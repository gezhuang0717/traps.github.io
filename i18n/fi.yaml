zg_pub_help_search: "Kaikkien hakusanojen on löydyttävä otsikosta, tekijäluettelosta, viitteestä, DOI:sta tai aihetunnisteesta. Vuosi-, tekijärooli- ja aihesuodattimet toimivat yhdessä. Vain osa viitteistä on merkitty aihetunnisteella; Kaikki aiheet näyttää koko luettelon."
zg_pub_help_sections: "Pääjulkaisuihin kuuluvat ensimmäisen ja toisen tekijän sekä erikseen merkityn vastaavan tekijän julkaisut. Osat eivät ole päällekkäisiä. Luvut koskevat tämän sivun viitteitä, myös konferenssijulkaisuja, raportteja ja esijulkaisuja, eivät viittausmääriä. Numerointi laskee näkyvien pääjulkaisujen määrän mukaan ja päivittyy suodatettaessa. Kaikki kirjoittajat avaa nimet ja niiden lähteen."
