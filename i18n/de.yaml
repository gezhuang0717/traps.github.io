zg_pub_help_search: "Alle Suchwörter müssen in Titel, vollständiger Autorenliste, Referenz, DOI oder Themenmarkierung vorkommen. Jahr, Autorenrolle und Thema werden kombiniert. Nur ausgewählte Einträge haben Themenmarkierungen; Alle Themen zeigt die vollständige Liste."
zg_pub_help_sections: "Hauptpublikationen umfassen Erst-, Zweit- oder ausdrücklich vermerkte korrespondierende Autorschaft. Die Abschnitte überschneiden sich nicht. Gezählt werden Einträge dieser Seite, einschließlich Tagungsbeiträgen, Berichten und Preprints, keine Zitierungen. Die Nummern zählen innerhalb der sichtbaren Hauptpublikationen rückwärts und werden beim Filtern angepasst. Alle Autoren öffnet Namen und Quellen."
