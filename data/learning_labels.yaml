  laser: Laser cooling
  label: Research, papers and tools
  research: Research questions
  papers: Find publications
  lab: Penning trap and nuclear chart
  facilities: Explore facilities
  title: Try a measurement walkthrough
  text: 'Inspect the ¹³³Xe ground and isomeric states in the chart, including excitation
    energy and uncertainty. An isomer is a relatively long-lived excited nuclear state.
    In MR-TOF, ions repeatedly travel between electrostatic mirrors: change the lap
    count, peak width and relative populations. In TOF-ICR, a radiofrequency excitation
    is scanned across the cyclotron resonance; compare the mixed signal with a one-species
    fit and the residuals (observed minus fitted values). In PI-ICR, ion-motion phases
    are imaged on a detector; change the accumulation time to see angles wrap through
    a full turn. Peak separation, statistical precision and model bias describe different
    limitations.'
zh:
  rfq: RFQ / 保罗阱
  laser: 激光冷却
  label: 研究、论文与工具
  research: 研究问题
  papers: 检索论文
  lab: 彭宁阱与核素图
  facilities: 相关设施
  title: 练习：从核态数据到测量结果
  text: 先在核素图查看 ¹³³Xe 的基态和同核异能态，确认激发能及其不确定度。同核异能态是寿命相对较长的原子核激发态。在 MR-TOF 中，离子在静电反射镜之间往返：改变圈数、峰宽和各离子占比。在
    TOF-ICR 中，射频激发扫描回旋共振：比较混合信号、单离子种类拟合和残差（观测值减去拟合值）。在 PI-ICR 中，探测器成像反映离子运动相位：改变累积时间，观察角度绕满一圈后回到起点。峰分离、统计精度和模型偏差是不同的限制。
fi:
  rfq: RFQ / Paul-loukku
  laser: Laserjäähdytys
  label: Tutkimus, julkaisut ja työkalut
  research: Tutkimuskysymykset
  papers: Hae julkaisuja
  lab: Penning-loukku ja nuklidikartta
  facilities: Tutustu laitoksiin
  title: Kokeile mittauksen vaiheita
  text: 'Tarkastele kartasta ¹³³Xe:n perus- ja isomeerisiä tiloja sekä viritysenergiaa
    ja epävarmuutta. Isomeeri on suhteellisen pitkäikäinen virittynyt ydintila. MR-TOF:ssa
    ionit kulkevat sähköstaattisten peilien välillä: muuta kierroksia, piikin leveyttä
    ja ionien osuuksia. TOF-ICR:ssa radiotaajuutta pyyhkäistään syklotroniresonanssin
    yli: vertaa seossignaalia yhden ionilajin sovitukseen ja jäännöksiin (havainto
    miinus sovitus). PI-ICR:ssa liikkeen vaihe kuvataan ilmaisimelle: muuta kertymäaikaa
    ja tarkastele täyden kierroksen yli kiertyviä kulmia. Piikkien erottuminen, tilastollinen
    tarkkuus ja malliharha ovat eri rajoituksia.'
de:
  rfq: RFQ / Paul-Falle
  laser: Laserkühlung
  label: Forschung, Veröffentlichungen und Werkzeuge
  research: Forschungsfragen
  papers: Veröffentlichungen finden
  lab: Penningfalle und Nuklidkarte
  facilities: Einrichtungen erkunden
  title: Einen Messablauf ausprobieren
  text: 'Untersuchen Sie die Grund- und isomeren Zustände von ¹³³Xe in der Karte,
    einschließlich Anregungsenergie und Unsicherheit. Ein Isomer ist ein relativ langlebiger
    angeregter Kernzustand. Bei MR-TOF fliegen Ionen zwischen elektrostatischen Spiegeln:
    Umlaufzahl, Peakbreite und Populationsanteile ändern. Bei TOF-ICR wird eine Hochfrequenzanregung
    über die Zyklotronresonanz gescannt: Mischsignal, Ein-Spezies-Anpassung und Residuen
    (Messwert minus Anpassung) vergleichen. PI-ICR bildet Bewegungsphasen auf einem
    Detektor ab: Akkumulationszeit ändern und Winkel nach einem vollen Umlauf verfolgen.
    Peaktrennung, statistische Präzision und Modellverzerrung sind unterschiedliche
    Grenzen.'
ja:
  rfq: RFQ / ポールトラップ
  laser: レーザー冷却
  label: 研究・論文・ツール
  research: 研究課題
  papers: 論文を検索
  lab: ペニングトラップと核図表
  facilities: 施設を見る
  title: 測定の流れを試す
  text: 核図表で ¹³³Xe の基底状態と核異性体状態を調べ、励起エネルギーと不確かさを確認してください。核異性体は比較的長寿命の励起核状態です。MR-TOF
    ではイオンが静電ミラー間を往復します。周回数、ピーク幅、存在比を変えてみましょう。TOF-ICR では高周波励起を共鳴に沿って走査します。混合信号、単一イオン種のフィット、残差（観測値からフィット値を引いた値）を比べます。PI-ICR
    では運動の位相を検出器に画像化します。蓄積時間を変えて、角度が一周後に戻る様子を観察してください。ピーク分離、統計精度、モデルの偏りは別々の制限です。
