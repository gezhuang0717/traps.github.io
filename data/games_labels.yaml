  rfq_start: "Säädä U ja V: kohdemassan (★) on päästävä läpi, muiden osuttava sauvoihin."
  rfq_h: "RF-jaksojen määrä asettaa viipymäajan, ei sauvojen pituutta: N jaksoa taajuudella f MHz antaa t = N/f mikrosekuntia. Oletusarvoilla 60 jaksoa ja 1,00 MHz tarkoittavat 60,00 µs. Fyysinen pituus vaatisi myös aksiaalisen nopeuden: L = v_z t. Aksiaalista liikettä ei tässä simuloida. r₀ on etäisyys akselista elektrodin pintaan, aluksi 10,00 mm. V on RF-huippuamplitudi, U tasajännite ja Ω = 2πf. z on positiivisten alkeisvarausten lukumäärä; m/z on massa varausta kohden. Dimensiottomat a ja q paikantavat ionin Mathieu-kaavioon; toimintasuora on a/q = 2U/V. LMCO ja HMCO ovat ideaaliset massan ja varauksen suhteen rajat, eivät läpäisyhyötysuhteita. Alkujakauma määrittää lähtöpaikkojen kiekon säteen prosentteina r₀:sta; sama opetushajonta vaikuttaa lähtönopeuksiin eikä ole mitattu säteen emittanssi. Animaation nopeus muuttaa toistoa, ei a:ta, q:ta tai rajoja. Siemen toistaa satunnaisen lähtösekvenssin. Vihreä vakausalue tarkoittaa rajattua liikettä ideaalissa äärettömän ajan yhtälössä; pelkkä lyhytaikainen säilyminen ei todista vakautta."
de:
  pi_multi: "Mehrere Ionensorten (von Hand)"
  pi_mtab: "Massentabelle"
  pi_ions: "Ionen"
  pi_presets: "Beispiele"
  pi_syntax: "Kommagetrennt: 84Rb · Rb-84 · 133Cs+2 oder 133Cs2+ (Ladung) · 45mSc, 45Scm oder 45Sc* (Isomer, Eₓ aus NUBASE2020; m2 = zweites Isomer) · 12C16O2 oder 12C11 (Moleküle, Cluster) · 87Rb:0.3 (relative Intensität). Ionenmasse = Atommasse − q·mₑ (Elektronenbindungsenergien vernachlässigt)."
  pi_bad: "nicht gefunden"
  pi_species: "Ionensorten"
  pi_closest: "nächstes Paar"
  pi_mindep: "in erster Ordnung massenunabhängig"
  pi_unstable: "für manche Ionen keine stabile Bewegung: U₀ senken oder d erhöhen"
  pi_fh: "Eigenfrequenzen einer idealen hyperbolischen Penning-Falle: ν_c = qB/(2πm), ν_z = √(qU₀/(m d²))/(2π), ν± = ν_c/2 ± √(ν_c²/4 − ν_z²/2); also ν₊ + ν₋ = ν_c und ν₊² + ν₋² + ν_z² = ν_c² (Invarianztheorem). Die Magnetronfrequenz ν₋ ≈ U₀/(4πB d²) hängt kaum von der Masse ab – deshalb genügt eine Magnetron-Referenz für alle Ionen, wie im JYFLTRAP-Steuerprogramm PyMassScanner (ν₊ = ν_c − ν₋, ν_z = √(ν_c² − ν₊² − ν₋²)). Sorte i erscheint bei der Phase φ_i = 2π ν_c,i t_acc (mod 2π)."
  pi_center: "Zentrumsfleck"
  pi_cfrac: "Anteil Zentrumsfleck"
  pi: "Trenne das Isomer (PI-ICR)"
  pi_auto: "Kürzestes t_acc"
  pi_gs: "Grundzustand"
  pi_is: "Isomer"
  set_one: "nur A"
