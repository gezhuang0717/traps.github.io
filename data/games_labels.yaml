# Extra labels for the Games page (layouts/_shortcodes/games.html, static/js/games.js).
# Keys are lower-case; each language overrides "en". Missing keys fall back to English.
en:
  pi_multi: "Several ion species (by hand)"
  pi_mtab: "Mass table"
  pi_ions: "Ions"
  pi_presets: "Examples"
  pi_syntax: "Comma-separated: 84Rb · Rb-84 · 133Cs+2 or 133Cs2+ (charge) · 45mSc, 45Scm or 45Sc* (isomer, Eₓ from NUBASE2020; m2 = second isomer) · 12C16O2 or 12C11 (molecules, clusters) · 87Rb:0.3 (relative intensity). Ion mass = atomic mass − q·mₑ (electron binding energies neglected)."
  pi_bad: "not found"
  pi_species: "species"
  pi_closest: "closest pair"
  pi_mindep: "to first order independent of the mass"
  pi_unstable: "no stable motion for some ions: lower U₀ or raise d"
  pi_fh: "Eigenfrequencies of an ideal hyperbolic Penning trap: ν_c = qB/(2πm), ν_z = √(qU₀/(m d²))/(2π), ν± = ν_c/2 ± √(ν_c²/4 − ν_z²/2), so ν₊ + ν₋ = ν_c and ν₊² + ν₋² + ν_z² = ν_c² (invariance theorem). The magnetron frequency ν₋ ≈ U₀/(4πB d²) hardly depends on the mass — this is why one magnetron reference serves all species, as in the JYFLTRAP control program PyMassScanner (ν₊ = ν_c − ν₋, ν_z = √(ν_c² − ν₊² − ν₋²)). Each species i appears at the phase φ_i = 2π ν_c,i t_acc (mod 2π)."
  pi_center: "centre spot"
  pi_cfrac: "Centre-spot fraction"
  pi: "Resolve the isomer (PI-ICR)"
  pi_n: "Phase-imaging: after the accumulation time t_acc the cyclotron phase of each ion is projected onto a position-sensitive detector. Ground state and isomer differ in mass by Eₓ/c², so their spots move apart by Δφ = 2π Δν_c t_acc. Find a t_acc that separates them."
  iso_pick: "Nuclear state (NUBASE2020)"
  pi_spot: "Cartesian spot width σx,y"
  pi_ratio: "Isomer fraction"
  pi_auto: "Shortest t_acc"
  pi_ref: "magnetron (reference)"
  pi_gs: "ground"
  pi_is: "isomer"
  pi_angle: "phase angle (degrees)"
  pi_h: "ν_c = (φ_c + 2πn)/(2π t_acc). Δν_c/ν_c = Eₓ/(mc²). Spot angle width σ_φ ≈ σ_r/R_spot (here R_spot = 6 mm); resolving power R = 2π ν_c t_acc/(2.355 σ_φ). Because angles wrap every 2π, two states can overlap again at larger t_acc — choose t_acc so that Δφ is well away from 0 and 2π (Eliseev et al., PRL 110, 082501 (2013); Nesterenko et al., EPJA 54, 154 (2018))."
  set_one: "only A"
  rfq_custom: "add ions (isotopes)"
  target: "Target"
  emit: "Initial spread"
  cycles: "Residence time · RF cycles"
  rfq_bad: "unknown nuclide — use e.g. 100Sn, Sn-100 or 133Cs+2"
  mr_manual: "enter nuclei by hand"
  charge: "Charge state"
  counts: "Ions"
  mr_sum: "sum of both peaks"
  mr_auto: "Laps needed"
  ion: "Ion"
  video: "Video"
  tof_n: "Set the excitation frequency ν_rf, shoot ions and find the minimum of the time of flight. ¹³³Cs⁺ in a 7 T trap: ν_c = qB/(2πm) ≈ 808 795.01 Hz. Fewer shots and a closer guess give more points."
  tof_start: "Scan ν_rf: at resonance the ions are fully converted and arrive EARLIEST — look for the dip."
  trf: "Excitation time T_rf"
  scheme: "Excitation"
  rect: "rectangular"
  ramsey: "Ramsey (two pulses)"
  ions: "Ions per shot (mean)"
  view: "View"
  v_pts: "points + means"
  v_pix: "2D histogram (pixels)"
  theory: "show expected line shape"
  scan: "Auto-scan 15 points"
  fit: "Fit ν_c"
  fit_res: "Fit"
  fit_need: "Measure at least three frequencies before fitting."
  ions_got: "ions detected"
  scan_done: "scan done — look for the dip and zoom in with single shots"
  hints: "Physics hints"
  h1: "At ν_rf = ν_c the quadrupole drive converts the slow magnetron motion completely into fast reduced-cyclotron motion. On the way to the detector the radial energy E_r ∝ ω₊²r² is turned into axial energy in the magnetic-field gradient, so resonant ions fly faster: the resonance is a MINIMUM of the time of flight."
  h2: "Line width: FWHM ≈ 0.8/T_rf for a rectangular pulse. Longer excitation → narrower dip → more precise ν_c (statistical precision ∝ 1/(T_rf·√N))."
  h3: "Rectangular excitation has side minima (a sinc²-like pattern). Ramsey excitation (two short pulses with a waiting time) gives a ~40 % narrower central fringe and stronger side fringes — do not mistake a side fringe for the centre."
  h4: "From frequency to mass: m = qB/(2πν_c) (B is calibrated with a reference ion). An error of 0.1 Hz at 808 kHz is δm/m ≈ 1.2×10⁻⁷ ≈ 15 keV for A = 133."
  png: "PNG"
  csv: "CSV"
  mr_n: "Ions bounce between two electrostatic mirrors; every lap adds flight time, so the time difference between two isobars grows while the peaks only broaden slowly. Start with the initial bunch width from the cooler-buncher, then add laps until the peaks separate."
  pair: "Isobar pair"
  rand: "Random pair from NUBASE2020"
  dt0: "Initial bunch width Δt₀ (FWHM)"
  dlap: "Broadening per lap"
  tlap: "Lap time (A = 100)"
  t0: "Flight time without laps (A = 100)"
  ratio: "Intensity ratio"
  mr_sat: "per-lap broadening equals Δt₀ after"
  mr_h: "t(N) = t₀ + N·T_lap ∝ √m, Δt = t·Δm/(2m), FWHM² = Δt₀² + (N·δ)², R = t/(2·FWHM). Separation when Δt ≥ FWHM, i.e. R ≥ m/Δm. A short initial bunch matters most at few laps; per-lap broadening limits R at many laps."
  rfq: "Keep the ions (linear Paul trap / RFQ mass filter)"
  rfq_n: "Ions move in the rapidly switching quadrupole field of four rods. Only ions whose working point (q, a) lies inside the stability region stay inside r₀; the others oscillate with growing amplitude and hit a rod (spark). Set U and V so that only the target mass passes."
  a: "Target mass number A"
  set: "Ions in the beam"
  set_near: "A − 2, A, A + 2"
  set_far: "A/2, A, 2A"
  u: "DC voltage U"
  v: "RF amplitude V"
  speed: "Speed"
  cool: "Cooler mode (U = 0, q ≈ 0.4)"
  tip: "Mass filter at the tip"
  pause: "Pause / run"
  rfq_stable: "stable in x and y"
  rfq_score: "Score"
  rfq_t: "target transmitted"
  rfq_o: "best other mass"
  rfq_start: "Adjust U and V: the target mass (★) must pass, the others must hit the rods."
  rfq_h: "RF cycles is a residence-time setting, not a rod length: N cycles at frequency f MHz give t = N/f microseconds. At the defaults, 60 cycles at 1.00 MHz mean 60.00 µs. A physical filter length would also require the axial speed, L = v_z t; axial motion is not simulated here. r₀ is the distance from the axis to the electrode surface, initially 10.00 mm. V is the zero-to-peak RF voltage; U is the DC voltage and Ω = 2πf. Charge z is the number of elementary positive charges; m/z is mass per charge. Dimensionless a and q locate an ion in the Mathieu stability diagram, and the operating line is a/q = 2U/V. LMCO and HMCO are the ideal lower and upper mass-per-charge boundaries, not transmission efficiencies. The initial spread sets the launch-position disk radius as a percentage of r₀; launch velocities also use this teaching spread and are not a measured beam emittance. Animation speed changes playback, not a, q or the cutoffs. Seed repeats the same random launch sequence. Green stability means bounded motion for the ideal infinite-time equation; surviving a finite time alone does not prove stability."
