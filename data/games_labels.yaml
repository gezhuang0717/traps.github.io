  mr_h: "t(N) = t₀ + N·T_lap ∝ √m、Δt = t·Δm/(2m)、FWHM² = Δt₀² + (N·δ)²、R = t/(2·FWHM)。Δt ≥ FWHM（R ≥ m/Δm）で分離。"
  rfq: "イオンを留めよ（線形パウルトラップ / RFQ 質量フィルター）"
  rfq_n: "イオンは4本のロッドが高速に切り替わる四重極場の中を運動します。動作点 (q, a) が安定領域内のイオンだけが r₀ 内に留まり、他はロッドに衝突します（火花）。U と V を調整して目標質量だけを通そう。"
  a: "目標質量数 A"
