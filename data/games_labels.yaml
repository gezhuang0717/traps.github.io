  hints: "物理のヒント"
  h1: "ν_rf = ν_c では四重極励起がゆっくりしたマグネトロン運動を速い換算サイクロトロン運動へ完全に変換します。検出器へ向かう途中、動径エネルギー E_r ∝ ω₊²r² が磁場勾配で軸方向エネルギーに変わるため、共鳴イオンは速く飛びます：共鳴は飛行時間の最小値です。"
  h2: "線幅：矩形パルスでは FWHM ≈ 0.8/T_rf。励起が長いほど谷は狭く、ν_c は精密になります（統計精度 ∝ 1/(T_rf·√N)）。"
  h3: "矩形励起には副極小（sinc² 型）があります。ラムゼー励起（短い2パルス＋待ち時間）は中心縞が約40%狭く、副縞が強くなります——副縞を中心と間違えないように。"
  h4: "周波数から質量へ：m = qB/(2πν_c)（B は参照イオンで校正）。808 kHz で 0.1 Hz の誤差は δm/m ≈ 1.2×10⁻⁷、A = 133 で約 15 keV。"
