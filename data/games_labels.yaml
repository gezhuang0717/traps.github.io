  ratio: "强度比"
  mr_sat: "每圈展宽累积到 Δt₀ 所需圈数"
  mr_h: "t(N) = t₀ + N·T_lap ∝ √m，Δt = t·Δm/(2m)，FWHM² = Δt₀² + (N·δ)²，R = t/(2·FWHM)。当 Δt ≥ FWHM（即 R ≥ m/Δm）时两峰分开。圈数少时初始束团宽度最关键；圈数多时每圈展宽限制分辨本领。"
  rfq: "留住离子（线性保罗阱 / RFQ 质量过滤器）"
  rfq_n: "离子在四根电极快速切换的四极场中运动。只有工作点 (q, a) 位于稳定区内的离子留在 r₀ 以内；其余离子振幅不断增大，最终撞上电极（火花）。调节 U 和 V，只让目标质量通过。"
  a: "目标质量数 A"
  set: "束流中的离子"
  u: "直流电压 U"
  v: "射频幅度 V"
  speed: "速度"
  cool: "冷却模式（U = 0，q ≈ 0.4）"
  tip: "稳定区顶点质量过滤"
  pause: "暂停 / 继续"
  rfq_stable: "x、y 方向均稳定"
  rfq_score: "得分"
  rfq_t: "目标通过率"
  rfq_o: "其他质量最高通过率"
  rfq_start: "调节 U 和 V：目标质量（★）必须通过，其余离子必须撞上电极。"
  rfq_h: "射频周期数设置停留时间，并非电极杆长：频率为 f MHz 时，N 个周期对应 t = N/f 微秒。默认 1.00 MHz、60 个周期即 60.00 µs。真实过滤器长度还需要轴向速度，L = v_z t；这里未模拟轴向运动。r₀ 是轴线到电极表面的距离，初值 10.00 mm。V 为零到峰值射频电压，U 为直流电压，Ω = 2πf。电荷数 z 是正基本电荷的个数；m/z 是质量电荷比。无量纲 a、q 决定离子在马修稳定图中的位置，工作线为 a/q = 2U/V。LMCO 与 HMCO 是理想质量电荷比下限和上限，并非透过效率。初始散布给出发射位置圆盘半径，占 r₀ 的百分比；发射速度也使用这一教学散布，不代表实测束流发射度。动画速度只改变播放，不改变 a、q 或截止值。随机种子用于重现相同发射序列。绿色稳定区表示理想无限时间方程中的有界运动；只存活有限时间不能证明稳定。"
