  mr_sat: "Rundenverbreiterung erreicht Δt₀ nach"
  mr_h: "t(N) = t₀ + N·T_lap ∝ √m, Δt = t·Δm/(2m), FWHM² = Δt₀² + (N·δ)², R = t/(2·FWHM). Trennung bei Δt ≥ FWHM, d. h. R ≥ m/Δm."
  rfq: "Halte die Ionen (lineare Paul-Falle / RFQ-Massenfilter)"
  rfq_n: "Ionen bewegen sich im schnell umschaltenden Quadrupolfeld von vier Stäben. Nur Ionen mit Arbeitspunkt (q, a) im Stabilitätsgebiet bleiben innerhalb r₀; die anderen treffen einen Stab (Funke). Stelle U und V so ein, dass nur die Zielmasse passiert."
  a: "Ziel-Massenzahl A"
  set: "Ionen im Strahl"
  u: "Gleichspannung U"
  v: "RF-Amplitude V"
  speed: "Tempo"
  cool: "Kühlermodus (U = 0, q ≈ 0,4)"
  tip: "Massenfilter an der Spitze"
  pause: "Pause / weiter"
  rfq_stable: "stabil in x und y"
  rfq_score: "Punkte"
  rfq_t: "Ziel transmittiert"
  rfq_o: "beste andere Masse"
  rfq_start: "U und V einstellen: die Zielmasse (★) muss passieren, die anderen müssen die Stäbe treffen."
  rfq_h: "Die Zahl der RF-Perioden legt die Verweilzeit fest, keine Stablänge: N Perioden bei f MHz ergeben t = N/f Mikrosekunden. Die Vorgaben 60 Perioden und 1,00 MHz entsprechen 60,00 µs. Für eine reale Filterlänge wäre auch die axiale Geschwindigkeit nötig: L = v_z t. Axiale Bewegung wird hier nicht simuliert. r₀ ist der Abstand von der Achse zur Elektrodenoberfläche, anfangs 10,00 mm. V ist die RF-Spitzenamplitude, U die Gleichspannung und Ω = 2πf. z zählt positive Elementarladungen; m/z ist Masse pro Ladung. Die dimensionslosen Parameter a und q bestimmen den Punkt im Mathieu-Diagramm; die Betriebsgerade ist a/q = 2U/V. LMCO und HMCO sind ideale Grenzen der Masse pro Ladung und keine Durchlasseffizienzen. Die Anfangsstreuung setzt den Radius der Startpositionsscheibe als Prozentsatz von r₀; die Startgeschwindigkeiten verwenden dieselbe Lehrstreuung, keine gemessene Strahlemittanz. Die Animationsgeschwindigkeit ändert die Wiedergabe, nicht a, q oder die Grenzen. Der Zufallsstartwert wiederholt die Startsequenz. Grün bedeutet beschränkte Bewegung in der idealen Gleichung für unbegrenzte Zeit; bloßes Überleben während einer endlichen Zeit beweist keine Stabilität."
