  ion: "Ion"
  video: "Video"
  tof_n: "Stelle die Anregungsfrequenz ν_rf ein, schieße Ionen und suche das Minimum der Flugzeit. ¹³³Cs⁺ in einer 7-T-Falle: ν_c = qB/(2πm) ≈ 808 795.01 Hz. Weniger Schüsse und ein genauerer Tipp geben mehr Punkte."
  tof_start: "ν_rf scannen: bei Resonanz werden die Ionen vollständig konvertiert und kommen am FRÜHESTEN an — suche das Minimum."
  trf: "Anregungszeit T_rf"
  scheme: "Anregung"
  rect: "rechteckig"
  ramsey: "Ramsey (zwei Pulse)"
  ions: "Ionen pro Schuss (Mittel)"
  view: "Ansicht"
  v_pts: "Punkte + Mittelwerte"
  v_pix: "2D-Histogramm (Pixel)"
  theory: "erwartete Linienform zeigen"
  scan: "Auto-Scan mit 15 Punkten"
  fit: "ν_c anpassen"
  fit_res: "Fit"
  fit_need: "Für einen Fit mindestens drei Frequenzen messen."
  ions_got: "Ionen nachgewiesen"
  scan_done: "Scan fertig — Minimum suchen und mit Einzelschüssen verfeinern"
  hints: "Physik-Hinweise"
  h1: "Bei ν_rf = ν_c wandelt die Quadrupolanregung die langsame Magnetronbewegung vollständig in die schnelle reduzierte Zyklotronbewegung um. Auf dem Weg zum Detektor wird die radiale Energie E_r ∝ ω₊²r² im Magnetfeldgradienten in axiale Energie umgesetzt; resonante Ionen fliegen schneller: die Resonanz ist ein MINIMUM der Flugzeit."
  h2: "Linienbreite: FWHM ≈ 0,8/T_rf bei Rechteckanregung. Längere Anregung → schmaleres Minimum → genaueres ν_c (statistische Genauigkeit ∝ 1/(T_rf·√N))."
  h3: "Rechteckanregung zeigt Nebenminima (sinc²-artig). Ramsey-Anregung (zwei kurze Pulse mit Wartezeit) gibt ein ~40 % schmaleres Zentralmaximum — Nebenmaxima nicht mit dem Zentrum verwechseln."
  h4: "Von der Frequenz zur Masse: m = qB/(2πν_c) (B mit Referenzion kalibriert). 0,1 Hz Fehler bei 808 kHz sind δm/m ≈ 1,2×10⁻⁷ ≈ 15 keV für A = 133."
  mr_n: "Ionen pendeln zwischen zwei elektrostatischen Spiegeln; jede Runde verlängert die Flugzeit, die Zeitdifferenz zweier Isobare wächst, die Peaks werden nur langsam breiter. Erst die Anfangsbreite des Pakets aus dem Kühler-Buncher wählen, dann Runden hinzufügen."
  pair: "Isobarenpaar"
  rand: "Zufälliges Paar aus NUBASE2020"
