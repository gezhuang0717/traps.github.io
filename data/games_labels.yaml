  h1: "当 ν_rf = ν_c 时，四极激发把慢的磁控运动完全转换为快的约化回旋运动。飞向探测器途中，径向能量 E_r ∝ ω₊²r² 在磁场梯度中转化为轴向能量，因此共振离子飞得更快：共振对应飞行时间的最小值。"
  h2: "线宽：矩形脉冲 FWHM ≈ 0.8/T_rf。激发越长，低谷越窄，ν_c 越精确（统计精度 ∝ 1/(T_rf·√N)）。"
