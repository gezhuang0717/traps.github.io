labels:
  en:
    title: "Laser cooling"
    intro: "Red-detuned laser light slows atoms and ions: a moving particle sees the beam it flies into Doppler-shifted towards resonance and scatters more photons from it. Each absorption gives a kick ħk against the motion; random spontaneous emission heats. The balance is the Doppler temperature."
    m_title: "Optical molasses — cool the cloud"
    m_intro: "Two counter-propagating beams along x. Tune the detuning and intensity, start the laser and try to reach the Doppler limit ħΓ/2k_B as fast as possible."
    p_title: "One ion in a Penning trap"
    p_intro: "A radial beam cools the cyclotron motion but heats the magnetron motion (its energy is negative). Shift the beam off centre so the intensity gradient pushes the magnetron orbit inwards; tilt it to cool the axial motion too."
