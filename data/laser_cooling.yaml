    allcool: "Alle drei Bewegungen werden gekühlt"
    notall: "Nicht alle Bewegungen werden gekühlt"
    goal_p: "Ziel: alle Amplituden unter 10 µm innerhalb von 100 ms"
    scaled: "Die Bahn wird mit verlangsamten, übertriebenen Frequenzen gezeichnet; alle Zahlen gelten für die reale Falle."
    hint1: "Beste Doppler-Temperatur: δ = −Γ/2 bei kleiner Intensität. Größeres s₀ kühlt schneller, verbreitert aber: T ∝ (1 + s₀ + (2δ/Γ)²)/(2|δ|/Γ)."
    hint2: "Sind die Atome schneller als die Einfanggeschwindigkeit ≈ Γ/2k, wechselwirken sie kaum: kälter starten oder zuerst größer verstimmen."
    hint3: "Penningfalle: Die radiale Dämpfung teilt sich als γ₊ + γ₋ = −β_r/2m auf; der Strahlversatz verschiebt Dämpfung vom Zyklotron zum Magnetron."
    hint4: "Zwei-Niveau-Modell: keine Hyperfeinstruktur, Dunkelzustände oder Mikrobewegung. Ionen wie Ca⁺ brauchen einen Rückpumper; Werte sind Lehrabschätzungen, kein Experiment."
    refs: "Quellen"
    hints: "Hinweise"
    princ: "Prinzipien (Physik im Detail)"
    princ_m: ["Streurate: R = (Γ/2)·s₀/(1 + s₀ + (2Δ/Γ)²), wobei Δ = δ − k·v die Verstimmung ist, die ein Atom mit Geschwindigkeit v sieht (Doppler-Verschiebung k·v, k = 2π/λ).", "Strahlungsdruck: Jedes absorbierte Photon überträgt ħk entlang des Strahls; spontane Emission ist richtungszufällig. Kraft eines Strahls: F = ħk·R.", "Optische Melasse: Zwei gegenläufige rotverstimmte Strahlen ergeben F(v) = ħk[R(δ − kv) − R(δ + kv)] ≈ −β·v mit β = −8ħk²δs₀/(Γ(1 + s₀ + (2δ/Γ)²)²); wirksam nur innerhalb der Einfanggeschwindigkeit ≈ (Γ/2k)√(1+s₀).", "Heizen: zufällige Rückstöße erzeugen Impulsdiffusion D₀ = ħ²k²R_tot(1+η)/2 (η = 1 im 1D-Lehrbuchmodell, 1/3 bei isotroper Emission).", "Doppler-Temperatur: k_BT = D₀/β = ħΓ(1+η)(1 + s₀ + (2δ/Γ)²)/(16|δ|/Γ); Minimum bei δ = −(Γ/2)√(1+s₀), s₀ → 0: T_D = ħΓ/2k_B. Die Rückstoßtemperatur T_r = ħ²k²/(m k_B) ist eine untere Grenze.", "Die Simulation zieht pro Atom und Strahl poissonverteilte Photonenzahlen, daher zeigt die Temperaturkurve echtes Schrotrauschen. Blauverstimmung (δ > 0) heizt."]
    princ_p: ["Penning-Falle: modifizierte Zyklotronbewegung ω₊, Magnetron ω₋ und axial ω_z; ω₊ + ω₋ = ω_c = qB/m, ω₊ω₋ = ω_z²/2.", "Die Magnetronbewegung hat negative Energie; Reibung vergrößert ihren Radius: ein zentrierter Strahl kühlt ω₊, heizt aber ω₋.", "Itano–Wineland: Ein versetzter Strahl erzeugt einen Kraftgradienten F′. γ₊ = (F′ − β_rω₊)/(2mΔω), γ₋ = (β_rω₋ − F′)/(2mΔω); beide kühlen nur im Fenster β_rω₋ < F′ < β_rω₊. Summe γ₊ + γ₋ = −β_r/(2m).", "Kippung θ ergibt axiale Dämpfung γ_z = −β sin²θ/(2m) und β_r = β cos²θ.", "Gleichgewicht A_eq = √(D/(−2γ)); A(t)² = A₀²e^{2γt} + D(e^{2γt} − 1)/(2γ). Quellen: Itano & Wineland PRA 25, 35 (1982); Hendricks et al. arXiv:0709.3817."]
