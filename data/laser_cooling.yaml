    goal_p: "Goal: all three amplitudes below 10 µm within 100 ms"
    scaled: "Orbit drawing uses slowed, exaggerated frequencies; all numbers are for the real trap."
    hint1: "Best Doppler temperature: δ = −Γ/2 at low intensity. Higher s₀ cools faster but power-broadens: T ∝ (1 + s₀ + (2δ/Γ)²)/(2|δ|/Γ)."
    hint2: "If atoms are faster than the capture velocity ≈ Γ/2k they barely interact: start colder or use a larger detuning first."
    hint3: "Penning trap: the radial damping β_r is shared as γ₊ + γ₋ = −β_r/2m; the beam offset moves damping from the cyclotron to the magnetron mode."
    hint4: "Two-level model: no hyperfine structure, dark states or micromotion. Ions such as Ca⁺ need a repumper; values are teaching estimates, not an experiment."
    refs: "Sources"
    hints: "Hints"
    princ: "Principles (physics in detail)"
    princ_m: ["Scattering rate. A two-level atom with linewidth Γ in a beam of saturation s₀ = I/I_sat scatters R = (Γ/2)·s₀/(1 + s₀ + (2Δ/Γ)²) photons per second; Δ = δ − k·v is the detuning seen by an atom moving with velocity v (Doppler shift k·v, k = 2π/λ).", "Radiation pressure. Each absorbed photon gives a momentum kick ħk along the beam; spontaneous emission goes in a random direction, so on average only absorption pushes. Force from one beam: F = ħk·R.", "Molasses force. With two counter-propagating red-detuned beams (δ < 0) an atom moving to the right is closer to resonance with the beam coming from the right and scatters more from it: F(v) = ħk[R(δ − kv) − R(δ + kv)] ≈ −β·v for |kv| ≪ Γ, with β = −8ħk²δs₀/(Γ(1 + s₀ + (2δ/Γ)²)²). The red curve in the plot is this F(v); it acts only within the capture velocity ≈ (Γ/2k)√(1+s₀).", "Heating. Every scattered photon adds two random recoil kicks (absorption from either beam and emission), giving momentum diffusion D₀ = ħ²k²R_tot(1+η)/2, where η is the fraction of emission projected on the axis (1 for the textbook 1D model, 1/3 for isotropic 3D emission).", "Doppler temperature. Damping and heating balance at k_BT = D₀/β = ħΓ(1+η)(1 + s₀ + (2δ/Γ)²)/(16|δ|/Γ). The minimum, at δ = −(Γ/2)√(1+s₀) and s₀ → 0, is the Doppler limit T_D = ħΓ/2k_B (η = 1). Recoil sets a lower floor T_r = ħ²k²/(m k_B); narrow lines (Γ comparable to the recoil frequency) break the semiclassical model.", "Simulation. Each time step draws Poisson-distributed photon numbers from each beam for every atom and adds ±ħk/m per absorption and a random emission kick, so the temperature curve shows real shot noise around the analytic value. Blue detuning (δ > 0) turns the force into anti-damping and heats the cloud."]
    princ_p: ["Penning-trap motions. An ion in B and a quadrupole potential U₀ has three eigenmotions: modified cyclotron ω₊, magnetron ω₋ and axial ω_z, with ω₊ + ω₋ = ω_c = qB/m and ω₊ω₋ = ω_z²/2.", "Magnetron problem. The magnetron motion has negative total energy (potential hill dominates), so a friction force that removes kinetic energy increases its radius: a centred radial laser cools ω₊ but heats ω₋.", "Itano–Wineland solution. Offset the beam by y_b so that the intensity gradient gives a force gradient F′ = ∂F/∂y. The radial amplitude rates become γ₊ = (F′ − β_rω₊)/(2mΔω) and γ₋ = (β_rω₋ − F′)/(2mΔω) with Δω = ω₊ − ω₋. Both are negative (cooling) only inside the window β_rω₋ < F′ < β_rω₊ — shown as the green bar. Their sum is fixed: γ₊ + γ₋ = −β_r/(2m).", "Axial cooling. Tilting the beam by θ out of the radial plane gives axial damping γ_z = −β sin²θ/(2m) and reduces the radial share to β_r = β cos²θ.", "Equilibrium. Recoil diffusion D limits the amplitudes to A_eq = √(D/(−2γ)); amplitudes evolve as A(t)² = A₀²e^{2γt} + D(e^{2γt} − 1)/(2γ), drawn in the log–log plot. Sources: Itano & Wineland PRA 25, 35 (1982); Hendricks et al. arXiv:0709.3817."]
  zh:
    title: "激光冷却"
    intro: "红失谐的激光能使原子和离子减速：粒子迎着光束运动时，多普勒频移使光更接近共振，因而散射更多该光束的光子。每次吸收给出与运动方向相反的反冲 ħk；随机的自发辐射造成加热。两者平衡即多普勒温度。"
    m_title: "光学黏团——冷却原子云"
    m_intro: "沿 x 方向有两束对射光。调节失谐和光强，打开激光，尽快达到多普勒极限 ħΓ/2k_B。"
    p_title: "彭宁阱中的单个离子"
    p_intro: "径向光束冷却回旋运动，却加热磁控运动（其能量为负）。把光束偏离中心，使光强梯度把磁控轨道推向中心；把光束倾斜，也可冷却轴向运动。"
