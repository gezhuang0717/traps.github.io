    goal_p: "目標：100 ms 以内に 3 つの振幅すべてを 10 µm 未満に"
    scaled: "軌道図は減速・誇張した周波数で描画しています。数値はすべて実際のトラップの値です。"
    hint1: "最良のドップラー温度：低強度で δ = −Γ/2。s₀ を大きくすると速く冷えますがパワー広がりがあります：T ∝ (1 + s₀ + (2δ/Γ)²)/(2|δ|/Γ)。"
    hint2: "原子が捕獲速度 ≈ Γ/2k より速いとほとんど相互作用しません：低温から始めるか、まず大きな離調を使いましょう。"
    hint3: "ペニングトラップ：径方向の減衰は γ₊ + γ₋ = −β_r/2m と分配され、ビームのずれが減衰をサイクロトロンからマグネトロンへ移します。"
    hint4: "2 準位モデル：超微細構造、暗状態、マイクロモーションは含みません。Ca⁺ などにはリポンプ光が必要です。値は教育用の見積もりで、実験結果ではありません。"
    refs: "出典"
    hints: "ヒント"
    princ: "原理（物理の詳細）"
    princ_m: ["散乱率：R = (Γ/2)·s₀/(1 + s₀ + (2Δ/Γ)²)。Δ = δ − k·v は速度 v の原子が感じる離調（ドップラーシフト k·v、k = 2π/λ）。", "放射圧：吸収した光子ごとに光の方向へ運動量 ħk を受け、自然放出の方向はランダム。1本のビームの力は F = ħk·R。", "光モラセス：対向する2本の赤方離調ビームで F(v) = ħk[R(δ − kv) − R(δ + kv)] ≈ −β·v、β = −8ħk²δs₀/(Γ(1 + s₀ + (2δ/Γ)²)²)。捕獲速度 ≈ (Γ/2k)√(1+s₀) 以内でのみ有効。", "加熱：ランダムな反跳が運動量拡散 D₀ = ħ²k²R_tot(1+η)/2 を生む（1次元教科書モデルで η = 1、等方放出で 1/3）。", "ドップラー温度：k_BT = D₀/β = ħΓ(1+η)(1 + s₀ + (2δ/Γ)²)/(16|δ|/Γ)。δ = −(Γ/2)√(1+s₀)、s₀ → 0 で最小 T_D = ħΓ/2k_B。反跳温度 T_r = ħ²k²/(m k_B) が下限。", "シミュレーションは各原子・各ビームでポアソン分布の光子数を引くため、温度曲線に実際のショットノイズが現れる。青方離調（δ > 0）は加熱する。"]
    princ_p: ["ペニングトラップの運動：修正サイクロトロン ω₊、マグネトロン ω₋、軸方向 ω_z。ω₊ + ω₋ = ω_c = qB/m、ω₊ω₋ = ω_z²/2。", "マグネトロン運動はエネルギーが負なので、摩擦で半径が増える：中心のビームは ω₊ を冷却するが ω₋ を加熱する。", "Itano–Wineland 法：ビームをずらすと力の勾配 F′ が生じる。γ₊ = (F′ − β_rω₊)/(2mΔω)、γ₋ = (β_rω₋ − F′)/(2mΔω)。窓 β_rω₋ < F′ < β_rω₊ の内側でのみ両方が冷却される。和は γ₊ + γ₋ = −β_r/(2m)。", "傾き θ により軸方向減衰 γ_z = −β sin²θ/(2m)、β_r = β cos²θ。", "平衡振幅 A_eq = √(D/(−2γ))；A(t)² = A₀²e^{2γt} + D(e^{2γt} − 1)/(2γ)。出典：Itano & Wineland PRA 25, 35 (1982)；Hendricks ら arXiv:0709.3817。"]
