    goal_p: "Tavoite: kaikki amplitudit alle 10 µm 100 ms:ssa"
    scaled: "Rata piirretään hidastetuilla, liioitelluilla taajuuksilla; kaikki luvut ovat todelliselle loukulle."
    hint1: "Paras Doppler-lämpötila: δ = −Γ/2 pienellä intensiteetillä. Suurempi s₀ jäähdyttää nopeammin mutta levittää viivaa: T ∝ (1 + s₀ + (2δ/Γ)²)/(2|δ|/Γ)."
    hint2: "Jos atomit ovat kaappausnopeutta ≈ Γ/2k nopeampia, ne tuskin vuorovaikuttavat: aloita kylmempänä tai käytä ensin suurempaa viritystä."
    hint3: "Penning-loukku: radiaalinen vaimennus jakautuu γ₊ + γ₋ = −β_r/2m; säteen siirto siirtää vaimennusta syklotronista magnetroniin."
    hint4: "Kaksitasomalli: ei hyperhienorakennetta, pimeitä tiloja eikä mikroliikettä. Ca⁺-kaltaiset ionit tarvitsevat takaisinpumppauksen; arvot ovat opetusarvioita, eivät koe."
    refs: "Lähteet"
    hints: "Vihjeet"
    princ: "Periaatteet (fysiikka tarkemmin)"
    princ_m: ["Sirontanopeus: R = (Γ/2)·s₀/(1 + s₀ + (2Δ/Γ)²), missä Δ = δ − k·v on liikkuvan atomin näkemä virityspoikkeama (Doppler-siirtymä k·v, k = 2π/λ).", "Säteilypaine: jokainen absorboitu fotoni antaa liikemäärän ħk säteen suuntaan; spontaani emissio on satunnaissuuntainen. Yhden säteen voima F = ħk·R.", "Optinen melassi: kaksi vastakkaista punasiirrettyä sädettä antavat F(v) = ħk[R(δ − kv) − R(δ + kv)] ≈ −β·v, β = −8ħk²δs₀/(Γ(1 + s₀ + (2δ/Γ)²)²). Voima vaikuttaa vain sieppausnopeuden ≈ (Γ/2k)√(1+s₀) sisällä.", "Lämpeneminen: satunnaiset rekyylit antavat diffuusion D₀ = ħ²k²R_tot(1+η)/2 (η = 1 yksiulotteisessa mallissa, 1/3 isotrooppisessa emissiossa).", "Doppler-lämpötila: k_BT = D₀/β = ħΓ(1+η)(1 + s₀ + (2δ/Γ)²)/(16|δ|/Γ); minimi δ = −(Γ/2)√(1+s₀) ja s₀ → 0 antaa T_D = ħΓ/2k_B. Rekyylilämpötila T_r = ħ²k²/(m k_B) on alaraja.", "Simulaatio arpoo jokaiselle atomille Poisson-jakautuneet fotonimäärät kummastakin säteestä, joten lämpötilakäyrässä näkyy todellinen kohina. Sinisiirtymä (δ > 0) lämmittää."]
    princ_p: ["Penning-loukun liikkeet: modifioitu syklotroni ω₊, magnetroni ω₋ ja aksiaalinen ω_z; ω₊ + ω₋ = ω_c = qB/m, ω₊ω₋ = ω_z²/2.", "Magnetroniliikkeen energia on negatiivinen, joten kitka kasvattaa sen sädettä: keskitetty säde jäähdyttää ω₊:aa mutta lämmittää ω₋:aa.", "Itano–Wineland: siirretty säde antaa voimagradientin F′. γ₊ = (F′ − β_rω₊)/(2mΔω), γ₋ = (β_rω₋ − F′)/(2mΔω); molemmat jäähtyvät vain ikkunassa β_rω₋ < F′ < β_rω₊. Summa γ₊ + γ₋ = −β_r/(2m).", "Kallistus θ antaa aksiaalisen vaimennuksen γ_z = −β sin²θ/(2m) ja β_r = β cos²θ.", "Tasapaino A_eq = √(D/(−2γ)); A(t)² = A₀²e^{2γt} + D(e^{2γt} − 1)/(2γ). Lähteet: Itano & Wineland PRA 25, 35 (1982); Hendricks ym. arXiv:0709.3817."]
  de:
    title: "Laserkühlung"
    intro: "Rot verstimmtes Laserlicht bremst Atome und Ionen: Ein bewegtes Teilchen sieht den entgegenkommenden Strahl durch den Doppler-Effekt näher an der Resonanz und streut mehr Photonen daraus. Jede Absorption gibt einen Stoß ħk gegen die Bewegung; zufällige spontane Emission heizt. Das Gleichgewicht ist die Doppler-Temperatur."
    m_title: "Optische Melasse — kühle die Wolke"
    m_intro: "Zwei gegenläufige Strahlen entlang x. Stelle Verstimmung und Intensität ein, schalte den Laser ein und erreiche möglichst schnell das Doppler-Limit ħΓ/2k_B."
    p_title: "Ein Ion in einer Penningfalle"
    p_intro: "Ein radialer Strahl kühlt die Zyklotronbewegung, heizt aber die Magnetronbewegung (ihre Energie ist negativ). Verschiebe den Strahl, damit der Intensitätsgradient die Magnetronbahn nach innen drückt; kippe ihn, um auch die Axialbewegung zu kühlen."
