    auto: "建议偏移"
    allcool: "三种运动都已冷却"
    notall: "并非所有运动都被冷却"
    goal_p: "目标：100 ms 内三种振幅都小于 10 µm"
    scaled: "轨道图使用放慢、夸大的频率；所有数值对应真实的阱。"
    hint1: "最佳多普勒温度：低光强下 δ = −Γ/2。较大的 s₀ 冷却更快，但有功率展宽：T ∝ (1 + s₀ + (2δ/Γ)²)/(2|δ|/Γ)。"
    hint2: "若原子速度大于俘获速度 ≈ Γ/2k，几乎不与光作用：先从更低温度开始或先用更大的失谐。"
    hint3: "彭宁阱：径向阻尼 β_r 按 γ₊ + γ₋ = −β_r/2m 分配；光束偏移把阻尼从回旋运动转移到磁控运动。"
    hint4: "二能级模型：不含超精细结构、暗态和微运动。Ca⁺ 等离子需要回泵光；数值仅用于教学估算，并非实验结果。"
    refs: "参考来源"
    hints: "提示"
    princ: "原理（详细物理说明）"
    princ_m: ["散射率。线宽为 Γ 的二能级原子在饱和参数 s₀ = I/I_sat 的光束中，每秒散射 R = (Γ/2)·s₀/(1 + s₀ + (2Δ/Γ)²) 个光子；Δ = δ − k·v 是速度为 v 的原子感受到的失谐（多普勒频移 k·v，k = 2π/λ）。", "辐射压力。每吸收一个光子沿光束方向获得动量 ħk；自发辐射方向随机，平均而言只有吸收产生推力。单束光的力 F = ħk·R。", "光学黏团力。两束对射的红失谐光（δ < 0）中，向右运动的原子更接近从右侧射来光束的共振，从它散射更多光子：F(v) = ħk[R(δ − kv) − R(δ + kv)]，当 |kv| ≪ Γ 时 ≈ −β·v，β = −8ħk²δs₀/(Γ(1 + s₀ + (2δ/Γ)²)²)。图中红色曲线即 F(v)；它只在俘获速度 ≈ (Γ/2k)√(1+s₀) 内起作用。", "加热。每个散射光子带来两次随机反冲（吸收与发射），动量扩散 D₀ = ħ²k²R_tot(1+η)/2，η 为发射在光轴上的投影比例（教科书一维模型 η = 1，各向同性三维发射 η = 1/3）。", "多普勒温度。阻尼与加热平衡于 k_BT = D₀/β = ħΓ(1+η)(1 + s₀ + (2δ/Γ)²)/(16|δ|/Γ)。在 δ = −(Γ/2)√(1+s₀)、s₀ → 0 时取最小值，即多普勒极限 T_D = ħΓ/2k_B（η = 1）。反冲温度 T_r = ħ²k²/(m k_B) 给出更低的下限；窄线（Γ 与反冲频率可比）时半经典模型失效。", "模拟。每个时间步对每个原子分别从两束光抽取泊松分布的光子数，每次吸收加 ±ħk/m，并加随机发射反冲，因此温度曲线在解析值附近呈现真实的散粒噪声。蓝失谐（δ > 0）使力变为反阻尼，原子云被加热。"]
    princ_p: ["彭宁阱运动。处于磁场 B 与四极势 U₀ 中的离子有三种本征运动：修正回旋 ω₊、磁控 ω₋ 与轴向 ω_z，满足 ω₊ + ω₋ = ω_c = qB/m，ω₊ω₋ = ω_z²/2。", "磁控难题。磁控运动的总能量为负（势垒占主导），去除动能的摩擦力反而增大其半径：居中的径向激光冷却 ω₊，却加热 ω₋。", "Itano–Wineland 方案。将光束偏移 y_b，利用光强梯度得到力梯度 F′ = ∂F/∂y。径向振幅变化率为 γ₊ = (F′ − β_rω₊)/(2mΔω)，γ₋ = (β_rω₋ − F′)/(2mΔω)，Δω = ω₊ − ω₋。只有在窗口 β_rω₋ < F′ < β_rω₊（绿色条）内两者都为负（冷却）。二者之和固定：γ₊ + γ₋ = −β_r/(2m)。", "轴向冷却。将光束相对径向平面倾斜 θ，得到轴向阻尼 γ_z = −β sin²θ/(2m)，径向份额减为 β_r = β cos²θ。", "平衡。反冲扩散 D 将振幅限制在 A_eq = √(D/(−2γ))；振幅演化为 A(t)² = A₀²e^{2γt} + D(e^{2γt} − 1)/(2γ)，见双对数图。来源：Itano & Wineland PRA 25, 35 (1982)；Hendricks 等 arXiv:0709.3817。"]
  fi:
    title: "Laserjäähdytys"
    intro: "Punaisesti viritetty laservalo hidastaa atomeja ja ioneja: liikkuva hiukkanen näkee vastaantulevan säteen Doppler-siirtyneenä lähemmäs resonanssia ja sirottaa siitä enemmän fotoneja. Jokainen absorptio antaa liikettä vastustavan potkun ħk; satunnainen spontaani emissio lämmittää. Tasapaino on Doppler-lämpötila."
    m_title: "Optinen melassi — jäähdytä pilvi"
    m_intro: "Kaksi vastakkaista sädettä x-suunnassa. Säädä viritystä ja intensiteettiä, käynnistä laser ja yritä päästä Doppler-rajalle ħΓ/2k_B mahdollisimman nopeasti."
    p_title: "Yksi ioni Penning-loukussa"
    p_intro: "Radiaalinen säde jäähdyttää syklotroniliikettä mutta lämmittää magnetroniliikettä (sen energia on negatiivinen). Siirrä säde sivuun, jotta intensiteettigradientti työntää magnetroniradan sisäänpäin; kallista sädettä jäähdyttääksesi myös aksiaaliliikkeen."
