c128:
  de: Das inverse Design verwendet das gewählte Zielion, den Radius und die RF-Frequenz. Vor dem Anwenden in der Vorschau prüfen; jede Änderung macht die vorherige Vorschau ungültig. Die nominelle Tiefe QqV/4 gilt für U=0 bei r=r₀ im idealen adiabatischen Modell und ist keine gemessene Barriere an der Staboberfläche. Massengrenzen beschreiben den ersten Stabilitätsbereich für unendliche Zeit; die Transmission bei endlicher Verweilzeit kann abweichen.
  en: Inverse design uses the selected target ion, radius and RF frequency. Preview before applying; any edit invalidates the previous preview. Nominal depth QqV/4 is for U=0 at r=r₀ in the ideal adiabatic model, rather than a measured rod-surface barrier. Mass cutoffs describe the infinite-time first stability region; finite-residence transmission may differ.
  fi: Käänteissuunnittelu käyttää valittua kohdeionia, sädettä ja RF-taajuutta. Esikatsele ennen käyttöä; mikä tahansa muutos mitätöi edellisen esikatselun. Nimellissyvyys QqV/4 pätee, kun U=0 ja r=r₀ ideaalisessa adiabaattisessa mallissa, eikä se ole mitattu sauvan pinnan este. Massarajat kuvaavat äärettömän ajan ensimmäistä stabiiliusaluetta; äärellisen viipymäajan läpäisy voi poiketa.
  fr: La conception inverse utilise l'ion cible, le rayon et la fréquence RF sélectionnés. Prévisualisez avant d'appliquer ; toute modification invalide l'aperçu précédent. La profondeur nominale QqV/4 correspond à U=0 en r=r₀ dans le modèle adiabatique idéal ; ce n'est pas une barrière mesurée à la surface des tiges. Les coupures de masse décrivent la première région de stabilité en temps infini ; la transmission à temps de séjour fini peut différer.
  ja: 逆設計は、選択した対象イオン、半径、RF 周波数を使います。適用前にプレビューしてください。何かを編集すると以前のプレビューは無効になります。公称の深さ QqV/4 は理想的な断熱モデルで U=0、r=r₀ の場合のもので、ロッド表面での測定されたバリアではありません。質量カットオフは無限時間での第 1 安定領域を表し、有限の滞在時間での透過は異なることがあります。
  zh: 反算使用当前目标离子、半径和 RF 频率。先预览再应用，任何输入变化均取消旧预览。名义势阱深度 QqV/4 在 U=0、r=r₀ 的理想绝热模型下计算；非真实杆表面的势垒。质量截止值来自无限时间第一稳定区；有限驻留透过率可能不同。
c129:
  de: Wie Einrichtungen und Massenmessexperimente zusammenhängen
