  de: Rote Verstimmung dämpft langsame Atome; blaue Verstimmung kann heizen.
  en: Red detuning damps slow atoms; blue detuning can heat.
  fi: Punainen viritysero vaimentaa hitaita atomeja; sininen viritysero voi lämmittää.
  fr: Un désaccord vers le rouge amortit les atomes lents ; un désaccord vers le bleu peut chauffer.
  ja: 赤離調は遅い原子を減衰させ、青離調は加熱することがあります。
  zh: 红失谐可阻尼慢原子，蓝失谐可能加热。
c168:
  de: I/I_sat pro Strahl; der Nenner verwendet die lokale Summe aller sechs Strahlen.
  en: I/I_sat per beam; the denominator uses the local sum of all six beams.
  fi: I/I_sat säettä kohden; nimittäjä käyttää kaikkien kuuden säteen paikallista summaa.
  fr: I/I_sat par faisceau ; le dénominateur utilise la somme locale des six faisceaux.
  ja: ビームあたりの I/I_sat。分母には 6 本すべてのビームの局所的な合計を使います。
  zh: 每束光的 I/I_sat；分母使用六束光的局部总饱和度。
c169:
  de: Die Intensität fällt wie exp(−2 r_perp²/w²) ab, mit dem Abstand quer zu jedem Strahl.
  en: Intensity falls as exp(−2 r_perp²/w²), using distance transverse to each beam.
  fi: Intensiteetti laskee kuten exp(−2 r_perp²/w²) käyttäen kunkin säteen poikittaisetäisyyttä.
  fr: L'intensité décroît comme exp(−2 r_perp²/w²), à partir de la distance transverse à chaque faisceau.
  ja: 強度は各ビームに垂直な距離を用いて exp(−2 r_perp²/w²) に従って減少します。
  zh: 按各束横向距离，强度为 exp(−2 r_perp²/w²)。
c170:
  de: Gaußsche Geschwindigkeitsvarianz pro Achse k_B T/m; endliche Stichproben weichen von diesem Ziel ab.
  en: Gaussian velocity variance per axis k_B T/m; finite samples differ from this target.
  fi: Gaussin nopeusvarianssi akselia kohden k_B T/m; äärelliset otokset poikkeavat tästä tavoitteesta.
  fr: Variance gaussienne des vitesses par axe k_B T/m ; les échantillons finis diffèrent de cette cible.
  ja: 各軸のガウス分布の速度分散は k_B T/m です。有限サンプルは目標値と一致しません。
  zh: 每轴高斯速度方差 k_B T/m；有限样本不完全等于目标。
c171:
  de: Eine Standardabweichung jeder gaußschen Ortskomponente, kein Teilchenradius.
  en: One standard deviation of each Gaussian position component, not a particle radius.
  fi: Kunkin Gaussin paikkakomponentin yksi keskihajonta, ei hiukkasen säde.
  fr: Un écart-type de chaque composante de position gaussienne, et non un rayon de particule.
  ja: 各ガウス位置成分の標準偏差 1 つ分であり、粒子の半径ではありません。
  zh: 各高斯位置分量的一个标准差，并非原子球半径。
c172:
  de: Unabhängige Teilchen; größere Stichproben verringern statistische Schwankungen und erhöhen den Rechenaufwand.
  en: Independent particles; larger samples reduce statistical fluctuations and increase work.
  fi: Toisistaan riippumattomat hiukkaset; suurempi otos vähentää tilastollista vaihtelua mutta lisää laskentaa.
  fr: Particules indépendantes ; un échantillon plus grand réduit les fluctuations statistiques et augmente le travail de calcul.
  ja: 互いに独立した粒子です。サンプルを増やすと統計ゆらぎは減りますが、計算量は増えます。
  zh: 独立粒子；增大样本可减小统计涨落，但增加运算量。
