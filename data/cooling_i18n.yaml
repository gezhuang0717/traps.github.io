  de: Das 3D-Diagramm durch Ziehen drehen und mit dem Mausrad zoomen. Mit dem Zeiger über einen Punkt oder eine Kurve fahren, um Werte zu sehen; klicken, um sie im Textfeld festzuhalten. Ansichtsänderungen erhalten die Physik; physikalische Änderungen stoppen und setzen den Lauf zurück. Verborgene Methoden-Reiter pausieren sofort ohne Hintergrundsimulation.
  en: Drag the 3D plot to rotate and use the wheel to zoom. Hover over a point or curve for values; click to pin them in the textbox. View changes keep the physics; physical edits stop and reset the run. Hidden method tabs pause immediately without background simulation.
  fi: Pyöritä 3D-kuvaa vetämällä ja zoomaa rullalla. Vie osoitin pisteen tai käyrän päälle nähdäksesi arvot; napsauta kiinnittääksesi ne tekstikenttään. Näkymän muutokset säilyttävät fysiikan; fysikaaliset muutokset pysäyttävät ja nollaavat ajon. Piilotetut menetelmävälilehdet pysähtyvät heti ilman taustasimulaatiota.
  fr: Faites glisser le graphique 3D pour le faire tourner et utilisez la molette pour zoomer. Survolez un point ou une courbe pour voir les valeurs ; cliquez pour les épingler dans la zone de texte. Les changements de vue conservent la physique ; les modifications physiques arrêtent et réinitialisent l'exécution. Les onglets de méthode masqués se mettent immédiatement en pause, sans simulation en arrière-plan.
  ja: 3D プロットはドラッグで回転し、ホイールで拡大縮小します。点や曲線にカーソルを合わせると値が表示され、クリックするとテキストボックスに固定されます。表示の変更では物理計算は変わらず、物理パラメータを編集すると実行は停止してリセットされます。非表示の手法タブは直ちに一時停止し、バックグラウンドでは計算しません。
  zh: 拖动三维图旋转、滚轮缩放；悬停在点或曲线上查看数值，单击固定到下方文本框。改变视图不会重算物理结果；改变物理参数会停止并重置。隐藏标签页立即暂停，不在后台计算。
