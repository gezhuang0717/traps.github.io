c037:
  de: Stochastische Diffusionsintegration mit zusätzlichen Zeitschrittgrenzen für Dämpfung, rücktreibende Kraft, Strahldurchflug und Zeeman-Änderung. Optische Zyklen, Transienten der inneren Zustände und einzelne seltene Photonenereignisse werden nicht aufgelöst; Photonenzahlen sind Erwartungswerte. Die Wiedergabegeschwindigkeit ändert nie den physikalischen Zeitschritt. Die Arbeit ist auf 20 Millionen Teilchenschritte begrenzt; zur Konvergenzprüfung den Zeitschritt halbieren. Der Verlustradius ist eine vom Nutzer definierte diagnostische Grenze, keine MOT-Wand; die Temperatur der Überlebenden verwendet nur Atome, die noch innerhalb liegen.
  en: Stochastic diffusion integration with additional damping, restoring-force, beam-transit and Zeeman-change timestep limits. Optical cycles, internal-state transients and individual sparse photon events are not resolved; photon counts are expectations. Playback speed never changes the physical timestep. Work is capped at 20 million particle steps; halve the timestep to check convergence. The loss radius is a user-defined diagnostic boundary, not a MOT wall; survivor temperature uses only atoms still inside it.
  fi: Stokastinen diffuusiointegrointi lisävaimennus-, palautusvoima-, sädekulku- ja Zeeman-muutosaika-askelrajoituksin. Optisia sykliä, sisäisten tilojen transientteja ja yksittäisiä harvoja fotonitapahtumia ei erotella; fotonimäärät ovat odotusarvoja. Toistonopeus ei koskaan muuta fysikaalista aika-askelta. Työ rajoitetaan 20 miljoonaan hiukkasaskeleeseen; puolita aika-askel tarkistaaksesi suppenemisen. Häviösäde on käyttäjän määrittelemä diagnostinen raja, ei MOT-seinä; eloonjääneiden lämpötila käyttää vain säteen sisään jääneitä atomeja.
  fr: Intégration stochastique de diffusion avec limites supplémentaires du pas de temps liées à l'amortissement, à la force de rappel, au transit dans les faisceaux et au changement Zeeman. Les cycles optiques, les transitoires d'états internes et les événements photoniques rares individuels ne sont pas résolus ; les nombres de photons sont des espérances. La vitesse de lecture ne change jamais le pas de temps physique. Le travail est plafonné à 20 millions de pas de particules ; divisez le pas par deux pour vérifier la convergence. Le rayon de perte est une frontière de diagnostic définie par l'utilisateur, pas une paroi de MOT ; la température des survivants n'utilise que les atomes restés à l'intérieur.
  ja: 減衰・復元力・ビーム通過・ゼーマン変化に対する追加の時間刻み制限を備えた、確率的拡散の積分です。光学サイクル、内部状態の過渡現象、個々のまれな光子イベントは分解せず、光子数は期待値です。再生速度が物理的な時間刻みを変えることはありません。計算量は粒子ステップ 2000 万回に制限され、収束の確認には時間刻みを半分にしてください。損失半径はユーザーが定義する診断用の境界で、MOT の壁ではありません。生存原子の温度は半径内に残った原子のみから求めます。
  zh: 使用带反冲的随机扩散积分；时间步还受阻尼、恢复力、穿越光束与 Zeeman 变化尺度限制。它不解析光学周期、内部态瞬态或稀疏散射中的逐光子事件；光子计数是预期值。播放速度不改变物理时间步。运行总量上限为两千万粒子步；减半时间步检查收敛。损失半径是用户定义的诊断边界，不是磁光阱硬壁；“剩余温度”只统计仍在边界内的原子。
