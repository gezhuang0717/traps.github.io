c005:
  de: 'Empfohlene Reihenfolge: (1) rote und blaue Verstimmung in der optischen Melasse vergleichen; (2) in der analytischen Penning-Falle Strahlversatz null und vorgeschlagenen Versatz vergleichen, 50 ms anzeigen und die Bahn anpassen; (3) im Reiter „Noch ausgefeilter“ Paul- oder Penning-Falle wählen und alle drei Achsen vergleichen; (4) bei der Paul-Falle gemitteltes und tatsächliches RF-Feld vergleichen; (5) nach dem Festlegen von Parametern und Startwert das CSV speichern. Der Penning-Einschluss besitzt kein positiv definites statisches 3D-Minimum des elektrischen Potentials; die statische Relaxation der Paul-Falle darf daher nicht auf die Penning-Falle übertragen werden.'
  en: 'Suggested sequence: (1) compare red and blue detuning in optical molasses; (2) compare zero and suggested offset in analytic Penning, show 50 ms and fit the orbit; (3) choose Paul or Penning in the fancier panel and compare all three axes; (4) compare averaged and actual RF for Paul; (5) save CSV after fixing parameters and seed. Penning confinement has no positive-definite static 3D electric-potential minimum, so Paul static relaxation must not be applied to Penning.'
  fi: 'Ehdotettu järjestys: (1) vertaa punaista ja sinistä virityseroa optisessa melassissa; (2) vertaa nollaa ja ehdotettua siirtymää analyyttisessä Penning-loukussa, näytä 50 ms ja sovita rata; (3) valitse Paul- tai Penning-loukku välilehdellä “Vielä edistyneempi” ja vertaa kaikkia kolmea akselia; (4) vertaa Paul-loukussa keskiarvoistettua ja todellista RF:ää; (5) tallenna CSV, kun parametrit ja siemenluku on lukittu. Penning-loukun vangitsemisessa ei ole positiividefiniittiä staattista 3D-sähköpotentiaalin minimiä, joten Paul-loukun staattista relaksaatiota ei saa soveltaa Penning-loukkuun.'
  fr: 'Séquence suggérée : (1) comparer les désaccords vers le rouge et vers le bleu dans la mélasse optique ; (2) comparer un décalage de faisceau nul et le décalage suggéré dans le piège de Penning analytique, afficher 50 ms et ajuster l''orbite ; (3) dans l''onglet « Détaillé », choisir un piège de Paul ou de Penning et comparer les trois axes ; (4) pour le piège de Paul, comparer le champ RF moyenné et le champ RF réel ; (5) enregistrer le CSV après avoir fixé les paramètres et la graine. Le confinement de Penning n''a pas de minimum défini positif du potentiel électrique statique 3D ; la relaxation statique du piège de Paul ne doit donc pas être appliquée au piège de Penning.'
  ja: 推奨手順：(1) 光学モラセスで赤離調と青離調を比較する。(2) 解析的ペニングトラップでオフセット 0 と提案オフセットを比較し、50 ms を表示して軌道をフィットする。(3)「さらに高度」タブでパウルまたはペニングを選び、3 軸すべてを比較する。(4) パウルトラップでは平均化した RF と実際の RF を比較する。(5) パラメータと乱数シードを固定してから CSV を保存する。ペニングトラップの閉じ込めには正定値の静的 3D 電位の極小がないため、パウルトラップの静的緩和をペニングトラップに適用してはいけません。
  zh: 建议顺序：① 原始光学黏胶用红失谐与蓝失谐比较；② 解析潘宁页比较偏移 0 与建议偏移，再显示 50 ms 并适应轨道；③ 更进阶页选择 Paul 或 Penning，运行并比较三个轴；④ 保罗阱比较平均势与真实射频；⑤ 固定参数和种子后保存 CSV。潘宁阱没有正定的静态三维电势最低点，不能把保罗阱的静态松弛直接用于潘宁阱。
