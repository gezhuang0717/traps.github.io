  fr: Après l'enregistrement, utilisez Enregistrer la vidéo sous son aperçu. Les captures incluent les paramètres et le temps physique.
  ja: 録画後、プレビューの下にある「録画した動画を保存」を使ってください。録画にはパラメータと物理時間が含まれます。
  zh: 录制后在预览下点击“保存录制视频”；画面包含参数与物理时间。
