c001:
  de: Die 3D-Bewegung und die Kühlkurven verwenden dieselbe Uhr. Räumliche Bahnen werden auf den Bildschirm projiziert; das Drehen der Kamera verändert die Ionen nicht. Die Dynamik beruht auf idealen Feldern, klassischen Ionen und voneinander unabhängigen Zwei-Niveau-Strahlen.
  en: The 3D motion and cooling curves use the same clock. Spatial trajectories are projected onto the screen; rotating the camera does not change the ions. Dynamics use ideal fields, classical ions and independent two-level beams.
  fi: 3D-liike ja jäähdytyskäyrät käyttävät samaa kelloa. Avaruudelliset radat projisoidaan näytölle; kameran kääntäminen ei muuta ioneja. Dynamiikassa käytetään ideaalisia kenttiä, klassisia ioneja ja toisistaan riippumattomia kaksitasosäteitä.
  fr: Le mouvement 3D et les courbes de refroidissement utilisent la même horloge. Les trajectoires spatiales sont projetées sur l'écran ; faire tourner la caméra ne modifie pas les ions. La dynamique repose sur des champs idéaux, des ions classiques et des faisceaux à deux niveaux indépendants.
  ja: 3D の運動と冷却曲線は同じ時計を使います。空間軌道は画面に投影されており、カメラを回してもイオンは変わりません。力学には理想的な電磁場、古典的なイオン、互いに独立した二準位ビームを用います。
  zh: 三维视图与冷却曲线使用同一时钟。相空间中的轨迹投影在屏幕上；旋转视角不会改变离子运动。动力学采用理想场、经典离子与独立二能级光束。
c002:
  de: Jeder Strahl streut mit R = (Γ/2)s/[1+s+(2(δ−kv)/Γ)²]. Absorption überträgt ±ℏk Impuls; spontane Emission liefert einen zufälligen 3D-Rückstoß. Die Achsentemperaturen werden aus der Geschwindigkeitsvarianz nach Abzug der Schwerpunktsdrift berechnet, Tᵢ=m Var(vᵢ)/kB; die mittlere Temperatur ist der Mittelwert der Achsen. Mikrobewegung und kollektive Bewegung können in diese Größe eingehen; sie ist nicht automatisch eine Gleichgewichtstemperatur.
  en: Each beam scatters at R = (Γ/2)s/[1+s+(2(δ−kv)/Γ)²]. Absorption gives ±ℏk momentum; spontaneous emission gives random 3D recoil. Axis temperatures use velocity variance after removing centre-of-mass drift, Tᵢ=m Var(vᵢ)/kB; mean temperature averages the axes. Micromotion and collective motion can enter this diagnostic; it is not automatically an equilibrium temperature.
  fi: Jokainen säde sirottaa nopeudella R = (Γ/2)s/[1+s+(2(δ−kv)/Γ)²]. Absorptio antaa ±ℏk liikemäärän; spontaani emissio antaa satunnaisen 3D-rekyylin. Akselien lämpötilat lasketaan nopeuden varianssista massakeskipisteen ajautuman poiston jälkeen, Tᵢ=m Var(vᵢ)/kB; keskilämpötila on akselien keskiarvo. Mikroliike ja kollektiivinen liike voivat vaikuttaa tähän diagnostiikkaan; se ei ole automaattisesti tasapainolämpötila.
  fr: Chaque faisceau diffuse au taux R = (Γ/2)s/[1+s+(2(δ−kv)/Γ)²]. L'absorption transfère une impulsion ±ℏk ; l'émission spontanée donne un recul 3D aléatoire. Les températures par axe utilisent la variance des vitesses après retrait de la dérive du centre de masse, Tᵢ=m Var(vᵢ)/kB ; la température moyenne est la moyenne des axes. Le micromouvement et le mouvement collectif peuvent entrer dans ce diagnostic ; ce n'est pas automatiquement une température d'équilibre.
  ja: 各ビームは R = (Γ/2)s/[1+s+(2(δ−kv)/Γ)²] で散乱します。吸収で ±ℏk の運動量を受け取り、自然放出でランダムな 3D 反跳を受けます。軸ごとの温度は重心ドリフトを除いた速度分散 Tᵢ=m Var(vᵢ)/kB から求め、平均温度は各軸の平均です。マイクロモーションや集団運動もこの診断量に入り得るため、必ずしも平衡温度ではありません。
  zh: 单束散射率 R = (Γ/2)s/[1+s+(2(δ−kv)/Γ)²]。吸收提供 ±ℏk 动量，随机发射提供三维反冲。去除整体漂移后，以速度方差计算各轴温度 Tᵢ=m Var(vᵢ)/kB；平均温度为三轴平均。微运动和有序集体运动仍可进入该诊断，不能自动解释为平衡热温度。
