c021:
  de: Γ/2π wird in MHz angegeben; der Rechenkern verwendet Γ (rad/s), λ (m) und die Atommasse (kg). Rückstoßaufgelöste Übergänge werden abgelehnt und nicht als gültige Diffusionskühlung behandelt.
  en: Γ/2π is given in MHz; the kernel uses Γ (rad/s), λ (m) and atomic mass (kg). Recoil-resolved transitions are rejected rather than treated as valid diffusion cooling.
  fi: Γ/2π annetaan MHz-yksikössä; ydin käyttää Γ:aa (rad/s), λ:aa (m) ja atomimassaa (kg). Rekyyli-erotetut siirtymät hylätään eikä niitä käsitellä pätevänä diffuusiojäähdytyksenä.
  fr: Γ/2π est donné en MHz ; le noyau de calcul utilise Γ (rad/s), λ (m) et la masse atomique (kg). Les transitions résolues en recul sont rejetées plutôt que traitées comme un refroidissement par diffusion valide.
  ja: Γ/2π は MHz で示します。計算コアは Γ (rad/s)、λ (m)、原子質量 (kg) を使います。反跳分解される遷移は有効な拡散冷却として扱わず、拒否します。
  zh: Γ/2π 以 MHz 给出；核心程序使用 Γ（rad/s）、λ（m）与原子质量（kg）。接近反冲分辨区的谱线会被拒绝，不用扩散模型伪造窄线冷却。
