c116:
  de: εₓ = √(Var(x)Var(vₓ) − Cov(x,vₓ)²), in µm·m/s. Ein unkorrelierter Gauß-Start hat ε ≈ σₓ√(kBT/m). „T aus ε setzen“ verwendet diese Beziehung und deaktiviert die Relaxation der Anfangspositionen. Endliche Stichproben weichen vom gewünschten Ziel ab; die Statusanzeige nennt das tatsächliche anfängliche und aktuelle ε. Die Temperatur verwendet die Varianzen der Geschwindigkeitsstichprobe nach Abzug des Schwerpunkts; der Mittelwert ist der Durchschnitt aus x/y/z. Die Anfangs-T ist ein Verteilungsziel, daher weicht eine kleine Stichprobe ab. Freisetzung potentieller Energie und Mikrobewegung können vorübergehende Erwärmung verursachen; die Kurven werden nicht zum Fallen gezwungen. Die Doppler-Linie ist eine Referenzskala und keine Vorhersage für jede Bedingung. Dies ist eine Phasenraumfläche und keine Strahlemittanz in mm·mrad, die eine Longitudinalgeschwindigkeit erfordert. Der Kugelradius ändert nur die gezeichnete Markierung; er ist nicht der physikalische Radius des Ions.
  en: εₓ = √(Var(x)Var(vₓ) − Cov(x,vₓ)²), in µm·m/s. An uncorrelated Gaussian start has ε ≈ σₓ√(kBT/m). Set T from ε uses this relation and disables initial-position relaxation. Finite samples differ from the requested target; the status shows actual initial and current ε. Temperature uses the velocity sample variances after centre-of-mass subtraction; mean is the average of x/y/z. Initial T is a distribution target, so a small sample differs. Potential-energy release and micromotion can cause transient heating; curves are not forced to decrease. The Doppler line is a reference scale rather than a prediction for every condition. This is a phase-space area, rather than beam emittance in mm·mrad, which requires a longitudinal velocity. Ball radius changes the drawn marker only; it is not the ion’s physical radius.
  fi: εₓ = √(Var(x)Var(vₓ) − Cov(x,vₓ)²), yksikössä µm·m/s. Korreloimattoman Gaussin alulle ε ≈ σₓ√(kBT/m). “Aseta T ε:n mukaan” käyttää tätä yhteyttä ja poistaa alkupaikkojen relaksaation käytöstä. Äärelliset otokset poikkeavat pyydetystä tavoitteesta; tilarivi näyttää todellisen alku- ja nykyisen ε:n. Lämpötila käyttää nopeusotoksen variansseja massakeskipisteen vähennyksen jälkeen; keskiarvo on x/y/z:n keskiarvo. Alku-T on jakauman tavoite, joten pieni otos poikkeaa siitä. Potentiaalienergian vapautuminen ja mikroliike voivat aiheuttaa ohimenevää lämpenemistä; käyriä ei pakoteta laskemaan. Doppler-viiva on viiteasteikko eikä ennuste jokaiselle tilanteelle. Tämä on vaiheavaruuden ala, ei sädeemittanssi yksikössä mm·mrad, joka vaatii pitkittäisnopeuden. Pallon säde muuttaa vain piirrettyä merkkiä; se ei ole ionin fysikaalinen säde.
  fr: εₓ = √(Var(x)Var(vₓ) − Cov(x,vₓ)²), en µm·m/s. Un départ gaussien non corrélé a ε ≈ σₓ√(kBT/m). Fixer T d'après ε utilise cette relation et désactive la relaxation des positions initiales. Les échantillons finis diffèrent de la cible demandée ; l'état affiche le ε initial et le ε courant réels. La température utilise les variances de l'échantillon de vitesses après soustraction du centre de masse ; la moyenne est celle de x/y/z. T initial est une cible de distribution, donc un petit échantillon s'en écarte. La libération d'énergie potentielle et le micromouvement peuvent provoquer un chauffage transitoire ; les courbes ne sont pas forcées à décroître. La ligne Doppler est une échelle de référence et non une prédiction pour chaque condition. Il s'agit d'une aire dans l'espace des phases, et non de l'émittance d'un faisceau en mm·mrad, qui nécessite une vitesse longitudinale. Le rayon de la boule ne change que le marqueur dessiné ; ce n'est pas le rayon physique de l'ion.
  ja: εₓ = √(Var(x)Var(vₓ) − Cov(x,vₓ)²)、単位は µm·m/s。相関のないガウス分布の初期状態では ε ≈ σₓ√(kBT/m) です。「ε から T を設定」はこの関係を使い、初期位置の緩和を無効にします。有限サンプルは目標値と一致せず、ステータスには実際の初期 ε と現在の ε が表示されます。温度は重心を引いた後の速度サンプル分散から求め、平均は x/y/z の平均です。初期 T は分布の目標値なので、小さなサンプルでは差が出ます。ポテンシャルエネルギーの解放やマイクロモーションにより一時的な加熱が起こることがあり、曲線は減少するよう強制されません。ドップラー線は基準のスケールであり、あらゆる条件の予測ではありません。これは位相空間の面積であり、縦方向速度を必要とする mm·mrad のビームエミッタンスではありません。球の半径は描画マーカーだけを変え、イオンの物理的な半径ではありません。
  zh: εₓ = √(Var(x)Var(vₓ) − Cov(x,vₓ)²)，单位 µm·m/s。无相关的高斯初态约为 σₓ√(kBT/m)；“由 ε 设置初温”据此计算 T，并关闭初始位置松弛。有限粒子样本的实际 ε 与输入目标有差别，状态栏同时显示初始与当前 ε。温度曲线使用去除质心速度后的三轴样本方差，均值是三轴的平均；初温输入是随机分布的目标，少量离子的样本值通常不同。初始势能释放和微运动可使曲线短时升温，并不强制单调下降。图中多普勒标线是参考尺度，非所有条件的最终温度预测。该量不是需要纵向速度定义的 mm·mrad 束流发射度。球半径仅改变绘图标记；并非离子的物理半径。
c117:
  de: Modell, Bedienelemente und Quellen
  en: Model, controls and sources
  fi: Malli, säätimet ja lähteet
  fr: Modèle, commandes et sources
  ja: モデル・操作・出典
  zh: 模型、用法与来源
c118:
  de: 'Voreinstellungen: ⁴⁰Ca⁺, 397 nm, Γ/2π=23,05 MHz. Kühlung ausführen und dann blaue Heizung oder die RF-Voreinstellung vergleichen. Eine Änderung physikalischer Parameter setzt die Trajektorie zurück; Zoomen ändert nur die Darstellung. Die Temperatur verwendet die Geschwindigkeitsvarianz nach Abzug der Schwerpunktsdrift. Die Temperatur bei tatsächlichem RF enthält Mikrobewegung und ist keine reine säkulare Temperatur.'
  en: 'Defaults: ⁴⁰Ca⁺, 397 nm, Γ/2π=23.05 MHz. Run cooling, then compare blue heating or the RF preset. Changing physical parameters resets the trajectory; zoom changes only the drawing. Temperature uses velocity variance after subtracting centre-of-mass drift. Actual-RF temperature includes micromotion and is not a pure secular temperature.'
  fi: 'Oletukset: ⁴⁰Ca⁺, 397 nm, Γ/2π=23,05 MHz. Aja jäähdytys ja vertaa sitten sinistä lämmitystä tai RF-esiasetusta. Fysikaalisten parametrien muutos nollaa radan; zoom muuttaa vain piirtämistä. Lämpötila käyttää nopeuden varianssia massakeskipisteen ajautuman vähennyksen jälkeen. Todellisen RF:n lämpötila sisältää mikroliikkeen eikä ole puhdas sekulaarilämpötila.'
  fr: 'Valeurs par défaut : ⁴⁰Ca⁺, 397 nm, Γ/2π=23,05 MHz. Lancez le refroidissement, puis comparez le chauffage bleu ou le préréglage RF. Modifier des paramètres physiques réinitialise la trajectoire ; le zoom ne change que le dessin. La température utilise la variance des vitesses après soustraction de la dérive du centre de masse. La température avec RF réel inclut le micromouvement et n''est pas une température séculaire pure.'
  ja: 既定値：⁴⁰Ca⁺、397 nm、Γ/2π=23.05 MHz。冷却を実行してから、青離調による加熱や RF プリセットと比較してください。物理パラメータを変えると軌道はリセットされ、ズームは描画だけを変えます。温度は重心ドリフトを引いた後の速度分散から求めます。実際の RF での温度はマイクロモーションを含み、純粋な永年運動の温度ではありません。
  zh: 默认 ⁴⁰Ca⁺，397 nm，Γ/2π=23.05 MHz。先运行冷却，再选择蓝失谐或射频微运动预设。修改物理参数会重置轨迹；放大仅改变画面。温度由去除整体漂移后的速度方差定义，真实射频结果包含微运动，因此不是纯世俗温度。
c119:
  de: Klassische Punktionen, ideale Felder, voneinander unabhängige Zwei-Niveau-Strahlen und stochastischer Rückstoß; Coulomb-Abrundung 0,3 µm, einstellbarer Stabradius/Apertur. Mindestens 40 Integrationsschritte pro RF-Periode. Die Dynamik des Mehrniveau-Rückpumpens ist nicht enthalten; dieses Lehrmodell ist weder ein experimenteller noch ein Kristallphasen-Nachweis.
  en: Classical point ions, ideal fields, independent two-level beams and stochastic recoil; Coulomb softening 0.3 µm, adjustable rod radius/aperture. At least 40 integration steps per RF period. Multilevel repumping dynamics are omitted; this teaching model is not experimental or crystal-phase evidence.
  fi: Klassiset pistemäiset ionit, ideaaliset kentät, toisistaan riippumattomat kaksitasosäteet ja stokastinen rekyyli; Coulombin pehmennys 0,3 µm, säädettävä sauvan säde/aukko. Vähintään 40 integrointiaskelta RF-jaksoa kohti. Monitasoista takaisinpumppausdynamiikkaa ei ole mukana; tämä opetusmalli ei ole kokeellinen todiste eikä kidefaasin todiste.
  fr: Ions ponctuels classiques, champs idéaux, faisceaux à deux niveaux indépendants et recul stochastique ; adoucissement coulombien de 0,3 µm, rayon de tige et ouverture réglables. Au moins 40 pas d'intégration par période RF. La dynamique de repompage multi-niveaux est omise ; ce modèle pédagogique n'est ni une preuve expérimentale ni une preuve de phase cristalline.
  ja: 古典的な点イオン、理想的な電磁場、互いに独立した二準位ビーム、確率的な反跳を用います。クーロン力の緩和は 0.3 µm、ロッド半径と開口は調整可能です。積分は RF 1 周期あたり少なくとも 40 ステップ。多準位の再ポンピングの力学は含まず、この教育用モデルは実験的証拠でも結晶相の証拠でもありません。
  zh: 经典点离子、理想场、独立二能级光束及随机反冲；库仑相互作用在 0.3 µm 软化。r₀ 可调。射频每周期至少 40 个时间步。该教学模型不包含多能级回泵动力学；不能作为实验或晶体相变证据。
c120:
  de: 'Ionenmassen: AME2020-Atommasse minus Elektronenmasse; Korrekturen der Ionisationsbindungsenergie werden weggelassen. Der Spannungsmodus behält beim Wechsel der Spezies Spannungen und Geometrie bei; q und die Bewegungsfrequenzen ändern sich mit der Masse. Die JSON-Bedingungen enthalten die Masse.'
  en: 'Ion masses: AME2020 atomic mass minus electron mass; ionization binding corrections are omitted. Voltage mode keeps voltages and geometry when changing species; q and motional frequencies change with mass. The JSON conditions record the mass.'
  fi: 'Ionien massat: AME2020-atomimassa miinus elektronin massa; ionisaation sidosenergiakorjauksia ei oteta huomioon. Jännitetilassa jännitteet ja geometria säilyvät lajia vaihdettaessa; q ja liiketaajuudet muuttuvat massan mukana. JSON-ehdot tallentavat massan.'
  fr: 'Masses des ions : masse atomique AME2020 moins la masse des électrons ; les corrections d''énergie de liaison d''ionisation sont omises. Le mode tension conserve tensions et géométrie quand l''espèce change ; q et les fréquences de mouvement changent avec la masse. Les conditions JSON enregistrent la masse.'
  ja: イオン質量：AME2020 の原子質量から電子質量を引いたもので、電離の束縛エネルギーの補正は含みません。電圧モードではイオン種を変えても電圧と形状は保たれ、q と運動周波数は質量とともに変わります。JSON の条件には質量が記録されます。
  zh: 离子质量：AME2020 原子质量减去电子质量；忽略电离结合能修正。电压模式切换离子时保持电压和几何，q 与频率随质量改变；可在 JSON 条件中检查质量。
c121:
  de: Fallendesign, Umkehrrechnungen und Herleitungen
  en: Trap design, inverse calculations and derivations
  fi: Loukun suunnittelu, käänteislaskennat ja johdot
  fr: Conception du piège, calculs inverses et démonstrations
  ja: トラップの設計・逆算・導出
  zh: 阱设计、反算与公式推导
c122:
  de: Die RFQ-Stabpotentiale sind ±(U−V cos Ωt). V ist die Null-bis-Spitze-Amplitude eines Stabpaars gegenüber Masse; die differentielle Amplitude beträgt 2V. Das Kühlungspanel verwendet das differentielle V_RF, daher sind gleiche Zahlenwerte der Spannungen nicht austauschbar.
  en: RFQ rod potentials are ±(U−V cos Ωt). V is the zero-to-peak amplitude of one rod pair relative to ground; the differential amplitude is 2V. The cooling panel uses differential V_RF, so equal numerical voltages are not interchangeable.
  fi: RFQ-sauvojen potentiaalit ovat ±(U−V cos Ωt). V on yhden sauvaparin nollasta huippuun -amplitudi maahan nähden; differentiaaliamplitudi on 2V. Jäähdytyspaneeli käyttää differentiaalista V_RF-arvoa, joten samat numeeriset jännitteet eivät ole keskenään vaihdettavissa.
  fr: Les potentiels des tiges RFQ valent ±(U−V cos Ωt). V est l'amplitude zéro-crête d'une paire de tiges par rapport à la masse ; l'amplitude différentielle est 2V. Le panneau de refroidissement utilise V_RF différentiel, donc des tensions numériquement égales ne sont pas interchangeables.
  ja: RFQ のロッド電位は ±(U−V cos Ωt) です。V は接地に対する 1 組のロッドのゼロ・ピーク振幅で、差動振幅は 2V です。冷却パネルは差動の V_RF を使うため、数値が同じ電圧でも互換ではありません。
  zh: 此 RFQ 的杆电压为 ±(U−V cos Ωt)，V 是单组杆对地的零到峰值幅度。两组杆之间的差分幅度为 2V。冷却面板的 V_RF 是差分幅度，因此相同数值不可直接互换。
