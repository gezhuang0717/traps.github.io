c014:
  de: Die Geschwindigkeit ändert die Zahl der sicheren Schritte oder das Fortschreiten der analytischen Uhr, ohne den numerischen Zeitschritt zu vergrößern. Für die Inspektion die langsame Wiedergabe oder Einzelschritte verwenden. Schnelle Wiedergabe wird durch eine Obergrenze der Rechenarbeit pro Bild begrenzt und kann unter dem gewünschten Faktor liegen; die physikalische Uhr zeigt den tatsächlichen Fortschritt. Die Video-fps bestimmt die Aufnahmerate und garantiert nicht, dass schnelle Bewegungen aufgelöst werden. Zur Verringerung von Aliasing den Beobachtungszeitraum verkürzen und langsam aufnehmen.
  en: Speed changes the number of safe steps or the analytic clock advance, without enlarging the numerical timestep. Use slow playback or single steps for inspection. Fast playback is limited by a per-frame work cap and may fall below the requested multiplier. The physical clock reports the actual advance. Video fps controls capture sampling; it does not guarantee resolution of rapid motion. Shorten the observation span and record slowly to reduce aliasing.
  fi: Nopeus muuttaa turvallisten askelten määrää tai analyyttisen kellon etenemistä suurentamatta numeerista aika-askelta. Käytä hidasta toistoa tai yksittäisaskelia tarkasteluun. Nopeaa toistoa rajoittaa kuvakohtainen laskentaraja, joten se voi jäädä pyydettyä kerrointa pienemmäksi; fysikaalinen kello näyttää todellisen etenemisen. Videon fps säätää kuvaustaajuutta eikä takaa nopean liikkeen erottumista. Lyhennä havaintojaksoa ja tallenna hitaasti vähentääksesi laskostumista.
  fr: La vitesse modifie le nombre de pas sûrs ou l'avance de l'horloge analytique, sans agrandir le pas de temps numérique. Pour inspecter, utilisez la lecture lente ou le pas unique. La lecture rapide est limitée par un plafond de calcul par image et peut rester sous le facteur demandé ; l'horloge physique indique l'avance réelle. Les images par seconde de la vidéo règlent l'échantillonnage de la capture et ne garantissent pas de résoudre les mouvements rapides. Raccourcissez la durée d'observation et enregistrez lentement pour limiter le repliement.
  ja: 速度を上げても数値の時間刻みは大きくならず、安全なステップ数や解析的な時計の進みが変わります。確認にはスロー再生や 1 ステップ送りを使ってください。高速再生はフレームごとの計算量の上限があるため、指定倍率に届かないことがあります。物理時計は実際の進みを表示します。動画の fps は撮影間隔を決めるもので、速い運動の分解を保証しません。エイリアシングを減らすには、観測区間を短くしてゆっくり録画してください。
  zh: 速度只改变显示时推进的步数或解析时钟，不放大数值积分时间步。慢速或单步便于观察；高速受每帧计算上限限制，可能达不到指定倍数。物理时钟是实际推进时间。录制帧率决定保存的视频采样，不保证解析高频运动；为避免混叠，应缩短观察时间并慢速录制。
c015:
  de: 'Magnetooptische Falle: sechsstrahliges 3D-Einfangen und Kühlen'
  en: 'Magneto-optical trap: six-beam 3D capture and cooling'
  fi: 'Magneto-optinen loukku: kuusisäteinen 3D-vangitseminen ja jäähdytys'
  fr: 'Piège magnéto-optique : capture et refroidissement 3D à six faisceaux'
  ja: 磁気光学トラップ：6 ビームによる 3 次元捕獲と冷却
  zh: 磁光阱：六光束三维捕获与冷却
c016:
  de: 'Optische 3D-Melasse: Kühlung und Ausdehnung der Wolke'
  en: '3D optical molasses: cooling and cloud expansion'
  fi: '3D-optinen melassi: jäähtyminen ja pilven laajeneminen'
  fr: 'Mélasse optique 3D : refroidissement et expansion du nuage'
  ja: 3 次元光学モラセス：冷却と原子雲の膨張
  zh: 三维光学黏胶：冷却与云团膨胀
c017:
  de: Sechs gegenläufige Gauß-Strahlen wirken auf voneinander unabhängige neutrale Atome. Melasse dämpft die Geschwindigkeit ohne rücktreibende Kraft; eine MOT kombiniert ein Quadrupol-Magnetfeld mit zirkularer Polarisation, um ausgelenkte Atome zurückzuführen. Temperatur, Gesamtdrift und Wolkengröße getrennt vergleichen.
  en: Six counterpropagating Gaussian beams act on independent neutral atoms. Molasses damps velocity without a restoring force; a MOT combines a quadrupole magnetic field and circular polarization to restore displaced atoms. Compare temperature, bulk drift and cloud size separately.
  fi: Kuusi vastakkaissuuntaista Gaussin sädettä vaikuttaa toisistaan riippumattomiin neutraaleihin atomeihin. Melassi vaimentaa nopeutta ilman palauttavaa voimaa; MOT yhdistää kvadrupolimagneettikentän ja ympyräpolarisaation palauttamaan siirtyneet atomit. Vertaa lämpötilaa, kokonaisliikettä ja pilven kokoa erikseen.
  fr: Six faisceaux gaussiens contre-propageants agissent sur des atomes neutres indépendants. La mélasse amortit la vitesse sans force de rappel ; un MOT combine un champ magnétique quadripolaire et une polarisation circulaire pour rappeler les atomes déplacés. Comparez séparément la température, la dérive d'ensemble et la taille du nuage.
  ja: 6 本の対向するガウスビームが、互いに独立した中性原子に作用します。モラセスは復元力なしに速度を減衰させ、MOT は四重極磁場と円偏光を組み合わせて変位した原子を引き戻します。温度、全体のドリフト、雲の大きさは別々に比較してください。
  zh: 六束反向传播的高斯光束作用于独立中性原子。光学黏胶减小速度，但没有位置恢复力；磁光阱结合四极磁场与圆偏振产生恢复力。比较温度、整体漂移和云团大小，不要把三者混为一谈。
c018:
  de: 'Semiklassisches Lehrmodell im Browser: ideales F=0 → F′=1, augenblickliche stationäre Streuung, Näherung gemeinsamer Sättigung und isotrope Diffusion durch spontane Emission. Die Alkali-Einträge sind effektive Linienbeispiele; ihre reale Hyperfeinstruktur, das Rückpumpen, Polarisationsgradienten sowie Sub-Doppler- und Grau-Melasse-Dynamik sind nicht enthalten.'
  en: 'Browser semiclassical teaching model: ideal F=0 → F′=1, instantaneous steady scattering, shared-saturation approximation and isotropic spontaneous-emission diffusion. Alkali entries are effective-line examples; their real hyperfine structure, repumping, polarization-gradient, sub-Doppler and gray-molasses dynamics are omitted.'
  fi: 'Selaimessa toimiva puoliklassinen opetusmalli: ideaalinen F=0 → F′=1, hetkellinen vakaa sironta, jaetun saturaation approksimaatio ja isotrooppinen spontaanin emission diffuusio. Alkalimetallien rivit ovat tehollisia esimerkkirivejä; niiden todellista hyperhienorakennetta, takaisinpumppausta, polarisaatiogradienttia, sub-Doppler- ja harmaamelassidynamiikkaa ei ole mukana.'
  fr: 'Modèle pédagogique semi-classique dans le navigateur : F=0 → F′=1 idéal, diffusion stationnaire instantanée, approximation de saturation partagée et diffusion isotrope due à l''émission spontanée. Les entrées alcalines sont des exemples de raies effectives ; leur structure hyperfine réelle, le repompage, les gradients de polarisation, la dynamique sub-Doppler et celle de la mélasse grise sont omis.'
  ja: ブラウザ上の半古典的な教育用モデル：理想的な F=0 → F′=1、瞬時の定常散乱、共有飽和近似、等方的な自然放出拡散。アルカリ原子の項目は実効的なスペクトル線の例であり、実際の超微細構造、再ポンピング、偏光勾配、サブドップラー冷却、グレーモラセスの力学は含みません。
  zh: 浏览器半经典教学模型：理想 F=0 → F′=1，瞬时稳态散射、共享饱和近似、各向同性自发辐射扩散。碱金属是有效谱线示例，不包含其真实超精细结构、回泵、偏振梯度、亚多普勒或灰黏胶动力学。
