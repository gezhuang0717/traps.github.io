  fi: Aksiaalinen z–x-projektio (itsenäiset alueet)
  fr: Projection axiale z–x (plages indépendantes)
  ja: 軸方向 z–x 投影（独立した範囲）
  zh: 轴向 z–x 投影（独立范围）
c152:
  de: 3D-Projektion (physikalische Eigenfrequenzen)
  en: 3D projection (physical eigenfrequencies)
  fi: 3D-projektio (fysikaaliset ominaistaajuudet)
  fr: Projection 3D (fréquences propres physiques)
  ja: 3 次元投影（物理的な固有周波数）
  zh: 三维投影（真实本征频率）
c153:
  de: Die Bahnen verwenden die physikalischen Phasen von ν₊, ν₋ und νz zur angezeigten Zeit; die Spur umfasst die letzten sechs Zyklotronperioden. Die Wiedergabe nutzt eine beschleunigte logarithmische Uhr, und schnelle Bewegung kann visuell Aliasing zeigen. Die 3D-Ansicht durch Ziehen drehen; mit dem Mausrad zoomen.
  en: Orbits use the physical ν₊, ν₋ and νz phases at the displayed time; the trail covers the last six cyclotron periods. Playback uses an accelerated logarithmic clock and fast motion can visually alias. Drag the 3D view to rotate; wheel to zoom.
  fi: Radat käyttävät fysikaalisia ν₊-, ν₋- ja νz-vaiheita näytettynä hetkenä; jälki kattaa viimeiset kuusi syklotronijaksoa. Toisto käyttää kiihdytettyä logaritmista kelloa, ja nopea liike voi näyttää laskostuvalta. Pyöritä 3D-näkymää vetämällä; zoomaa rullalla.
  fr: Les orbites utilisent les phases physiques de ν₊, ν₋ et νz à l'instant affiché ; la traînée couvre les six dernières périodes cyclotron. La lecture utilise une horloge logarithmique accélérée et un mouvement rapide peut présenter un repliement visuel. Faites glisser la vue 3D pour la faire tourner ; molette pour zoomer.
  ja: 軌道は表示時刻における物理的な ν₊、ν₋、νz の位相を使い、軌跡は直近 6 サイクロトロン周期分を表示します。再生は加速された対数時計を使うため、速い運動は見かけ上エイリアシングを起こすことがあります。3D 表示はドラッグで回転し、ホイールで拡大縮小します。
  zh: 轨道使用真实 ν₊、ν₋、νz 与当前物理时间的相位，轨迹线仅显示最近六个回旋周期；播放采用加速的对数时钟，高频运动可能视觉混叠。拖动三维图旋转，滚轮缩放。
