c110:
  de: '3D-Ansicht: zum Drehen ziehen, zum Zoomen das Mausrad verwenden (auf Touchscreens „Ansichtszoom“); „Anpassen“ stellt den Maßstab wieder her. Das Video nimmt einen 2–30 Sekunden langen Ausschnitt unter den aktuellen Bedingungen auf. Kurze Läufe verlangsamen ihre Anzeige während der Aufnahme; die physikalische Uhr bleibt ausdrücklich sichtbar. Abbildungen und Video enthalten eine Zusammenfassung der Bedingungen; die vollständigen Bedingungen als JSON und die Zahlen als CSV speichern. Den gewünschten Ordner im Speichern-Dialog des Browsers wählen.'
  en: '3D view: drag to rotate, wheel to zoom (use View zoom on touch screens); Fit restores the scale. Video records a 2–30 second clip under the current conditions. Short runs slow their display while recording; the physical clock remains explicit. Figures and video include a condition summary; save full conditions as JSON and numbers as CSV. Choose your preferred folder in the browser’s save dialog.'
  fi: '3D-näkymä: pyöritä vetämällä, zoomaa rullalla (kosketusnäytöillä käytä Näkymän zoomia); Sovita palauttaa mittakaavan. Video tallentaa 2–30 sekunnin klipin nykyisillä ehdoilla. Lyhyet ajot hidastavat näyttöään tallennuksen aikana; fysikaalinen kello pysyy selkeästi näkyvissä. Kuvat ja video sisältävät ehtojen yhteenvedon; tallenna täydet ehdot JSON-tiedostona ja luvut CSV-tiedostona. Valitse haluamasi kansio selaimen tallennusikkunassa.'
  fr: 'Vue 3D : faites glisser pour tourner, utilisez la molette pour zoomer (sur écran tactile, utilisez Zoom de la vue) ; Ajuster rétablit l''échelle. La vidéo enregistre un clip de 2 à 30 secondes dans les conditions actuelles. Les exécutions courtes ralentissent leur affichage pendant l''enregistrement ; l''horloge physique reste affichée explicitement. Les figures et la vidéo incluent un résumé des conditions ; enregistrez les conditions complètes en JSON et les nombres en CSV. Choisissez votre dossier dans la boîte de dialogue d''enregistrement du navigateur.'
  ja: 3D 表示：ドラッグで回転、ホイールで拡大縮小（タッチ画面では「表示ズーム」を使用）。「全体表示に合わせる」で縮尺が元に戻ります。動画は現在の条件で 2〜30 秒のクリップを録画します。短い実行は録画中に表示が遅くなりますが、物理時計は明示されます。図と動画には条件の要約が入ります。全条件は JSON、数値は CSV で保存してください。保存先はブラウザーの保存ダイアログで選べます。
  zh: 三维图：拖动旋转，滚轮放大（触屏用放大框）；“完整视图”重设比例。视频按当前条件录制 2–30 秒；短模拟在录制时减慢显示，物理时钟仍明确标出。图像与视频带条件摘要；完整条件另存 JSON，数值另存 CSV。浏览器的保存位置请选择保存文件夹。
