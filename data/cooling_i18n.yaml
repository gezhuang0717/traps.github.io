c150:
  de: 'Strahlversatz 0 mit dem vorgeschlagenen Versatz vergleichen: Der Indikator tritt in das grüne Fenster ein, und die Magnetronrate wechselt von positiv zu negativ. Zum Vergleich der Kühlung einen festen Bereich beibehalten; „An aktuelle Bahn anpassen“ vergrößert die aktuelle Bewegung. Die Inspektionszeit verschiebt den Beobachtungspunkt ohne neue Anpassung.'
  en: 'Compare beam offset 0 with Suggest offset: the indicator enters the green window and the magnetron rate changes from positive to negative. Keep a fixed range to compare cooling; Fit current orbit magnifies the current motion. Inspect time changes the observation point without refitting.'
  fi: 'Vertaa säteen siirtymää 0 ehdotettuun siirtymään: ilmaisin siirtyy vihreälle alueelle ja magnetronin nopeus vaihtuu positiivisesta negatiiviseksi. Pidä alue kiinteänä verrataksesi jäähtymistä; Sovita nykyiseen rataan suurentaa nykyisen liikkeen. Tarkasteluhetki muuttaa havaintopistettä ilman uutta sovitusta.'
  fr: 'Comparez le décalage de faisceau 0 avec le décalage suggéré : l''indicateur entre dans la fenêtre verte et le taux de magnétron passe de positif à négatif. Gardez une plage fixe pour comparer le refroidissement ; Ajuster à l''orbite actuelle agrandit le mouvement courant. L''instant d''inspection déplace le point d''observation sans nouvel ajustement.'
  ja: ビームオフセット 0 と提案オフセットを比較してください。指標が緑の範囲に入り、マグネトロン速度の符号が正から負に変わります。冷却を比較するには範囲を固定し、「現在の軌道に合わせる」で現在の運動を拡大します。確認時刻を変えても再フィットはされず、観測点だけが動きます。
  zh: 先将光束偏移设为 0，再点「建议偏移」：箭头进入绿色区间，磁控管变化率从正变负。固定范围用于比较冷却；「适应当前轨道」用于放大。查看时刻只改变观察位置，不重新拟合。
c151:
  de: Axiale z–x-Projektion (unabhängige Bereiche)
