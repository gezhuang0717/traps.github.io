c063:
  de: PNG und PDF verwenden dieselben gewählten Ansichten; das PDF enthält ein hochauflösendes Bild. JSON speichert Bedingungen, Ansicht, tatsächlichen Zeitschritt und Statistik; die Wiederherstellung beginnt mit demselben Startwert und setzt den Zufallszustand nicht mittendrin fort. CSV speichert den abgetasteten Verlauf und die Teilchen-Momentaufnahme. Aufgenommene Videos haben unter der Browser-Vorschau einen eigenen Speicherlink; den Ordner im Speichern-Dialog des Systems wählen.
  en: PNG and PDF use the same selected views; the PDF contains a high-resolution image. JSON saves conditions, view, actual timestep and statistics; restore starts from the same seed rather than resuming the random state midway. CSV saves the sampled history and particle snapshot. Recorded video has a separate save link below its browser preview; choose your folder in the system save dialog.
  fi: PNG ja PDF käyttävät samoja valittuja näkymiä; PDF sisältää korkearesoluutioisen kuvan. JSON tallentaa ehdot, näkymän, todellisen aika-askeleen ja tilastot; palautus alkaa samasta siemenluvusta eikä jatka satunnaislukujen tilaa kesken. CSV tallentaa otetun historian ja hiukkasten tilannekuvan. Tallennetulla videolla on oma tallennuslinkki selainesikatselun alla; valitse kansio järjestelmän tallennusikkunassa.
  fr: Le PNG et le PDF utilisent les mêmes vues sélectionnées ; le PDF contient une image haute résolution. Le JSON enregistre les conditions, la vue, le pas de temps réel et les statistiques ; la restauration repart de la même graine au lieu de reprendre l'état aléatoire en cours de route. Le CSV enregistre l'historique échantillonné et un instantané des particules. La vidéo enregistrée a son propre lien de sauvegarde sous l'aperçu du navigateur ; choisissez votre dossier dans la boîte de dialogue d'enregistrement du système.
  ja: PNG と PDF は同じ選択ビューを使い、PDF には高解像度の画像が含まれます。JSON は条件、表示、実際の時間刻み、統計を保存します。復元は同じシードから開始し、乱数の状態を途中から再開するものではありません。CSV はサンプルした履歴と粒子のスナップショットを保存します。録画した動画にはブラウザのプレビューの下に別の保存リンクがあり、保存先フォルダーはシステムの保存ダイアログで選びます。
  zh: PNG 与 PDF 使用同一组所选画面；PDF 为高分辨率图像。JSON 保存条件、视图、实际时间步与当前统计，载入后按相同种子从头运行，并非恢复中途随机状态。CSV 保存当前采样历史及原子状态。视频在浏览器预览下方另有保存链接；请在系统保存框选择自己的文件夹。
c064:
  de: Physik, Gleichungen, Grenzen und Quellen
  en: Physics, equations, limits and sources
  fi: Fysiikka, yhtälöt, rajat ja lähteet
  fr: Physique, équations, limites et sources
  ja: 物理・方程式・限界・出典
  zh: 物理、公式、局限与来源
c065:
  de: Die zirkulare Polarisation wird auf die lokale Magnetfeldrichtung projiziert; starke und transversale Achsen haben entgegengesetzte Helizität. Schrotrauschen der Absorption und isotrope spontane Emission ergeben Var(dvⱼ)/dt = vᵣ²(Rⱼ,+ + Rⱼ,− + R_total/3). Tⱼ = m Σ(vⱼ−v̄ⱼ)²/[(N−1)k_B]; die Schwerpunktsdrift wird ausgeschlossen. „Rückstoß aus“ ist ein deterministischer Vergleich, keine physikalische Kühlgrenze. Die Doppler-Skala ℏΓ/(2k_B) ist eine Referenz; endliche Strahlen, Sättigung, Magnetfelder, Schwerkraft und Verluste verändern Gleichgewicht und Einfang.
  en: Circular polarization is projected onto the local magnetic-field direction; strong and transverse axes have opposite helicities. Absorption shot noise and isotropic spontaneous emission give Var(dvⱼ)/dt = vᵣ²(Rⱼ,+ + Rⱼ,− + R_total/3). Tⱼ = m Σ(vⱼ−v̄ⱼ)²/[(N−1)k_B]; centroid drift is excluded. Recoil off is a deterministic comparison, not a physical cooling limit. The Doppler scale ℏΓ/(2k_B) is a reference; finite beams, saturation, magnetic fields, gravity and escape alter equilibrium and capture.
  fi: Ympyräpolarisaatio projisoidaan paikalliseen magneettikentän suuntaan; vahvalla ja poikittaisilla akseleilla on vastakkaiset heliciteetit. Absorption haulikohina ja isotrooppinen spontaani emissio antavat Var(dvⱼ)/dt = vᵣ²(Rⱼ,+ + Rⱼ,− + R_total/3). Tⱼ = m Σ(vⱼ−v̄ⱼ)²/[(N−1)k_B]; keskipisteen ajautuma jätetään pois. Rekyylin sammutus on deterministinen vertailu, ei fysikaalinen jäähdytysraja. Doppler-asteikko ℏΓ/(2k_B) on viitearvo; äärelliset säteet, saturaatio, magneettikentät, painovoima ja karkaaminen muuttavat tasapainoa ja vangitsemista.
  fr: La polarisation circulaire est projetée sur la direction locale du champ magnétique ; les axes fort et transverses ont des hélicités opposées. Le bruit de grenaille d'absorption et l'émission spontanée isotrope donnent Var(dvⱼ)/dt = vᵣ²(Rⱼ,+ + Rⱼ,− + R_total/3). Tⱼ = m Σ(vⱼ−v̄ⱼ)²/[(N−1)k_B] ; la dérive du centroïde est exclue. Recul désactivé est une comparaison déterministe, pas une limite physique de refroidissement. L'échelle Doppler ℏΓ/(2k_B) est une référence ; les faisceaux finis, la saturation, les champs magnétiques, la gravité et l'échappement modifient l'équilibre et la capture.
  ja: 円偏光は局所的な磁場方向に射影され、強軸と横方向の軸ではヘリシティが逆になります。吸収のショットノイズと等方的な自然放出から Var(dvⱼ)/dt = vᵣ²(Rⱼ,+ + Rⱼ,− + R_total/3) が得られます。Tⱼ = m Σ(vⱼ−v̄ⱼ)²/[(N−1)k_B] で、重心ドリフトは除外します。反跳オフは決定論的な比較であり、物理的な冷却限界ではありません。ドップラー限界 ℏΓ/(2k_B) は基準値で、有限のビーム、飽和、磁場、重力、脱出は平衡や捕獲を変えます。
  zh: 圆偏振在局部磁场方向投影，强轴与横轴使用相反手性。吸收散粒噪声与各向同性自发辐射给出 Var(dvⱼ)/dt = vᵣ²(Rⱼ,+ + Rⱼ,− + R总/3)。温度 Tⱼ = m Σ(vⱼ−v̄ⱼ)²/[(N−1)k_B]；质心漂移不计入温度。关反冲是确定性对照，不是物理冷却极限。多普勒尺度 ℏΓ/(2k_B) 是参考值；有限光束、饱和、磁场、重力和逃逸使稳态与捕获行为不同。
c066:
  de: Dieses Programm ruft PyLCP nicht auf; seine heuristische Gleichung dient als Formelreferenz. Bei hoher Geschwindigkeit oder Sättigung weicht diese Näherung von den vollständigen Ratengleichungen oder den optischen Bloch-Gleichungen ab. Mehrfachstreuung, Stöße, Dunkelzustände, Kohärenz, Dipolkräfte, magnetische Dipolkräfte und Mehrniveau-Rückpumpen sind nicht enthalten.
  en: This program does not call PyLCP; its heuristic equation supplies the formula reference. At high velocity or saturation this approximation differs from full rate equations or optical Bloch equations. Multiple scattering, collisions, dark states, coherence, dipole forces, magnetic-dipole forces and multilevel repumping are omitted.
  fi: Tämä ohjelma ei kutsu PyLCP:tä; sen heuristinen yhtälö toimii kaavaviitteenä. Suurella nopeudella tai saturaatiolla tämä approksimaatio poikkeaa täydellisistä ratayhtälöistä tai optisista Blochin yhtälöistä. Monisirontaa, törmäyksiä, tummia tiloja, koherenssia, dipolivoimia, magneettisia dipolivoimia ja monitasoista takaisinpumppausta ei ole mukana.
  fr: Ce programme n'appelle pas PyLCP ; son équation heuristique sert de référence de formule. À grande vitesse ou forte saturation, cette approximation diffère des équations de taux complètes ou des équations de Bloch optiques. La diffusion multiple, les collisions, les états noirs, la cohérence, les forces dipolaires, les forces dipolaires magnétiques et le repompage multi-niveaux sont omis.
  ja: このプログラムは PyLCP を呼び出しません。その発見的な式は数式の参照用です。高速や高飽和では、この近似は完全なレート方程式や光学ブロッホ方程式と異なります。多重散乱、衝突、暗状態、コヒーレンス、双極子力、磁気双極子力、多準位の再ポンピングは含みません。
  zh: 本程序未调用 PyLCP；其启发式方程提供公式依据。高速度与高饱和下，该近似与完整速率方程 / 光学 Bloch 方程不同。没有多重散射、碰撞、暗态、相干、光偶极力、磁偶极力或多能级回泵。
