  fi: Miten laitokset ja massamittauskokeet liittyvät toisiinsa
  fr: Comment les installations et les expériences de mesure de masse s'articulent
  ja: 施設と質量測定実験の関係
  zh: 设施、机构与质量测量装置的关系
c130:
  de: Eine Trägerinstitution betreibt eine Einrichtung; eine Einrichtung liefert Strahlen für unterschiedliche Experimente; ein Experiment nutzt ein oder mehrere Instrumente. Dieser Leitfaden beschreibt diese Beziehungen, nicht eine Mitarbeiterliste oder eine Liste von Kollaborationen.
  en: A host institution operates a facility; a facility supplies beams to distinct experiments; an experiment uses one or more instruments. This guide describes those relationships, rather than a staff roster or a list of collaborations.
  fi: Isäntäorganisaatio ylläpitää laitosta; laitos tuottaa säteitä erillisille kokeille; koe käyttää yhtä tai useampaa instrumenttia. Tämä opas kuvaa näitä suhteita, ei henkilöstöluetteloa tai yhteistyöverkostojen luetteloa.
  fr: Un établissement hôte exploite une installation ; une installation fournit des faisceaux à des expériences distinctes ; une expérience utilise un ou plusieurs instruments. Ce guide décrit ces relations, et non un organigramme du personnel ni une liste de collaborations.
  ja: ホスト機関が施設を運営し、施設は個々の実験にビームを供給し、実験は 1 つ以上の装置を使います。このガイドはこうした関係を説明するもので、職員名簿や共同研究の一覧ではありません。
  zh: 机构承载束流设施；设施为不同实验提供离子束；实验使用一台或多台仪器。下表说明这些关系，不是人员名册，也不表示与所有实验都有合作关系。
