c071:
  de: Den tatsächlichen RF-Antrieb mit dem zeitgemittelten Potential vergleichen. Mikrobewegung, Ionenabstoßung, rotverstimmte Kühlung und blauverstimmte Heizung beobachten. Alle Ansichten teilen sich eine Simulationsuhr.
  en: Compare the actual RF drive with the time-averaged potential. Watch micromotion, ion repulsion, red-detuned cooling and blue-detuned heating. All views share one simulation clock.
  fi: Vertaa todellista RF-ajoa aikakeskiarvoistettuun potentiaaliin. Tarkkaile mikroliikettä, ionien hylkimistä, punaviritteistä jäähdytystä ja sinivirittyisä lämmitystä. Kaikki näkymät käyttävät samaa simulaatiokelloa.
  fr: Comparez le pilotage RF réel avec le potentiel moyenné dans le temps. Observez le micromouvement, la répulsion entre ions, le refroidissement à désaccord rouge et le chauffage à désaccord bleu. Toutes les vues partagent une seule horloge de simulation.
  ja: 実際の RF 駆動と時間平均ポテンシャルを比較します。マイクロモーション、イオン間の反発、赤離調による冷却、青離調による加熱を観察できます。すべてのビューは同じシミュレーション時計を共有します。
  zh: 比较真实射频与时间平均势：观察微运动、离子间排斥，以及红失谐冷却或蓝失谐加热。所有图使用同一模拟时钟。
