c088:
  de: 'Die axiale Frequenz wird aus Endkappenspannung, Geometrie und Ionenmasse berechnet. Physikalische Spannungen normal eingeben; der erweiterte Modus setzt das Mathieu-q direkt. Ein Wechsel der Spezies behält die Spannungen bei: die Stabilität erneut prüfen. V_RF ist die differentielle Null-bis-Spitze-Amplitude zwischen den Stabpaaren.'
  en: 'Axial frequency is calculated from endcap voltage, geometry and ion mass. Enter physical voltages normally; advanced mode sets Mathieu q directly. Species changes preserve voltages: check stability again. V_RF is the differential zero-to-peak amplitude between rod pairs.'
  fi: 'Aksiaalitaajuus lasketaan päätyelektrodin jännitteestä, geometriasta ja ionin massasta. Syötä fysikaaliset jännitteet normaalisti; edistynyt tila asettaa Mathieun q:n suoraan. Lajin vaihto säilyttää jännitteet: tarkista stabiilius uudelleen. V_RF on sauvaparien välinen differentiaalinen nollasta huippuun -amplitudi.'
  fr: 'La fréquence axiale est calculée à partir de la tension des électrodes de bout, de la géométrie et de la masse de l''ion. Saisissez les tensions physiques normalement ; le mode avancé fixe directement le q de Mathieu. Changer d''espèce conserve les tensions : revérifiez la stabilité. V_RF est l''amplitude différentielle zéro-crête entre les paires de tiges.'
  ja: 軸方向周波数はエンドキャップ電圧、形状、イオン質量から計算されます。物理的な電圧は通常どおり入力してください。詳細モードではマシュー q を直接設定します。イオン種を変えても電圧は保たれるため、安定性を再確認してください。V_RF はロッド対間の差動のゼロ・ピーク振幅です。
  zh: 轴向频率不能直接设置：由端电极电压、几何和离子质量计算。默认输入实际电压；高级模式只直接设置 Mathieu q。切换离子保持电压，需重新检查稳定性。V_RF 是两组电极间的零到峰值差分幅度。
