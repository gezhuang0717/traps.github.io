en:
  title: Chart hints — symbols, filters and calculations
  entries:
    - ["Z, N and A", "Z counts protons and identifies the element; N counts neutrons; A = Z + N is the mass number. Move right to add neutrons and up to add protons. A is a count, not a measured atomic mass in u."]
    - ["Mass excess ME", "ME = (m_atom − A u)c², using a neutral atom in its ground state. It is the difference from the integer-mass reference, expressed as energy; a negative value is not a negative mass. The neutral ¹²C atom defines 12 u, so its mass excess is zero. keV and MeV differ by a factor of 1,000."]
    - ["Binding energy B and B/A", "The atomic-mass convention used here is B = Z ME(¹H) + N ME(n) − ME(Z,N). B/A is the average per nucleon. This combination includes the small electronic-binding differences of neutral atoms; interpreting it as a precision nuclear binding energy needs those corrections."]
    - ["Mass filters", "Measured/extrapolated selects the mass-quality flag; # marks a value estimated from systematics. δm < 1, 10 or 100 keV means the quoted mass standard uncertainty is below that threshold and the mass is not extrapolated. Unknown uncertainty and missing mass are separate filters. An uncertainty of zero must never be inferred from an empty field."]
    - ["Other filters", "Stable, known half-life, confirmed isomers, magic Z/N, odd/even A, proton-rich N < Z and N≈Z select different properties. Even/odd refers to the integer proton and neutron counts. Available Δ⁽³⁾/Δ⁽⁵⁾ requires all neighbours in the respective calculation. Low Q requires a positive β⁻ or electron-capture energy below 1 MeV. An extrapolated excitation-energy flag is independent of the ground-state mass flag."]
    - ["States, half-life and spin", "An isomer is a metastable nuclear state, not a different element. The searchable state list preserves source designations, higher states and excitation energies Eₓ above the ground state. Other levels and analogue states require the advanced state filter. T½ is the half-life; Jπ is spin and parity. Models here predict ground-state masses, not isomer excitation energies."]
    - ["Separation energies and drip lines", "Sₙ is the energy to remove one neutron; S₂ₙ removes two. Proton quantities Sₚ and S₂ₚ are analogous. Negative separation energy means that emission is energetically possible; it does not specify its lifetime. A line marks the last bound entry under the displayed table convention, not a directly measured continuous boundary. A model table edge may limit the line."]
    - ["Decay Q-values", "Q is the available decay energy. With neutral atomic masses, Q(β⁻) = ME(parent) − ME(daughter), Q(EC) has the same mass-difference form, and Q(α) subtracts the daughter and ⁴He mass excess. Positron emission additionally needs 2mₑc² = approximately 1.022 MeV; positive Q(EC) alone does not guarantee β⁺ emission."]
    - ["Shell gaps δ₂ₙ and δ₂ₚ", "δ₂ₙ(Z,N) = S₂ₙ(Z,N) − S₂ₙ(Z,N+2); use Z in place of N for the proton form. A sharp change can indicate a shell closure. Magic-number guide lines mark 2, 8, 20, 28, 50, 82 and 126; these guides are not a claim that every shell remains equally strong far from stability."]
    - ["Pairing indicators Δ⁽³⁾ and Δ⁽⁵⁾", "These are odd–even mass-staggering indicators, not directly measured microscopic gaps. At fixed Z, Δₙ⁽³⁾ = (−1)ᴺ[ME(N+1) − 2ME(N) + ME(N−1)]/2. The mass-excess five-point convention is Δₙ⁽⁵⁾ = −(−1)ᴺ[ME(N+2) − 4ME(N+1) + 6ME(N) − 4ME(N−1) + ME(N−2)]/8. Proton forms use Z. Missing neighbours produce missing results."]
    - ["Proton–neutron indicator δVpn", "For even Z and even N, δVpn = [B(Z,N) − B(Z,N−2) − B(Z−2,N) + B(Z−2,N−2)]/4. It estimates an average interaction through binding-energy differences. Odd/even combinations use different finite-difference stencils; a curve is not a direct isolated two-particle potential."]
    - ["Wigner indicator W", "This chart defines W(Z,N) = δVpn(Z,N) − [δVpn(Z,N+2) + δVpn(Z,N−2)]/2, at fixed Z. It compares the local value to neighbours two neutrons away and can highlight structure near N = Z. It has energy units; it is neither the number of protons nor a universal standalone measurement of Wigner energy. Its value depends on this stencil and available masses."]
    - ["Mass models, residual and β₂", "FRDM1992 was published in 1995; FRDM2012 in 2016. HFB-17 and HFB-D1M are distinct models. ME(AME) − ME(model) is positive when the evaluated mass excess is larger. β₂ is a dimensionless quadrupole deformation parameter: its sign distinguishes prolate/oblate within the model convention. Model error bars are unavailable here, not zero; a global RMS error is not a per-nucleus uncertainty."]
    - ["Chain plots and uncertainties", "An isotopic chain fixes Z; an isotonic chain fixes N; an isobaric chain fixes A. Range controls select chains and horizontal coordinates. Error bars show quoted standard uncertainties; shared occurrences of the same mass cancel before propagation. Remaining distinct masses use a diagonal covariance approximation because the full AME covariance is unavailable. A connecting line guides the eye; gaps are missing data, not zero."]
    - ["Process paths, colours and saved figures", "r denotes rapid neutron capture; rp denotes rapid proton capture. The orange and green paths are illustrative paths, not a reaction-network calculation for every temperature or density. EC means electron capture; β⁺ means positron decay. Adjust overlay width before PNG/PDF saving; PDF contains the same high-resolution image. CSV keeps numeric precision. Website branding is omitted from figures."]
zh:
  title: 核素图提示——符号、筛选与计算
  entries:
    - ["Z、N 与 A", "Z 为质子数并决定元素，N 为中子数，A = Z + N 为质量数。向右增加中子，向上增加质子。A 是计数，不是以 u 表示的实测原子质量。"]
    - ["质量过剩 ME", "ME = (m_atom − A u)c²，使用基态中性原子质量，表示相对整数质量参考的能量差；负质量过剩不代表负质量。中性 ¹²C 原子定义为 12 u，因此质量过剩为零。1 MeV = 1,000 keV。"]
    - ["结合能 B 与 B/A", "这里采用原子质量约定：B = Z ME(¹H) + N ME(n) − ME(Z,N)。B/A 是每个核子的平均值。该组合包含中性原子的微小电子结合能差；若要解释为精密核结合能，需修正这些差别。"]
    - ["质量筛选", "实验/外推筛选依据质量品质标记，# 表示系统学估算。δm < 1、10 或 100 keV 要求给出的质量标准不确定度低于阈值，且质量不是外推值。不确定度未知与质量缺失是两个独立筛选；空白不能当成零误差。"]
    - ["其他筛选", "稳定、半衰期已知、确认的同核异能态、幻数、奇偶 A、富质子 N < Z 及 N≈Z 选择不同性质。奇偶指整数质子/中子数。可计算 Δ⁽³⁾/Δ⁽⁵⁾ 要求相应邻核数据齐全。低 Q 要求正的 β⁻ 或电子俘获能量低于 1 MeV。激发能的外推标记独立于基态质量标记。"]
    - ["核态、半衰期与自旋", "同核异能态是亚稳核态，并非另一种元素。可搜索列表保留原始核态名称、高阶核态及相对基态的激发能 Eₓ。其他能级与同量异位类似态通过高级筛选查看。T½ 为半衰期，Jπ 为自旋与宇称。质量模型仅预测基态质量，不预测这里的异能态激发能。"]
    - ["分离能与滴线", "Sₙ 是移除一个中子的能量，S₂ₙ 对应两个中子；Sₚ、S₂ₚ 类似。负分离能表示发射在能量上可能，但不能由此确定寿命。线条按所选表的约定标出最后束缚项，不是实测连续边界；模型表的边缘可能限制线的位置。"]
    - ["衰变 Q 值", "Q 为可用衰变能。使用中性原子质量时，Q(β⁻) = ME(母核) − ME(子核)，Q(EC) 也是质量差，Q(α) 再减子核及 ⁴He 的质量过剩。正电子发射还需要 2mₑc²≈1.022 MeV；Q(EC)>0 不保证 β⁺ 发射。"]
    - ["壳隙 δ₂ₙ 与 δ₂ₚ", "δ₂ₙ(Z,N) = S₂ₙ(Z,N) − S₂ₙ(Z,N+2)，质子形式改用 Z。突变可能提示壳层闭合。幻数线标出 2、8、20、28、50、82、126，并不保证远离稳定线时所有壳层同样强。"]
    - ["配对指标 Δ⁽³⁾ 与 Δ⁽⁵⁾", "它们是奇偶质量交错指标，不是直接测量的微观配对能隙。固定 Z：Δₙ⁽³⁾ = (−1)ᴺ[ME(N+1) − 2ME(N) + ME(N−1)]/2。质量过剩约定下，Δₙ⁽⁵⁾ = −(−1)ᴺ[ME(N+2) − 4ME(N+1) + 6ME(N) − 4ME(N−1) + ME(N−2)]/8。质子形式改用 Z，邻核缺失时结果也缺失。"]
    - ["质子–中子指标 δVpn", "偶偶核采用 δVpn = [B(Z,N) − B(Z,N−2) − B(Z−2,N) + B(Z−2,N−2)]/4，通过结合能差估计平均作用。不同奇偶组合使用不同差分公式，不能把这条曲线当作独立两粒子势。"]
    - ["维格纳指标 W", "本图定义 W(Z,N) = δVpn(Z,N) − [δVpn(Z,N+2) + δVpn(Z,N−2)]/2，保持 Z 不变。它将局部值与相隔两个中子的邻核比较，可突出 N = Z 附近结构。W 的单位是能量；它不是质子数，也不是独立、普适的维格纳能实测值，取决于差分定义与可用质量。"]
    - ["质量模型、残差与 β₂", "FRDM1992 于 1995 年发表，FRDM2012 于 2016 年发表；HFB-17、HFB-D1M 是不同模型。ME(AME) − ME(模型)>0 表示评价质量过剩较大。β₂ 是无量纲四极形变参数，其符号在模型约定中区分长椭球/扁椭球。模型不确定度未提供，不等于零；整体均方根误差不能当成逐核误差棒。"]
    - ["核素链与不确定度", "同位素链固定 Z，同中子素链固定 N，同量异位素链固定 A。范围控件选择链及横坐标。误差棒使用标准不确定度，同一质量的重复项先合并并抵消。完整 AME 协方差未提供，对其余不同质量采用对角协方差近似。连线只引导视线；数据缺口不是零值。"]
    - ["过程路径、颜色与保存", "r 为快中子俘获，rp 为快质子俘获。橙色、绿色路径是示意，并非适用于所有温度与密度的反应网络计算。EC 为电子俘获，β⁺ 为正电子衰变。保存 PNG/PDF 前可调叠加线宽；PDF 保存相同的高分辨率图像，CSV 保留数值精度，图内不加网站署名。"]
fi:
  title: Kartan ohjeet — symbolit, suodattimet ja laskenta
  entries:
    - ["Z, N ja A", "Z on protonien määrä ja määrää alkuaineen; N on neutronien määrä ja A = Z + N massaluku. Oikealle lisätään neutroneja, ylöspäin protoneja. A on lukumäärä, ei mitattu atomimassa yksikössä u."]
    - ["Massaylijäämä ME", "ME = (m_atom − A u)c² käyttää perustilan neutraalin atomin massaa. Se on energiaksi muunnettu ero kokonaislukureferenssistä; negatiivinen arvo ei tarkoita negatiivista massaa. Neutraali ¹²C määrittää 12 u, joten sen massaylijäämä on nolla. 1 MeV = 1 000 keV."]
    - ["Sidosenergia B ja B/A", "Tässä atomimassojen konventiossa B = Z ME(¹H) + N ME(n) − ME(Z,N). B/A on keskiarvo nukleonia kohden. Yhdistelmä sisältää atomien pienet elektronien sidosenergiaerot; tarkka ydinsidosenergia vaatii niiden korjauksen."]
    - ["Massasuodattimet", "Mitattu/ekstrapoloitu perustuu massan laatumerkintään; # tarkoittaa systematiikasta arvioitua suuretta. δm < 1, 10 tai 100 keV vaatii ilmoitetun standardiepävarmuuden alittavan rajan ja massan olevan ilman ekstrapolaatiota. Puuttuva massa ja tuntematon epävarmuus ovat eri suodattimia. Tyhjä kenttä ei tarkoita nollaepävarmuutta."]
    - ["Muut suodattimet", "Stabiilius, tunnettu puoliintumisaika, vahvistetut isomeerit, maagiset luvut, pariton/parillinen A, protonirikkaus N < Z ja N≈Z valitsevat eri ominaisuuksia. Parillisuus koskee protonien ja neutronien lukumääriä. Δ⁽³⁾/Δ⁽⁵⁾ vaatii tarvittavat naapurimassat. Pieni Q vaatii positiivisen β⁻- tai elektronisieppausenergian alle 1 MeV. Viritysenergian # on riippumaton perustilan massan merkinnästä."]
    - ["Tilat, puoliintumisaika ja spin", "Isomeeri on metastabiili ydintila, ei toinen alkuaine. Tilaluettelo säilyttää lähdemerkinnät, korkeammat tilat ja viritysenergian Eₓ perustilan suhteen. Muut tasot ja analogiatilat löytyvät laajennetusta suodattimesta. T½ on puoliintumisaika, Jπ spin ja pariteetti. Mallit ennustavat tässä perustilan massoja, eivät isomeerien viritysenergioita."]
    - ["Separaatioenergiat ja tippumisrajat", "Sₙ on yhden neutronin irrotusenergia, S₂ₙ kahden; Sₚ ja S₂ₚ ovat protonivastineet. Negatiivinen energia sallii emission energeettisesti mutta ei määrää elinikää. Viiva seuraa taulukon viimeistä sidottua pistettä, ei mitattua jatkuvaa rajaa; mallitaulukon reuna voi rajoittaa viivaa."]
    - ["Hajoamisen Q-arvot", "Q on käytettävissä oleva hajoamisenergia. Neutraaleille atomimassoille Q(β⁻) on emo- ja tytärytimen massaylijäämien ero; Q(EC) on vastaava elektronisieppaukselle. Q(α) vähentää myös ⁴He:n massaylijäämän. Positroniemissio vaatii lisäksi 2mₑc²≈1,022 MeV; positiivinen Q(EC) ei yksin takaa β⁺-hajoamista."]
    - ["Kuoriaukot δ₂ₙ ja δ₂ₚ", "δ₂ₙ(Z,N) = S₂ₙ(Z,N) − S₂ₙ(Z,N+2); protonimuoto vaihtaa N:n Z:ksi. Terävä muutos voi viitata kuoren sulkeutumiseen. Maagiset ohjeviivat ovat 2, 8, 20, 28, 50, 82 ja 126; kuorien voimakkuus voi muuttua kaukana stabiiliudesta."]
    - ["Parittumisindikaattorit Δ⁽³⁾ ja Δ⁽⁵⁾", "Nämä kuvaavat parillisuusvaihtelua, eivät suoraan mitattua mikroskooppista aukkoa. Kiinteällä Z:lla Δₙ⁽³⁾ = (−1)ᴺ[ME(N+1) − 2ME(N) + ME(N−1)]/2. Massaylijäämäkonventiossa Δₙ⁽⁵⁾ = −(−1)ᴺ[ME(N+2) − 4ME(N+1) + 6ME(N) − 4ME(N−1) + ME(N−2)]/8. Protonimuodot käyttävät Z:aa. Puuttuvat naapurit tuottavat puuttuvan tuloksen."]
    - ["Protoni–neutroni-indikaattori δVpn", "Parillisille Z:lle ja N:lle δVpn = [B(Z,N) − B(Z,N−2) − B(Z−2,N) + B(Z−2,N−2)]/4. Se arvioi keskimääräistä vuorovaikutusta sidosenergiaeroista. Muut parillisuusluokat käyttävät eri erotuksia; käyrä ei ole eristetty kahden hiukkasen potentiaali."]
    - ["Wigner-indikaattori W", "Tässä W(Z,N) = δVpn(Z,N) − [δVpn(Z,N+2) + δVpn(Z,N−2)]/2 kiinteällä Z:lla. Vertailu kahden neutronin päässä oleviin naapureihin voi korostaa N = Z:n rakennetta. W on energiasuure, ei protonien määrä eikä yleispätevä erillinen Wigner-energian mittaus. Tulos riippuu erotusmääritelmästä ja saatavista massoista."]
    - ["Massamallit, jäännös ja β₂", "FRDM1992 julkaistiin 1995 ja FRDM2012 vuonna 2016. HFB-17 ja HFB-D1M ovat eri malleja. Positiivinen ME(AME) − ME(malli) tarkoittaa suurempaa arvioitua massaylijäämää. β₂ on dimensioton kvadrupolideformaatio; etumerkki erottaa pitkänomaisen ja litistyneen muodon mallikonventiossa. Malliepävarmuutta ei ole annettu: se ei ole nolla eikä mallin globaali RMS ole yksittäisen ytimen virhepalkki."]
    - ["Ketjut ja epävarmuudet", "Isotooppiketjussa Z on vakio, isotoniketjussa N ja isobaariketjussa A. Aluevalinnat rajaavat ketjuja ja vaaka-akselia. Virhepalkit ovat standardiepävarmuuksia. Saman massan toistuvat termit yhdistetään ennen etenemislaskua; muille käytetään diagonaalista kovarianssiapproksimaatiota, koska täysi AME-kovarianssi puuttuu. Viiva ohjaa silmää; aukko ei ole nolla."]
    - ["Prosessipolut ja tallennus", "r tarkoittaa nopeaa neutronisieppausta ja rp nopeaa protonisieppausta. Oranssi ja vihreä polku ovat havainnollisia, eivät jokaisen lämpötilan ja tiheyden reaktioverkkolaskuja. EC on elektronisieppaus ja β⁺ positronihajoaminen. PNG/PDF käyttää valittua viivanleveyttä; PDF sisältää tarkan kuvan. CSV säilyttää numerotarkkuuden. Kuviin ei lisätä verkkosivun nimeä."]
de:
  title: Kartenhinweise — Symbole, Filter und Berechnungen
  entries:
    - ["Z, N und A", "Z zählt Protonen und bestimmt das Element; N zählt Neutronen, A = Z + N ist die Massenzahl. Nach rechts kommen Neutronen hinzu, nach oben Protonen. A ist eine Anzahl, keine gemessene Atommasse in u."]
    - ["Massenexzess ME", "ME = (m_atom − A u)c² verwendet die Masse des neutralen Atoms im Grundzustand. Es ist die Energiedifferenz zur ganzzahligen Massenreferenz; ein negativer Wert bedeutet keine negative Masse. Das neutrale ¹²C-Atom definiert 12 u und hat daher ME = 0. 1 MeV = 1.000 keV."]
    - ["Bindungsenergie B und B/A", "Die hier verwendete Atommasse-Konvention lautet B = Z ME(¹H) + N ME(n) − ME(Z,N). B/A ist der Mittelwert pro Nukleon. Kleine Unterschiede elektronischer Bindungsenergien bleiben enthalten; für präzise Kernbindungsenergien sind diese zu korrigieren."]
    - ["Massenfilter", "Gemessen/extrapoliert bezieht sich auf die Qualitätskennzeichnung; # markiert einen Wert aus Systematik. δm < 1, 10 oder 100 keV verlangt eine angegebene Standardunsicherheit unter der Grenze und eine nicht extrapolierte Masse. Fehlende Masse und unbekannte Unsicherheit sind verschiedene Filter. Ein leeres Feld ist keine Nullunsicherheit."]
    - ["Weitere Filter", "Stabilität, bekannte Halbwertszeit, bestätigte Isomere, magische Zahlen, gerade/ungerade A, Protonenreichtum N < Z und N≈Z wählen unterschiedliche Eigenschaften. Gerade/ungerade betrifft Protonen- und Neutronenzahlen. Δ⁽³⁾/Δ⁽⁵⁾ setzt alle benötigten Nachbarmassen voraus. Kleines Q verlangt positive β⁻- oder Elektroneneinfangenergie unter 1 MeV. Ein # der Anregungsenergie ist unabhängig von der Grundzustandsmasse."]
    - ["Zustände, Halbwertszeit und Spin", "Ein Isomer ist ein metastabiler Kernzustand, kein anderes Element. Die Zustandsliste erhält Quellenbezeichnungen, höhere Zustände und Eₓ relativ zum Grundzustand. Weitere Niveaus und Analogzustände erscheinen im erweiterten Filter. T½ ist die Halbwertszeit, Jπ Spin und Parität. Die Modelle liefern Grundzustandsmassen, keine Isomer-Anregungsenergien."]
    - ["Separationsenergien und Abbruchkanten", "Sₙ entfernt ein Neutron, S₂ₙ zwei; Sₚ und S₂ₚ sind die Protonenformen. Negative Energie erlaubt Emission energetisch, bestimmt aber keine Lebensdauer. Die Linie folgt dem letzten gebundenen Eintrag der Tabelle und ist keine gemessene kontinuierliche Grenze; der Rand einer Modelltabelle kann sie begrenzen."]
    - ["Q-Werte des Zerfalls", "Q ist die verfügbare Zerfallsenergie. Mit neutralen Atommassen ist Q(β⁻) der Massenexzess der Mutter minus der Tochter; Q(EC) hat dieselbe Form für Elektroneneinfang. Q(α) zieht zusätzlich den ⁴He-Massenexzess ab. Positronenemission braucht weitere 2mₑc²≈1,022 MeV; positives Q(EC) garantiert keinen β⁺-Zerfall."]
    - ["Schalenlücken δ₂ₙ und δ₂ₚ", "δ₂ₙ(Z,N) = S₂ₙ(Z,N) − S₂ₙ(Z,N+2); die Protonenform verwendet Z statt N. Ein scharfer Wechsel kann einen Schalenabschluss anzeigen. Die Hilfslinien markieren 2, 8, 20, 28, 50, 82 und 126; Schalenstärken können sich fern der Stabilität ändern."]
    - ["Paarungsindikatoren Δ⁽³⁾ und Δ⁽⁵⁾", "Sie messen Gerade-Ungerade-Staggering, keine direkt gemessene mikroskopische Lücke. Bei festem Z ist Δₙ⁽³⁾ = (−1)ᴺ[ME(N+1) − 2ME(N) + ME(N−1)]/2. Für Massenexzesse gilt Δₙ⁽⁵⁾ = −(−1)ᴺ[ME(N+2) − 4ME(N+1) + 6ME(N) − 4ME(N−1) + ME(N−2)]/8. Protonenformen verwenden Z. Fehlende Nachbarn ergeben fehlende Ergebnisse."]
    - ["Proton-Neutron-Indikator δVpn", "Für gerade Z und N gilt δVpn = [B(Z,N) − B(Z,N−2) − B(Z−2,N) + B(Z−2,N−2)]/4. Er schätzt mittlere Wechselwirkung über Bindungsenergiedifferenzen. Andere Paritätsklassen verwenden andere Differenzen; die Kurve ist kein isoliertes Zweiteilchenpotential."]
    - ["Wigner-Indikator W", "Hier ist W(Z,N) = δVpn(Z,N) − [δVpn(Z,N+2) + δVpn(Z,N−2)]/2 bei festem Z. Der Vergleich mit zwei Neutronen entfernten Nachbarn kann Struktur bei N = Z hervorheben. W hat Energieeinheiten und ist weder die Protonenzahl noch eine allgemeingültige unabhängige Messung der Wigner-Energie. Er hängt von der Differenzdefinition und verfügbaren Massen ab."]
    - ["Massenmodelle, Residuum und β₂", "FRDM1992 erschien 1995, FRDM2012 im Jahr 2016. HFB-17 und HFB-D1M sind verschiedene Modelle. Positives ME(AME) − ME(Modell) bedeutet einen größeren evaluierten Massenexzess. β₂ ist die dimensionslose Quadrupoldeformation; das Vorzeichen unterscheidet längliche und abgeflachte Formen in der Modellkonvention. Modellunsicherheit ist nicht verfügbar, nicht null; ein globaler RMS-Fehler ist kein kernspezifischer Fehlerbalken."]
    - ["Ketten und Unsicherheiten", "Isotopenketten halten Z fest, Isotonenketten N und Isobarenketten A. Bereichswahlen begrenzen Ketten und horizontale Koordinaten. Fehlerbalken zeigen Standardunsicherheiten. Wiederholte Terme derselben Masse werden vor der Fortpflanzung zusammengeführt; andere Massen verwenden eine diagonale Kovarianznäherung, weil die vollständige AME-Kovarianz fehlt. Linien führen das Auge; Lücken sind keine Nullwerte."]
    - ["Prozesspfade und Speicherung", "r bedeutet schnellen Neutroneneinfang, rp schnellen Protoneneinfang. Orange und grüne Pfade sind illustrativ und keine Netzwerkrechnung für alle Temperaturen und Dichten. EC ist Elektroneneinfang, β⁺ Positronenzerfall. PNG/PDF verwendet die gewählte Linienbreite; PDF enthält das hochauflösende Bild. CSV erhält Zahlengenauigkeit. Figuren tragen keinen Webseitennamen."]
ja:
  title: 核図表のヒント — 記号、フィルター、計算
  entries:
    - ["Z、N、A", "Z は陽子数で元素を決め、N は中性子数、A = Z + N は質量数です。右へ行くと中性子、上へ行くと陽子が増えます。A は個数であり、u 単位の実測原子質量ではありません。"]
    - ["質量超過 ME", "ME = (m_atom − A u)c² は基底状態の中性原子質量を使い、整数の質量基準との差をエネルギーで表します。負の値は負の質量ではありません。中性 ¹²C 原子が 12 u を定義するため、その ME はゼロです。1 MeV = 1,000 keV です。"]
    - ["結合エネルギー B と B/A", "ここでは原子質量の規約で B = Z ME(¹H) + N ME(n) − ME(Z,N) とします。B/A は核子一個あたりの平均です。中性原子の小さな電子結合エネルギー差も含むため、精密な核結合エネルギーには補正が必要です。"]
    - ["質量フィルター", "実測／外挿は質量の品質フラグを使い、# は系統性からの推定を表します。δm < 1、10、100 keV は質量標準不確かさが閾値未満で、質量が外挿でないことを要求します。質量欠損と不確かさ不明は別の条件です。空欄は不確かさゼロではありません。"]
    - ["その他のフィルター", "安定、半減期既知、確認されたアイソマー、魔法数、A の偶奇、陽子過剰 N < Z、N≈Z は別々の性質です。偶奇は陽子・中性子数の整数に対する分類です。Δ⁽³⁾／Δ⁽⁵⁾ には必要な隣接核の質量がすべて必要です。低 Q は正の β⁻ または電子捕獲エネルギーが 1 MeV 未満という条件です。励起エネルギーの # と基底状態質量の # は独立です。"]
    - ["核状態、半減期、スピン", "アイソマーは準安定な核状態で、別の元素ではありません。状態一覧は原典の名称、高次状態、基底状態からの励起エネルギー Eₓ を保持します。ほかの準位とアナログ状態は拡張フィルターで表示します。T½ は半減期、Jπ はスピンとパリティです。質量モデルは基底状態の予測であり、アイソマーの励起エネルギーではありません。"]
    - ["分離エネルギーとドリップ線", "Sₙ は中性子一個、S₂ₙ は二個を取り去るエネルギーで、Sₚ、S₂ₚ は陽子の対応量です。負の値は放出がエネルギー的に可能という意味で、寿命は決めません。線は表の規約による最後の束縛点を追い、実測の連続境界ではありません。モデル表の端に制限される場合があります。"]
    - ["崩壊 Q 値", "Q は使える崩壊エネルギーです。中性原子質量では Q(β⁻) は親と娘の質量超過の差、Q(EC) も電子捕獲について同じ形式です。Q(α) は娘と ⁴He の質量超過を引きます。陽電子放出には追加で 2mₑc²≈1.022 MeV が必要で、Q(EC)>0 だけでは β⁺ 崩壊を保証しません。"]
    - ["殻ギャップ δ₂ₙ と δ₂ₚ", "δ₂ₙ(Z,N) = S₂ₙ(Z,N) − S₂ₙ(Z,N+2) とし、陽子の式は N を Z に置き換えます。急変は殻の閉じ方を示すことがあります。ガイド線の魔法数は 2、8、20、28、50、82、126 です。安定線から遠い領域で同じ殻の強さを保証しません。"]
    - ["対形成指標 Δ⁽³⁾ と Δ⁽⁵⁾", "偶奇による質量の交互変化を示し、微視的ギャップの直接測定ではありません。Z 固定で Δₙ⁽³⁾ = (−1)ᴺ[ME(N+1) − 2ME(N) + ME(N−1)]/2 です。質量超過の規約では Δₙ⁽⁵⁾ = −(−1)ᴺ[ME(N+2) − 4ME(N+1) + 6ME(N) − 4ME(N−1) + ME(N−2)]/8 です。陽子の式は Z を使い、隣接データ欠損は結果の欠損になります。"]
    - ["陽子–中性子指標 δVpn", "Z、N がともに偶数なら δVpn = [B(Z,N) − B(Z,N−2) − B(Z−2,N) + B(Z−2,N−2)]/4 です。結合エネルギー差から平均作用を推定します。ほかの偶奇組合せには別の差分を使い、曲線は孤立した二粒子ポテンシャルではありません。"]
    - ["ウィグナー指標 W", "この図の定義は Z 固定で W(Z,N) = δVpn(Z,N) − [δVpn(Z,N+2) + δVpn(Z,N−2)]/2 です。中性子二個分離れた隣接核と比較し、N = Z 付近の構造を強調できます。W はエネルギー量であり、陽子数でも、普遍的な独立のウィグナーエネルギー実測値でもありません。差分の定義と利用できる質量に依存します。"]
    - ["質量モデル、残差、β₂", "FRDM1992 は 1995 年、FRDM2012 は 2016 年に発表されました。HFB-17、HFB-D1M は異なるモデルです。ME(AME) − ME(モデル)>0 は評価質量超過の方が大きいことを示します。β₂ は無次元四重極変形で、符号はモデル規約で長球／扁球を区別します。モデルの不確かさは未提供で、ゼロではありません。全体の RMS 誤差は核ごとの誤差棒ではありません。"]
    - ["核種系列と不確かさ", "同位体系列は Z、同中性子体系列は N、同重体系列は A を固定します。範囲設定は系列と横座標を選びます。誤差棒は標準不確かさです。同じ質量の重複項を先にまとめ、残る異なる質量には完全な AME 共分散がないため対角近似を使います。連線は視線の案内で、欠損はゼロではありません。"]
    - ["過程経路と保存", "r は速い中性子捕獲、rp は速い陽子捕獲です。橙色と緑色の経路は例示で、あらゆる温度・密度の反応網計算ではありません。EC は電子捕獲、β⁺ は陽電子崩壊です。PNG／PDF は選んだ線幅を使用し、PDF には高解像度画像を保存します。CSV は数値精度を保ち、図にウェブサイト名を入れません。"]
fr:
  title: 'Aide de la carte : symboles, filtres et calculs'
  entries:
  - - Z, N et A
    - Z compte les protons et identifie l’élément ; N compte les neutrons ; A = Z + N est le nombre de masse. Vers
      la droite on ajoute des neutrons, vers le haut des protons. A est un nombre entier, pas une masse mesurée
      en u.
  - - Excès de masse ME
    - ME = (m_atom − A u)c² pour l’atome neutre fondamental. C’est une différence d’énergie, pas une masse négative
      quand ME < 0. L’atome neutre ¹²C définit 12 u et ME = 0. Un MeV vaut 1000 keV.
  - - Liaison B et B/A
    - La convention atomique est B = Z ME(¹H) + N ME(n) − ME(Z,N). B/A est la moyenne par nucléon. Les petites différences
      de liaison électronique sont incluses ; une liaison nucléaire de haute précision exige leur correction.
  - - Filtres de masse
    - 'Mesuré/extrapolé utilise l’indicateur de qualité ; # signifie estimé par systématique. δm < 1, 10 ou 100
      keV exige une erreur standard inférieure au seuil et une masse non extrapolée. Masse absente et incertitude
      inconnue sont distinctes ; un champ vide ne vaut jamais zéro.'
  - - Autres filtres
    - 'Stabilité, demi-vie connue, isomères confirmés, Z/N magique, A pair/impair, N < Z et N≈Z sélectionnent des
      propriétés différentes. Δ⁽³⁾/Δ⁽⁵⁾ exige tous les voisins. Faible Q sélectionne une énergie positive β⁻ ou
      EC sous 1 MeV. Le # d’excitation est indépendant du # de masse fondamentale.'
  - - États, demi-vie et spin
    - Un isomère est un état nucléaire métastable, pas un autre élément. La liste conserve les désignations, états
      supérieurs et excitations Eₓ. Les autres niveaux et IAS exigent le filtre avancé. T½ est la demi-vie ; Jπ
      le spin/parité. Les modèles donnent les masses fondamentales, pas les excitations isomériques.
  - - Séparation et limites de liaison
    - Sₙ retire un neutron, S₂ₙ deux ; Sₚ et S₂ₚ sont analogues. Une énergie négative autorise l’émission sans en
      donner la durée. La ligne indique la dernière entrée liée selon la table affichée, pas une frontière continue
      directement mesurée ; le bord de la table peut la limiter.
  - - Énergies Q
    - Avec les masses atomiques neutres, Q(β⁻) = ME(parent) − ME(fils), comme Q(EC) ; Q(α) retranche aussi ME(⁴He).
      L’émission β⁺ exige en plus 2mₑc² ≈ 1.022 MeV. Un Q(EC) positif ne suffit donc pas pour β⁺.
  - - Écarts de couches δ₂ₙ et δ₂ₚ
    - δ₂ₙ(Z,N) = S₂ₙ(Z,N) − S₂ₙ(Z,N+2) ; la forme protonique emploie Z. Une variation brusque peut indiquer une
      fermeture de couche. Les repères 2, 8, 20, 28, 50, 82, 126 ne garantissent pas une même force de couche partout.
  - - Appariement Δ⁽³⁾ et Δ⁽⁵⁾
    - 'Ce sont des indicateurs d’alternance pair-impair, pas des écarts microscopiques mesurés directement. À Z
      fixe : Δₙ⁽³⁾ = (−1)ᴺ[ME(N+1) − 2ME(N) + ME(N−1)]/2 ; Δₙ⁽⁵⁾ = −(−1)ᴺ[ME(N+2) − 4ME(N+1) + 6ME(N) − 4ME(N−1)
      + ME(N−2)]/8. Remplacer N par Z pour les protons. Voisin absent : résultat absent.'
  - - Indicateur proton–neutron δVpn
    - Pour Z et N pairs, δVpn = [B(Z,N) − B(Z,N−2) − B(Z−2,N) + B(Z−2,N−2)]/4. Cette différence estime une interaction
      moyenne. Les autres parités emploient d’autres stencils ; la courbe n’est pas un potentiel isolé à deux particules.
  - - Indicateur de Wigner W
    - Ici W(Z,N) = δVpn(Z,N) − [δVpn(Z,N+2) + δVpn(Z,N−2)]/2, à Z fixe. Il compare les voisins à deux neutrons et
      peut mettre en évidence N = Z. Il possède une unité d’énergie ; il dépend du stencil et des masses disponibles.
  - - Modèles, résidu et β₂
    - FRDM1992 a été publié en 1995, FRDM2012 en 2016 ; HFB-17 et HFB-D1M sont distincts. ME(AME) − ME(modèle) est
      positif si l’excès évalué est supérieur. β₂ est une déformation quadrupolaire sans unité. L’erreur d’un modèle
      est indisponible, pas nulle ; une RMS globale n’est pas l’erreur de chaque noyau.
  - - Chaînes et incertitudes
    - Une chaîne isotopique fixe Z, isotonique N, isobarique A. Les plages sélectionnent les chaînes et abscisses.
      Les barres sont les erreurs standards ; une même masse s’annule avant propagation. Les autres masses utilisent
      une covariance diagonale approchée, faute de covariance AME complète. Une lacune n’est pas zéro et une ligne
      guide seulement l’œil.
  - - Trajets, couleurs et figures
    - r signifie capture rapide de neutrons ; rp, capture rapide de protons. Les trajets sont illustratifs, pas
      un calcul de réseau pour toutes les conditions. EC = capture électronique ; β⁺ = émission de positon. Ajustez
      les lignes avant l’export PNG/PDF ; le PDF reprend l’image haute résolution, le CSV la précision numérique.
      Les figures omettent la marque du site.
