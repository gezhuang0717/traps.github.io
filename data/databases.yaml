items:
# ───────────── structure & decay ─────────────
- id: nudat
  name: "NuDat 3"
  org: "NNDC, Brookhaven National Laboratory"
  cat: structure
  kind: evaluated
  url: "https://www.nndc.bnl.gov/nudat3/"
  help: "https://www.nndc.bnl.gov/nudat3/help/"
  short: {en: "Interactive chart of nuclides with levels, γ rays, decay radiation and ground-state properties from ENSDF.", zh: "交互式核素图：能级、γ 射线、衰变辐射和基态性质（数据来自 ENSDF）。"}
  what: {en: "Evaluated level energies, spins/parities, half-lives, γ-ray energies and intensities, decay radiations, and ground- and isomeric-state properties for about 3 200 nuclides, derived from ENSDF; plus a level-scheme plotter and search forms.", zh: "约 3200 个核素的评价能级、自旋宇称、半衰期、γ 射线能量与强度、衰变辐射及基态和同核异能态性质（取自 ENSDF），并带能级图绘制与检索表单。"}
  use:
    en: ["Click a square on the chart or type a nuclide (e.g. 100Sn) in the search box.", "Choose Levels and Gammas, Decay Radiation or Ground and Isomeric States.", "Use the plot tools to draw level schemes or plot systematics (e.g. E(2⁺) along a chain).", "Download tables as text/CSV for analysis."]
    zh: ["在核素图上点击方块，或在搜索框输入核素（如 100Sn）。", "选择 Levels and Gammas、Decay Radiation 或 Ground and Isomeric States。", "用绘图工具画能级图或系统学（如同位素链的 E(2⁺)）。", "将表格下载为文本/CSV 进行分析。"]
  tips: {en: "NuDat is a convenient front end; for the full evaluated dataset with comments and references open ENSDF.", zh: "NuDat 是便捷的前端；需要带注释和参考文献的完整评价数据时请打开 ENSDF。"}
  cite: "NuDat 3, National Nuclear Data Center, Brookhaven National Laboratory, https://www.nndc.bnl.gov/nudat3/"
- id: ensdf
  name: "ENSDF"
  org: "NNDC / NSDD network"
  cat: structure
  kind: evaluated
  url: "https://www.nndc.bnl.gov/ensdf/"
  short: {en: "Evaluated Nuclear Structure Data File — the reference evaluation of levels, γ rays and decays for every nuclide.", zh: "评价核结构数据文件——各核素能级、γ 射线与衰变的权威评价。"}
  what: {en: "Recommended values with uncertainties for level energies, Jπ, half-lives, moments, γ-ray and particle transitions, branching ratios, log ft values and reaction data sets, with the evaluator's comments and references. Published as the Nuclear Data Sheets.", zh: "能级能量、Jπ、半衰期、电磁矩、γ 与粒子跃迁、分支比、log ft 及反应数据集的推荐值与不确定度，附评价者注释与参考文献；以 Nuclear Data Sheets 形式出版。"}
  use:
    en: ["Search by nuclide or by mass chain A.", "Pick the 'Adopted Levels, Gammas' data set for recommended values, or an individual decay/reaction data set.", "Read the comments: they explain how each value was obtained.", "Download the ENSDF (80-column) or JSON format for programs."]
    zh: ["按核素或质量链 A 检索。", "选择 “Adopted Levels, Gammas” 获取推荐值，或选择单个衰变/反应数据集。", "阅读注释：说明每个数值的来源。", "下载 ENSDF（80 列）或 JSON 格式供程序使用。"]
  tips: {en: "Cite the Nuclear Data Sheets evaluation of the mass chain (the reference is shown in the data set header).", zh: "引用相应质量链的 Nuclear Data Sheets 评价（数据集表头给出文献）。"}
- id: xundl
  name: "XUNDL"
  org: "NNDC"
  cat: structure
  kind: experimental
  url: "https://www.nndc.bnl.gov/ensdf/xundl/about.jsp"
  short: {en: "Experimental Unevaluated Nuclear Data List — recent results compiled quickly, before they enter ENSDF.", zh: "实验未评价核数据列表——在进入 ENSDF 之前快速汇编的最新实验结果。"}
  what: {en: "Level schemes, γ rays and decay data from individual recent papers, compiled in ENSDF format but not evaluated (no averaging or recommendation).", zh: "来自单篇最新论文的能级纲图、γ 射线与衰变数据，按 ENSDF 格式汇编，但未经评价（不做平均与推荐）。"}
  use:
    en: ["Search XUNDL through the ENSDF search page (data-set type XUNDL).", "Compare with the adopted ENSDF values to see what is new.", "Follow the reference keynumber to the original paper."]
    zh: ["通过 ENSDF 检索页面查询（数据集类型选 XUNDL）。", "与 ENSDF 推荐值比较，找出新结果。", "根据文献编号查看原始论文。"]
  tips: {en: "Use it to follow the newest spectroscopy; always cite the original article.", zh: "适合追踪最新谱学结果；引用时请引原始论文。"}
- id: livechart
  name: "LiveChart of Nuclides"
  org: "IAEA Nuclear Data Section"
  cat: structure
  kind: evaluated
  url: "https://www-nds.iaea.org/livechart/"
  help: "https://www-nds.iaea.org/relnsd/vcharthtml/api_v0_guide.html"
  short: {en: "IAEA interactive chart with ENSDF and NUBASE data, plots of systematics and a free CSV download API.", zh: "IAEA 交互式核素图：ENSDF 与 NUBASE 数据、系统学作图，并提供免费 CSV 下载 API。"}
  what: {en: "Ground- and excited-state properties, decay radiations, charge radii, fission yields and more, with colour-coded charts of any property and links to the original evaluations.", zh: "基态与激发态性质、衰变辐射、电荷半径、裂变产额等；可对任意性质着色作图，并链接到原始评价。"}
  use:
    en: ["Choose a colour scheme (half-life, decay mode, Q values, radii…) and click a nuclide.", "Use the side panels for levels, γ rays and decay radiation.", "For programs use the API, e.g. https://nds.iaea.org/relnsd/v1/data?fields=ground_states&nuclides=100sn (CSV).", "Other fields: levels, gammas, decay_rads (with rad_types=g, e, a, bp, bm…)."]
    zh: ["选择着色方案（半衰期、衰变方式、Q 值、半径……）并点击核素。", "侧栏查看能级、γ 射线和衰变辐射。", "程序调用请用 API，例如 https://nds.iaea.org/relnsd/v1/data?fields=ground_states&nuclides=100sn（CSV）。", "其他字段：levels、gammas、decay_rads（rad_types=g、e、a、bp、bm……）。"]
  tips: {en: "The API sometimes refuses requests without a browser-like User-Agent header; the official Jupyter notebook shows how to use it from Python/pandas.", zh: "API 有时拒绝没有浏览器式 User-Agent 的请求；官方 Jupyter 笔记本演示了 Python/pandas 的用法。"}
  lookup: "https://nds.iaea.org/relnsd/v1/data?fields=ground_states&nuclides={A}{sym}"
- id: mird
  name: "MIRD decay data"
  org: "NNDC"
  cat: structure
  kind: evaluated
  url: "https://www.nndc.bnl.gov/mird/"
  short: {en: "Radiation spectra (energies, intensities, dose per decay) of ~2 100 radionuclides for medical dosimetry.", zh: "约 2100 个放射性核素的辐射谱（能量、强度、每次衰变剂量），用于医学剂量学。"}
  what: {en: "Evaluated decay radiations derived from ENSDF, tabulated as needed for Medical Internal Radiation Dose calculations.", zh: "由 ENSDF 推导的评价衰变辐射，按医学内照射剂量（MIRD）计算所需格式列表。"}
  use:
    en: ["Enter the radionuclide.", "Read the table of emitted radiations with energy, intensity and energy per decay.", "Export for dose or detector-efficiency calculations."]
    zh: ["输入放射性核素。", "查看发射辐射表：能量、强度及每次衰变的能量。", "导出用于剂量或探测效率计算。"]
  tips: {en: "Quick way to see all X-rays, Auger electrons and β spectra of a source in one table.", zh: "可在一张表里快速查看放射源的全部 X 射线、俄歇电子和 β 谱。"}
- id: ddep
  name: "DDEP recommended data (LNHB)"
  org: "Decay Data Evaluation Project / LNHB"
  cat: structure
  kind: evaluated
  url: "http://www.lnhb.fr/nuclear-data/nuclear-data-table/"
  help: "http://www.lnhb.fr/ddep_wg/"
  short: {en: "High-precision decay-data evaluations for metrology: half-lives, γ intensities, X-rays, Auger electrons.", zh: "面向计量学的高精度衰变数据评价：半衰期、γ 强度、X 射线、俄歇电子。"}
  what: {en: "Recommended decay data for about 200 radionuclides important for detector calibration, metrology and applications, with full uncertainty analyses.", zh: "约 200 个对探测器刻度、计量与应用重要的放射性核素推荐衰变数据，附完整不确定度分析。"}
  use:
    en: ["Open the nuclide table and choose the radionuclide.", "Download the tables (PDF) and the evaluation report (comments).", "Use these values for efficiency calibration sources (e.g. ¹³³Ba, ¹⁵²Eu, ²⁴¹Am)."]
    zh: ["打开核素表并选择放射性核素。", "下载数据表（PDF）及评价报告（注释）。", "刻度源（如 ¹³³Ba、¹⁵²Eu、²⁴¹Am）的效率刻度建议使用这些数值。"]
  tips: {en: "For calibration standards DDEP values are often preferred over ENSDF.", zh: "刻度标准源通常优先采用 DDEP 数值而非 ENSDF。"}
- id: kaeri
  name: "KAERI Table of Nuclides"
  org: "Korea Atomic Energy Research Institute"
  cat: structure
  kind: portal
  url: "https://atom.kaeri.re.kr/"
  short: {en: "Lightweight table of nuclides with decay data, cross sections and isotope abundances.", zh: "轻量级核素表：衰变数据、截面与同位素丰度。"}
  what: {en: "Element and nuclide pages with half-lives, decay modes, γ lines, thermal cross sections and natural abundances, compiled from evaluated sources.", zh: "元素与核素页面：半衰期、衰变方式、γ 线、热中子截面和天然丰度（取自评价数据）。"}
  use:
    en: ["Pick an element from the periodic table.", "Select the isotope for decay data and plots.", "Check the evaluation source quoted on the page."]
    zh: ["在元素周期表中选择元素。", "选择同位素查看衰变数据与图表。", "核对页面注明的评价数据来源。"]
  tips: {en: "Handy for a quick look; quote the underlying evaluation (ENSDF/ENDF) in publications.", zh: "适合快速查看；发表时请引用其底层评价数据（ENSDF/ENDF）。"}
# ───────────── masses ─────────────
- id: amdc
  name: "AMDC — AME2020 & NUBASE2020"
  org: "Atomic Mass Data Center (IAEA / IMP-CAS)"
  cat: masses
  kind: evaluated
  url: "https://www-nds.iaea.org/amdc/"
  short: {en: "The Atomic Mass Evaluation and NUBASE: recommended masses, Q values and ground/isomer properties.", zh: "原子质量评价 AME 与 NUBASE：推荐质量、Q 值以及基态/同核异能态性质。"}
  what: {en: "AME2020: atomic masses (mass excesses), binding energies, separation energies and reaction/decay Q values for ~3 500 nuclides with uncertainties and the input-data network. NUBASE2020: half-lives, spins, decay modes and excitation energies of ground and isomeric states.", zh: "AME2020：约 3500 个核素的原子质量（质量过剩）、结合能、分离能、反应/衰变 Q 值及不确定度和输入数据网络。NUBASE2020：基态与同核异能态的半衰期、自旋、衰变方式与激发能。"}
  use:
    en: ["Download mass_1.mas20.txt (ME, binding energy/A, beta Q), rct1.mas20.txt and rct2_1.mas20.txt (reactions), and nubase_4.mas20.txt (states) as fixed-width text.", "Read the column description: '#' replaces a decimal point for estimated values; '*' means unavailable. Retain separate flags for values and uncertainties.", "Use published reaction uncertainties: evaluated masses are correlated. Adding individual mass errors in quadrature does not reproduce these uncertainties.", "For quantities without a published reaction column, use the covariance file when applicable or explicitly label independent-error propagation."]
    zh: ["下载定宽文本：mass_1.mas20.txt（ME、每核子结合能和 β Q）、rct1.mas20.txt 与 rct2_1.mas20.txt（反应），以及 nubase_4.mas20.txt（核态）。", "先阅读列说明：“#” 在外推数值中代替小数点；“*” 表示无数据。数值和不确定度的标记应分别保留。", "优先采用直接发表的反应不确定度：评价质量之间存在相关性，单个质量误差的平方和无法重现这些不确定度。", "没有直接反应列的物理量，应在适用时采用协方差文件，或明确注明独立误差传播近似。"]
  tips: {en: "The chart's AME reference uses published energies and evaluated uncertainties where tabulated. New-mass and model calculations remain separate. Cite the original AME/NUBASE papers.", zh: "核素图的 AME 参考在有直接数据时采用已发表能量与评价不确定度；新质量和模型的计算另行区分。请引用 AME/NUBASE 原始论文。"}
  cite: "W.J. Huang et al., Chin. Phys. C 45, 030002 (2021); M. Wang et al., Chin. Phys. C 45, 030003 (2021); F.G. Kondev et al., Chin. Phys. C 45, 030001 (2021)"
- id: amdc-imp
  name: "AMDC mirror at IMP (Lanzhou)"
  org: "Institute of Modern Physics, CAS"
  cat: masses
  kind: evaluated
  url: "https://amdc.impcas.ac.cn/"
  short: {en: "Chinese home of the Atomic Mass Data Center with the AME/NUBASE files and evaluation tools.", zh: "原子质量数据中心在兰州近代物理研究所的主页，提供 AME/NUBASE 文件与评价工具。"}
  what: {en: "The same AME and NUBASE tables, historical evaluations and documentation.", zh: "相同的 AME 与 NUBASE 数据表、历史版本与文档。"}
  use:
    en: ["Use as an alternative download site for the mass tables.", "Browse earlier evaluations (AME2016, AME2012…) to compare versions."]
    zh: ["作为质量表的备用下载站点。", "浏览早期评价（AME2016、AME2012……）进行版本比较。"]
  tips: {en: "Keep the version (AME2020) in file names and papers — values change between evaluations.", zh: "在文件名和论文中注明版本（AME2020）——不同评价之间数值会变化。"}
- id: amdc-anl
  name: "AMDC at Argonne — atomic mass data resources"
  org: "Argonne National Laboratory"
  cat: masses
  kind: evaluated
  url: "https://www.anl.gov/phy/atomic-mass-data-resources"
  short: {en: "Official AMDC collaboration entry at Argonne, with atomic-mass evaluation resources.", zh: "AMDC 合作组在阿贡国家实验室的官方入口，提供原子质量评价资源。"}
  what: {en: "One of the collaboration websites named by the IMP and IAEA AMDC pages. Use the IAEA or IMP mirrors if access is restricted.", zh: "IMP 和 IAEA 的 AMDC 主页列出的合作组站点之一；如访问受限，可使用 IAEA 或 IMP 镜像。"}
  use:
    en: ["Choose an evaluation edition before downloading.", "Keep the mass, reaction and covariance files from the same edition.", "Read the original papers and each file's fixed-column header."]
    zh: ["下载前先选择评价版本。", "质量、反应与协方差文件应来自同一评价版本。", "阅读原始论文以及各文件的定宽列说明。"]
  tips: {en: "Do not mix AME2016, AME2020 and rounded exports without labelling the edition and precision.", zh: "不要混用 AME2016、AME2020 和舍入导出文件而不注明版本与精度。"}
- id: nubase-min
  name: "NUBASE2020 browser (IAEA)"
  org: "IAEA Nuclear Data Section"
  cat: masses
  kind: evaluated
  url: "https://nds.iaea.org/relnsd/nubase/nubase_min.html"
  short: {en: "Searchable web version of NUBASE2020: states, half-lives, spins and decay modes.", zh: "NUBASE2020 网页检索版：核态、半衰期、自旋与衰变方式。"}
  what: {en: "All NUBASE2020 ground and isomeric states with excitation energies, half-lives, Jπ and decay branches.", zh: "NUBASE2020 全部基态与同核异能态：激发能、半衰期、Jπ 与衰变分支。"}
  use:
    en: ["Filter by Z, N or A.", "Sort by excitation energy or half-life to find long-lived isomers (useful for PI-ICR)."]
    zh: ["按 Z、N 或 A 筛选。", "按激发能或半衰期排序，查找长寿命同核异能态（PI-ICR 测量很有用）。"]
  tips: {en: "Isomer energies marked '#' are estimates; measured energies have no '#'.", zh: "标 “#” 的同核异能态能量为估计值；测量值不带 “#”。"}
- id: radii
  name: "Nuclear charge radii (IAEA)"
  org: "IAEA Nuclear Data Section"
  cat: masses
  kind: evaluated
  url: "https://www-nds.iaea.org/radii/"
  short: {en: "Compilation of experimental ground-state charge radii (Angeli & Marinova and updates).", zh: "实验基态电荷半径汇编（Angeli & Marinova 及更新）。"}
  what: {en: "rms charge radii from electron scattering, muonic atoms and laser spectroscopy (isotope shifts), with uncertainties.", zh: "来自电子散射、μ 原子与激光谱（同位素移位）的均方根电荷半径及不确定度。"}
  use:
    en: ["Choose the element and download the table.", "Plot δ⟨r²⟩ along an isotope chain to see shell closures and shape changes."]
    zh: ["选择元素并下载数据表。", "沿同位素链画 δ⟨r²⟩，观察壳闭合和形状变化。"]
  tips: {en: "Laser spectroscopy gives differences δ⟨r²⟩; absolute radii need a reference isotope.", zh: "激光谱给出差值 δ⟨r²⟩；绝对半径需要参考同位素。"}
  cite: "I. Angeli, K.P. Marinova, At. Data Nucl. Data Tables 99, 69 (2013)"
- id: moments
  name: "Nuclear moments (IAEA)"
  org: "IAEA Nuclear Data Section"
  cat: masses
  kind: evaluated
  url: "https://www-nds.iaea.org/nuclearmoments/"
  help: "https://www-nds.iaea.org/nuclearmoments/help.html"
  short: {en: "Magnetic dipole and electric quadrupole moments of ground and excited states (N.J. Stone tables).", zh: "基态与激发态的磁偶极矩和电四极矩（N.J. Stone 表）。"}
  what: {en: "Measured and recommended μ and Q values with method and reference.", zh: "测量与推荐的 μ 与 Q 值，附测量方法和参考文献。"}
  use:
    en: ["Search by nuclide or state.", "Check the method column (laser, NMR, β-NMR…) and the reference.", "Use the recommended tables (INDC(NDS)-0794, -0816) where available."]
    zh: ["按核素或核态检索。", "查看方法列（激光、NMR、β-NMR……）与文献。", "有推荐表（INDC(NDS)-0794、-0816）时优先使用。"]
  tips: {en: "Mind the sign conventions and the diamagnetic/Sternheimer corrections quoted in the tables.", zh: "注意表中给出的符号约定及抗磁/Sternheimer 修正。"}
- id: frdm2012
  name: "FRDM2012 mass model"
  org: "Los Alamos National Laboratory"
  cat: masses
  kind: theory
  url: "https://doi.org/10.1016/j.adt.2015.10.002"
  short: {en: "Finite-range droplet model: masses, deformations and shell corrections for 9 318 nuclei up to the drip lines.", zh: "有限力程液滴模型：直至滴线的 9318 个核的质量、形变与壳修正。"}
  what: {en: "Calculated ground-state masses, β₂…β₆ deformations, shell and pairing corrections; rms deviation ≈ 0.56 MeV from AME masses.", zh: "计算的基态质量、β₂…β₆ 形变、壳修正与对修正；与 AME 质量的均方根偏差约 0.56 MeV。"}
  use:
    en: ["Download the table from the journal supplement (ADNDT 109–110, 1 (2016)).", "Use it where no measured mass exists (r-process, drip lines) — compare with AME where data exist.", "On this site: chart → mass model → FRDM (2012)."]
    zh: ["从期刊补充材料下载数据表（ADNDT 109–110, 1 (2016)）。", "在没有测量质量的区域（r 过程、滴线）使用——有数据处与 AME 比较。", "本站：核素图 → 质量模型 → FRDM (2012)。"]
  tips: {en: "Model-to-model spread far from stability is a useful estimate of the true uncertainty.", zh: "远离稳定线处不同模型间的差异可作为真实不确定度的估计。"}
  cite: "P. Möller, A.J. Sierk, T. Ichikawa, H. Sagawa, At. Data Nucl. Data Tables 109–110, 1 (2016)"
- id: ws4
  name: "WS4 / WS-type mass models"
  org: "N. Wang et al., Guangxi Normal University"
  cat: masses
  kind: theory
  url: "http://www.imqmd.com/mass/"
  short: {en: "Weizsäcker–Skyrme mass formula (rms ≈ 0.3 MeV) with RBF-corrected and DZ variants, downloadable tables.", zh: "Weizsäcker–Skyrme 质量公式（均方根约 0.3 MeV），含 RBF 修正与 DZ 变体，可下载数据表。"}
  what: {en: "WS4, WS4+RBF and DZ28+RBF masses, deformations and shell energies as plain text tables.", zh: "以纯文本表提供 WS4、WS4+RBF 与 DZ28+RBF 的质量、形变和壳能。"}
  use:
    en: ["Download WS4.txt; columns are A, Z, β₂, β₄, β₆, E_sh, E_def, E_exp, E_th, M_exp, M_th (MeV).", "Use M_th as mass excess for unknown nuclei."]
    zh: ["下载 WS4.txt；列依次为 A、Z、β₂、β₄、β₆、E_sh、E_def、E_exp、E_th、M_exp、M_th（MeV）。", "未知核的质量过剩取 M_th。"]
  tips: {en: "One of the most accurate global models near known nuclei; extrapolations still differ by MeV at the drip lines.", zh: "在已知核附近是精度最高的全局模型之一；在滴线附近外推仍可相差数 MeV。"}
  cite: "N. Wang, M. Liu, X. Wu, J. Meng, Phys. Lett. B 734, 215 (2014)"
- id: bruslib
  name: "BRUSLIB (HFB mass tables)"
  org: "Université Libre de Bruxelles"
  cat: masses
  kind: theory
  url: "http://www.astro.ulb.ac.be/bruslib/"
  short: {en: "Brussels nuclear library: HFB-21…31 masses, fission barriers, level densities and astrophysical rates.", zh: "布鲁塞尔核库：HFB-21…31 质量、裂变位垒、能级密度与天体物理反应率。"}
  what: {en: "Skyrme/Gogny Hartree–Fock–Bogoliubov mass tables and derived nuclear inputs for nucleosynthesis.", zh: "Skyrme/Gogny Hartree–Fock–Bogoliubov 质量表及核合成所需的派生核输入。"}
  use:
    en: ["Choose 'Nuclear masses' and the model (e.g. HFB-24).", "Select Z/A range and download the table."]
    zh: ["选择 “Nuclear masses” 及模型（如 HFB-24）。", "选择 Z/A 范围并下载数据表。"]
  tips: {en: "HFB tables are the standard choice for r-process network calculations.", zh: "HFB 质量表是 r 过程网络计算的常用选择。"}
# ───────────── reactions ─────────────
- id: exfor
  name: "EXFOR (experimental reaction data)"
  org: "IAEA NDS / NRDC network"
  cat: reactions
  kind: experimental
  url: "https://www-nds.iaea.org/exfor/"
  help: "https://www-nds.iaea.org/exfor/x4guide/"
  short: {en: "Experimental nuclear reaction data — cross sections, yields, spectra — from more than 25 000 experiments.", zh: "实验核反应数据——截面、产额、能谱——来自超过 25 000 项实验。"}
  what: {en: "Numerical data as published (or supplied by authors) for neutron-, charged-particle- and photon-induced reactions, with the experimental details.", zh: "中子、带电粒子和光子诱发反应的原始数值数据（发表或作者提供），附实验细节。"}
  use:
    en: ["Search by target, reaction (e.g. 58Ni(p,γ)) and quantity (CS = cross section).", "Plot several data sets together with evaluated curves.", "Export in EXFOR, X4+ or C5 table formats."]
    zh: ["按靶核、反应（如 58Ni(p,γ)）与物理量（CS = 截面）检索。", "将多个数据集与评价曲线一起作图。", "导出为 EXFOR、X4+ 或 C5 表格式。"]
  tips: {en: "Use the EXFOR entry number (e.g. 12345.002) when you cite a data set together with the paper.", zh: "引用数据集时同时给出论文与 EXFOR 条目号（如 12345.002）。"}
- id: exfor-nndc
  name: "EXFOR at NNDC"
