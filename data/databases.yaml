  org: "NNDC / NSDD"
  cat: literature
  kind: bibliography
  url: "https://www.nndc.bnl.gov/nsr/"
  short: {en: "Bibliography of >250 000 nuclear-physics papers indexed by nuclide, reaction and measured quantity.", zh: "超过 25 万篇核物理文献的书目，按核素、反应与测量量索引。"}
