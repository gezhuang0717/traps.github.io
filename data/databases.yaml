    zh: ["在小核素图上点击靶核。", "选择数据库与反应；可叠加多个数据库。", "加入 EXFOR 数据进行比较。"]
  tips: {en: "Quick way to compare ENDF/B, JEFF and JENDL for the same reaction.", zh: "快速比较同一反应在 ENDF/B、JEFF 与 JENDL 中的差异。"}
- id: janis
  name: "JANIS"
  org: "OECD Nuclear Energy Agency"
  cat: reactions
  kind: tool
  url: "https://www.oecd-nea.org/janis/"
  short: {en: "Java/web display program for evaluated libraries, EXFOR and decay data.", zh: "评价数据库、EXFOR 与衰变数据的 Java/网页显示程序。"}
  what: {en: "Browser for ENDF-6, PENDF/GENDF, EXFOR and CINDA with plotting and comparison tools.", zh: "ENDF-6、PENDF/GENDF、EXFOR 与 CINDA 浏览器，带作图与比较工具。"}
  use:
    en: ["Use JANIS Web or download the desktop program.", "Select database → material → reaction and plot.", "Compare evaluations and experimental data in one figure."]
    zh: ["使用 JANIS 网页版或下载桌面程序。", "选择数据库 → 材料 → 反应并作图。", "在一张图中比较评价与实验数据。"]
  tips: {en: "Good for preparing publication-quality comparison plots.", zh: "适合制作出版质量的比较图。"}
- id: tendl
  name: "TENDL"
  org: "PSI / IAEA (TALYS-based)"
  cat: reactions
  kind: library
  url: "https://tendl.web.psi.ch/"
  short: {en: "TALYS-based evaluated library covering all targets and projectiles up to 200 MeV.", zh: "基于 TALYS 的评价数据库，覆盖全部靶核与入射粒子，能量至 200 MeV。"}
  what: {en: "Complete ENDF-6 files with covariances for n, p, d, t, ³He, α and γ on ~2 800 targets, including unstable ones.", zh: "约 2800 个靶核（含不稳定核）的 n、p、d、t、³He、α、γ 完整 ENDF-6 文件及协方差。"}
  use:
    en: ["Choose the release (e.g. TENDL-2023), projectile and target.", "Download ENDF files or use the plots.", "Good when no other evaluation exists (e.g. exotic targets)."]
    zh: ["选择版本（如 TENDL-2023）、入射粒子与靶核。", "下载 ENDF 文件或查看图表。", "在没有其他评价时（如奇特靶核）很有用。"]
  tips: {en: "Model-based: check against EXFOR where data exist.", zh: "基于模型：有实验数据处请与 EXFOR 核对。"}
- id: jeff
  name: "JEFF"
  org: "OECD-NEA Data Bank"
  cat: reactions
  kind: library
  url: "https://www.oecd-nea.org/dbdata/jeff/"
  short: {en: "Joint Evaluated Fission and Fusion library (European evaluation).", zh: "联合评价裂变与聚变数据库（欧洲评价）。"}
  what: {en: "Neutron, decay, fission-yield and activation sublibraries in ENDF-6 format.", zh: "中子、衰变、裂变产额与活化子库（ENDF-6 格式）。"}
  use:
    en: ["Choose the latest release and sublibrary.", "Download files or view them in JANIS."]
    zh: ["选择最新版本与子库。", "下载文件或在 JANIS 中查看。"]
  tips: {en: "Decay and fission-yield sublibraries are widely used in Europe.", zh: "衰变与裂变产额子库在欧洲广泛使用。"}
- id: jendl
  name: "JENDL"
  org: "Japan Atomic Energy Agency"
  cat: reactions
  kind: library
  url: "https://wwwndc.jaea.go.jp/jendl/jendl.html"
  short: {en: "Japanese Evaluated Nuclear Data Library (JENDL-5 and special-purpose files).", zh: "日本评价核数据库（JENDL-5 及专用文件）。"}
  what: {en: "General-purpose neutron data plus proton, deuteron, photonuclear, decay and fission-yield sublibraries.", zh: "通用中子数据以及质子、氘、光核、衰变和裂变产额子库。"}
  use:
    en: ["Open the JENDL-5 page and choose the sublibrary.", "Download ENDF-6 files or use the plotting pages."]
    zh: ["打开 JENDL-5 页面选择子库。", "下载 ENDF-6 文件或使用作图页面。"]
  tips: {en: "JAEA also provides the FRENDY processing code.", zh: "JAEA 还提供 FRENDY 数据处理程序。"}
- id: ripl
  name: "RIPL-3"
  org: "IAEA Nuclear Data Section"
  cat: reactions
  kind: library
  url: "https://www-nds.iaea.org/RIPL-3/"
  short: {en: "Reference Input Parameter Library: masses, levels, level densities, optical potentials, γ strength functions.", zh: "参考输入参数库：质量、能级、能级密度、光学势、γ 强度函数。"}
  what: {en: "Input parameters for statistical-model reaction codes (TALYS, EMPIRE, CoH), including theoretical mass tables and discrete level schemes.", zh: "统计模型反应程序（TALYS、EMPIRE、CoH）的输入参数，包括理论质量表与分立能级纲图。"}
  use:
    en: ["Choose the segment (MASSES, LEVELS, OPTICAL, DENSITIES, GAMMA, FISSION).", "Download the files and read the segment README."]
    zh: ["选择数据段（MASSES、LEVELS、OPTICAL、DENSITIES、GAMMA、FISSION）。", "下载文件并阅读该段 README。"]
  tips: {en: "The LEVELS segment is the discrete-level input used by TALYS.", zh: "LEVELS 段即 TALYS 使用的分立能级输入。"}
- id: isotopia
  name: "Isotopia (IAEA)"
  org: "IAEA Nuclear Data Section"
  cat: reactions
  kind: tool
  url: "https://www-nds.iaea.org/relnsd/isotopia/isotopia.html"
  short: {en: "Production yields and decay data for medical and industrial radioisotopes.", zh: "医用与工业放射性同位素的生产产额与衰变数据。"}
  what: {en: "Recommended cross sections, thick-target yields and decay data for isotope production with cyclotrons and reactors.", zh: "回旋加速器与反应堆生产同位素的推荐截面、厚靶产额与衰变数据。"}
  use:
    en: ["Choose the product isotope.", "Compare production routes and yields.", "Check impurities from competing reactions."]
    zh: ["选择目标产物同位素。", "比较生产路线与产额。", "检查竞争反应产生的杂质。"]
  tips: {en: "Complements the IAEA medical-isotope cross-section evaluations.", zh: "可与 IAEA 医用同位素截面评价配合使用。"}
# ───────────── astrophysics ─────────────
- id: reaclib
  name: "JINA REACLIB"
  org: "JINA-CEE"
  cat: astro
  kind: library
  url: "https://reaclib.jinaweb.org/"
  short: {en: "Thermonuclear reaction-rate library in the 7-parameter REACLIB format for network codes.", zh: "热核反应率库，采用 7 参数 REACLIB 格式，供网络计算程序使用。"}
  what: {en: "Experimental and theoretical rates (and weak rates) for ~80 000 reactions, versioned snapshots, with the source label of every rate.", zh: "约 80 000 个反应的实验与理论反应率（及弱反应率），带版本快照与每条反应率的来源标签。"}
  use:
    en: ["Search a reaction or download a full snapshot.", "Each rate is λ = exp(a₀ + a₁/T₉ + a₂T₉^(−1/3) + a₃T₉^(1/3) + a₄T₉ + a₅T₉^(5/3) + a₆ ln T₉).", "Replace individual rates with new ones (e.g. from new masses) and record the label."]
    zh: ["检索单个反应或下载完整快照。", "每个反应率为 λ = exp(a₀ + a₁/T₉ + a₂T₉^(−1/3) + a₃T₉^(1/3) + a₄T₉ + a₅T₉^(5/3) + a₆ ln T₉)。", "可用新反应率（如新质量得到的）替换并记录标签。"]
  tips: {en: "New masses change rp- and r-process rates through Q values — reverse rates depend exponentially on Q.", zh: "新质量通过 Q 值改变 rp 与 r 过程反应率——逆反应率随 Q 指数变化。"}
  cite: "R.H. Cyburt et al., Astrophys. J. Suppl. 189, 240 (2010)"
- id: kadonis
  name: "KADoNiS"
  org: "Karlsruhe / Frankfurt"
  cat: astro
  kind: evaluated
  url: "https://www.kadonis.org/"
  short: {en: "Karlsruhe Astrophysical Database of Nucleosynthesis in Stars: s-process (n,γ) and p-process data.", zh: "卡尔斯鲁厄恒星核合成天体物理数据库：s 过程 (n,γ) 与 p 过程数据。"}
  what: {en: "Recommended Maxwellian-averaged cross sections (MACS) at kT = 5–100 keV and p-process reaction data.", zh: "kT = 5–100 keV 的推荐麦克斯韦平均截面（MACS）及 p 过程反应数据。"}
  use:
    en: ["Select the isotope.", "Read MACS(30 keV) and the energy dependence with references."]
    zh: ["选择同位素。", "查看 MACS(30 keV) 及其能量依赖与文献。"]
  tips: {en: "Standard reference for s-process network inputs.", zh: "s 过程网络输入的标准参考。"}
- id: starlib
  name: "STARLIB"
  org: "Sallaska, Iliadis et al."
  cat: astro
  kind: library
  url: "https://starlib.github.io/Rate-Library/"
  short: {en: "Tabulated reaction rates with statistical uncertainties (log-normal factors) for Monte-Carlo nucleosynthesis.", zh: "带统计不确定度（对数正态因子）的反应率表，供蒙特卡罗核合成计算。"}
  what: {en: "Rates on a temperature grid with recommended values and factor uncertainties.", zh: "温度网格上的反应率推荐值与因子不确定度。"}
  use:
    en: ["Download the library file.", "Sample rates from the log-normal distribution to propagate uncertainties."]
    zh: ["下载数据库文件。", "按对数正态分布抽样反应率以传递不确定度。"]
  tips: {en: "Pairs naturally with Monte-Carlo network studies of rp-process sensitivity.", zh: "适合 rp 过程敏感度的蒙特卡罗网络研究。"}
# ───────────── atomic data ─────────────
- id: nist-asd
  name: "NIST Atomic Spectra Database"
  org: "NIST"
  cat: atomic
  kind: evaluated
  url: "https://physics.nist.gov/PhysRefData/ASD/lines_form.html"
  short: {en: "Evaluated atomic energy levels, spectral lines and ionization energies.", zh: "评价原子能级、谱线与电离能。"}
  what: {en: "Line wavelengths, transition probabilities, level energies and ionization energies for atoms and ions.", zh: "原子与离子的谱线波长、跃迁概率、能级能量与电离能。"}
  use:
    en: ["Enter the spectrum (e.g. 'Sn I' or 'Cs II') and wavelength range.", "For electron binding energies of ions use the ionization-energies form.", "Needed for laser spectroscopy and for ion-mass corrections."]
    zh: ["输入光谱（如 “Sn I” 或 “Cs II”）与波长范围。", "离子的电子结合能请用电离能表单。", "激光谱和离子质量修正时需要这些数据。"]
  tips: {en: "Ion mass for Penning-trap work: m_ion = M_atom − q·mₑ + B_e/c² (B_e = total binding energy of the removed electrons).", zh: "彭宁阱离子质量：m_ion = M_atom − q·mₑ + B_e/c²（B_e 为移去电子的总结合能）。"}
- id: nist-ion
  name: "NIST ionization energies"
  org: "NIST"
  cat: atomic
  kind: evaluated
  url: "https://physics.nist.gov/PhysRefData/ASD/ionEnergy.html"
  short: {en: "Ionization energies of all charge states — needed for highly charged ion masses.", zh: "全部电荷态的电离能——高电荷态离子质量所需。"}
  what: {en: "Sequential ionization energies and total binding energies of atoms and ions.", zh: "原子与离子的逐级电离能和总结合能。"}
  use:
    en: ["Select element and charge-state range.", "Sum the energies to get the binding energy of the removed electrons."]
    zh: ["选择元素与电荷态范围。", "求和得到移去电子的结合能。"]
  tips: {en: "For singly charged ions the correction is a few eV — below most uncertainties but not for PENTATRAP-level work.", zh: "对单电荷离子修正为几 eV——低于多数不确定度，但对 PENTATRAP 级测量不可忽略。"}
- id: codata
  name: "CODATA fundamental constants"
  org: "NIST"
  cat: atomic
  kind: evaluated
  url: "https://physics.nist.gov/cuu/Constants/"
  short: {en: "Recommended values of the fundamental physical constants (mₑ, u, e, h…).", zh: "基本物理常数推荐值（mₑ、u、e、h……）。"}
  what: {en: "The CODATA adjustment with uncertainties and correlations.", zh: "CODATA 平差的常数值、不确定度与相关性。"}
  use:
    en: ["Search a constant by name.", "Use the same CODATA version as the mass evaluation you compare with (AME2020 uses CODATA 2018)."]
    zh: ["按名称检索常数。", "与所比较的质量评价使用同一 CODATA 版本（AME2020 采用 CODATA 2018）。"]
  tips: {en: "1 u = 931 494.10242(28) keV/c² (CODATA 2018).", zh: "1 u = 931 494.10242(28) keV/c²（CODATA 2018）。"}
- id: ciaaw
  name: "CIAAW atomic weights & isotopic abundances"
  org: "IUPAC"
  cat: atomic
  kind: evaluated
  url: "https://www.ciaaw.org/"
  short: {en: "Standard atomic weights and isotopic compositions of the elements.", zh: "元素标准原子量与同位素组成。"}
  what: {en: "Recommended atomic weights and natural isotopic abundances with their variations.", zh: "推荐原子量与天然同位素丰度及其变化范围。"}
  use:
    en: ["Open the element page.", "Use the isotopic abundances for natural-target yields or reference-ion choice."]
    zh: ["打开元素页面。", "用同位素丰度估算天然靶产额或选择参考离子。"]
  tips: {en: "NIST also offers a combined table of atomic weights and isotopic compositions.", zh: "NIST 也提供原子量与同位素组成的综合表。"}
# ───────────── tools ─────────────
- id: qcalc
  name: "QCalc (Q-value calculator)"
  org: "NNDC"
  cat: tools
  kind: tool
  url: "https://www.nndc.bnl.gov/qcalc/"
  short: {en: "Q values and thresholds for any reaction or decay from AME masses.", zh: "基于 AME 质量计算任意反应或衰变的 Q 值与阈能。"}
  what: {en: "Calculates reaction Q values, thresholds and separation energies.", zh: "计算反应 Q 值、阈能与分离能。"}
  use:
    en: ["Enter target, projectile and ejectile.", "Read Q, threshold and their uncertainties."]
    zh: ["输入靶核、入射与出射粒子。", "读取 Q 值、阈能及不确定度。"]
  tips: {en: "Check which mass evaluation the calculator uses.", zh: "注意计算器所用的质量评价版本。"}
- id: logft
  name: "LOGFT"
  org: "NNDC"
  cat: tools
  kind: tool
  url: "https://www.nndc.bnl.gov/logft/"
  short: {en: "log ft values for β decay and electron capture.", zh: "β 衰变与电子俘获的 log ft 值计算。"}
  what: {en: "Computes f, log ft and EC/β⁺ ratios for allowed and unique-forbidden transitions.", zh: "计算容许与唯一禁戒跃迁的 f、log ft 及 EC/β⁺ 比。"}
  use:
    en: ["Enter Z, Q value, level energy, half-life and branching.", "Choose transition type and read log ft."]
    zh: ["输入 Z、Q 值、能级能量、半衰期和分支比。", "选择跃迁类型并读取 log ft。"]
  tips: {en: "A new mass changes Q and therefore log ft — useful for low-Q decay studies.", zh: "新质量会改变 Q 值从而改变 log ft——对低 Q 值衰变研究很有用。"}
- id: bricc
  name: "BrIcc"
  org: "Australian National University"
  cat: tools
  kind: tool
  url: "https://bricc.anu.edu.au/"
  short: {en: "Internal-conversion coefficients and E0 factors.", zh: "内转换系数与 E0 因子计算。"}
  what: {en: "Calculated conversion coefficients (K, L, M… shells) and pair-conversion coefficients for any multipolarity.", zh: "任意多极性的各壳层（K、L、M……）内转换系数与电子对转换系数。"}
  use:
    en: ["Enter Z, γ energy and multipolarity (and mixing ratio).", "Read α_total and shell coefficients."]
    zh: ["输入 Z、γ 能量与多极性（及混合比）。", "读取 α_total 与各壳层系数。"]
  tips: {en: "Low-energy isomeric transitions decay mostly by conversion — important for isomer half-lives.", zh: "低能同核异能跃迁主要通过内转换衰变——对同核异能态寿命很重要。"}
- id: lise
  name: "LISE++"
  org: "FRIB / Michigan State University"
  cat: tools
  kind: tool
  url: "https://lise.frib.msu.edu/"
  short: {en: "Fragment-separator and RI-beam simulation with production cross sections and charge states.", zh: "碎片分离器与放射性束模拟，含产生截面与电荷态。"}
  what: {en: "Calculates rates, purity, energy loss and charge states for in-flight facilities; includes many utilities (masses, kinematics).", zh: "计算飞行分离装置的束流强度、纯度、能损与电荷态；包含众多工具（质量、运动学）。"}
  use:
    en: ["Load a facility configuration (FRS, BigRIPS, ARIS…).", "Set primary beam and target, tune the separator, read rates."]
    zh: ["载入装置配置（FRS、BigRIPS、ARIS……）。", "设置初级束与靶，调节分离器，读取产额。"]
  tips: {en: "Free download; Windows program (runs on macOS/Linux with Wine).", zh: "免费下载；Windows 程序（macOS/Linux 可用 Wine 运行）。"}
- id: srim
  name: "SRIM"
  org: "J.F. Ziegler"
  cat: tools
  kind: tool
  url: "http://www.srim.org/"
  short: {en: "Stopping powers and ranges of ions in matter.", zh: "离子在物质中的阻止本领与射程。"}
  what: {en: "Stopping and Range of Ions in Matter: tables and TRIM Monte-Carlo for energy loss, straggling and implantation.", zh: "离子在物质中的阻止与射程：能损、歧离与注入的表格和 TRIM 蒙特卡罗。"}
  use:
    en: ["Use 'Stopping/Range Tables' for quick values.", "Use TRIM for degraders, gas cells and implantation profiles."]
    zh: ["快速数值用 “Stopping/Range Tables”。", "降能片、气体室与注入分布用 TRIM。"]
  tips: {en: "Essential for designing degraders before gas cells (IGISOL, CSC).", zh: "设计气体室（IGISOL、CSC）前的降能片时必不可少。"}
- id: simion
  name: "SIMION"
  org: "Scientific Instrument Services"
  cat: tools
  kind: tool
  url: "https://simion.com/"
  short: {en: "Ion-optics simulation: electric/magnetic fields and ion trajectories.", zh: "离子光学模拟：电场/磁场与离子轨迹。"}
  what: {en: "Potential-array field solver with Lua user programs for time-dependent voltages (RFQ, traps, MR-TOF).", zh: "势阵列场求解器，可用 Lua 用户程序施加时变电压（RFQ、离子阱、MR-TOF）。"}
  use:
    en: ["Define electrodes (GEM files), refine the arrays.", "Fly ion groups; add Lua for RF, buffer gas or switching.", "Export trajectories and TOF for analysis."]
    zh: ["定义电极（GEM 文件）并求解势阵列。", "飞行离子组；用 Lua 加入射频、缓冲气体或切换。", "导出轨迹与飞行时间进行分析。"]
  tips: {en: "Commercial licence; the user manual and example workbenches are on the website.", zh: "商业许可；用户手册与示例工作台见官网。"}
# ───────────── literature ─────────────
- id: nsr
