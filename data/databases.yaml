terms:
- key: evaluated
  name: {en: "Evaluated vs. experimental data", zh: "评价数据与实验数据"}
  text: {en: "Experimental (compiled) data are the published numbers of single measurements (EXFOR, XUNDL). Evaluated data are recommended values obtained by critically averaging all measurements, resolving discrepancies and filling gaps with theory (ENSDF, AME, ENDF). Use evaluated values for applications; cite the original measurement when you compare with one experiment.", zh: "实验（汇编）数据是单次测量的发表数值（EXFOR、XUNDL）。评价数据是对所有测量进行批判性平均、处理矛盾并用理论补缺后得到的推荐值（ENSDF、AME、ENDF）。应用中使用评价值；与某一实验比较时引用原始测量。"}
- key: mass-excess
  name: {en: "Mass excess Δ", zh: "质量过剩 Δ"}
  text: {en: "Δ = (M − A·u)c², the difference between the atomic mass and A atomic mass units, in keV. AME tables give Δ; the atomic mass is M = A + Δ/931 494.10242 keV (in u).", zh: "Δ = (M − A·u)c²，原子质量与 A 个原子质量单位之差，单位 keV。AME 给出 Δ；原子质量 M = A + Δ/931 494.10242 keV（单位 u）。"}
- key: hash
  name: {en: "'#' in AME / NUBASE", zh: "AME / NUBASE 中的 “#”"}
  text: {en: "A '#' marks a value estimated from the smooth trends of the mass surface (systematics), not a measurement. Its uncertainty is the evaluators' estimate.", zh: "“#” 表示由质量面平滑趋势（系统学）估计的值，而非测量值；其不确定度为评价者的估计。"}
- key: jpi
  name: {en: "Jπ notation", zh: "Jπ 记号"}
  text: {en: "Spin and parity, e.g. 0+, 9/2−. Values in parentheses are tentative, '#' values come from systematics, several values separated by commas are possible assignments.", zh: "自旋与宇称，如 0+、9/2−。括号内为暂定值，带 “#” 为系统学值，逗号分隔的多个值表示可能的指定。"}
- key: ensdf-format
  name: {en: "ENSDF 80-column format", zh: "ENSDF 80 列格式"}
  text: {en: "Fixed-width records: identification (ID), level (L), gamma (G), beta (B), EC (E), alpha (A) and comment (C) records. Modern access via JSON exports and the LiveChart API is easier for programs.", zh: "定宽记录：标识（ID）、能级（L）、γ（G）、β（B）、EC（E）、α（A）与注释（C）记录。程序使用时 JSON 导出和 LiveChart API 更方便。"}
- key: endf-format
  name: {en: "ENDF-6 MF/MT numbers", zh: "ENDF-6 的 MF/MT 编号"}
  text: {en: "MF is the file (data type: 1 general, 2 resonances, 3 cross sections, 4 angular, 5 energy distributions, 8 decay, 33 covariances); MT is the reaction (1 total, 2 elastic, 16 (n,2n), 18 fission, 102 (n,γ), 103 (n,p)…).", zh: "MF 为文件（数据类型：1 总信息，2 共振，3 截面，4 角分布，5 能谱，8 衰变，33 协方差）；MT 为反应（1 总截面，2 弹性，16 (n,2n)，18 裂变，102 (n,γ)，103 (n,p)……）。"}
- key: exfor-entry
  name: {en: "EXFOR entry / subentry", zh: "EXFOR 条目 / 子条目"}
  text: {en: "An entry (5 characters, e.g. 14523) is one experiment/paper; subentries (.002, .003…) hold individual data tables. The first character tells which data centre compiled it.", zh: "条目（5 个字符，如 14523）对应一项实验/论文；子条目（.002、.003……）为各数据表。首字符表示负责汇编的数据中心。"}
- key: keynumber
  name: {en: "NSR keynumber", zh: "NSR 文献编号"}
  text: {en: "YYYYAaNN — year, first-author code and running number (e.g. 2021Ge05). Used as references in ENSDF/XUNDL.", zh: "YYYYAaNN——年份、第一作者代码与序号（如 2021Ge05），在 ENSDF/XUNDL 中用作文献引用。"}
- key: uncertainty
  name: {en: "Uncertainty notation", zh: "不确定度记法"}
  text: {en: "1.234(12) means 1.234 ± 0.012 (one standard deviation, in the last digits). Evaluations add uncertainties in quadrature and may inflate them (Birge ratio) when data disagree.", zh: "1.234(12) 表示 1.234 ± 0.012（一个标准差，作用于末位）。评价中不确定度按平方和合成，数据不一致时可能按 Birge 比放大。"}
