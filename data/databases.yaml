  cat: reactions
  kind: experimental
  url: "https://www.nndc.bnl.gov/exfor/"
  short: {en: "US interface to the same EXFOR database, with its own search and plotting.", zh: "EXFOR 数据库的美国访问界面，自带检索与作图。"}
  what: {en: "The EXFOR experimental reaction library (also called CSISRS in the US).", zh: "EXFOR 实验反应数据库（在美国也称 CSISRS）。"}
  use:
    en: ["Enter target, reaction and quantity.", "Select data sets and plot or download."]
    zh: ["输入靶核、反应与物理量。", "选择数据集作图或下载。"]
  tips: {en: "Same content as the IAEA site; choose the faster interface for you.", zh: "内容与 IAEA 站点相同；选择对你更快的界面即可。"}
- id: endf
  name: "ENDF (evaluated libraries)"
  org: "NNDC / CSEWG"
  cat: reactions
  kind: library
  url: "https://www.nndc.bnl.gov/endf/"
  short: {en: "Evaluated Nuclear Data File: ENDF/B and other libraries in ENDF-6 format for transport codes.", zh: "评价核数据文件：ENDF/B 等 ENDF-6 格式数据库，用于输运程序。"}
  what: {en: "Complete evaluated cross sections, angular and energy distributions, fission yields, decay and covariance data for neutron, proton, photon and other sublibraries.", zh: "中子、质子、光子等子库的完整评价截面、角分布与能量分布、裂变产额、衰变与协方差数据。"}
  use:
    en: ["Choose library (ENDF/B-VIII, JEFF, JENDL, TENDL…) and sublibrary.", "Select the material and the MF/MT section (e.g. MF3 MT102 = (n,γ) cross section).", "Plot or download; process with NJOY/FRENDY for transport codes."]
    zh: ["选择数据库（ENDF/B-VIII、JEFF、JENDL、TENDL……）与子库。", "选择材料及 MF/MT 段（如 MF3 MT102 = (n,γ) 截面）。", "作图或下载；用 NJOY/FRENDY 处理后供输运程序使用。"]
  tips: {en: "MF = data type, MT = reaction channel; the ENDF-6 manual lists all numbers.", zh: "MF = 数据类型，MT = 反应道；ENDF-6 手册列出所有编号。"}
- id: sigma
  name: "Sigma"
  org: "NNDC"
  cat: reactions
  kind: tool
  url: "https://www.nndc.bnl.gov/sigma/"
  short: {en: "Retrieve and plot evaluated cross sections and decay data from several national libraries.", zh: "检索并绘制多个国家数据库的评价截面与衰变数据。"}
  what: {en: "Web plotting of ENDF-format libraries, with comparison to EXFOR points.", zh: "ENDF 格式数据库的网页作图，可与 EXFOR 实验点比较。"}
  use:
