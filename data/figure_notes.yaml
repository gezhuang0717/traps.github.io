# Explanations of figures, one block per language (static/js/zg-ui.js reads the page language). Every figure id exists in all six languages.
en:
  mathieu:
    title: How to read the Mathieu stability explorer
    summary: Radial motion of an ion in a linear RFQ obeys w″ + (a − 2q cos 2τ) w = 0 with τ = Ωt/2. The map shows which (q, a) give bounded motion.
    items:
    - - q
      - RF parameter q = 4QV/(mΩ²r₀²); V is the RF peak on each rod (adjacent rods ±V), Q the ion charge, m its mass, Ω = 2πf.
    - - a
      - DC parameter a = 8QU/(mΩ²r₀²); U is the DC voltage on the rods (pairs at ±U). a = 0 is pure RF.
    - - Blue area
      - 'First plane: motion along x is bounded at (a, q).'
    - - Orange area
      - 'Second plane: motion along y is bounded; its parameters are (−a, −q).'
    - - Green area
      - 'Both planes stable: the ideal field confines the ion in two dimensions.'
    - - Black dot
      - The selected operating point (q, a) of the chosen ion, mass, charge and voltages.
    - - Coloured dots and dashed lines
      - Operating points of the optional sections (cooler, mass filter, buncher). Each dashed line is a = (2U/V) q for that section; changing the ion mass moves its dot along the line.
    - - Limits
      - 'Ideal Mathieu motion only: no collisions, space charge, fringe fields or measured transmission.'
  rfq-geometry:
    title: How to read the rod-geometry drawing
    summary: Cross-section of 2n round rods around the axis; adjacent rods carry opposite RF.
    items:
    - - r₀
      - 'Dashed circle: field radius, the distance from the axis to the rod surface.'
    - - ρ
      - Rod radius = ratio × r₀; the ratio follows the rule chosen in the form (optimal 1.14511 for four rods).
    - - Blue / red rods
      - Rods at +V and −V (alternating); the number is the rod index.
    - - Rc, D, g
      - Centres at Rc = r₀ + ρ; adjacent centre distance D = 2Rc sin(π/N); surface gap g = D − 2ρ.
  mr-spectrum:
    title: How to read the MR-TOF spectrum
    summary: Simulated time-of-flight peaks after the chosen number of laps, for each species and isomer and for their sum.
    items:
    - - Coloured curves
      - Expected counts per bin of each species; isomers carry their state letter (133Xem). The area follows the population weight.
    - - Black curve
      - 'Combined sample: sum of all species.'
    - - Grey bars
      - One random sample of ions drawn from the same distribution (optional histogram).
    - - Dashed vertical lines
      - Centre time of each species.
    - - x axis
      - Time of flight relative to the first species, t − t₁ (ns).
    - - FWHM
      - Full width at half maximum of a peak, from the peak width and the broadening per lap.
    - &id001
      - Legend
      - 'Nuclide + state letter, charge as a superscript: 133Xe⁺ is the ground state, 133Xem⁺ the isomer m (its excitation energy E* is listed), 133Xe²⁺ a doubly charged ion.'
  mr-power:
    title: How to read the resolving-power plot
    summary: Resolving power of each species against the number of laps, compared with the value needed to separate each pair.
    items:
    - - R
      - Resolving power R = (m/q)/Δ(m/q) of a peak; it grows with the number of laps.
    - - Solid curves
      - R of each species, in the colours of the legend.
    - - Dashed lines
      - 'Required resolving power of a pair: ((m₁/q₁ + m₂/q₂)/2) / |m₁/q₁ − m₂/q₂|.'
    - - Reading
      - Where a solid curve is above the dashed line of its pair, the two peaks are resolved.
  mr-laps:
    title: How to read the separation and width plot
    summary: Time separation of each pair and the peak width as the number of laps grows.
    items:
    - - '|Δt|'
      - 'Solid curves: time-of-flight difference of a pair (ns); it grows linearly with laps.'
    - - FWHM
      - 'Dashed curve: peak width (ns), including the broadening per lap.'
    - - Resolved
      - A pair is separated once |Δt| exceeds the FWHM.
  tof-resonance:
    title: How to read the TOF-ICR resonance plot
    summary: Mean time of flight to the detector against the RF excitation frequency; the dip marks the cyclotron resonance of each species.
    items:
    - - x axis
      - 'νRF − νc of the target species (Hz): detuning of the excitation from its cyclotron frequency.'
    - - Coloured curves
      - Expected mean TOF of each species (isomers carry their state letter, 133Xem); the width of a dip is about 1/T (Fourier limit) for excitation time T.
    - - Black curve
      - 'Mixture: population-weighted mean TOF of the whole sample.'
    - - Dots with bars
      - 'Simulated measurement: mean TOF ± standard error at each scanned frequency.'
    - - Dashed gold curve
      - Single-species fit to the simulated data; its centre minus the true frequency is the bias.
    - - Dashed vertical lines
      - Cyclotron frequency of each species relative to the target.
    - *id001
  tof-residuals:
    title: How to read the residual plot
    summary: Data minus single-species fit at each scanned frequency.
    items:
    - - Dots with bars
      - Residual (µs) ± standard error. Scatter around zero means the fit describes the data; a systematic trend means a second species or a wrong model.
    - - x axis
      - Same detuning νRF − νc (Hz) as the resonance plot.
  tof-distribution:
    title: How to read the TOF distribution
    summary: 'Distribution of single-ion times of flight at the chosen detuning: what the detector records for each species.'
    items:
    - - Coloured curves
      - Probability density of each species, scaled by its population weight; a species on resonance arrives earlier.
    - - Black curve
      - Sum over all species.
    - - x axis
      - Time of flight of a detected ion (µs).
  penning-trajectory:
    title: How to read the Penning-trap trajectory
    summary: 'Projection of the ion path in an ideal Penning trap: fast modified-cyclotron motion on top of slow magnetron drift, plus axial oscillation.'
    items:
    - - ν₊, ν₋, νz
      - Modified cyclotron, magnetron and axial frequencies; ν₊ + ν₋ = νc = qB/(2πm).
    - - Black line
      - 'Ion path so far (view: top x–y, side x–z or a 3D projection).'
    - - Red dot
      - Current ion position.
    - - rp, rm, z
      - Radii of the cyclotron and magnetron motions and the axial amplitude, in mm, as set in the form.
  rfq-design:
    title: Symbols and formulas of the rod design
    summary: A multipole guide has N = 2n rods; neighbouring rods carry opposite voltages. Close to the axis the RF potential is a pure multipole. Averaged over one RF period it confines the ion in an effective potential; η tells whether that averaging is allowed.
    items:
    - - N, n
      - N rods (even, 4–24); n = N/2 is the multipole order. N = 4 gives n = 2 (quadrupole, the Mathieu case), N = 8 gives n = 4 (octupole).
    - - Φ = (U + V cos Ωt)(r/r₀)ⁿ cos nθ
      - Electric potential in volts at distance r from the axis and polar angle θ, at time t. On the surface of a rod (r = r₀, θ = 0) it equals U + V cos Ωt; the next rod has the opposite sign.
    - - U, V
      - DC voltage and RF peak voltage of a rod relative to ground (V). Between neighbouring rods the peak difference is 2V.
    - - Ω = 2πf
      - Angular RF frequency; f is the frequency entered in MHz.
    - - r₀, r
      - 'r₀: distance from the axis to the rod surface (field radius). r: distance of the ion from the axis; the readout is evaluated at the chosen fraction r/r₀.'
    - - Q, m
      - Ion charge Q = z·e and mass m.
    - - '|E|'
      - RF field amplitude |E| = nV/r₀ · (r/r₀)ⁿ⁻¹ in V/m; it grows towards the rods and is zero on the axis.
    - - U_eff
      - 'Effective (pseudo) potential, the confining energy left after averaging over one RF period: U_eff = Q²|E|²/(4mΩ²) = Q²n²V²/(4mΩ²r₀²) · (r/r₀)²ⁿ⁻². It rises as r^(2n−2): parabolic for a quadrupole, a flat floor with steep walls for higher n.'
    - - η = 2|Q|n(n−1)V/(mΩ²r₀²) · (r/r₀)ⁿ⁻²
      - 'Adiabaticity parameter η = 2|Q|·|d|E|/dr|/(mΩ²): the change of the RF force over the distance the ion moves in one RF period, relative to the force scale mΩ². Small η: smooth slow motion with small micromotion, so U_eff is valid. Large η: the averaging fails, the micromotion is large and RF heating is possible. For four rods η equals the Mathieu parameter q.'
    - - η target
      - Your limit for η at the evaluated radius. η is used because only the quadrupole has a Mathieu stability diagram; for n > 2 the motion is not a Mathieu equation, and the usual design rule is η below about 0.3 (Gerlich 1992). For four rods this is q ≈ 0.3 (the textbook runs cooler-bunchers at q = 0.3–0.5; the stability limit is q = 0.908). It is a rule of thumb, not a sharp threshold. The tile shows η / target, green when η ≤ target.
    - - f_min, V_max
      - η scales as V/f². For your V, f_min is the lowest frequency with η ≤ target; for your f, V_max is the highest RF peak voltage.
    - - A₃ₙ/Aₙ
      - First unwanted harmonic of the round-rod potential relative to the wanted one (see the rod-ratio rule).
  tof-hunt:
    title: How to read the TOF-ICR hunt plot
    summary: Mean time of flight to the detector against the RF excitation frequency; the dip marks the cyclotron resonance you are hunting.
    items:
    - - Blue dots with bars
      - Mean time of flight ± standard error of the ions shot at that frequency.
    - - Orange dashed line
      - The RF frequency currently set with the slider.
    - - Green curve and band
      - 'Fit to the shots so far: the fitted resonance curve and, as a band, its centre ± uncertainty.'
    - - Red line
      - True resonance frequency, drawn only after you reveal it.
    - - Axes
      - 'x: νRF − νc,ref (Hz), the detuning from the reference cyclotron frequency. y: mean time of flight (µs); a lower value means more radial energy was converted, so the ion was closer to resonance.'
    - - Text in the corner
      - Ion, field B, reference νc, excitation time T_rf with scheme, and the number of ions and shots.
  mr-classic:
    title: How to read the MR-TOF game plots
    summary: 'Upper plot: simulated time-of-flight peaks of the two ions after the chosen number of laps. Lower plot: resolving power against laps, compared with the resolving power the pair needs.'
    items:
    - - Blue and red peaks
      - Counts per bin of the first ion (blue) and the second ion (red); each bar takes the colour of the nearer peak centre.
    - - Violet dashed curve
      - Sum of both peaks, when the sum box is ticked.
    - - Δt, FWHM
      - Time separation of the two peak centres and the full width at half maximum of one peak, in ns.
    - - x axis
      - Time of flight relative to the first ion, TOF − t₁ (ns).
    - - Violet curve (lower plot)
      - Resolving power R = t/(2·FWHM) against the number of laps; the width grows with the laps, so R levels off.
    - - Orange dot
      - R at the current number of laps.
    - - Red dashed line
      - 'Resolving power m/Δm the pair needs: ((m₁ + m₂)/2)/|Δm|. The peaks separate once the violet curve is above it.'
    - - log R
      - When ticked, the vertical axis shows log₁₀ R.
  rfq-classic:
    title: How to read the RFQ game
    summary: 'Left: cross-section of the four rods with the simulated ions. Right: the a–q stability diagram with the working point of every ion species.'
    items:
    - - Red and blue rods
      - Polarity of the four rods at the instant shown (+ red, − blue); it swaps every half RF period.
    - - Dashed circle
      - 'Field radius r₀: distance from the axis to the rod surface.'
    - - Dots and thin lines
      - Ions and their recent path, one colour per species.
    - - Sparks
      - An ion hit a rod and is lost; ions that survive the chosen number of RF cycles count as transmitted.
    - - Green region
      - Values of q = 4zeV/(m r₀² Ω²) and a = 8zeU/(m r₀² Ω²) with bounded motion in both planes.
    - - 0.908 and tip
      - Largest stable q at a = 0, and the apex of the region where only a narrow mass window is stable.
    - - Dashed line
      - Scan line a/q = 2U/V set by the DC and RF voltages; a larger U/V narrows the transmitted mass window.
    - - Coloured points
      - Working point (q, a) of each ion species; the target ion has a ring.
  pi-icr:
    title: How to read the PI-ICR plots
    summary: A position-sensitive detector records where the ions land after the accumulation time; the angle of each spot is the phase of the motion.
    items:
    - - Large circle
      - Detector area; the dashed cross is the detector centre.
    - - Coloured rings and labels
      - 'Expected spot of each species after the accumulation time: the angle is its accumulated phase, the ring radius is twice the phase width σ.'
    - - Dots or pixels
      - 'Simulated ion hits (dots, coloured by species; dark: centre-spot hits, grey: reference-spot hits) or their 2D histogram (pixels).'
    - - Small circle at the centre
      - Centre spot, the origin of the angles.
    - - Grey point and label
      - Reference position (first magnetron phase), when shown.
    - - Angle histogram
      - Hits against polar angle (0–360°); dashed lines mark the expected angle of each species.
    - - min Δφ against t_acc
      - 'Fancier tab: smallest phase difference between any two species as a function of accumulation time; the dashed red line is the required separation (σ target × event width), vertical lines are the compared times.'
  penning-sim:
    title: How to read the Penning-trap motion plot
    summary: 'Left: view along the magnetic field (x–y plane). Right: side view with the axial position.'
    items:
    - - Red dot
      - Current ion position.
    - - Coloured trail
      - Recent path; it fades from older (blue) to newer (magenta).
    - - Large circle and cross
      - Edge of the display range and the trap axis.
    - - Two circles at once
      - Fast modified-cyclotron motion (ν₊, radius r₊) riding on the slow magnetron motion (ν₋, radius r₋).
    - - Side view
      - Hyperbolic electrodes (curves) with the axial position z of the ion along the field.
    - - Sliders
      - r₊, r₋ and the axial amplitude are percentages of the display scale, not millimetres.
  penning-3d:
    title: How to read the 3D Penning-trap view
    summary: Ion paths in an ideal Penning trap with the magnetic field along the vertical axis; drag to rotate, wheel to zoom.
    items:
    - - B
      - Magnetic field axis (vertical line).
    - - Orange and blue outlines
      - Ring electrode (orange) and end caps (blue), when electrodes are shown.
    - - Grey vertical lines
      - Magnetic field lines, when shown.
    - - Coloured trails
      - Path of each ion, fading from old to new; with several ions each ion has its own colour.
    - - Red outline below
      - Plane of a PI-ICR-like detector with dots where the ions would hit it, when the detector is shown.
  laser-cooling-figures:
    title: How to read the laser-cooling plots
    summary: One-dimensional Doppler cooling of an atomic ensemble between two counter-propagating laser beams.
    items:
    - - Cloud
      - Schematic positions of the simulated particles, not a real geometry; the colour shows the speed (blue slow, red fast).
    - - Blue bars
      - Histogram of the particle velocities (counts).
    - - Rose curve
      - Normalised laser force F(v) from the two beams.
    - - Dashed lines
      - v = 0 and the capture velocities ±v_c; faster particles are not cooled efficiently.
    - - Temperature plot
      - Ensemble temperature against time with dashed reference lines for the Doppler limit (green), the steady-state theory value (brown) and the recoil temperature (violet).
  penning-cooling-figures:
    title: How to read the Penning-trap laser-cooling plots
    summary: Laser cooling of an ion in a Penning trap works only if the force gradient lies in a window between the magnetron and the cyclotron frequency.
    items:
    - - Green band
      - The window ν₋ … ν₊ on a logarithmic frequency axis.
    - - Arrow
      - 'F′/(2π βr): the force gradient divided by the radial friction coefficient. Inside the band both radial modes are cooled; below it the magnetron mode heats, above it the cyclotron mode heats.'
    - - γ₋, γ₊, γz
      - Rates of change of the magnetron, cyclotron and axial amplitudes (s⁻¹); a negative value means cooling.
    - - "z–y projection"
      - "The same motion seen from the side along x: axial z against y, with its own axial and radial ranges."
    - - "Phase-space plots"
      - "x against its velocity vₓ for the radial motion (last six cyclotron periods) and z against v_z for the axial motion (last three axial periods); the orange dot is the present time. Cooling shrinks the loops towards the centre."
    - - Orbit, axial and 3D plots
      - Radial x–y orbit, axial z–x projection and a 3D projection of the physical motion; the 3D axes are red x, green y, blue z.
    - - Amplitude plot
      - Log–log amplitude of the cyclotron, magnetron and axial motion against time; dashed lines mark 10 µm and 0.1 s.
  neutral-cooling-figures:
    title: How to read the neutral-atom cooling plots
    summary: Numerical cooling of a neutral-atom cloud by the selected laser-cooling method; every panel shows the same simulated atoms.
    items:
    - - 3D cloud
      - Atoms in equal physical axes (mm); red, green and blue arrows are x, y, z; grey circles mark the initial positions, if shown; drag or wheel to rotate and zoom.
    - - 2D projection
      - The same atoms on the plane selected in the view controls.
    - - Temperature
      - 'Survivor temperature from the centred velocity variance: total T (dark), Tx (red), Ty (green), Tz (blue); the dashed gold line is the Doppler temperature scale.'
    - - RMS size
      - Root-mean-square cloud size σx, σy, σz (mm).
    - - Centroid velocity
      - Mean velocity of the cloud along x, y, z (m/s).
    - - Force diagnostic
      - Radiation-pressure force along the chosen axis against position or velocity, other coordinates at zero (10⁻²¹ N).
    - - Phase space
      - Position against velocity along the selected axis, laboratory values (mm, m/s).
  paul-cooling-figures:
    title: How to read the Paul-trap laser-cooling plots
    summary: Numerical cooling of a Coulomb cloud of trapped ions; every panel shows the same simulated ions.
    items:
    - - 3D projection
      - Rotating 3D view in µm; red, green and blue arrows are x, y, z.
    - - x–y, z–x, y–z
      - Projections of the same ions on the radial and axial planes.
    - - Temperature
      - 'Mean, x, y and z temperature (mK, logarithmic) from the centred velocity variances; the dashed line is the Doppler scale ħΓ/(2k_B). Curves are not forced to fall: release of potential energy and micromotion can heat.'
    - - Phase space
      - x − mean(x) against vₓ − mean(vₓ) (µm, m/s).
  rfq-design-inputs:
    title: What the design inputs mean
    summary: These fields set the rod geometry and the RF drive that the readout below evaluates. Values are in the units of the labels (mm, V, MHz).
    items:
    - - Rod count
      - Number of round rods N, even, 4–24. Four rods are a quadrupole (mass filter, cooler, buncher). More rods give a flatter pseudopotential well and have no Mathieu stability diagram.
    - - Rod-radius rule
      - 'How the rod radius ρ is chosen. Optimal: the first unwanted field harmonic A₃ₙ vanishes. Curvature: ρ = r₀/(n−1), the rod follows the curvature of the ideal field line at its apex. Mass filter 1.128: the usual compromise for four-rod filters. Own ratio / own radius: your value (there is no default radius).'
    - - Ratio r/r₀, radius
      - Rod radius divided by the field radius r₀, and the same radius in mm. They are editable only for the own-ratio and own-radius rules; with the other rules they are computed from r₀.
    - - Rod-diameter tolerance
      - Optional machining tolerance of the rod diameter (mm). It only adds the corresponding ± change of r/r₀ to the readout.
    - - Evaluation radius r/r₀
      - 'Distance from the axis, in units of r₀, at which the RF field, the pseudopotential, η and the unwanted harmonic are evaluated: 0.5 is half way to the rod surface, 1 is at the aperture edge.'
    - - η target
      - Design limit for the adiabaticity parameter η (0.3 is usual; η = q for four rods). The readout says whether η at the evaluation radius is below it and gives the lowest frequency and the highest RF voltage that still meet it.
    - - Candidate RF peaks
      - RF peak voltages V in volts (one rod to ground), separated by commas. Each is listed with its η, its pseudopotential and, for four rods, its Mathieu classification.
  mathieu-inputs:
    title: What the explorer inputs mean
    summary: The map shows where bounded motion exists in the plane of the dimensionless parameters a (DC) and q (RF). The point is the operating point of the ion typed below.
    items:
    - - Geometry
      - 'Linear RFQ: radial motion of a four-rod quadrupole, plane (a, q) and its mirror image (−a, −q). 3D Paul trap: axial coordinates of a ring-and-endcap trap.'
    - - Selected point
      - 'From RFQ voltages: a and q are computed from U, V, r₀, f and the ion. Direct a, q: type the dimensionless values yourself.'
    - - Number of bands
      - How many stability bands (n = 0, 1, … up to 6) are shaded; higher bands lie at larger q.
    - - q and a limits
      - Plot limits of the map. The zoom buttons, the mouse wheel and dragging change them.
    - - Ion mass, charge z
      - Mass in u of the ion and its charge number z. “Fill ion mass” takes the mass from the catalogue (AME2020 + NUBASE2020) for the species typed in the field above.
    - - Rod DC U
      - 'Signed DC voltage of the rod pair (V): a = 8zeU/(m r₀² Ω²). U = 0 is RF-only operation, a = 0.'
    - - Rod RF peak V
      - 'Zero-to-peak RF voltage of one rod relative to ground (adjacent rods carry ±V): q = 4zeV/(m r₀² Ω²). The peak difference between adjacent rods is 2V.'
    - - Inscribed radius r₀
      - 'Field radius: distance from the axis to the rod surface.'
    - - RF frequency f
      - Drive frequency in MHz; Ω = 2πf.
    - - Independent RFQ sections
      - Cooler, mass filter and buncher can each have their own U, V, r₀ and f; their operating lines a = (2U/V)·q and points are drawn on the same map.
  wb-species-input:
    title: How to type a species
    summary: 'Each species is an ion: nuclide, nuclear state and charge, or a molecule. The “Nuclear state” menu lists the ground state and every isomer of a typed nuclide.'
    items:
    - - Nuclide
      - 'Mass number and element symbol: 133Xe (also Xe133, Xe-133). The ion mass is the AME2020 atomic mass minus the electron masses.'
    - - Isomer
      - Pick it in “Nuclear state”, or type 133mXe or 133Xem (both mean the first isomer of 133Xe), 133Xe*, 133Xe[m], 133Xe[2]; m2Xe style numbers and the letters g m n p q r x i j also work. It is shown as 133Xem and its excitation energy E* is added to the mass.
    - - Molecule
      - 'Isotopes one after another: 16O133Cs, 1H16O133Cs; 12C11 is eleven 12C atoms. Colon form with explicit counts (count, element, mass number): 1O16:1Cs133, 1H1:2O16:1Cs133 = H + 2 ¹⁶O + ¹³³Cs, and an isomer per constituent: 1H1:2O16:1mXe133 or 1H1:2O16:1Xem133. The mass is the sum of the atomic masses (molecular binding energies omitted).'
    - - Charge
      - 'Charge field, or typed: 133Cs+2, 133Cs2+. By electrons: 133Cs-e removes one electron (shown as 133Cs+), 133Cs-2e two (133Cs2+); in colon form 1O16:1Cs133:-e becomes 1O16:1Cs133:+. Negative ions add electrons: 133Cs+e or 133Cs- (shown as 133Cs-). Penning traps then need a negative trap voltage. Integer 1–100; a positive charge cannot exceed the electron count.'
    - - Population
      - 'Detected population: relative weight of the species in the sample; can also be typed as 133Xe:30.'
    - - Masses
      - 'AME2020 ground-state atomic masses plus NUBASE2020 excitation energies; # marks extrapolated values. Open “AME2020 masses and energies” under a species to see every tabulated number.'
zh:
  mathieu:
    title: 如何阅读 Mathieu 稳定性图
    summary: 线性 RFQ 中离子的径向运动满足 w″ + (a − 2q cos 2τ) w = 0，τ = Ωt/2。此图显示哪些 (q, a) 对应有界运动。
    items:
    - - q
      - RF 参数 q = 4QV/(mΩ²r₀²)；V 为每根杆的 RF 峰值（相邻杆 ±V），Q 为离子电荷，m 为质量，Ω = 2πf。
    - - a
      - 直流参数 a = 8QU/(mΩ²r₀²)；U 为杆上的直流电压（两对杆 ±U）。a = 0 为纯 RF。
    - - 蓝色区域
      - 第一平面：x 方向运动在 (a, q) 处有界。
    - - 橙色区域
      - 第二平面：y 方向运动有界；其参数为 (−a, −q)。
    - - 绿色区域
      - 两个平面都稳定：理想场在二维上约束离子。
    - - 黑点
      - 所选离子、质量、电荷和电压对应的工作点 (q, a)。
    - - 彩色点与虚线
      - 可选分段（冷却器、质量过滤器、聚束器）的工作点。每条虚线为该段的 a = (2U/V) q；改变离子质量会使其点沿虚线移动。
    - - 局限
      - 仅为理想 Mathieu 运动：不含碰撞、空间电荷、边缘场或实测传输。
  rfq-geometry:
    title: 如何阅读杆几何图
    summary: 围绕轴线的 2n 根圆杆截面；相邻杆 RF 极性相反。
    items:
    - - r₀
      - 虚线圆：场半径，即轴线到杆表面的距离。
    - - ρ
      - 杆半径 = 比值 × r₀；比值由表单所选规则决定（4 杆最优为 1.14511）。
    - - 蓝/红杆
      - 电位 +V 与 −V 的杆（交替排列）；数字为杆编号。
    - - Rc, D, g
      - 杆心在 Rc = r₀ + ρ；相邻中心距 D = 2Rc sin(π/N)；表面间隙 g = D − 2ρ。
  mr-spectrum:
    title: 如何阅读 MR-TOF 谱
    summary: 在所选圈数后，各核素/同质异能态及其总和的模拟飞行时间峰。
    items:
    - - 彩色曲线
      - 各核素的每道期望计数；同质异能态带有状态字母（如 133Xem）。面积正比于布居权重。
    - - 黑色曲线
      - 合成样品：所有核素之和。
    - - 灰色柱
      - 从同一分布抽取的一组随机离子样本（可选直方图）。
    - - 垂直虚线
      - 各核素的中心时间。
    - - 横轴
      - 相对第一种核素的飞行时间 t − t₁（ns）。
    - - FWHM
      - 峰的半高全宽，由峰宽和每圈展宽得到。
    - &id002
      - 图例
      - 核素 + 状态字母，电荷为上标：133Xe⁺ 是基态，133Xem⁺ 是同质异能态 m（并列出激发能 E*），133Xe²⁺ 是二价离子。
  mr-power:
    title: 如何阅读分辨本领图
    summary: 各核素的分辨本领随圈数变化，并与分离每对核素所需的值比较。
    items:
    - - R
      - 峰的分辨本领 R = (m/q)/Δ(m/q)；随圈数增长。
    - - 实线
      - 各核素的 R，颜色与图例一致。
    - - 虚线
      - 一对核素所需的分辨本领：((m₁/q₁ + m₂/q₂)/2) / |m₁/q₁ − m₂/q₂|。
    - - 读法
      - 实线高于其对应虚线处，两峰可分辨。
  mr-laps:
    title: 如何阅读间隔与宽度图
    summary: 随圈数增加，每对核素的时间间隔和峰宽。
    items:
    - - '|Δt|'
      - 实线：一对核素的飞行时间差（ns）；随圈数线性增长。
    - - FWHM
      - 虚线：峰宽（ns），含每圈展宽。
    - - 可分辨
      - 当 |Δt| 超过 FWHM 时，这一对核素被分开。
  tof-resonance:
    title: 如何阅读 TOF-ICR 共振图
    summary: 到探测器的平均飞行时间随 RF 激发频率变化；凹陷标出各核素的回旋共振。
    items:
    - - 横轴
      - νRF − νc（目标核素，Hz）：激发频率相对其回旋频率的失谐。
    - - 彩色曲线
      - 各核素的期望平均 TOF（同质异能态带状态字母，如 133Xem）；激发时间 T 时，凹陷宽度约为 1/T（傅里叶极限）。
    - - 黑色曲线
      - 混合样品：按布居加权的平均 TOF。
    - - 带误差棒的点
      - 模拟测量：每个扫描频率处的平均 TOF ± 标准误差。
    - - 金色虚线
      - 对模拟数据的单核素拟合；其中心减去真实频率即为偏差。
    - - 垂直虚线
      - 各核素相对目标的回旋频率。
    - *id002
  tof-residuals:
    title: 如何阅读残差图
    summary: 每个扫描频率处的数据减去单核素拟合。
    items:
    - - 带误差棒的点
      - 残差（µs）± 标准误差。围绕零随机分布说明拟合合理；系统趋势意味着存在第二核素或模型不当。
    - - 横轴
      - 与共振图相同的失谐 νRF − νc（Hz）。
  tof-distribution:
    title: 如何阅读 TOF 分布
    summary: 在所选失谐下单个离子飞行时间的分布：探测器对每种核素记录的结果。
    items:
    - - 彩色曲线
      - 各核素的概率密度，按布居权重缩放；处于共振的核素到达更早。
    - - 黑色曲线
      - 所有核素之和。
    - - 横轴
      - 被探测离子的飞行时间（µs）。
  penning-trajectory:
    title: 如何阅读潘宁阱轨迹
    summary: 理想潘宁阱中离子路径的投影：快速的修正回旋运动叠加在缓慢的磁控漂移上，并带轴向振荡。
    items:
    - - ν₊, ν₋, νz
      - 修正回旋、磁控和轴向频率；ν₊ + ν₋ = νc = qB/(2πm)。
    - - 黑色线
      - 迄今的离子路径（视图：俯视 x–y、侧视 x–z 或 3D 投影）。
    - - 红点
      - 离子当前位置。
    - - rp, rm, z
      - 回旋、磁控运动半径与轴向振幅（mm），由表单设定。
  rfq-design:
    title: 杆设计中的符号与公式
    summary: 多极导引由 N = 2n 根杆组成，相邻杆电压相反。靠近轴线时射频势是纯多极场。对一个射频周期取平均后，离子被约束在有效势中；η 用来判断这种平均是否成立。
    items:
    - - N, n
      - N 为杆数（偶数，4–24）；n = N/2 为多极阶数。N = 4 时 n = 2（四极，即 Mathieu 情形），N = 8 时 n = 4（八极）。
    - - Φ = (U + V cos Ωt)(r/r₀)ⁿ cos nθ
      - 距轴线 r、极角 θ、时刻 t 处的电势（V）。杆表面（r = r₀，θ = 0）处等于 U + V cos Ωt，相邻杆符号相反。
    - - U, V
      - 一根杆相对地的直流电压与射频峰值电压（V）。相邻杆之间的射频峰值差为 2V。
    - - Ω = 2πf
      - 射频角频率；f 是以 MHz 输入的频率。
    - - r₀, r
      - r₀：轴线到杆表面的距离（场半径）。r：离子到轴线的距离；读数在所选的 r/r₀ 处计算。
    - - Q, m
      - 离子电荷 Q = z·e 与质量 m。
    - - '|E|'
      - 射频电场幅值 |E| = nV/r₀ · (r/r₀)ⁿ⁻¹（V/m）；靠近杆处增大，轴线上为零。
    - - U_eff
      - 有效（赝）势，即对一个射频周期取平均后剩下的约束势能：U_eff = Q²|E|²/(4mΩ²) = Q²n²V²/(4mΩ²r₀²) · (r/r₀)²ⁿ⁻²。它按 r^(2n−2) 上升：四极为抛物线，更高阶则底部平坦、壁很陡。
    - - η = 2|Q|n(n−1)V/(mΩ²r₀²) · (r/r₀)ⁿ⁻²
      - 绝热参数 η = 2|Q|·|d|E|/dr|/(mΩ²)：离子在一个射频周期内移动的距离上，射频力的变化相对于力标度 mΩ² 的大小。η 小：运动是平滑的慢运动加小的微运动，U_eff 成立；η 大：平均化失效，微运动大，可能出现射频加热。四根杆时 η 等于 Mathieu 参数 q。
    - - η 目标
      - 你在所选半径处为 η 设的上限。用 η 是因为只有四极场才有 Mathieu 稳定图；n > 2 时运动方程不是 Mathieu 方程，常用设计准则是 η 低于约 0.3（Gerlich 1992）。四根杆时即 q ≈ 0.3（教材中冷却聚束器取 q = 0.3–0.5，稳定极限 q = 0.908）。这是经验设计准则，不是严格阈值。方块显示 η / 目标，η ≤ 目标时为绿色。
    - - f_min, V_max
      - η 正比于 V/f²。给定 V，使 η ≤ 目标的最低 f 为 f_min；给定 f，最高射频峰值电压为 V_max。
    - - A₃ₙ/Aₙ
      - 圆杆电势中第一个不需要的谐波相对于所需谐波的大小（见杆比规则）。
  tof-hunt:
    title: 如何阅读 TOF-ICR 寻峰图
    summary: 到达探测器的平均飞行时间随射频激发频率的变化；凹陷处就是要寻找的回旋共振。
    items:
    - - 蓝点和误差棒
      - 该频率下所发射离子的平均飞行时间 ± 标准误差。
    - - 橙色虚线
      - 滑块当前设置的射频频率。
    - - 绿色曲线和色带
      - 对已有测量的拟合：拟合的共振曲线，色带为拟合中心 ± 不确定度。
    - - 红线
      - 真实共振频率，只在你揭晓答案后绘出。
    - - 坐标轴
      - x：νRF − νc,ref（Hz），相对参考回旋频率的失谐。y：平均飞行时间（µs）；数值越低表示转换的径向能量越多，离子越接近共振。
    - - 角落文字
      - 离子、磁场 B、参考 νc、激发时间 T_rf 与方案，以及离子数和发射次数。
  mr-classic:
    title: 如何阅读 MR-TOF 游戏图
    summary: 上图：选定圈数后两种离子的模拟飞行时间峰。下图：分辨本领随圈数的变化，并与该离子对所需的分辨本领比较。
    items:
    - - 蓝色与红色峰
      - 第一种离子（蓝）和第二种离子（红）每个时间格的计数；每根柱取离它更近的峰中心的颜色。
    - - 紫色虚线
      - 勾选“叠加”时，两个峰之和。
    - - Δt、FWHM
      - 两个峰中心的时间间隔，以及单个峰的半高全宽，单位 ns。
    - - x 轴
      - 相对第一种离子的飞行时间 TOF − t₁（ns）。
    - - 紫色曲线（下图）
      - 分辨本领 R = t/(2·FWHM) 随圈数的变化；峰宽随圈数增大，所以 R 趋于平缓。
    - - 橙色点
      - 当前圈数下的 R。
    - - 红色虚线
      - 该离子对所需的分辨本领 m/Δm：((m₁ + m₂)/2)/|Δm|。紫色曲线超过它时两峰分开。
    - - log R
      - 勾选后纵轴显示 log₁₀ R。
  rfq-classic:
    title: 如何阅读 RFQ 游戏
    summary: 左：四根杆的截面和模拟离子。右：a–q 稳定图，以及每种离子的工作点。
    items:
    - - 红色与蓝色杆
      - 所示时刻四根杆的极性（+ 红，− 蓝）；每半个射频周期交换一次。
    - - 虚线圆
      - 场半径 r₀：轴线到杆表面的距离。
    - - 点和细线
      - 离子及其近期轨迹，每种离子一种颜色。
    - - 火花
      - 离子撞到杆上而丢失；存活到所选射频周期数的离子计为透过。
    - - 绿色区域
      - 在两个平面内运动都有界的 q = 4zeV/(m r₀² Ω²) 与 a = 8zeU/(m r₀² Ω²) 取值。
    - - 0.908 与顶点
      - a = 0 时最大的稳定 q，以及稳定区的顶点，那里只有很窄的质量窗口稳定。
    - - 虚线
      - 由直流和射频电压决定的扫描线 a/q = 2U/V；U/V 越大，通过的质量窗口越窄。
    - - 彩色点
      - 每种离子的工作点 (q, a)；目标离子带圆圈。
  pi-icr:
    title: 如何阅读 PI-ICR 图
    summary: 位置灵敏探测器记录离子在累积时间之后的落点；每个光斑的角度就是运动的相位。
    items:
    - - 大圆
      - 探测器区域；虚线十字为探测器中心。
    - - 彩色圆环与标签
      - 累积时间后每种离子的预期光斑：角度为其累积相位，圆环半径为相位宽度 σ 的两倍。
    - - 点或像素
      - 模拟的离子击中位置（点，按离子种类着色；深色：中心光斑，灰色：参考光斑）或其二维直方图（像素）。
    - - 中心小圆
      - 中心光斑，角度的原点。
    - - 灰点与标签
      - 参考位置（第一个磁控管相位），显示时才出现。
    - - 角度直方图
      - 击中数随极角（0–360°）的分布；虚线标出各离子的预期角度。
    - - min Δφ 随 t_acc
      - “花式”页：任意两种离子之间最小相位差随累积时间的变化；红色虚线为所需分离度（σ 目标 × 事件宽度），竖线为比较的时间点。
  penning-sim:
    title: 如何阅读彭宁阱运动图
    summary: 左：沿磁场方向看（x–y 平面）。右：显示轴向位置的侧视图。
    items:
    - - 红点
      - 离子当前位置。
    - - 彩色轨迹
      - 近期路径；由旧（蓝）到新（洋红）渐变。
    - - 大圆和十字
      - 显示范围的边界和阱轴。
    - - 同时两个圆
      - 快速的修正回旋运动（ν₊，半径 r₊）叠加在缓慢的磁控管运动（ν₋，半径 r₋）上。
    - - 侧视图
      - 双曲面电极（曲线）及离子沿磁场方向的轴向位置 z。
    - - 滑块
      - r₊、r₋ 和轴向振幅是显示尺度的百分比，不是毫米。
  penning-3d:
    title: 如何阅读三维彭宁阱视图
    summary: 理想彭宁阱中的离子路径，磁场沿竖直轴；拖动旋转，滚轮缩放。
    items:
    - - B
      - 磁场轴（竖线）。
    - - 橙色和蓝色轮廓
      - 显示电极时：环电极（橙）和端盖（蓝）。
    - - 灰色竖线
      - 显示时为磁力线。
    - - 彩色轨迹
      - 每个离子的路径，由旧到新渐变；多个离子时各有自己的颜色。
    - - 下方红色轮廓
      - 显示探测器时：类 PI-ICR 探测器平面，点为离子可能的击中位置。
  laser-cooling-figures:
    title: 如何阅读激光冷却图
    summary: 原子系综在两束对射激光之间的一维多普勒冷却。
    items:
    - - 云团
      - 模拟粒子的示意位置，并非真实几何；颜色表示速率（蓝慢，红快）。
    - - 蓝色柱
      - 粒子速度的直方图（计数）。
    - - 玫红曲线
      - 两束激光产生的归一化光力 F(v)。
    - - 虚线
      - v = 0 与俘获速度 ±v_c；更快的粒子不能被有效冷却。
    - - 温度图
      - 系综温度随时间的变化，虚线为参考：多普勒极限（绿）、稳态理论值（棕）、反冲温度（紫）。
  penning-cooling-figures:
    title: 如何阅读彭宁阱激光冷却图
    summary: 彭宁阱中离子的激光冷却，只有当力梯度落在磁控管频率与回旋频率之间的窗口内才有效。
    items:
    - - 绿色带
      - 对数频率轴上的窗口 ν₋ … ν₊。
    - - 箭头
      - F′/(2π βr)：力梯度除以径向摩擦系数。落在带内时两个径向模都被冷却；低于带则磁控管模被加热，高于带则回旋模被加热。
    - - γ₋、γ₊、γz
      - 磁控管、回旋与轴向振幅的变化率（s⁻¹）；负值表示冷却。
    - - "z–y 投影"
      - "沿 x 方向侧视同一运动：轴向 z 对 y，轴向与径向范围各自独立。"
    - - "相空间图"
      - "径向运动的 x–vₓ（最近六个回旋周期）和轴向运动的 z–v_z（最近三个轴向周期）；橙点为当前时刻。冷却使回路向中心收缩。"
    - - 轨道、轴向和三维图
      - 径向 x–y 轨道、轴向 z–x 投影，以及实际运动的三维投影；三维坐标轴为红 x、绿 y、蓝 z。
    - - 振幅图
      - 回旋、磁控管和轴向运动的振幅随时间变化（双对数）；虚线标出 10 µm 和 0.1 s。
  neutral-cooling-figures:
    title: 如何阅读中性原子冷却图
    summary: 用所选激光冷却方法对中性原子云做数值冷却；每个面板显示同一批模拟原子。
    items:
    - - 三维云团
      - 等比例物理坐标轴（mm）；红、绿、蓝箭头分别是 x、y、z；显示时灰色圆圈标出初始位置；拖动或滚轮可旋转、缩放。
    - - 二维投影
      - 同一批原子在视图控件所选平面上的投影。
    - - 温度
      - 由去质心速度方差得到的幸存原子温度：总 T（深色）、Tx（红）、Ty（绿）、Tz（蓝）；金色虚线为多普勒温度尺度。
    - - 均方根尺寸
      - 云团均方根尺寸 σx、σy、σz（mm）。
    - - 质心速度
      - 云团沿 x、y、z 的平均速度（m/s）。
    - - 光力诊断
      - 沿所选轴的辐射压力随位置或速度的变化，其余坐标为零（10⁻²¹ N）。
    - - 相空间
      - 所选轴上的位置对速度，实验室数值（mm、m/s）。
  paul-cooling-figures:
    title: 如何阅读保罗阱激光冷却图
    summary: 囚禁离子库仑团的数值冷却；每个面板显示同一批模拟离子。
    items:
    - - 三维投影
      - 以 µm 为单位的可旋转三维视图；红、绿、蓝箭头分别是 x、y、z。
    - - x–y、z–x、y–z
      - 同一批离子在径向和轴向平面上的投影。
    - - 温度
      - 由去质心速度方差得到的平均、x、y、z 温度（mK，对数轴）；虚线为多普勒尺度 ħΓ/(2k_B)。曲线不强制下降：势能释放和微运动会造成加热。
    - - 相空间
      - x − mean(x) 对 vₓ − mean(vₓ)（µm、m/s）。
  rfq-design-inputs:
    title: 设计输入项的含义
    summary: 这些输入决定下方读数所评估的杆几何与射频驱动。数值单位见标签（mm、V、MHz）。
    items:
    - - 电极杆数
      - 圆杆数 N，偶数，4–24。四根杆是四极场（质量过滤器、冷却器、聚束器）；杆数更多时赝势阱更平，且没有 Mathieu 稳定图。
    - - 杆半径规则
      - 杆半径 ρ 的选取方式。最优：第一个不需要的场谐波 A₃ₙ 为零。曲率：ρ = r₀/(n−1)，杆顶与理想场线的曲率一致。质量过滤器 1.128：四杆过滤器常用的折中值。自定比值/自定半径：使用你输入的数值（没有默认半径）。
    - - 比值 r/r₀、半径
      - 杆半径除以场半径 r₀，以及同一半径的毫米值。只有“自定比值”和“自定半径”规则下可以编辑；其他规则由 r₀ 计算得出。
    - - 杆直径公差
      - 杆直径的可选加工公差（mm）。它只在读数中加上对应的 r/r₀ 的 ± 变化。
    - - 计算半径 r/r₀
      - 射频场、赝势、η 和不需要的谐波所计算的位置，离轴线的距离以 r₀ 为单位：0.5 是到杆表面的一半，1 是孔径边缘。
    - - η 目标
      - 绝热参数 η 的设计上限（常用 0.3；四根杆时 η = q）。读数会说明计算半径处的 η 是否低于它，并给出仍满足它的最低频率和最高射频电压。
    - - 候选射频峰值
      - 射频峰值电压 V（单位 V，一根杆对地），用逗号分隔。每个值都会列出其 η、赝势，四根杆时还有 Mathieu 分类。
  mathieu-inputs:
    title: 探索器输入项的含义
    summary: 图中显示在无量纲参数 a（直流）与 q（射频）平面内哪里存在有界运动。图中的点是下面所填离子的工作点。
    items:
    - - 几何
      - 线性 RFQ：四杆四极场的径向运动，平面 (a, q) 及其镜像 (−a, −q)。三维保罗阱：环电极加端盖阱的轴向坐标。
    - - 选定点
      - 由 RFQ 电压计算：由 U、V、r₀、f 和离子算出 a 与 q。直接输入 a、q：自己填写无量纲数值。
    - - 稳定带数量
      - 着色的稳定带个数（n = 0, 1, …，最多 6）；更高的带位于更大的 q。
    - - q 与 a 的范围
      - 图的坐标范围。缩放按钮、鼠标滚轮和拖动都会改变它们。
    - - 离子质量、电荷数 z
      - 离子质量（u）和电荷数 z。“填入离子质量”会按上面输入的离子从目录（AME2020 + NUBASE2020）取质量。
    - - 杆直流电压 U
      - 杆对的带符号直流电压（V）：a = 8zeU/(m r₀² Ω²)。U = 0 为仅射频运行，a = 0。
    - - 杆射频峰值 V
      - 一根杆相对地的零到峰射频电压（相邻杆为 ±V）：q = 4zeV/(m r₀² Ω²)。相邻杆之间的峰值电压差为 2V。
    - - 内切半径 r₀
      - 场半径：轴线到杆表面的距离。
    - - 射频频率 f
      - 驱动频率，单位 MHz；Ω = 2πf。
    - - 独立 RFQ 节
      - 冷却器、质量过滤器和聚束器各自可以有自己的 U、V、r₀ 和 f；它们的工作线 a = (2U/V)·q 和工作点画在同一张图上。
  wb-species-input:
    title: 如何输入离子种类
    summary: 每个种类是一个离子：核素、核态和电荷，或一个分子。“核态”菜单列出所输入核素的基态和全部同核异能态。
    items:
    - - 核素
      - 质量数加元素符号：133Xe（也可写 Xe133、Xe-133）。离子质量为 AME2020 原子质量减去电子质量。
    - - 同核异能态
      - 在“核态”中选择，或输入 133mXe 或 133Xem（二者都表示 133Xe 的第一个同核异能态）、133Xe*、133Xe[m]、133Xe[2]；也可用 m2Xe 形式的编号及字母 g m n p q r x i j。显示为 133Xem，激发能 E* 会加到质量上。
    - - 分子
      - 依次写出同位素：16O133Cs、1H16O133Cs；12C11 是 11 个 12C 原子。也可用带明确个数的冒号形式（个数、元素、质量数）：1O16:1Cs133、1H1:2O16:1Cs133 = H + 2 个 ¹⁶O + ¹³³Cs，并可为每个组成原子指定同核异能态：1H1:2O16:1mXe133 或 1H1:2O16:1Xem133。质量为原子质量之和（不含分子结合能）。
    - - 电荷
      - 在“电荷”栏设置，或直接输入：133Cs+2、133Cs2+。按电子数：133Cs-e 去掉一个电子（显示为 133Cs+），133Cs-2e 去掉两个（133Cs2+）；冒号形式 1O16:1Cs133:-e 显示为 1O16:1Cs133:+。负离子是增加电子：133Cs+e 或 133Cs-（显示为 133Cs-），此时彭宁阱需要负的阱电压。整数 1–100；正电荷不能超过电子数。
    - - 布居
      - 探测到的布居：该种类在样品中的相对权重，也可写成 133Xe:30。
    - - 质量
      - AME2020 基态原子质量加 NUBASE2020 激发能；# 表示外推值。展开某个种类下的“AME2020 质量与能量”可看到所有表中数值。
fi:
  mathieu:
    title: Mathieu-stabiilisuuskuvan lukeminen
    summary: Ionin radiaaliliike lineaarisessa RFQ:ssa noudattaa yhtälöä w″ + (a − 2q cos 2τ) w = 0, τ = Ωt/2. Kuva näyttää, millä (q, a) liike pysyy rajoitettuna.
    items:
    - - q
      - RF-parametri q = 4QV/(mΩ²r₀²); V on kunkin sauvan RF-huippu (viereiset sauvat ±V), Q ionin varaus, m massa, Ω = 2πf.
    - - a
      - DC-parametri a = 8QU/(mΩ²r₀²); U on sauvojen tasajännite (parit ±U). a = 0 tarkoittaa puhdasta RF:ää.
    - - Sininen alue
      - 'Ensimmäinen taso: x-suuntainen liike on rajoitettu pisteessä (a, q).'
    - - Oranssi alue
      - 'Toinen taso: y-suuntainen liike on rajoitettu; sen parametrit ovat (−a, −q).'
    - - Vihreä alue
      - 'Molemmat tasot stabiileja: ideaalikenttä sitoo ionin kahdessa ulottuvuudessa.'
    - - Musta piste
      - Valitun ionin, massan, varauksen ja jännitteiden työpiste (q, a).
    - - Värilliset pisteet ja katkoviivat
      - Valinnaisten osien (jäähdytin, massasuodatin, paketoija) työpisteet. Kukin katkoviiva on a = (2U/V) q kyseiselle osalle; massan muutos siirtää pistettä viivaa pitkin.
    - - Rajoitukset
      - 'Vain ideaalinen Mathieu-liike: ei törmäyksiä, avaruusvarausta, reunakenttiä eikä mitattua läpäisyä.'
  rfq-geometry:
    title: Sauvageometriakuvan lukeminen
    summary: Poikkileikkaus 2n pyöreästä sauvasta akselin ympärillä; viereisillä sauvoilla vastakkainen RF.
    items:
    - - r₀
      - 'Katkoviivaympyrä: kenttäsäde, etäisyys akselilta sauvan pintaan.'
    - - ρ
      - Sauvan säde = suhde × r₀; suhde määräytyy lomakkeen säännöstä (neljälle sauvalle optimi 1,14511).
    - - Siniset / punaiset sauvat
      - Sauvat potentiaalissa +V ja −V (vuorotellen); numero on sauvan järjestysluku.
    - - Rc, D, g
      - Keskipisteet Rc = r₀ + ρ; viereisten keskipisteiden väli D = 2Rc sin(π/N); pintaväli g = D − 2ρ.
  mr-spectrum:
    title: MR-TOF-spektrin lukeminen
    summary: Simuloidut lentoaikapiikit valitun kierrosmäärän jälkeen kullekin lajille ja isomeerille sekä niiden summalle.
    items:
    - - Värilliset käyrät
      - Kunkin lajin odotetut laskennat lokeroa kohti; isomeereillä on tilakirjain (133Xem). Pinta-ala seuraa populaatiopainoa.
    - - Musta käyrä
      - 'Yhdistetty näyte: kaikkien lajien summa.'
    - - Harmaat palkit
      - Yksi samasta jakaumasta arvottu ionien satunnaisotos (valinnainen histogrammi).
    - - Pystysuuntaiset katkoviivat
      - Kunkin lajin keskiaika.
    - - x-akseli
      - Lentoaika suhteessa ensimmäiseen lajiin, t − t₁ (ns).
    - - FWHM
      - Piikin täysi leveys puolikorkeudella, piikin leveydestä ja kierroskohtaisesta levenemisestä.
    - &id003
      - Selite
      - 'Nuklidi + tilakirjain, varaus yläindeksinä: 133Xe⁺ on perustila, 133Xem⁺ on isomeeri m (virityksen energia E* mainitaan), 133Xe²⁺ on kaksinkertaisesti varautunut ioni.'
  mr-power:
    title: Erotuskyvyn kuvaajan lukeminen
    summary: Kunkin lajin erotuskyky kierrosten funktiona verrattuna parin erottamiseen tarvittavaan arvoon.
    items:
    - - R
      - Piikin erotuskyky R = (m/q)/Δ(m/q); kasvaa kierrosmäärän mukana.
    - - Yhtenäiset käyrät
      - Kunkin lajin R, selitteen väreillä.
    - - Katkoviivat
      - 'Parin vaatima erotuskyky: ((m₁/q₁ + m₂/q₂)/2) / |m₁/q₁ − m₂/q₂|.'
    - - Lukeminen
      - Missä yhtenäinen käyrä ylittää parin katkoviivan, piikit erottuvat.
  mr-laps:
    title: Erotuksen ja leveyden kuvaajan lukeminen
    summary: Kunkin parin aikaero ja piikin leveys kierrosmäärän kasvaessa.
    items:
    - - '|Δt|'
      - 'Yhtenäiset käyrät: parin lentoaikaero (ns); kasvaa lineaarisesti kierroksilla.'
    - - FWHM
      - 'Katkoviiva: piikin leveys (ns) kierroskohtainen leveneminen mukaan lukien.'
    - - Erottuu
      - Pari erottuu, kun |Δt| ylittää FWHM:n.
  tof-resonance:
    title: TOF-ICR-resonanssikuvan lukeminen
    summary: Keskimääräinen lentoaika ilmaisimelle RF-herätetaajuuden funktiona; kuoppa osoittaa kunkin lajin syklotroniresonanssin.
    items:
    - - x-akseli
      - 'νRF − νc (kohdelaji, Hz): herätteen poikkeama sen syklotronitaajuudesta.'
    - - Värilliset käyrät
      - Kunkin lajin odotettu keski-TOF (isomeereillä tilakirjain, 133Xem); kuopan leveys on noin 1/T herätysajalla T (Fourier-raja).
    - - Musta käyrä
      - 'Seos: koko näytteen populaatiopainotettu keski-TOF.'
    - - Pisteet virhepalkeilla
      - 'Simuloitu mittaus: keski-TOF ± keskivirhe jokaisella skannatulla taajuudella.'
    - - Kultainen katkoviiva
      - Yhden lajin sovite simuloituun dataan; sen keskipiste miinus todellinen taajuus on harha.
    - - Pystysuuntaiset katkoviivat
      - Kunkin lajin syklotronitaajuus suhteessa kohteeseen.
    - *id003
  tof-residuals:
    title: Residuaalikuvan lukeminen
    summary: Data miinus yhden lajin sovite jokaisella skannatulla taajuudella.
    items:
    - - Pisteet virhepalkeilla
      - Residuaali (µs) ± keskivirhe. Hajonta nollan ympärillä tarkoittaa hyvää sovitetta; systemaattinen suunta viittaa toiseen lajiin tai väärään malliin.
    - - x-akseli
      - Sama poikkeama νRF − νc (Hz) kuin resonanssikuvassa.
  tof-distribution:
    title: TOF-jakauman lukeminen
    summary: 'Yksittäisten ionien lentoaikojen jakauma valitulla poikkeamalla: mitä ilmaisin kirjaa kustakin lajista.'
    items:
    - - Värilliset käyrät
      - Kunkin lajin todennäköisyystiheys populaatiopainolla skaalattuna; resonanssissa oleva laji saapuu aiemmin.
    - - Musta käyrä
      - Kaikkien lajien summa.
    - - x-akseli
      - Havaitun ionin lentoaika (µs).
  penning-trajectory:
    title: Penning-loukun radan lukeminen
    summary: 'Ionin radan projektio ideaalisessa Penning-loukussa: nopea muunneltu syklotroniliike hitaan magnetroniliikkeen päällä sekä aksiaalivärähtely.'
    items:
    - - ν₊, ν₋, νz
      - Muunneltu syklotroni-, magnetroni- ja aksiaalitaajuus; ν₊ + ν₋ = νc = qB/(2πm).
    - - Musta viiva
      - 'Ionin rata tähän asti (näkymä: päältä x–y, sivulta x–z tai 3D-projektio).'
    - - Punainen piste
      - Ionin nykyinen paikka.
    - - rp, rm, z
      - Syklotroni- ja magnetroniliikkeen säteet sekä aksiaaliamplitudi (mm) lomakkeen mukaan.
  rfq-design:
    title: Sauvasuunnittelun symbolit ja kaavat
    summary: Moninapaisessa ohjaimessa on N = 2n sauvaa; vierekkäisillä sauvoilla on vastakkaiset jännitteet. Lähellä akselia RF-potentiaali on puhdas moninapa. Yhden RF-jakson yli keskiarvoistettuna se sitoo ionin tehokkaaseen potentiaaliin; η kertoo, onko keskiarvoistus sallittu.
    items:
    - - N, n
      - N sauvaa (parillinen, 4–24); n = N/2 on moninapaisuuden kertaluku. N = 4 antaa n = 2 (kvadrupoli, Mathieun tapaus), N = 8 antaa n = 4 (oktupoli).
    - - Φ = (U + V cos Ωt)(r/r₀)ⁿ cos nθ
      - Sähköinen potentiaali voltteina etäisyydellä r akselista ja napakulmassa θ hetkellä t. Sauvan pinnalla (r = r₀, θ = 0) se on U + V cos Ωt; viereisellä sauvalla vastakkainen etumerkki.
    - - U, V
      - Sauvan tasajännite ja RF-huippujännite maahan nähden (V). Vierekkäisten sauvojen huippuero on 2V.
    - - Ω = 2πf
      - RF:n kulmataajuus; f on MHz:nä annettu taajuus.
    - - r₀, r
      - 'r₀: etäisyys akselilta sauvan pintaan (kenttäsäde). r: ionin etäisyys akselilta; lukemat lasketaan valitulla osuudella r/r₀.'
    - - Q, m
      - Ionin varaus Q = z·e ja massa m.
    - - '|E|'
      - RF-kentän amplitudi |E| = nV/r₀ · (r/r₀)ⁿ⁻¹ (V/m); kasvaa sauvoja kohti ja on nolla akselilla.
    - - U_eff
      - 'Tehokas (pseudo)potentiaali, yhden RF-jakson keskiarvoistuksen jälkeen jäävä sidontaenergia: U_eff = Q²|E|²/(4mΩ²) = Q²n²V²/(4mΩ²r₀²) · (r/r₀)²ⁿ⁻². Se kasvaa kuten r^(2n−2): paraabeli kvadrupolilla, korkeammilla n tasainen pohja ja jyrkät seinät.'
    - - η = 2|Q|n(n−1)V/(mΩ²r₀²) · (r/r₀)ⁿ⁻²
      - 'Adiabaattisuusparametri η = 2|Q|·|d|E|/dr|/(mΩ²): RF-voiman muutos matkalla, jonka ioni kulkee yhdessä RF-jaksossa, suhteessa voimaskaalaan mΩ². Pieni η: tasainen hidas liike ja pieni mikroliike, joten U_eff pätee. Suuri η: keskiarvoistus ei päde, mikroliike on suuri ja RF-lämmitys on mahdollinen. Neljällä sauvalla η on Mathieun parametri q.'
    - - η-tavoite
      - Oma rajasi η:lle lasketulla säteellä. η:aa käytetään, koska vain kvadrupolilla on Mathieun stabiilisuuskaavio; kun n > 2, liike ei ole Mathieun yhtälö, ja tavallinen suunnittelusääntö on η alle noin 0,3 (Gerlich 1992). Neljällä sauvalla se vastaa q ≈ 0,3 (oppikirjan jäähdytin-kasaajat (cooler-buncher) toimivat arvoilla q = 0,3–0,5; stabiilisuusraja on q = 0,908). Se on peukalosääntö, ei terävä raja. Ruutu näyttää η / tavoite, vihreä kun η ≤ tavoite.
    - - f_min, V_max
      - η skaalautuu kuten V/f². Annetulle V:lle f_min on pienin taajuus, jolla η ≤ tavoite; annetulle f:lle V_max on suurin RF-huippujännite.
    - - A₃ₙ/Aₙ
      - Pyöreiden sauvojen potentiaalin ensimmäinen ei-toivottu harmoninen suhteessa haluttuun (ks. sauvasuhteen sääntö).
  tof-hunt:
    title: Näin luet TOF-ICR-etsintäkuvaajaa
    summary: Ilmaisimelle saapuva keskimääräinen lentoaika RF-herätteen taajuuden funktiona; kuoppa osoittaa etsimäsi syklotroniresonanssin.
    items:
    - - Siniset pisteet ja virhepalkit
      - Kyseisellä taajuudella ammuttujen ionien keskimääräinen lentoaika ± keskivirhe.
    - - Oranssi katkoviiva
      - Liukusäätimellä asetettu RF-taajuus.
    - - Vihreä käyrä ja vyöhyke
      - 'Tähän mennessä kerättyjen laukausten sovite: sovitettu resonanssikäyrä ja vyöhykkeenä sen keskikohta ± epävarmuus.'
    - - Punainen viiva
      - Todellinen resonanssitaajuus, piirtyy vasta kun paljastat sen.
    - - Akselit
      - 'x: νRF − νc,ref (Hz), poikkeama vertailusyklotronitaajuudesta. y: keskimääräinen lentoaika (µs); pienempi arvo tarkoittaa, että enemmän radiaalienergiaa muuntui, eli ioni oli lähempänä resonanssia.'
    - - Teksti nurkassa
      - Ioni, kenttä B, vertailu-νc, herätysaika T_rf ja menetelmä sekä ionien ja laukausten määrä.
  mr-classic:
    title: Näin luet MR-TOF-pelin kuvaajia
    summary: 'Ylempi kuva: kahden ionin simuloidut lentoaikapiikit valitun kierrosmäärän jälkeen. Alempi kuva: erotuskyky kierrosten funktiona verrattuna siihen, mitä ioniparin erottaminen vaatii.'
    items:
    - - Siniset ja punaiset piikit
      - Ensimmäisen (sininen) ja toisen (punainen) ionin laskennat lokeroa kohti; kukin palkki saa lähemmän piikin keskikohdan värin.
    - - Violetti katkoviiva
      - Molempien piikkien summa, kun summaruutu on valittu.
    - - Δt, FWHM
      - Piikkien keskikohtien aikaero ja yhden piikin puoliarvoleveys, ns.
    - - x-akseli
      - Lentoaika suhteessa ensimmäiseen ioniin, TOF − t₁ (ns).
    - - Violetti käyrä (alempi kuva)
      - Erotuskyky R = t/(2·FWHM) kierrosmäärän funktiona; leveys kasvaa kierrosten mukana, joten R tasaantuu.
    - - Oranssi piste
      - R nykyisellä kierrosmäärällä.
    - - Punainen katkoviiva
      - 'Parin vaatima erotuskyky m/Δm: ((m₁ + m₂)/2)/|Δm|. Piikit erottuvat, kun violetti käyrä on sen yläpuolella.'
    - - log R
      - Valittuna pystyakselilla on log₁₀ R.
  rfq-classic:
    title: Näin luet RFQ-peliä
    summary: 'Vasemmalla: neljän sauvan poikkileikkaus ja simuloidut ionit. Oikealla: a–q-stabiilisuuskaavio ja kunkin ionilajin työpiste.'
    items:
    - - Punaiset ja siniset sauvat
      - Neljän sauvan napaisuus esitetyllä hetkellä (+ punainen, − sininen); vaihtuu joka puolen RF-jakson välein.
    - - Katkoviivaympyrä
      - 'Kenttäsäde r₀: etäisyys akselilta sauvan pintaan.'
    - - Pisteet ja ohuet viivat
      - Ionit ja niiden tuore rata, yksi väri lajia kohti.
    - - Kipinät
      - Ioni osui sauvaan ja menetettiin; valitun RF-jaksomäärän selviytyvät ionit lasketaan läpäisseiksi.
    - - Vihreä alue
      - Arvot q = 4zeV/(m r₀² Ω²) ja a = 8zeU/(m r₀² Ω²), joilla liike on rajoitettua molemmissa tasoissa.
    - - 0,908 ja kärki
      - Suurin stabiili q kohdassa a = 0 sekä alueen kärki, jossa vain kapea massaikkuna on stabiili.
    - - Katkoviiva
      - Tasa- ja RF-jännitteen asettama skannausviiva a/q = 2U/V; suurempi U/V kaventaa läpäisevää massaikkunaa.
    - - Värilliset pisteet
      - Kunkin ionilajin työpiste (q, a); kohdeionilla on rengas.
  pi-icr:
    title: Näin luet PI-ICR-kuvaajia
    summary: Paikkaherkkä ilmaisin tallentaa, mihin ionit osuvat keräysajan jälkeen; kunkin pisteen kulma on liikkeen vaihe.
    items:
    - - Suuri ympyrä
      - Ilmaisimen alue; katkoviivaristi on ilmaisimen keskipiste.
    - - Värilliset renkaat ja nimet
      - 'Kunkin lajin odotettu piste keräysajan jälkeen: kulma on kertynyt vaihe, renkaan säde on kaksi kertaa vaiheen leveys σ.'
    - - Pisteet tai pikselit
      - 'Simuloidut ionien osumat (pisteet, väri lajin mukaan; tumma: keskipisteen osumat, harmaa: vertailupisteen osumat) tai niiden 2D-histogrammi (pikselit).'
    - - Pieni ympyrä keskellä
      - Keskipiste, kulmien origo.
    - - Harmaa piste ja nimi
      - Vertailusijainti (ensimmäinen magnetronivaihe), kun näytetään.
    - - Kulmahistogrammi
      - Osumat napakulman (0–360°) funktiona; katkoviivat osoittavat lajien odotetut kulmat.
    - - min Δφ ajan t_acc funktiona
      - 'Fancier-välilehti: pienin vaihe-ero minkä tahansa kahden lajin välillä keräysajan funktiona; punainen katkoviiva on vaadittu erotus (σ-tavoite × tapahtumaleveys), pystyviivat ovat vertailtavat ajat.'
  penning-sim:
    title: Näin luet Penning-loukun liikekuvaa
    summary: 'Vasemmalla: näkymä magneettikentän suunnasta (x–y-taso). Oikealla: sivukuva, jossa aksiaalinen paikka.'
    items:
    - - Punainen piste
      - Ionin nykyinen paikka.
    - - Värillinen jälki
      - Tuore rata; haalenee vanhemmasta (sininen) uudempaan (magenta).
    - - Suuri ympyrä ja risti
      - Näyttöalueen reuna ja loukun akseli.
    - - Kaksi ympyrää yhtä aikaa
      - Nopea modifioitu syklotroniliike (ν₊, säde r₊) hitaan magnetroniliikkeen (ν₋, säde r₋) päällä.
    - - Sivukuva
      - Hyperboliset elektrodit (käyrät) ja ionin aksiaalinen paikka z kentän suunnassa.
    - - Liukusäätimet
      - r₊, r₋ ja aksiaaliamplitudi ovat prosentteja näytön mittakaavasta, eivät millimetrejä.
  penning-3d:
    title: Näin luet 3D-Penning-loukun näkymää
    summary: Ionien radat ihanteellisessa Penning-loukussa, magneettikenttä pystyakselin suuntaan; vedä pyörittääksesi, rulla zoomaa.
    items:
    - - B
      - Magneettikentän akseli (pystyviiva).
    - - Oranssit ja siniset ääriviivat
      - Rengaselektrodi (oranssi) ja päätyelektrodit (sininen), kun elektrodit näytetään.
    - - Harmaat pystyviivat
      - Magneettikentän kenttäviivat, kun ne näytetään.
    - - Värilliset jäljet
      - Kunkin ionin rata, haalenee vanhasta uuteen; usealla ionilla kullakin on oma värinsä.
    - - Punainen ääriviiva alla
      - PI-ICR:n kaltaisen ilmaisimen taso, jossa pisteet näyttävät ionien osumakohdat, kun ilmaisin näytetään.
  laser-cooling-figures:
    title: Näin luet laserjäähdytyksen kuvaajia
    summary: Atomijoukon yksiulotteinen Doppler-jäähdytys kahden vastakkaissuuntaisen lasersäteen välissä.
    items:
    - - Pilvi
      - Simuloitujen hiukkasten kaaviomaiset paikat, ei todellista geometriaa; väri kertoo nopeuden (sininen hidas, punainen nopea).
    - - Siniset palkit
      - Hiukkasnopeuksien histogrammi (laskennat).
    - - Ruusunpunainen käyrä
      - Kahden säteen normalisoitu laservoima F(v).
    - - Katkoviivat
      - v = 0 ja sieppausnopeudet ±v_c; nopeampia hiukkasia ei jäähdytetä tehokkaasti.
    - - Lämpötilakuvaaja
      - 'Joukon lämpötila ajan funktiona; katkoviivat ovat vertailut: Doppler-raja (vihreä), tasapainon teoria-arvo (ruskea) ja rekyylilämpötila (violetti).'
  penning-cooling-figures:
    title: Näin luet Penning-loukun laserjäähdytyskuvaajia
    summary: Ionin laserjäähdytys Penning-loukussa toimii vain, jos voimagradientti on magnetroni- ja syklotronitaajuuden välisessä ikkunassa.
    items:
    - - Vihreä vyöhyke
      - Ikkuna ν₋ … ν₊ logaritmisella taajuusakselilla.
    - - Nuoli
      - 'F′/(2π βr): voimagradientti jaettuna radiaalisella kitkakertoimella. Vyöhykkeen sisällä molemmat radiaalimoodit jäähtyvät; sen alapuolella magnetronimoodi lämpenee, yläpuolella syklotronimoodi lämpenee.'
    - - γ₋, γ₊, γz
      - Magnetroni-, syklotroni- ja aksiaaliamplitudin muutosnopeudet (s⁻¹); negatiivinen arvo tarkoittaa jäähtymistä.
    - - "z–y-projektio"
      - "Sama liike sivulta x:n suunnasta: aksiaalinen z y:n funktiona, omilla aksiaali- ja radiaalialueillaan."
    - - "Vaihetilakuvat"
      - "x nopeuttaan vₓ vastaan radiaaliliikkeelle (viimeiset kuusi syklotronijaksoa) ja z nopeuttaan v_z vastaan aksiaaliliikkeelle (viimeiset kolme aksiaalijaksoa); oranssi piste on nykyhetki. Jäähdytys kutistaa silmukat kohti keskustaa."
    - - Rata-, aksiaali- ja 3D-kuvat
      - Radiaalinen x–y-rata, aksiaalinen z–x-projektio ja fysikaalisen liikkeen 3D-projektio; 3D-akselit ovat punainen x, vihreä y, sininen z.
    - - Amplitudikuvaaja
      - Syklotroni-, magnetroni- ja aksiaaliliikkeen amplitudi ajan funktiona (log–log); katkoviivat merkitsevät 10 µm ja 0,1 s.
  neutral-cooling-figures:
    title: Näin luet neutraaliatomien jäähdytyskuvaajia
    summary: Neutraaliatomipilven numeerinen jäähdytys valitulla laserjäähdytysmenetelmällä; kaikki paneelit näyttävät samat simuloidut atomit.
    items:
    - - 3D-pilvi
      - Atomit yhtä mittakaavaisilla fysikaalisilla akseleilla (mm); punainen, vihreä ja sininen nuoli ovat x, y, z; harmaat ympyrät merkitsevät alkupaikat, kun ne näytetään; vedä tai rullaa pyörittääksesi ja zoomataksesi.
    - - 2D-projektio
      - Samat atomit näkymäasetuksissa valitulla tasolla.
    - - Lämpötila
      - 'Eloon jääneiden lämpötila keskitetystä nopeusvarianssista: kokonais-T (tumma), Tx (punainen), Ty (vihreä), Tz (sininen); kultainen katkoviiva on Doppler-lämpötilan mittakaava.'
    - - RMS-koko
      - Pilven neliökeskiarvokoko σx, σy, σz (mm).
    - - Keskipisteen nopeus
      - Pilven keskinopeus x-, y- ja z-suunnassa (m/s).
    - - Voimadiagnostiikka
      - Säteilypaineen voima valitulla akselilla paikan tai nopeuden funktiona, muut koordinaatit nollassa (10⁻²¹ N).
    - - Vaihetila
      - Paikka nopeuden funktiona valitulla akselilla, laboratorioarvot (mm, m/s).
  paul-cooling-figures:
    title: Näin luet Paul-loukun laserjäähdytyskuvaajia
    summary: Loukutettujen ionien Coulombin pilven numeerinen jäähdytys; kaikki paneelit näyttävät samat simuloidut ionit.
    items:
    - - 3D-projektio
      - Pyöritettävä 3D-näkymä µm-yksiköissä; punainen, vihreä ja sininen nuoli ovat x, y, z.
    - - x–y, z–x, y–z
      - Samojen ionien projektiot radiaali- ja aksiaalitasoille.
    - - Lämpötila
      - 'Keski-, x-, y- ja z-lämpötila (mK, logaritminen) keskitetyistä nopeusvariansseista; katkoviiva on Doppler-mittakaava ħΓ/(2k_B). Käyriä ei pakoteta laskemaan: potentiaalienergian vapautuminen ja mikroliike voivat lämmittää.'
    - - Vaihetila
      - x − keskiarvo(x) vastaan vₓ − keskiarvo(vₓ) (µm, m/s).
  rfq-design-inputs:
    title: Mitä suunnittelun syötteet tarkoittavat
    summary: Nämä kentät asettavat sauvojen geometrian ja RF-herätteen, jota alla oleva lukema arvioi. Arvot ovat otsikoiden yksiköissä (mm, V, MHz).
    items:
    - - Sauvoja
      - Pyöreiden sauvojen lukumäärä N, parillinen, 4–24. Neljä sauvaa on kvadrupoli (massasuodatin, jäähdytin, paketoija). Useampi sauva antaa tasaisemman pseudopotentiaalikuopan eikä Mathieun stabiilisuuskaaviota.
    - - Sauvan säteen sääntö
      - 'Miten sauvan säde ρ valitaan. Optimi: ensimmäinen ei-toivottu kenttäharmoninen A₃ₙ häviää. Kaarevuus: ρ = r₀/(n−1), sauva seuraa ihanteellisen kenttäviivan kaarevuutta kärjessään. Massasuodatin 1,128: neljän sauvan suodattimien tavallinen kompromissi. Oma suhde / oma säde: oma arvosi (oletussädettä ei ole).'
    - - Suhde r/r₀, säde
      - Sauvan säde jaettuna kenttäsäteellä r₀ ja sama säde millimetreinä. Muokattavissa vain omalla suhteella tai omalla säteellä; muilla säännöillä ne lasketaan r₀:sta.
    - - Sauvan halkaisijan toleranssi
      - Valinnainen sauvan halkaisijan valmistustoleranssi (mm). Se lisää lukemaan vain vastaavan ± muutoksen suhteeseen r/r₀.
    - - Arviointisäde r/r₀
      - 'Etäisyys akselilta r₀:n yksiköissä, jossa RF-kenttä, pseudopotentiaali, η ja ei-toivottu harmoninen arvioidaan: 0,5 on puolivälissä sauvan pintaan, 1 aukon reunalla.'
    - - η-tavoite
      - Adiabaattisuusparametrin η suunnitteluraja (tavallisesti 0,3; neljällä sauvalla η = q). Lukema kertoo, onko η arviointisäteellä sen alapuolella, ja antaa pienimmän taajuuden ja suurimman RF-jännitteen, jotka vielä täyttävät sen.
    - - RF-huippuehdokkaat
      - RF-huippujännitteet V voltteina (yksi sauva maahan), pilkuilla erotettuina. Jokaiselle luetellaan η, pseudopotentiaali ja neljällä sauvalla Mathieu-luokitus.
  mathieu-inputs:
    title: Mitä tutkijan syötteet tarkoittavat
    summary: Kartta näyttää, missä rajoitettu liike on olemassa dimensiottomien parametrien a (DC) ja q (RF) tasossa. Piste on alle kirjoitetun ionin toimintapiste.
    items:
    - - Geometria
      - 'Lineaarinen RFQ: nelisauvaisen kvadrupolin radiaaliliike, taso (a, q) ja sen peilikuva (−a, −q). 3D Paul-loukku: rengas- ja päätyelektrodiloukun aksiaaliset koordinaatit.'
    - - Valittu piste
      - 'RFQ-jännitteistä: a ja q lasketaan arvoista U, V, r₀, f ja ioni. Suorat a- ja q-arvot: kirjoita dimensiottomat arvot itse.'
    - - Vyöhykkeiden määrä
      - Kuinka monta stabiilisuusvyöhykettä (n = 0, 1, … enintään 6) väritetään; korkeammat vyöhykkeet ovat suuremmalla q:lla.
    - - q:n ja a:n rajat
      - Kartan rajat. Zoomipainikkeet, hiiren rulla ja vetäminen muuttavat niitä.
    - - Ionin massa, varausluku z
      - Ionin massa u-yksikössä ja varausluku z. “Täytä ionimassa” hakee massan luettelosta (AME2020 + NUBASE2020) yllä kirjoitetulle lajille.
    - - Sauvan DC-jännite U
      - 'Sauvaparin etumerkillinen DC-jännite (V): a = 8zeU/(m r₀² Ω²). U = 0 on pelkkää RF-käyttöä, a = 0.'
    - - Sauvan RF-huippu V
      - 'Yhden sauvan nollasta huippuun RF-jännite maahan nähden (viereisillä sauvoilla ±V): q = 4zeV/(m r₀² Ω²). Viereisten sauvojen huippuero on 2V.'
    - - Sisäsäde r₀
      - 'Kenttäsäde: etäisyys akselilta sauvan pintaan.'
    - - RF-taajuus f
      - Herätetaajuus MHz:nä; Ω = 2πf.
    - - Riippumattomat RFQ-osat
      - Jäähdyttimellä, massasuodattimella ja paketoijalla voi kullakin olla omat U, V, r₀ ja f; niiden toimintasuorat a = (2U/V)·q ja pisteet piirretään samaan karttaan.
  wb-species-input:
    title: Näin kirjoitat lajin
    summary: 'Jokainen laji on ioni: nuklidi, ydintila ja varaus, tai molekyyli. “Ydintila”-valikko luettelee kirjoitetun nuklidin perustilan ja kaikki isomeerit.'
    items:
    - - Nuklidi
      - 'Massaluku ja alkuaineen symboli: 133Xe (myös Xe133, Xe-133). Ionin massa on AME2020:n atomimassa miinus elektronien massat.'
    - - Isomeeri
      - Valitse “Ydintila”-valikosta tai kirjoita 133mXe tai 133Xem (molemmat tarkoittavat 133Xe:n ensimmäistä isomeeriä), 133Xe*, 133Xe[m], 133Xe[2]; myös m2Xe-tyyppiset numerot ja kirjaimet g m n p q r x i j käyvät. Näytetään muodossa 133Xem; virityksen energia E* lisätään massaan.
    - - Molekyyli
      - 'Isotoopit peräkkäin: 16O133Cs, 1H16O133Cs; 12C11 on yksitoista 12C-atomia. Kaksoispistemuoto tarkoilla lukumäärillä (lukumäärä, alkuaine, massaluku): 1O16:1Cs133, 1H1:2O16:1Cs133 = H + 2 ¹⁶O + ¹³³Cs, ja isomeeri jokaiselle osalle: 1H1:2O16:1mXe133 tai 1H1:2O16:1Xem133. Massa on atomimassojen summa (molekyylin sidosenergiat jätetty pois).'
    - - Varaus
      - 'Varauskenttä tai kirjoitettuna: 133Cs+2, 133Cs2+. Elektroneina: 133Cs-e poistaa yhden elektronin (näytetään 133Cs+), 133Cs-2e kaksi (133Cs2+); kaksoispistemuodossa 1O16:1Cs133:-e on 1O16:1Cs133:+. Negatiivinen ioni lisää elektroneja: 133Cs+e tai 133Cs- (näytetään 133Cs-); silloin Penning-loukku tarvitsee negatiivisen loukkujännitteen. Kokonaisluku 1–100; positiivinen varaus ei voi ylittää elektronien määrää.'
    - - Populaatio
      - 'Havaittu populaatio: lajin suhteellinen paino näytteessä; voi kirjoittaa myös 133Xe:30.'
    - - Massat
      - 'AME2020:n perustilan atomimassat ja NUBASE2020:n virityksen energiat; # merkitsee ekstrapoloitua arvoa. Avaa lajin alta “AME2020-massat ja energiat” nähdäksesi kaikki taulukoidut luvut.'
de:
  mathieu:
    title: So liest man das Mathieu-Stabilitätsdiagramm
    summary: Die radiale Bewegung eines Ions im linearen RFQ folgt w″ + (a − 2q cos 2τ) w = 0 mit τ = Ωt/2. Das Diagramm zeigt, bei welchen (q, a) die Bewegung beschränkt bleibt.
    items:
    - - q
      - RF-Parameter q = 4QV/(mΩ²r₀²); V ist die RF-Spitze je Stab (Nachbarstäbe ±V), Q die Ionenladung, m die Masse, Ω = 2πf.
    - - a
      - DC-Parameter a = 8QU/(mΩ²r₀²); U ist die Gleichspannung an den Stäben (Paare ±U). a = 0 ist reiner RF-Betrieb.
    - - Blaue Fläche
      - 'Erste Ebene: Die Bewegung in x bleibt bei (a, q) beschränkt.'
    - - Orange Fläche
      - 'Zweite Ebene: Die Bewegung in y bleibt beschränkt; ihre Parameter sind (−a, −q).'
    - - Grüne Fläche
      - 'Beide Ebenen stabil: Das ideale Feld bindet das Ion zweidimensional.'
    - - Schwarzer Punkt
      - Der gewählte Arbeitspunkt (q, a) für Ion, Masse, Ladung und Spannungen.
    - - Farbige Punkte und gestrichelte Linien
      - Arbeitspunkte der optionalen Abschnitte (Kühler, Massenfilter, Buncher). Jede gestrichelte Linie ist a = (2U/V) q für den Abschnitt; eine andere Masse verschiebt den Punkt entlang der Linie.
    - - Grenzen
      - 'Nur ideale Mathieu-Bewegung: keine Stöße, Raumladung, Randfelder oder gemessene Transmission.'
  rfq-geometry:
    title: So liest man die Stabgeometrie
    summary: Querschnitt von 2n runden Stäben um die Achse; benachbarte Stäbe tragen entgegengesetzte RF.
    items:
    - - r₀
      - 'Gestrichelter Kreis: Feldradius, Abstand von der Achse zur Stabfläche.'
    - - ρ
      - 'Stabradius = Verhältnis × r₀; das Verhältnis folgt der gewählten Regel (vier Stäbe: optimal 1,14511).'
    - - Blaue / rote Stäbe
      - Stäbe auf +V und −V (abwechselnd); die Zahl ist der Stabindex.
    - - Rc, D, g
      - Mittelpunkte bei Rc = r₀ + ρ; Mittenabstand D = 2Rc sin(π/N); Oberflächenspalt g = D − 2ρ.
  mr-spectrum:
    title: So liest man das MR-TOF-Spektrum
    summary: Simulierte Flugzeitpeaks nach der gewählten Rundenzahl für jede Spezies und jedes Isomer sowie ihre Summe.
    items:
    - - Farbige Kurven
      - Erwartete Zählungen je Bin für jede Spezies; Isomere tragen ihren Zustandsbuchstaben (133Xem). Die Fläche folgt dem Populationsgewicht.
    - - Schwarze Kurve
      - 'Gesamtprobe: Summe aller Spezies.'
    - - Graue Balken
      - Eine Zufallsstichprobe von Ionen aus derselben Verteilung (optionales Histogramm).
    - - Gestrichelte senkrechte Linien
      - Mittenzeit jeder Spezies.
    - - x-Achse
      - Flugzeit relativ zur ersten Spezies, t − t₁ (ns).
    - - FWHM
      - Volle Breite auf halber Höhe eines Peaks, aus Peakbreite und Verbreiterung pro Runde.
    - &id004
      - Legende
      - 'Nuklid + Zustandsbuchstabe, Ladung hochgestellt: 133Xe⁺ ist der Grundzustand, 133Xem⁺ das Isomer m (seine Anregungsenergie E* steht dabei), 133Xe²⁺ ein zweifach geladenes Ion.'
  mr-power:
    title: So liest man das Auflösungsdiagramm
    summary: Auflösungsvermögen jeder Spezies gegen die Rundenzahl, verglichen mit dem zur Trennung jedes Paars nötigen Wert.
    items:
    - - R
      - Auflösungsvermögen eines Peaks R = (m/q)/Δ(m/q); wächst mit der Rundenzahl.
    - - Durchgezogene Kurven
      - R jeder Spezies in den Farben der Legende.
    - - Gestrichelte Linien
      - 'Nötiges Auflösungsvermögen eines Paars: ((m₁/q₁ + m₂/q₂)/2) / |m₁/q₁ − m₂/q₂|.'
    - - Ablesen
      - Liegt eine durchgezogene Kurve über der gestrichelten Linie ihres Paars, sind die Peaks getrennt.
  mr-laps:
    title: So liest man das Abstands- und Breitendiagramm
    summary: Zeitabstand jedes Paars und Peakbreite bei wachsender Rundenzahl.
    items:
    - - '|Δt|'
      - 'Durchgezogen: Flugzeitdifferenz eines Paars (ns); wächst linear mit den Runden.'
    - - FWHM
      - 'Gestrichelt: Peakbreite (ns) einschließlich Verbreiterung pro Runde.'
    - - Getrennt
      - Ein Paar ist getrennt, sobald |Δt| die FWHM übersteigt.
  tof-resonance:
    title: So liest man die TOF-ICR-Resonanzkurve
    summary: Mittlere Flugzeit zum Detektor gegen die RF-Anregungsfrequenz; das Minimum markiert die Zyklotronresonanz jeder Spezies.
    items:
    - - x-Achse
      - 'νRF − νc der Zielspezies (Hz): Verstimmung der Anregung gegenüber ihrer Zyklotronfrequenz.'
    - - Farbige Kurven
      - Erwartete mittlere TOF jeder Spezies (Isomere mit Zustandsbuchstabe, 133Xem); die Breite des Minimums beträgt etwa 1/T bei Anregungszeit T (Fourier-Grenze).
    - - Schwarze Kurve
      - 'Mischung: populationsgewichtete mittlere TOF der gesamten Probe.'
    - - Punkte mit Fehlerbalken
      - 'Simulierte Messung: mittlere TOF ± Standardfehler bei jeder gescannten Frequenz.'
    - - Goldene gestrichelte Kurve
      - Ein-Spezies-Fit an die simulierten Daten; Mitte minus wahre Frequenz ist die Verschiebung.
    - - Gestrichelte senkrechte Linien
      - Zyklotronfrequenz jeder Spezies relativ zum Ziel.
    - *id004
  tof-residuals:
    title: So liest man das Residuendiagramm
    summary: Daten minus Ein-Spezies-Fit bei jeder gescannten Frequenz.
    items:
    - - Punkte mit Fehlerbalken
      - Residuum (µs) ± Standardfehler. Streuung um null bedeutet gute Anpassung; ein systematischer Trend deutet auf eine zweite Spezies oder ein falsches Modell.
    - - x-Achse
      - Gleiche Verstimmung νRF − νc (Hz) wie im Resonanzdiagramm.
  tof-distribution:
    title: So liest man die TOF-Verteilung
    summary: 'Verteilung der Einzelionen-Flugzeiten bei der gewählten Verstimmung: was der Detektor für jede Spezies aufzeichnet.'
    items:
    - - Farbige Kurven
      - Wahrscheinlichkeitsdichte jeder Spezies, mit dem Populationsgewicht skaliert; eine resonante Spezies kommt früher an.
    - - Schwarze Kurve
      - Summe über alle Spezies.
    - - x-Achse
      - Flugzeit eines detektierten Ions (µs).
  penning-trajectory:
    title: So liest man die Penningfallen-Bahn
    summary: 'Projektion der Ionenbahn in einer idealen Penningfalle: schnelle modifizierte Zyklotronbewegung über langsamer Magnetronbewegung plus Axialschwingung.'
    items:
    - - ν₊, ν₋, νz
      - Modifizierte Zyklotron-, Magnetron- und Axialfrequenz; ν₊ + ν₋ = νc = qB/(2πm).
    - - Schwarze Linie
      - 'Bisheriger Ionenweg (Ansicht: x–y von oben, x–z von der Seite oder 3D-Projektion).'
    - - Roter Punkt
      - Aktuelle Ionenposition.
    - - rp, rm, z
      - Radien der Zyklotron- und Magnetronbewegung sowie Axialamplitude (mm), wie im Formular eingestellt.
  rfq-design:
    title: Symbole und Formeln der Stabauslegung
    summary: Ein Multipolführungsfeld hat N = 2n Stäbe; benachbarte Stäbe tragen entgegengesetzte Spannungen. Nahe der Achse ist das HF-Potenzial ein reiner Multipol. Über eine HF-Periode gemittelt hält es das Ion in einem effektiven Potenzial; η sagt, ob diese Mittelung zulässig ist.
    items:
    - - N, n
      - N Stäbe (gerade, 4–24); n = N/2 ist die Multipolordnung. N = 4 ergibt n = 2 (Quadrupol, der Mathieu-Fall), N = 8 ergibt n = 4 (Oktupol).
    - - Φ = (U + V cos Ωt)(r/r₀)ⁿ cos nθ
      - Elektrisches Potenzial in Volt im Abstand r von der Achse und beim Polarwinkel θ zur Zeit t. Auf der Staboberfläche (r = r₀, θ = 0) ist es U + V cos Ωt; der nächste Stab hat das umgekehrte Vorzeichen.
    - - U, V
      - Gleichspannung und HF-Spitzenspannung eines Stabs gegen Masse (V). Zwischen Nachbarstäben beträgt die Spitzendifferenz 2V.
    - - Ω = 2πf
      - HF-Kreisfrequenz; f ist die in MHz eingegebene Frequenz.
    - - r₀, r
      - 'r₀: Abstand von der Achse zur Staboberfläche (Feldradius). r: Abstand des Ions von der Achse; die Anzeige gilt für den gewählten Anteil r/r₀.'
    - - Q, m
      - Ionenladung Q = z·e und Masse m.
    - - '|E|'
      - HF-Feldamplitude |E| = nV/r₀ · (r/r₀)ⁿ⁻¹ in V/m; sie wächst zu den Stäben hin und ist auf der Achse null.
    - - U_eff
      - 'Effektives (Pseudo-)Potenzial, die nach Mittelung über eine HF-Periode verbleibende Einschlussenergie: U_eff = Q²|E|²/(4mΩ²) = Q²n²V²/(4mΩ²r₀²) · (r/r₀)²ⁿ⁻². Es steigt wie r^(2n−2): parabolisch beim Quadrupol, bei höherem n flacher Boden mit steilen Wänden.'
    - - η = 2|Q|n(n−1)V/(mΩ²r₀²) · (r/r₀)ⁿ⁻²
      - 'Adiabasieparameter η = 2|Q|·|d|E|/dr|/(mΩ²): Änderung der HF-Kraft auf der Strecke, die das Ion in einer HF-Periode zurücklegt, relativ zur Kraftskala mΩ². Kleines η: glatte langsame Bewegung mit kleiner Mikrobewegung, U_eff gilt. Großes η: die Mittelung versagt, die Mikrobewegung ist groß, HF-Heizen ist möglich. Bei vier Stäben ist η gleich dem Mathieu-Parameter q.'
    - - η-Ziel
      - Ihre Grenze für η beim ausgewerteten Radius. Man nutzt η, weil nur der Quadrupol ein Mathieu-Stabilitätsdiagramm hat; für n > 2 ist die Bewegung keine Mathieu-Gleichung, und die übliche Auslegungsregel lautet η unter etwa 0,3 (Gerlich 1992). Bei vier Stäben entspricht das q ≈ 0,3 (das Lehrbuch betreibt Cooler-Buncher bei q = 0,3–0,5; die Stabilitätsgrenze liegt bei q = 0,908). Es ist eine Faustregel, keine scharfe Schwelle. Die Kachel zeigt η / Ziel, grün bei η ≤ Ziel.
    - - f_min, V_max
      - η skaliert wie V/f². Für Ihr V ist f_min die niedrigste Frequenz mit η ≤ Ziel; für Ihr f ist V_max die höchste HF-Spitzenspannung.
    - - A₃ₙ/Aₙ
      - Erste unerwünschte Harmonische des Rundstabpotenzials relativ zur gewünschten (siehe Regel für das Stabverhältnis).
  tof-hunt:
    title: So lesen Sie das TOF-ICR-Suchdiagramm
    summary: Mittlere Flugzeit zum Detektor gegen die HF-Anregungsfrequenz; das Minimum markiert die gesuchte Zyklotronresonanz.
    items:
    - - Blaue Punkte mit Balken
      - Mittlere Flugzeit ± Standardfehler der bei dieser Frequenz geschossenen Ionen.
    - - Orange gestrichelte Linie
      - Die mit dem Regler eingestellte HF-Frequenz.
    - - Grüne Kurve und Band
      - 'Anpassung an die bisherigen Schüsse: die angepasste Resonanzkurve und als Band ihr Zentrum ± Unsicherheit.'
    - - Rote Linie
      - Wahre Resonanzfrequenz, wird erst nach dem Aufdecken gezeichnet.
    - - Achsen
      - 'x: νRF − νc,ref (Hz), Verstimmung gegenüber der Referenz-Zyklotronfrequenz. y: mittlere Flugzeit (µs); ein kleinerer Wert heißt, mehr Radialenergie wurde umgewandelt, das Ion war näher an der Resonanz.'
    - - Text in der Ecke
      - Ion, Feld B, Referenz-νc, Anregungszeit T_rf mit Schema sowie Zahl der Ionen und Schüsse.
  mr-classic:
    title: So lesen Sie die Diagramme des MR-TOF-Spiels
    summary: 'Oberes Diagramm: simulierte Flugzeitpeaks der beiden Ionen nach der gewählten Rundenzahl. Unteres Diagramm: Auflösungsvermögen gegen Runden, verglichen mit dem Auflösungsvermögen, das das Paar braucht.'
    items:
    - - Blaue und rote Peaks
      - Zählungen je Bin des ersten (blau) und zweiten (rot) Ions; jeder Balken erhält die Farbe des näheren Peakzentrums.
    - - Violette gestrichelte Kurve
      - Summe beider Peaks, wenn das Summenfeld angekreuzt ist.
    - - Δt, FWHM
      - Zeitabstand der beiden Peakzentren und Halbwertsbreite eines Peaks in ns.
    - - x-Achse
      - Flugzeit relativ zum ersten Ion, TOF − t₁ (ns).
    - - Violette Kurve (unten)
      - Auflösungsvermögen R = t/(2·FWHM) gegen die Rundenzahl; die Breite wächst mit den Runden, daher flacht R ab.
    - - Oranger Punkt
      - R bei der aktuellen Rundenzahl.
    - - Rote gestrichelte Linie
      - 'Vom Paar benötigtes Auflösungsvermögen m/Δm: ((m₁ + m₂)/2)/|Δm|. Die Peaks trennen sich, sobald die violette Kurve darüber liegt.'
    - - log R
      - Angekreuzt zeigt die senkrechte Achse log₁₀ R.
  rfq-classic:
    title: So lesen Sie das RFQ-Spiel
    summary: 'Links: Querschnitt der vier Stäbe mit den simulierten Ionen. Rechts: das a–q-Stabilitätsdiagramm mit dem Arbeitspunkt jeder Ionenspezies.'
    items:
    - - Rote und blaue Stäbe
      - Polarität der vier Stäbe im gezeigten Moment (+ rot, − blau); sie wechselt alle halbe HF-Periode.
    - - Gestrichelter Kreis
      - 'Feldradius r₀: Abstand von der Achse zur Staboberfläche.'
    - - Punkte und dünne Linien
      - Ionen und ihr jüngster Weg, eine Farbe je Spezies.
    - - Funken
      - Ein Ion traf einen Stab und ist verloren; Ionen, die die gewählte Zahl HF-Zyklen überleben, gelten als transmittiert.
    - - Grüner Bereich
      - Werte von q = 4zeV/(m r₀² Ω²) und a = 8zeU/(m r₀² Ω²) mit beschränkter Bewegung in beiden Ebenen.
    - - 0,908 und Spitze
      - Größtes stabiles q bei a = 0 und die Spitze des Bereichs, wo nur ein schmales Massenfenster stabil ist.
    - - Gestrichelte Linie
      - Scanlinie a/q = 2U/V aus Gleich- und HF-Spannung; ein größeres U/V verengt das transmittierte Massenfenster.
    - - Farbige Punkte
      - Arbeitspunkt (q, a) jeder Ionenspezies; das Zielion hat einen Ring.
  pi-icr:
    title: So lesen Sie die PI-ICR-Diagramme
    summary: Ein ortsempfindlicher Detektor registriert, wo die Ionen nach der Akkumulationszeit landen; der Winkel jedes Flecks ist die Phase der Bewegung.
    items:
    - - Großer Kreis
      - Detektorfläche; das gestrichelte Kreuz ist die Detektormitte.
    - - Farbige Ringe und Beschriftungen
      - 'Erwarteter Fleck jeder Spezies nach der Akkumulationszeit: Der Winkel ist die akkumulierte Phase, der Ringradius das Doppelte der Phasenbreite σ.'
    - - Punkte oder Pixel
      - 'Simulierte Ionentreffer (Punkte, nach Spezies gefärbt; dunkel: Mittelpunktfleck, grau: Referenzfleck) oder ihr 2D-Histogramm (Pixel).'
    - - Kleiner Kreis in der Mitte
      - Mittelpunktfleck, Ursprung der Winkel.
    - - Grauer Punkt und Beschriftung
      - Referenzposition (erste Magnetronphase), wenn angezeigt.
    - - Winkelhistogramm
      - Treffer gegen den Polarwinkel (0–360°); gestrichelte Linien markieren den erwarteten Winkel jeder Spezies.
    - - min Δφ gegen t_acc
      - 'Fancier-Tab: kleinster Phasenunterschied zwischen zwei Spezies in Abhängigkeit von der Akkumulationszeit; die rote gestrichelte Linie ist die geforderte Trennung (σ-Ziel × Ereignisbreite), senkrechte Linien sind die verglichenen Zeiten.'
  penning-sim:
    title: So lesen Sie das Bewegungsbild der Penningfalle
    summary: 'Links: Blick entlang des Magnetfelds (x–y-Ebene). Rechts: Seitenansicht mit der axialen Position.'
    items:
    - - Roter Punkt
      - Aktuelle Ionenposition.
    - - Farbige Spur
      - Jüngster Weg; verblasst von älter (blau) zu neuer (magenta).
    - - Großer Kreis und Kreuz
      - Rand des Anzeigebereichs und die Fallenachse.
    - - Zwei Kreise gleichzeitig
      - Schnelle modifizierte Zyklotronbewegung (ν₊, Radius r₊) auf der langsamen Magnetronbewegung (ν₋, Radius r₋).
    - - Seitenansicht
      - Hyperbolische Elektroden (Kurven) mit der axialen Position z des Ions längs des Felds.
    - - Regler
      - r₊, r₋ und die Axialamplitude sind Prozent der Anzeigeskala, nicht Millimeter.
  penning-3d:
    title: So lesen Sie die 3D-Ansicht der Penningfalle
    summary: Ionenbahnen in einer idealen Penningfalle, Magnetfeld entlang der senkrechten Achse; Ziehen dreht, das Rad zoomt.
    items:
    - - B
      - Achse des Magnetfelds (senkrechte Linie).
    - - Orange und blaue Umrisse
      - Ringelektrode (orange) und Endkappen (blau), wenn Elektroden angezeigt werden.
    - - Graue senkrechte Linien
      - Magnetfeldlinien, wenn angezeigt.
    - - Farbige Spuren
      - Weg jedes Ions, von alt zu neu verblassend; bei mehreren Ionen hat jedes seine eigene Farbe.
    - - Roter Umriss unten
      - Ebene eines PI-ICR-ähnlichen Detektors mit Punkten, wo die Ionen auftreffen würden, wenn der Detektor angezeigt wird.
  laser-cooling-figures:
    title: So lesen Sie die Laserkühlungs-Diagramme
    summary: Eindimensionale Dopplerkühlung eines Atomensembles zwischen zwei gegenläufigen Laserstrahlen.
    items:
    - - Wolke
      - Schematische Positionen der simulierten Teilchen, keine echte Geometrie; die Farbe zeigt die Geschwindigkeit (blau langsam, rot schnell).
    - - Blaue Balken
      - Histogramm der Teilchengeschwindigkeiten (Zählungen).
    - - Rosa Kurve
      - Normierte Laserkraft F(v) der beiden Strahlen.
    - - Gestrichelte Linien
      - v = 0 und die Einfanggeschwindigkeiten ±v_c; schnellere Teilchen werden nicht effizient gekühlt.
    - - Temperaturdiagramm
      - Ensembletemperatur gegen die Zeit mit gestrichelten Referenzlinien für die Doppler-Grenze (grün), den theoretischen Gleichgewichtswert (braun) und die Rückstoßtemperatur (violett).
  penning-cooling-figures:
    title: So lesen Sie die Laserkühlungs-Diagramme der Penningfalle
    summary: Laserkühlung eines Ions in einer Penningfalle funktioniert nur, wenn der Kraftgradient im Fenster zwischen Magnetron- und Zyklotronfrequenz liegt.
    items:
    - - Grünes Band
      - Das Fenster ν₋ … ν₊ auf einer logarithmischen Frequenzachse.
    - - Pfeil
      - 'F′/(2π βr): Kraftgradient geteilt durch den radialen Reibungskoeffizienten. Im Band werden beide Radialmoden gekühlt; darunter wird die Magnetronmode geheizt, darüber die Zyklotronmode.'
    - - γ₋, γ₊, γz
      - Änderungsraten der Magnetron-, Zyklotron- und Axialamplitude (s⁻¹); ein negativer Wert bedeutet Kühlung.
    - - "z–y-Projektion"
      - "Dieselbe Bewegung von der Seite entlang x gesehen: axiales z gegen y, mit eigenen Axial- und Radialbereichen."
    - - "Phasenraumbilder"
      - "x gegen seine Geschwindigkeit vₓ für die Radialbewegung (letzte sechs Zyklotronperioden) und z gegen v_z für die Axialbewegung (letzte drei Axialperioden); der orange Punkt ist die aktuelle Zeit. Kühlung zieht die Schleifen zur Mitte zusammen."
    - - Bahn-, Axial- und 3D-Bilder
      - Radiale x–y-Bahn, axiale z–x-Projektion und 3D-Projektion der physikalischen Bewegung; die 3D-Achsen sind rot x, grün y, blau z.
    - - Amplitudendiagramm
      - Amplitude der Zyklotron-, Magnetron- und Axialbewegung gegen die Zeit (doppeltlogarithmisch); gestrichelte Linien markieren 10 µm und 0,1 s.
  neutral-cooling-figures:
    title: So lesen Sie die Diagramme zur Kühlung neutraler Atome
    summary: Numerische Kühlung einer Wolke neutraler Atome mit der gewählten Laserkühlmethode; jedes Feld zeigt dieselben simulierten Atome.
    items:
    - - 3D-Wolke
      - Atome mit gleich skalierten physikalischen Achsen (mm); rote, grüne und blaue Pfeile sind x, y, z; graue Kreise markieren die Anfangspositionen, wenn angezeigt; Ziehen oder Rad dreht und zoomt.
    - - 2D-Projektion
      - Dieselben Atome auf der in den Ansichtseinstellungen gewählten Ebene.
    - - Temperatur
      - 'Temperatur der Überlebenden aus der zentrierten Geschwindigkeitsvarianz: gesamt T (dunkel), Tx (rot), Ty (grün), Tz (blau); die goldene gestrichelte Linie ist die Doppler-Temperaturskala.'
    - - RMS-Größe
      - Quadratisch gemittelte Wolkengröße σx, σy, σz (mm).
    - - Schwerpunktgeschwindigkeit
      - Mittlere Geschwindigkeit der Wolke längs x, y, z (m/s).
    - - Kraftdiagnose
      - Strahlungsdruckkraft längs der gewählten Achse gegen Ort oder Geschwindigkeit, übrige Koordinaten null (10⁻²¹ N).
    - - Phasenraum
      - Ort gegen Geschwindigkeit längs der gewählten Achse, Laborwerte (mm, m/s).
  paul-cooling-figures:
    title: So lesen Sie die Laserkühlungs-Diagramme der Paulfalle
    summary: Numerische Kühlung einer Coulomb-Wolke gespeicherter Ionen; jedes Feld zeigt dieselben simulierten Ionen.
    items:
    - - 3D-Projektion
      - Drehbare 3D-Ansicht in µm; rote, grüne und blaue Pfeile sind x, y, z.
    - - x–y, z–x, y–z
      - Projektionen derselben Ionen auf die radiale und die axialen Ebenen.
    - - Temperatur
      - 'Mittlere, x-, y- und z-Temperatur (mK, logarithmisch) aus den zentrierten Geschwindigkeitsvarianzen; die gestrichelte Linie ist die Doppler-Skala ħΓ/(2k_B). Die Kurven werden nicht zum Fallen gezwungen: Freisetzung potenzieller Energie und Mikrobewegung können heizen.'
    - - Phasenraum
      - x − Mittelwert(x) gegen vₓ − Mittelwert(vₓ) (µm, m/s).
  rfq-design-inputs:
    title: Was die Auslegungseingaben bedeuten
    summary: Diese Felder legen die Stabgeometrie und den HF-Antrieb fest, die die Anzeige darunter auswertet. Werte stehen in den Einheiten der Beschriftungen (mm, V, MHz).
    items:
    - - Stabzahl
      - Zahl der Rundstäbe N, gerade, 4–24. Vier Stäbe sind ein Quadrupol (Massenfilter, Cooler, Buncher). Mehr Stäbe geben eine flachere Pseudopotenzialmulde und kein Mathieu-Stabilitätsdiagramm.
    - - Regel für den Stabradius
      - 'Wie der Stabradius ρ gewählt wird. Optimal: die erste unerwünschte Feldharmonische A₃ₙ verschwindet. Krümmung: ρ = r₀/(n−1), der Stab folgt am Scheitel der Krümmung der idealen Feldlinie. Massenfilter 1,128: der übliche Kompromiss für Vierstabfilter. Eigenes Verhältnis / eigener Radius: Ihr Wert (es gibt keinen Standardradius).'
    - - Verhältnis r/r₀, Radius
      - Stabradius geteilt durch den Feldradius r₀ und derselbe Radius in mm. Nur bei eigenem Verhältnis oder eigenem Radius editierbar; sonst werden sie aus r₀ berechnet.
    - - Toleranz des Stabdurchmessers
      - Optionale Fertigungstoleranz des Stabdurchmessers (mm). Sie fügt der Anzeige nur die entsprechende ±-Änderung von r/r₀ hinzu.
    - - Auswerteradius r/r₀
      - 'Abstand von der Achse in Einheiten von r₀, bei dem HF-Feld, Pseudopotenzial, η und die unerwünschte Harmonische ausgewertet werden: 0,5 ist halbe Strecke zur Staboberfläche, 1 der Rand der Apertur.'
    - - η-Ziel
      - Auslegungsgrenze für den Adiabasieparameter η (üblich 0,3; bei vier Stäben η = q). Die Anzeige sagt, ob η am Auswerteradius darunter liegt, und nennt die niedrigste Frequenz und höchste HF-Spannung, die es noch erfüllen.
    - - Kandidaten für die HF-Spitze
      - HF-Spitzenspannungen V in Volt (ein Stab gegen Masse), durch Kommas getrennt. Jede wird mit η, Pseudopotenzial und bei vier Stäben mit ihrer Mathieu-Klassifikation aufgeführt.
  mathieu-inputs:
    title: Was die Eingaben des Explorers bedeuten
    summary: Die Karte zeigt, wo beschränkte Bewegung in der Ebene der dimensionslosen Parameter a (Gleichspannung) und q (HF) existiert. Der Punkt ist der Arbeitspunkt des unten eingetragenen Ions.
    items:
    - - Geometrie
      - 'Linearer RFQ: Radialbewegung eines Vierstab-Quadrupols, Ebene (a, q) und ihr Spiegelbild (−a, −q). 3D-Paul-Falle: axiale Koordinaten einer Ring-Endkappen-Falle.'
    - - Ausgewählter Punkt
      - 'Aus RFQ-Spannungen: a und q werden aus U, V, r₀, f und dem Ion berechnet. a und q direkt: dimensionslose Werte selbst eintragen.'
    - - Anzahl der Bänder
      - Wie viele Stabilitätsbänder (n = 0, 1, … bis 6) schattiert werden; höhere Bänder liegen bei größerem q.
    - - Grenzen von q und a
      - Plotgrenzen der Karte. Zoomtasten, Mausrad und Ziehen ändern sie.
    - - Ionenmasse, Ladungszahl z
      - Masse des Ions in u und seine Ladungszahl z. „Ionenmasse eintragen“ holt die Masse aus dem Katalog (AME2020 + NUBASE2020) für die oben eingetragene Spezies.
    - - Stab-Gleichspannung U
      - 'Vorzeichenbehaftete Gleichspannung des Stabpaars (V): a = 8zeU/(m r₀² Ω²). U = 0 ist reiner HF-Betrieb, a = 0.'
    - - Stab-HF-Spitze V
      - 'Null-Spitze-HF-Spannung eines Stabs gegen Masse (Nachbarstäbe tragen ±V): q = 4zeV/(m r₀² Ω²). Die Spitzendifferenz zwischen Nachbarstäben ist 2V.'
    - - Innenradius r₀
      - 'Feldradius: Abstand von der Achse zur Staboberfläche.'
    - - RF-Frequenz f
      - Antriebsfrequenz in MHz; Ω = 2πf.
    - - Unabhängige RFQ-Abschnitte
      - Cooler, Massenfilter und Buncher können je eigene U, V, r₀ und f haben; ihre Betriebsgeraden a = (2U/V)·q und Punkte werden in dieselbe Karte gezeichnet.
  wb-species-input:
    title: So geben Sie eine Spezies ein
    summary: 'Jede Spezies ist ein Ion: Nuklid, Kernzustand und Ladung, oder ein Molekül. Das Menü „Kernzustand“ listet Grundzustand und alle Isomere des eingegebenen Nuklids.'
    items:
    - - Nuklid
      - 'Massenzahl und Elementsymbol: 133Xe (auch Xe133, Xe-133). Die Ionenmasse ist die AME2020-Atommasse minus die Elektronenmassen.'
    - - Isomer
      - In „Kernzustand“ wählen oder 133mXe bzw. 133Xem (beides das erste Isomer von 133Xe), 133Xe*, 133Xe[m], 133Xe[2] eingeben; auch Nummern wie m2Xe und die Buchstaben g m n p q r x i j funktionieren. Angezeigt als 133Xem; die Anregungsenergie E* wird zur Masse addiert.
    - - Molekül
      - 'Isotope nacheinander: 16O133Cs, 1H16O133Cs; 12C11 sind elf 12C-Atome. Doppelpunktform mit expliziten Anzahlen (Anzahl, Element, Massenzahl): 1O16:1Cs133, 1H1:2O16:1Cs133 = H + 2 ¹⁶O + ¹³³Cs, und ein Isomer je Bestandteil: 1H1:2O16:1mXe133 oder 1H1:2O16:1Xem133. Die Masse ist die Summe der Atommassen (molekulare Bindungsenergien weggelassen).'
    - - Ladung
      - 'Feld Ladung oder eingetippt: 133Cs+2, 133Cs2+. Per Elektronen: 133Cs-e entfernt ein Elektron (angezeigt als 133Cs+), 133Cs-2e zwei (133Cs2+); in Doppelpunktform wird 1O16:1Cs133:-e zu 1O16:1Cs133:+. Negative Ionen nehmen Elektronen auf: 133Cs+e oder 133Cs- (angezeigt als 133Cs-); eine Penningfalle braucht dann eine negative Fallenspannung. Ganzzahl 1–100; eine positive Ladung kann die Elektronenzahl nicht überschreiten.'
    - - Population
      - 'Detektierte Population: relatives Gewicht der Spezies in der Probe; auch als 133Xe:30 eintippbar.'
    - - Massen
      - 'AME2020-Grundzustandsmassen plus NUBASE2020-Anregungsenergien; # kennzeichnet extrapolierte Werte. Unter einer Spezies „AME2020-Massen und Energien“ öffnen, um alle tabellierten Zahlen zu sehen.'
ja:
  mathieu:
    title: マシュー安定性図の見方
    summary: 線形 RFQ 中のイオンの径方向運動は w″ + (a − 2q cos 2τ) w = 0（τ = Ωt/2）に従います。この図は、運動が有界になる (q, a) を示します。
    items:
    - - q
      - RF パラメータ q = 4QV/(mΩ²r₀²)。V は各ロッドの RF 波高（隣り合うロッドは ±V）、Q は電荷、m は質量、Ω = 2πf。
    - - a
      - 直流パラメータ a = 8QU/(mΩ²r₀²)。U はロッドの直流電圧（対で ±U）。a = 0 は純 RF です。
    - - 青い領域
      - 第一平面：(a, q) で x 方向の運動が有界。
    - - 橙色の領域
      - 第二平面：y 方向の運動が有界。パラメータは (−a, −q)。
    - - 緑の領域
      - 両平面が安定：理想場がイオンを二次元で閉じ込めます。
    - - 黒い点
      - 選択したイオン・質量・電荷・電圧の動作点 (q, a)。
    - - 色付きの点と破線
      - 任意区間（クーラー、質量フィルター、バンチャー）の動作点。各破線はその区間の a = (2U/V) q で、イオン質量を変えると点は線上を動きます。
    - - 限界
      - 理想的なマシュー運動のみ。衝突・空間電荷・端部電場・実測透過は含みません。
  rfq-geometry:
    title: ロッド配置図の見方
    summary: 軸の周りの 2n 本の円形ロッドの断面。隣り合うロッドは逆極性の RF。
    items:
    - - r₀
      - 破線の円：場の半径（軸からロッド表面までの距離）。
    - - ρ
      - ロッド半径 = 比 × r₀。比はフォームで選んだ規則に従います（4 本の最適値は 1.14511）。
    - - 青／赤のロッド
      - +V と −V のロッド（交互）。数字はロッド番号。
    - - Rc, D, g
      - 中心は Rc = r₀ + ρ。隣接中心間隔 D = 2Rc sin(π/N)、表面間隔 g = D − 2ρ。
  mr-spectrum:
    title: MR-TOF スペクトルの見方
    summary: 選んだ周回数後の、各核種・アイソマーとその合計のシミュレーション飛行時間ピーク。
    items:
    - - 色付きの曲線
      - 各核種のビンあたり期待カウント。アイソマーは状態の文字を付けて表します（133Xem）。面積は存在比に比例。
    - - 黒い曲線
      - 合成試料：全核種の和。
    - - 灰色の棒
      - 同じ分布から抽出した乱数イオン標本（任意のヒストグラム）。
    - - 縦の破線
      - 各核種の中心時間。
    - - 横軸
      - 最初の核種に対する飛行時間 t − t₁（ns）。
    - - FWHM
      - ピークの半値全幅。ピーク幅と周回あたりの広がりから求めます。
    - &id005
      - 凡例
      - 核種 + 状態の文字、電荷は上付き：133Xe⁺ は基底状態、133Xem⁺ はアイソマー m（励起エネルギー E* を併記）、133Xe²⁺ は 2 価のイオンです。
  mr-power:
    title: 分解能プロットの見方
    summary: 周回数に対する各核種の分解能と、各ペアの分離に必要な値。
    items:
    - - R
      - ピークの分解能 R = (m/q)/Δ(m/q)。周回数とともに増加します。
    - - 実線
      - 各核種の R（凡例の色）。
    - - 破線
      - ペアに必要な分解能：((m₁/q₁ + m₂/q₂)/2) / |m₁/q₁ − m₂/q₂|。
    - - 読み方
      - 実線がそのペアの破線を上回る周回数で、2 つのピークは分離されます。
  mr-laps:
    title: 間隔と幅のプロットの見方
    summary: 周回数に対する各ペアの時間間隔とピーク幅。
    items:
    - - '|Δt|'
      - 実線：ペアの飛行時間差（ns）。周回数に比例して増加。
    - - FWHM
      - 破線：ピーク幅（ns）。周回あたりの広がりを含みます。
    - - 分離
      - '|Δt| が FWHM を超えると、そのペアは分離されます。'
  tof-resonance:
    title: TOF-ICR 共鳴曲線の見方
    summary: RF 励起周波数に対する検出器までの平均飛行時間。谷が各核種のサイクロトロン共鳴を示します。
    items:
    - - 横軸
      - νRF − νc（対象核種、Hz）：励起周波数のサイクロトロン周波数からのずれ。
    - - 色付きの曲線
      - 各核種の期待平均 TOF（アイソマーは状態の文字付き、133Xem）。谷の幅は励起時間 T に対し約 1/T（フーリエ限界）。
    - - 黒い曲線
      - 混合：存在比で重み付けした試料全体の平均 TOF。
    - - 誤差棒付きの点
      - 模擬測定：各走査周波数での平均 TOF ± 標準誤差。
    - - 金色の破線
      - 模擬データへの単一核種フィット。中心と真の周波数の差がバイアス。
    - - 縦の破線
      - 目標に対する各核種のサイクロトロン周波数。
    - *id005
  tof-residuals:
    title: 残差プロットの見方
    summary: 各走査周波数でのデータ − 単一核種フィット。
    items:
    - - 誤差棒付きの点
      - 残差（µs）± 標準誤差。0 付近のばらつきはフィットが良いこと、系統的な傾向は第 2 の核種やモデルの誤りを示します。
    - - 横軸
      - 共鳴図と同じ離調 νRF − νc（Hz）。
  tof-distribution:
    title: TOF 分布の見方
    summary: 選択した離調での単一イオン飛行時間の分布。各核種について検出器が記録するもの。
    items:
    - - 色付きの曲線
      - 存在比で重み付けした各核種の確率密度。共鳴している核種は早く到達します。
    - - 黒い曲線
      - 全核種の和。
    - - 横軸
      - 検出イオンの飛行時間（µs）。
  penning-trajectory:
    title: ペニング・トラップ軌道の見方
    summary: 理想ペニング・トラップ中のイオン軌道の射影。遅いマグネトロン運動に速い修正サイクロトロン運動が重なり、軸方向振動も加わります。
    items:
    - - ν₊, ν₋, νz
      - 修正サイクロトロン・マグネトロン・軸方向周波数。ν₊ + ν₋ = νc = qB/(2πm)。
    - - 黒い線
      - これまでのイオン経路（上面 x–y、側面 x–z、3D 射影）。
    - - 赤い点
      - 現在のイオン位置。
    - - rp, rm, z
      - サイクロトロン・マグネトロン運動の半径と軸方向振幅（mm）。フォームで設定。
  rfq-design:
    title: ロッド設計の記号と式
    summary: 多重極ガイドには N = 2n 本のロッドがあり、隣り合うロッドには逆の電圧がかかります。軸の近くでは高周波ポテンシャルは純粋な多重極です。高周波 1 周期で平均すると、イオンは有効ポテンシャルに閉じ込められます。この平均化が許されるかどうかを示すのが η です。
    items:
    - - N, n
      - N はロッド本数（偶数、4–24）、n = N/2 は多重極の次数です。N = 4 なら n = 2（四重極、Mathieu の場合）、N = 8 なら n = 4（八重極）。
    - - Φ = (U + V cos Ωt)(r/r₀)ⁿ cos nθ
      - 軸からの距離 r、極角 θ、時刻 t における電位（V）。ロッド表面（r = r₀, θ = 0）では U + V cos Ωt で、隣のロッドは符号が逆です。
    - - U, V
      - ロッドの対地直流電圧と高周波ピーク電圧（V）。隣り合うロッド間のピーク差は 2V です。
    - - Ω = 2πf
      - 高周波の角周波数。f は MHz で入力した周波数です。
    - - r₀, r
      - r₀：軸からロッド表面までの距離（場の半径）。r：イオンの軸からの距離。表示値は選んだ r/r₀ で計算されます。
    - - Q, m
      - イオンの電荷 Q = z·e と質量 m。
    - - '|E|'
      - 高周波電場の振幅 |E| = nV/r₀ · (r/r₀)ⁿ⁻¹（V/m）。ロッドに近づくほど大きく、軸上では 0 です。
    - - U_eff
      - 有効（擬）ポテンシャル。高周波 1 周期で平均した後に残る閉じ込めエネルギー：U_eff = Q²|E|²/(4mΩ²) = Q²n²V²/(4mΩ²r₀²) · (r/r₀)²ⁿ⁻²。r^(2n−2) で増加し、四重極では放物線、次数が高いと底が平らで壁が急になります。
    - - η = 2|Q|n(n−1)V/(mΩ²r₀²) · (r/r₀)ⁿ⁻²
      - 断熱パラメータ η = 2|Q|·|d|E|/dr|/(mΩ²)：イオンが高周波 1 周期に動く距離での高周波力の変化を、力のスケール mΩ² と比べた量です。η が小さい：滑らかな低速運動と小さなマイクロモーションで、U_eff が成り立ちます。η が大きい：平均化が破れ、マイクロモーションが大きくなり高周波加熱が起こり得ます。ロッド 4 本では η は Mathieu パラメータ q に等しくなります。
    - - η の目標値
      - 評価半径での η の上限として自分で決める値です。η を使うのは、Mathieu の安定図があるのは四重極だけで、n > 2 の運動は Mathieu 方程式ではないためです。通常の設計目安は η を約 0.3 未満にすること（Gerlich 1992）。ロッド 4 本では q ≈ 0.3 に相当します（教科書ではクーラー・バンチャーを q = 0.3–0.5 で運転し、安定限界は q = 0.908）。厳密なしきい値ではなく経験則です。タイルには η / 目標が表示され、η ≤ 目標なら緑になります。
    - - f_min, V_max
      - η は V/f² に比例します。現在の V で η ≤ 目標となる最低の f が f_min、現在の f での最大の高周波ピーク電圧が V_max です。
    - - A₃ₙ/Aₙ
      - 円形ロッドの電位に含まれる最初の不要な高調波の、所望成分に対する比（ロッド比の規則を参照）。
  tof-hunt:
    title: TOF-ICR 探索プロットの見方
    summary: 検出器への平均飛行時間を高周波励起周波数に対して示します。谷が探しているサイクロトロン共鳴です。
    items:
    - - 青い点とエラーバー
      - その周波数で打ち込んだイオンの平均飛行時間 ± 標準誤差。
    - - 橙色の破線
      - スライダーで現在設定している高周波の周波数。
    - - 緑の曲線と帯
      - ここまでの測定へのフィット：フィットした共鳴曲線と、帯で示す中心 ± 不確かさ。
    - - 赤い線
      - 真の共鳴周波数。答えを表示したときだけ描かれます。
    - - 軸
      - x：νRF − νc,ref（Hz）、基準サイクロトロン周波数からのずれ。y：平均飛行時間（µs）。値が小さいほど動径方向エネルギーがよく変換され、共鳴に近いことを意味します。
    - - 隅の文字
      - イオン、磁場 B、基準 νc、励起時間 T_rf と方式、イオン数とショット数。
  mr-classic:
    title: MR-TOF ゲームのプロットの見方
    summary: 上：選んだ周回数後の 2 種のイオンの飛行時間ピーク（模擬）。下：周回数に対する分解能と、このペアに必要な分解能の比較。
    items:
    - - 青と赤のピーク
      - 1 つ目（青）と 2 つ目（赤）のイオンのビンごとのカウント。各棒は近い方のピーク中心の色になります。
    - - 紫の破線
      - 「合計」を選んだときの両ピークの和。
    - - Δt, FWHM
      - 2 つのピーク中心の時間差と、1 つのピークの半値全幅（ns）。
    - - x 軸
      - 1 つ目のイオンを基準にした飛行時間 TOF − t₁（ns）。
    - - 紫の曲線（下）
      - 分解能 R = t/(2·FWHM) と周回数。幅も周回数とともに増えるので R は頭打ちになります。
    - - 橙の点
      - 現在の周回数での R。
    - - 赤の破線
      - このペアに必要な分解能 m/Δm：((m₁ + m₂)/2)/|Δm|。紫の曲線がこれを超えるとピークが分離します。
    - - log R
      - オンにすると縦軸が log₁₀ R になります。
  rfq-classic:
    title: RFQ ゲームの見方
    summary: 左：4 本のロッドの断面と模擬イオン。右：a–q 安定図と各イオン種の動作点。
    items:
    - - 赤と青のロッド
      - 表示した瞬間の 4 本のロッドの極性（+ 赤、− 青）。高周波の半周期ごとに入れ替わります。
    - - 破線の円
      - 場の半径 r₀：軸からロッド表面までの距離。
    - - 点と細い線
      - イオンと最近の軌跡。イオン種ごとに 1 色。
    - - 火花
      - イオンがロッドに当たって失われた印。選んだ高周波サイクル数を生き延びたイオンは透過とみなします。
    - - 緑の領域
      - 両方の面で運動が有界になる q = 4zeV/(m r₀² Ω²) と a = 8zeU/(m r₀² Ω²) の範囲。
    - - 0.908 と頂点
      - a = 0 で安定な最大の q と、狭い質量窓だけが安定な領域の頂点。
    - - 破線
      - 直流と高周波の電圧で決まる走査線 a/q = 2U/V。U/V が大きいほど通る質量窓が狭くなります。
    - - 色付きの点
      - 各イオン種の動作点 (q, a)。ターゲットのイオンには輪が付きます。
  pi-icr:
    title: PI-ICR プロットの見方
    summary: 位置感応型検出器が蓄積時間後のイオンの着地点を記録します。各スポットの角度が運動の位相です。
    items:
    - - 大きな円
      - 検出器の領域。破線の十字が検出器の中心です。
    - - 色付きの輪とラベル
      - 蓄積時間後の各イオン種の予想スポット：角度は蓄積した位相、輪の半径は位相幅 σ の 2 倍です。
    - - 点またはピクセル
      - 模擬したイオンの着弾（点、イオン種ごとの色。濃色：中心スポット、灰色：基準スポット）またはその 2 次元ヒストグラム（ピクセル）。
    - - 中心の小さな円
      - 中心スポット。角度の原点です。
    - - 灰色の点とラベル
      - 基準位置（最初のマグネトロン位相）。表示したときのみ。
    - - 角度ヒストグラム
      - 極角（0–360°）ごとの着弾数。破線は各イオン種の予想角度です。
    - - min Δφ と t_acc
      - Fancier タブ：蓄積時間に対する、任意の 2 種の間の最小位相差。赤の破線は必要な分離（σ 目標 × イベント幅）、縦線は比較した時刻です。
  penning-sim:
    title: ペニングトラップの運動プロットの見方
    summary: 左：磁場方向から見た図（x–y 面）。右：軸方向の位置を示す側面図。
    items:
    - - 赤い点
      - イオンの現在位置。
    - - 色付きの軌跡
      - 最近の経路。古い（青）から新しい（マゼンタ）へ色が変わります。
    - - 大きな円と十字
      - 表示範囲の縁とトラップの軸。
    - - 2 つの円を同時に
      - 速い修正サイクロトロン運動（ν₊、半径 r₊）が遅いマグネトロン運動（ν₋、半径 r₋）に重なっています。
    - - 側面図
      - 双曲面電極（曲線）と、磁場方向のイオンの軸方向位置 z。
    - - スライダー
      - r₊、r₋、軸方向の振幅は表示スケールに対する百分率で、ミリメートルではありません。
  penning-3d:
    title: 3D ペニングトラップ表示の見方
    summary: 理想的なペニングトラップ内のイオンの経路。磁場は鉛直軸に沿います。ドラッグで回転、ホイールで拡大縮小。
    items:
    - - B
      - 磁場の軸（鉛直の線）。
    - - 橙と青の輪郭
      - 電極を表示したとき：リング電極（橙）とエンドキャップ（青）。
    - - 灰色の鉛直線
      - 表示したときの磁力線。
    - - 色付きの軌跡
      - 各イオンの経路。古いものから新しいものへ薄れていきます。複数のイオンではそれぞれ別の色です。
    - - 下の赤い輪郭
      - 検出器を表示したとき：PI-ICR 風の検出器面と、イオンが当たる位置の点。
  laser-cooling-figures:
    title: レーザー冷却プロットの見方
    summary: 互いに逆向きの 2 本のレーザー光の間での、原子集団の 1 次元ドップラー冷却。
    items:
    - - 雲
      - 模擬粒子の模式的な位置で、実際の配置ではありません。色は速さ（青が遅く、赤が速い）。
    - - 青い棒
      - 粒子速度のヒストグラム（カウント）。
    - - ピンクの曲線
      - 2 本のビームによる規格化したレーザー力 F(v)。
    - - 破線
      - v = 0 と捕獲速度 ±v_c。それより速い粒子は効率よく冷却されません。
    - - 温度のプロット
      - 集団の温度の時間変化。破線は基準で、ドップラー限界（緑）、定常状態の理論値（茶）、反跳温度（紫）。
  penning-cooling-figures:
    title: ペニングトラップのレーザー冷却プロットの見方
    summary: ペニングトラップ中のイオンのレーザー冷却は、力の勾配がマグネトロン周波数とサイクロトロン周波数の間の窓に入っているときだけ働きます。
    items:
    - - 緑の帯
      - 対数周波数軸上の窓 ν₋ … ν₊。
    - - 矢印
      - F′/(2π βr)：力の勾配を動径方向の摩擦係数で割った値。帯の中では両方の動径モードが冷却され、下回るとマグネトロンモードが、上回るとサイクロトロンモードが加熱されます。
    - - γ₋, γ₊, γz
      - マグネトロン、サイクロトロン、軸方向の振幅の変化率（s⁻¹）。負の値は冷却を意味します。
    - - "z–y 投影"
      - "x 方向から見た同じ運動：軸方向 z 対 y。軸方向と径方向の範囲はそれぞれ独立です。"
    - - "位相空間のプロット"
      - "径方向運動の x 対速度 vₓ（直近 6 サイクロトロン周期）と、軸方向運動の z 対 v_z（直近 3 軸方向周期）。橙色の点が現在時刻です。冷却するとループが中心へ縮みます。"
    - - 軌道・軸方向・3D のプロット
      - 動径方向 x–y 軌道、軸方向 z–x 投影、実際の運動の 3D 投影。3D の軸は赤が x、緑が y、青が z。
    - - 振幅のプロット
      - サイクロトロン、マグネトロン、軸方向の運動の振幅の時間変化（両対数）。破線は 10 µm と 0.1 s。
  neutral-cooling-figures:
    title: 中性原子冷却プロットの見方
    summary: 選んだレーザー冷却方式による中性原子雲の数値冷却。どのパネルも同じ模擬原子を表示します。
    items:
    - - 3D の雲
      - 等しい物理スケールの軸（mm）。赤・緑・青の矢印は x・y・z。表示時は灰色の円が初期位置。ドラッグまたはホイールで回転・拡大縮小。
    - - 2D 投影
      - 同じ原子を、表示設定で選んだ面に投影したもの。
    - - 温度
      - 重心を引いた速度分散から求めた生き残りの温度：全体 T（濃色）、Tx（赤）、Ty（緑）、Tz（青）。金色の破線はドップラー温度の目安です。
    - - RMS サイズ
      - 雲の二乗平均サイズ σx、σy、σz（mm）。
    - - 重心速度
      - 雲の x、y、z 方向の平均速度（m/s）。
    - - 力の診断
      - 選んだ軸に沿った輻射圧力を位置または速度に対して示したもの。他の座標は 0（10⁻²¹ N）。
    - - 位相空間
      - 選んだ軸の位置と速度（実験室系の値、mm と m/s）。
  paul-cooling-figures:
    title: ポールトラップのレーザー冷却プロットの見方
    summary: 捕捉イオンのクーロン結晶（雲）の数値冷却。どのパネルも同じ模擬イオンを表示します。
    items:
    - - 3D 投影
      - µm 単位で回転できる 3D 表示。赤・緑・青の矢印は x・y・z。
    - - x–y, z–x, y–z
      - 同じイオンを動径面と軸方向の面に投影したもの。
    - - 温度
      - 重心を引いた速度分散から求めた平均・x・y・z の温度（mK、対数軸）。破線はドップラーの目安 ħΓ/(2k_B)。曲線は下がるとは限りません。位置エネルギーの解放やマイクロモーションで加熱することがあります。
    - - 位相空間
      - x − 平均(x) と vₓ − 平均(vₓ)（µm、m/s）。
  rfq-design-inputs:
    title: 設計の入力項目の意味
    summary: これらの項目は、下の表示が評価するロッドの形状と高周波の駆動条件を決めます。値は各ラベルの単位（mm、V、MHz）です。
    items:
    - - ロッド数
      - 円形ロッドの本数 N（偶数、4–24）。4 本は四重極（質量フィルター、クーラー、バンチャー）。本数が多いほど擬ポテンシャルの井戸は平らになり、Mathieu の安定図はありません。
    - - ロッド半径の規則
      - ロッド半径 ρ の決め方。最適：最初の不要な場の高調波 A₃ₙ が 0 になる。曲率：ρ = r₀/(n−1)、先端で理想的な場の線の曲率に合わせる。質量フィルター 1.128：4 本フィルターで一般的な妥協値。自分の比／半径：入力した値を使います（既定の半径はありません）。
    - - 比 r/r₀、半径
      - ロッド半径を場の半径 r₀ で割った値と、同じ半径の mm 値。「自分の比」「自分の半径」の規則でのみ編集でき、他の規則では r₀ から計算されます。
    - - ロッド直径の公差
      - ロッド直径の任意の加工公差（mm）。表示に、対応する r/r₀ の ± の変化を加えるだけです。
    - - 評価半径 r/r₀
      - 高周波の場、擬ポテンシャル、η、不要な高調波を評価する軸からの距離（r₀ 単位）。0.5 はロッド表面までの半分、1 は開口の縁です。
    - - η の目標値
      - 断熱パラメータ η の設計上限（通常 0.3、4 本では η = q）。評価半径での η がそれ以下かどうかを示し、それを満たす最低周波数と最大の高周波電圧を表示します。
    - - 候補 RF ピーク
      - RF ピーク電圧 V（V、ロッド 1 本の対地）をカンマ区切りで入力。各値について η、擬ポテンシャル、4 本の場合は Mathieu 分類を表示します。
  mathieu-inputs:
    title: エクスプローラーの入力項目の意味
    summary: マップは、無次元パラメータ a（直流）と q（高周波）の平面で有界な運動が存在する場所を示します。点は下で指定したイオンの動作点です。
    items:
    - - 形状
      - 線形 RFQ：4 本ロッド四重極の動径方向の運動。平面 (a, q) とその鏡像 (−a, −q)。3次元パウルトラップ：リングとエンドキャップのトラップの軸方向座標。
    - - 選択点
      - RFQ 電圧から計算：U、V、r₀、f とイオンから a と q を求めます。a、q を直接入力：無次元の値を自分で入力します。
    - - 安定帯の数
      - 塗り分ける安定帯の数（n = 0, 1, …、最大 6）。高い帯ほど大きな q にあります。
    - - q と a の範囲
      - マップの表示範囲。ズームボタン、マウスホイール、ドラッグで変わります。
    - - イオン質量、電荷数 z
      - イオンの質量（u）と電荷数 z。「イオン質量を入力」は、上の欄のイオン種の質量をカタログ（AME2020 + NUBASE2020）から取得します。
    - - ロッドの直流電圧 U
      - ロッド対の符号付き直流電圧（V）：a = 8zeU/(m r₀² Ω²)。U = 0 は高周波のみの運転で a = 0。
    - - ロッドの RF ピーク V
      - ロッド 1 本の対地ゼロ・ピーク高周波電圧（隣り合うロッドは ±V）：q = 4zeV/(m r₀² Ω²)。隣り合うロッド間のピーク差は 2V です。
    - - 内接半径 r₀
      - 場の半径：軸からロッド表面までの距離。
    - - RF 周波数 f
      - 駆動周波数（MHz）。Ω = 2πf。
    - - 独立した RFQ 区間
      - クーラー、質量フィルター、バンチャーはそれぞれ独自の U、V、r₀、f を持てます。動作直線 a = (2U/V)·q と点は同じマップに描かれます。
  wb-species-input:
    title: イオン種の入力方法
    summary: 各イオン種は、核種・核状態・電荷、または分子で指定します。「核状態」メニューには、入力した核種の基底状態とすべてのアイソマーが並びます。
    items:
    - - 核種
      - 質量数と元素記号：133Xe（Xe133、Xe-133 も可）。イオン質量は AME2020 の原子質量から電子質量を引いたものです。
    - - アイソマー
      - 「核状態」で選ぶか、133mXe または 133Xem（どちらも 133Xe の最初のアイソマー）、133Xe*、133Xe[m]、133Xe[2] と入力します。m2Xe のような番号や文字 g m n p q r x i j も使えます。133Xem と表示され、励起エネルギー E* が質量に加わります。
    - - 分子
      - 同位体を続けて書きます：16O133Cs、1H16O133Cs。12C11 は 12C が 11 個。個数を明示するコロン形式（個数・元素・質量数）：1O16:1Cs133、1H1:2O16:1Cs133 = H + 2 個の ¹⁶O + ¹³³Cs、構成要素ごとのアイソマーも指定できます：1H1:2O16:1mXe133 または 1H1:2O16:1Xem133。質量は原子質量の和（分子の結合エネルギーは省略）。
    - - 電荷
      - 「電荷」欄で設定するか入力します：133Cs+2、133Cs2+。電子数で：133Cs-e は電子 1 個を取り除く（133Cs+ と表示）、133Cs-2e は 2 個（133Cs2+）。コロン形式では 1O16:1Cs133:-e が 1O16:1Cs133:+ になります。負イオンは電子を加えます：133Cs+e または 133Cs-（133Cs- と表示）。このときペニングトラップには負のトラップ電圧が必要です。1–100 の整数で、正の電荷は電子数を超えられません。
    - - 存在量
      - 検出される存在量：試料中のそのイオン種の相対的な重み。133Xe:30 のように入力することもできます。
    - - 質量
      - AME2020 の基底状態の原子質量に NUBASE2020 の励起エネルギーを加えたもの。# は外挿値。各イオン種の下の「AME2020 の質量とエネルギー」を開くと、表のすべての数値が見られます。
fr:
  mathieu:
    title: Lire le diagramme de stabilité de Mathieu
    summary: Le mouvement radial d’un ion dans un RFQ linéaire obéit à w″ + (a − 2q cos 2τ) w = 0 avec τ = Ωt/2. Le diagramme montre les (q, a) donnant un mouvement borné.
    items:
    - - q
      - Paramètre RF q = 4QV/(mΩ²r₀²) ; V est la crête RF sur chaque barreau (barreaux voisins ±V), Q la charge, m la masse, Ω = 2πf.
    - - a
      - 'Paramètre continu a = 8QU/(mΩ²r₀²) ; U est la tension continue sur les barreaux (paires ±U). a = 0 : RF pur.'
    - - Zone bleue
      - 'Premier plan : le mouvement selon x est borné en (a, q).'
    - - Zone orange
      - 'Second plan : le mouvement selon y est borné ; ses paramètres sont (−a, −q).'
    - - Zone verte
      - 'Les deux plans sont stables : le champ idéal confine l’ion en deux dimensions.'
    - - Point noir
      - Le point de fonctionnement (q, a) de l’ion, de la masse, de la charge et des tensions choisis.
    - - Points colorés et lignes pointillées
      - Points de fonctionnement des sections facultatives (refroidisseur, filtre de masse, groupeur). Chaque ligne pointillée est a = (2U/V) q ; changer la masse déplace le point le long de la ligne.
    - - Limites
      - 'Mouvement de Mathieu idéal seulement : ni collisions, ni charge d’espace, ni champs de bord, ni transmission mesurée.'
  rfq-geometry:
    title: Lire le schéma de géométrie des barreaux
    summary: Coupe de 2n barreaux ronds autour de l’axe ; les barreaux voisins portent une RF opposée.
    items:
    - - r₀
      - 'Cercle pointillé : rayon de champ, distance de l’axe à la surface du barreau.'
    - - ρ
      - Rayon du barreau = rapport × r₀ ; le rapport suit la règle choisie (optimal 1,14511 pour quatre barreaux).
    - - Barreaux bleus / rouges
      - Barreaux à +V et −V (en alternance) ; le nombre est l’indice du barreau.
    - - Rc, D, g
      - Centres à Rc = r₀ + ρ ; distance entre centres voisins D = 2Rc sin(π/N) ; jeu de surface g = D − 2ρ.
  mr-spectrum:
    title: Lire le spectre MR-TOF
    summary: Pics de temps de vol simulés après le nombre de tours choisi, pour chaque espèce et isomère et pour leur somme.
    items:
    - - Courbes colorées
      - Comptages attendus par canal pour chaque espèce ; les isomères portent leur lettre d’état (133Xem). L’aire suit le poids de population.
    - - Courbe noire
      - 'Échantillon combiné : somme de toutes les espèces.'
    - - Barres grises
      - Un échantillon aléatoire d’ions tiré de la même distribution (histogramme facultatif).
    - - Lignes verticales pointillées
      - Temps central de chaque espèce.
    - - Axe x
      - Temps de vol par rapport à la première espèce, t − t₁ (ns).
    - - FWHM
      - Largeur totale à mi-hauteur d’un pic, d’après la largeur du pic et l’élargissement par tour.
    - &id006
      - Légende
      - 'Nucléide + lettre d’état, charge en exposant : 133Xe⁺ est l’état fondamental, 133Xem⁺ l’isomère m (son énergie d’excitation E* est indiquée), 133Xe²⁺ un ion doublement chargé.'
  mr-power:
    title: Lire le graphique du pouvoir de résolution
    summary: Pouvoir de résolution de chaque espèce en fonction du nombre de tours, comparé à la valeur requise pour séparer chaque paire.
    items:
    - - R
      - Pouvoir de résolution d’un pic R = (m/q)/Δ(m/q) ; il croît avec le nombre de tours.
    - - Courbes pleines
      - R de chaque espèce, aux couleurs de la légende.
    - - Lignes pointillées
      - 'Pouvoir de résolution requis pour une paire : ((m₁/q₁ + m₂/q₂)/2) / |m₁/q₁ − m₂/q₂|.'
    - - Lecture
      - Là où une courbe pleine dépasse la ligne pointillée de sa paire, les deux pics sont résolus.
  mr-laps:
    title: Lire le graphique séparation et largeur
    summary: Écart temporel de chaque paire et largeur du pic quand le nombre de tours augmente.
    items:
    - - '|Δt|'
      - 'Courbes pleines : différence de temps de vol d’une paire (ns) ; croît linéairement avec les tours.'
    - - FWHM
      - 'Courbe pointillée : largeur du pic (ns), élargissement par tour inclus.'
    - - Résolu
      - Une paire est séparée dès que |Δt| dépasse la FWHM.
  tof-resonance:
    title: Lire la courbe de résonance TOF-ICR
    summary: Temps de vol moyen vers le détecteur en fonction de la fréquence RF ; le creux marque la résonance cyclotron de chaque espèce.
    items:
    - - Axe x
      - 'νRF − νc de l’espèce cible (Hz) : désaccord de l’excitation par rapport à sa fréquence cyclotron.'
    - - Courbes colorées
      - TOF moyen attendu de chaque espèce (isomères avec leur lettre d’état, 133Xem) ; la largeur du creux vaut environ 1/T pour le temps d’excitation T (limite de Fourier).
    - - Courbe noire
      - 'Mélange : TOF moyen pondéré par les populations de tout l’échantillon.'
    - - Points avec barres
      - 'Mesure simulée : TOF moyen ± erreur standard à chaque fréquence balayée.'
    - - Courbe dorée pointillée
      - Ajustement à une espèce des données simulées ; son centre moins la fréquence vraie est le biais.
    - - Lignes verticales pointillées
      - Fréquence cyclotron de chaque espèce relative à la cible.
    - *id006
  tof-residuals:
    title: Lire le graphique des résidus
    summary: Données moins ajustement à une espèce à chaque fréquence balayée.
    items:
    - - Points avec barres
      - Résidu (µs) ± erreur standard. Une dispersion autour de zéro indique un bon ajustement ; une tendance systématique révèle une seconde espèce ou un mauvais modèle.
    - - Axe x
      - Même désaccord νRF − νc (Hz) que le graphique de résonance.
  tof-distribution:
    title: Lire la distribution TOF
    summary: 'Distribution des temps de vol d’ions individuels au désaccord choisi : ce que le détecteur enregistre pour chaque espèce.'
    items:
    - - Courbes colorées
      - Densité de probabilité de chaque espèce, pondérée par sa population ; une espèce résonnante arrive plus tôt.
    - - Courbe noire
      - Somme sur toutes les espèces.
    - - Axe x
      - Temps de vol d’un ion détecté (µs).
  penning-trajectory:
    title: Lire la trajectoire du piège de Penning
    summary: 'Projection de la trajectoire d’un ion dans un piège de Penning idéal : mouvement cyclotron modifié rapide sur la dérive magnétron lente, plus l’oscillation axiale.'
    items:
    - - ν₊, ν₋, νz
      - Fréquences cyclotron modifiée, magnétron et axiale ; ν₊ + ν₋ = νc = qB/(2πm).
    - - Ligne noire
      - 'Trajet de l’ion jusqu’ici (vue : x–y de dessus, x–z de côté ou projection 3D).'
    - - Point rouge
      - Position actuelle de l’ion.
    - - rp, rm, z
      - Rayons des mouvements cyclotron et magnétron et amplitude axiale (mm), réglés dans le formulaire.
  rfq-design:
    title: Symboles et formules de la conception des barreaux
    summary: Un guide multipolaire a N = 2n barreaux ; deux barreaux voisins portent des tensions opposées. Près de l’axe, le potentiel RF est un multipôle pur. Moyenné sur une période RF, il confine l’ion dans un pseudo-potentiel ; η indique si cette moyenne est permise.
    items:
    - - N, n
      - N barreaux (pair, 4–24) ; n = N/2 est l’ordre du multipôle. N = 4 donne n = 2 (quadrupôle, le cas de Mathieu), N = 8 donne n = 4 (octupôle).
    - - Φ = (U + V cos Ωt)(r/r₀)ⁿ cos nθ
      - Potentiel électrique en volts à la distance r de l’axe et à l’angle polaire θ, au temps t. À la surface d’un barreau (r = r₀, θ = 0), il vaut U + V cos Ωt ; le barreau suivant a le signe opposé.
    - - U, V
      - Tension continue et tension RF crête d’un barreau par rapport à la masse (V). Entre barreaux voisins, la différence crête est 2V.
    - - Ω = 2πf
      - Pulsation RF ; f est la fréquence saisie en MHz.
    - - r₀, r
      - 'r₀ : distance de l’axe à la surface du barreau (rayon de champ). r : distance de l’ion à l’axe ; les valeurs affichées sont calculées à la fraction r/r₀ choisie.'
    - - Q, m
      - Charge de l’ion Q = z·e et masse m.
    - - '|E|'
      - Amplitude du champ RF |E| = nV/r₀ · (r/r₀)ⁿ⁻¹ en V/m ; elle croît vers les barreaux et s’annule sur l’axe.
    - - U_eff
      - 'Pseudo-potentiel, l’énergie de confinement qui reste après moyenne sur une période RF : U_eff = Q²|E|²/(4mΩ²) = Q²n²V²/(4mΩ²r₀²) · (r/r₀)²ⁿ⁻². Il croît comme r^(2n−2) : parabolique pour un quadrupôle, fond plat et parois raides pour n plus grand.'
    - - η = 2|Q|n(n−1)V/(mΩ²r₀²) · (r/r₀)ⁿ⁻²
      - 'Paramètre d’adiabaticité η = 2|Q|·|d|E|/dr|/(mΩ²) : variation de la force RF sur la distance parcourue par l’ion pendant une période RF, comparée à l’échelle de force mΩ². η petit : mouvement lent et régulier avec une faible micro-oscillation, U_eff est valable. η grand : la moyenne échoue, la micro-oscillation est grande et un chauffage RF est possible. Avec quatre barreaux, η est égal au paramètre de Mathieu q.'
    - - Cible de η
      - Votre limite pour η au rayon évalué. On utilise η car seul le quadrupôle possède un diagramme de stabilité de Mathieu ; pour n > 2 le mouvement n’obéit pas à l’équation de Mathieu, et la règle de conception usuelle est η inférieur à environ 0,3 (Gerlich 1992). Avec quatre barreaux, cela correspond à q ≈ 0,3 (le manuel fait fonctionner les cooler-bunchers à q = 0,3–0,5 ; la limite de stabilité est q = 0,908). C’est une règle empirique, pas un seuil net. La tuile affiche η / cible, verte quand η ≤ cible.
    - - f_min, V_max
      - η varie comme V/f². Pour votre V, f_min est la fréquence minimale avec η ≤ cible ; pour votre f, V_max est la tension RF crête maximale.
    - - A₃ₙ/Aₙ
      - Première harmonique indésirable du potentiel de barreaux ronds, relative à l’harmonique utile (voir la règle du rapport de barreau).
  tof-hunt:
    title: Lire le graphique de recherche TOF-ICR
    summary: Temps de vol moyen jusqu’au détecteur en fonction de la fréquence d’excitation RF ; le creux marque la résonance cyclotron recherchée.
    items:
    - - Points bleus avec barres
      - Temps de vol moyen ± erreur standard des ions envoyés à cette fréquence.
    - - Ligne orange pointillée
      - La fréquence RF réglée avec le curseur.
    - - Courbe et bande vertes
      - 'Ajustement des tirs déjà effectués : la courbe de résonance ajustée et, en bande, son centre ± incertitude.'
    - - Ligne rouge
      - Fréquence de résonance réelle, tracée seulement après la révélation.
    - - Axes
      - 'x : νRF − νc,ref (Hz), désaccord par rapport à la fréquence cyclotron de référence. y : temps de vol moyen (µs) ; une valeur plus basse signifie plus d’énergie radiale convertie, donc un ion plus proche de la résonance.'
    - - Texte dans le coin
      - Ion, champ B, νc de référence, temps d’excitation T_rf et schéma, nombre d’ions et de tirs.
  mr-classic:
    title: Lire les graphiques du jeu MR-TOF
    summary: 'Graphique du haut : pics de temps de vol simulés des deux ions après le nombre de tours choisi. Graphique du bas : pouvoir de résolution en fonction des tours, comparé à celui qu’exige la paire.'
    items:
    - - Pics bleu et rouge
      - Comptages par canal du premier ion (bleu) et du second (rouge) ; chaque barre prend la couleur du centre de pic le plus proche.
    - - Courbe violette pointillée
      - Somme des deux pics, quand la case somme est cochée.
    - - Δt, FWHM
      - Écart de temps entre les centres des deux pics et largeur à mi-hauteur d’un pic, en ns.
    - - Axe x
      - Temps de vol relatif au premier ion, TOF − t₁ (ns).
    - - Courbe violette (bas)
      - Pouvoir de résolution R = t/(2·FWHM) selon le nombre de tours ; la largeur croît avec les tours, donc R se stabilise.
    - - Point orange
      - R au nombre de tours actuel.
    - - Ligne rouge pointillée
      - 'Pouvoir de résolution m/Δm exigé par la paire : ((m₁ + m₂)/2)/|Δm|. Les pics se séparent quand la courbe violette passe au-dessus.'
    - - log R
      - Cochée, l’axe vertical montre log₁₀ R.
  rfq-classic:
    title: Lire le jeu RFQ
    summary: 'À gauche : coupe des quatre barreaux avec les ions simulés. À droite : diagramme de stabilité a–q avec le point de fonctionnement de chaque espèce.'
    items:
    - - Barreaux rouges et bleus
      - Polarité des quatre barreaux à l’instant montré (+ rouge, − bleu) ; elle s’inverse toutes les demi-périodes RF.
    - - Cercle pointillé
      - 'Rayon de champ r₀ : distance de l’axe à la surface du barreau.'
    - - Points et traits fins
      - Ions et leur trajet récent, une couleur par espèce.
    - - Étincelles
      - Un ion a heurté un barreau et est perdu ; les ions qui survivent au nombre de cycles RF choisi comptent comme transmis.
    - - Zone verte
      - Valeurs de q = 4zeV/(m r₀² Ω²) et a = 8zeU/(m r₀² Ω²) pour lesquelles le mouvement est borné dans les deux plans.
    - - 0,908 et pointe
      - Plus grand q stable à a = 0, et pointe de la zone où seule une étroite fenêtre de masse est stable.
    - - Ligne pointillée
      - Droite de balayage a/q = 2U/V fixée par les tensions continue et RF ; un U/V plus grand rétrécit la fenêtre de masse transmise.
    - - Points colorés
      - Point de fonctionnement (q, a) de chaque espèce ; l’ion cible porte un anneau.
  pi-icr:
    title: Lire les graphiques PI-ICR
    summary: Un détecteur sensible à la position enregistre où les ions arrivent après le temps d’accumulation ; l’angle de chaque tache est la phase du mouvement.
    items:
    - - Grand cercle
      - Surface du détecteur ; la croix pointillée est son centre.
    - - Anneaux colorés et étiquettes
      - 'Tache attendue de chaque espèce après le temps d’accumulation : l’angle est la phase accumulée, le rayon de l’anneau vaut deux fois la largeur de phase σ.'
    - - Points ou pixels
      - 'Impacts d’ions simulés (points, colorés par espèce ; sombre : tache centrale, gris : tache de référence) ou leur histogramme 2D (pixels).'
    - - Petit cercle au centre
      - Tache centrale, origine des angles.
    - - Point gris et étiquette
      - Position de référence (première phase magnétron), si affichée.
    - - Histogramme des angles
      - Impacts selon l’angle polaire (0–360°) ; les lignes pointillées marquent l’angle attendu de chaque espèce.
    - - min Δφ selon t_acc
      - 'Onglet fancier : plus petit écart de phase entre deux espèces selon le temps d’accumulation ; la ligne rouge pointillée est la séparation requise (cible σ × largeur d’événement), les lignes verticales sont les temps comparés.'
  penning-sim:
    title: Lire le graphique du mouvement dans le piège de Penning
    summary: 'À gauche : vue le long du champ magnétique (plan x–y). À droite : vue de côté avec la position axiale.'
    items:
    - - Point rouge
      - Position actuelle de l’ion.
    - - Traînée colorée
      - Trajet récent ; elle passe de l’ancien (bleu) au récent (magenta).
    - - Grand cercle et croix
      - Bord de la zone affichée et axe du piège.
    - - Deux cercles à la fois
      - Mouvement cyclotron modifié rapide (ν₊, rayon r₊) superposé au lent mouvement magnétron (ν₋, rayon r₋).
    - - Vue de côté
      - Électrodes hyperboliques (courbes) avec la position axiale z de l’ion le long du champ.
    - - Curseurs
      - r₊, r₋ et l’amplitude axiale sont des pourcentages de l’échelle d’affichage, pas des millimètres.
  penning-3d:
    title: Lire la vue 3D du piège de Penning
    summary: Trajectoires d’ions dans un piège de Penning idéal, champ magnétique selon l’axe vertical ; glisser pour tourner, molette pour zoomer.
    items:
    - - B
      - Axe du champ magnétique (ligne verticale).
    - - Contours orange et bleus
      - Électrode annulaire (orange) et chapeaux d’extrémité (bleu), quand les électrodes sont affichées.
    - - Lignes verticales grises
      - Lignes de champ magnétique, si affichées.
    - - Traînées colorées
      - Trajet de chaque ion, de l’ancien au récent ; avec plusieurs ions, chacun a sa couleur.
    - - Contour rouge en bas
      - Plan d’un détecteur de type PI-ICR avec des points là où les ions le toucheraient, si le détecteur est affiché.
  laser-cooling-figures:
    title: Lire les graphiques de refroidissement laser
    summary: Refroidissement Doppler à une dimension d’un ensemble d’atomes entre deux faisceaux laser opposés.
    items:
    - - Nuage
      - Positions schématiques des particules simulées, pas une géométrie réelle ; la couleur indique la vitesse (bleu lent, rouge rapide).
    - - Barres bleues
      - Histogramme des vitesses des particules (comptages).
    - - Courbe rose
      - Force laser normalisée F(v) des deux faisceaux.
    - - Lignes pointillées
      - v = 0 et vitesses de capture ±v_c ; les particules plus rapides ne sont pas refroidies efficacement.
    - - Graphique de température
      - 'Température de l’ensemble en fonction du temps, avec des lignes de référence pointillées : limite Doppler (vert), valeur théorique stationnaire (brun) et température de recul (violet).'
  penning-cooling-figures:
    title: Lire les graphiques de refroidissement laser du piège de Penning
    summary: Le refroidissement laser d’un ion dans un piège de Penning ne fonctionne que si le gradient de force est dans la fenêtre entre les fréquences magnétron et cyclotron.
    items:
    - - Bande verte
      - La fenêtre ν₋ … ν₊ sur un axe de fréquence logarithmique.
    - - Flèche
      - 'F′/(2π βr) : gradient de force divisé par le coefficient de friction radial. Dans la bande, les deux modes radiaux sont refroidis ; en dessous le mode magnétron chauffe, au-dessus le mode cyclotron chauffe.'
    - - γ₋, γ₊, γz
      - Taux de variation des amplitudes magnétron, cyclotron et axiale (s⁻¹) ; une valeur négative signifie un refroidissement.
    - - "Projection z–y"
      - "Le même mouvement vu de côté le long de x : z axial en fonction de y, avec ses propres plages axiale et radiale."
    - - "Espaces des phases"
      - "x en fonction de sa vitesse vₓ pour le mouvement radial (six dernières périodes cyclotron) et z en fonction de v_z pour le mouvement axial (trois dernières périodes axiales) ; le point orange est l’instant actuel. Le refroidissement resserre les boucles vers le centre."
    - - Orbite, axial et 3D
      - Orbite radiale x–y, projection axiale z–x et projection 3D du mouvement physique ; les axes 3D sont x rouge, y vert, z bleu.
    - - Graphique d’amplitude
      - Amplitude des mouvements cyclotron, magnétron et axial en fonction du temps (log–log) ; les lignes pointillées marquent 10 µm et 0,1 s.
  neutral-cooling-figures:
    title: Lire les graphiques de refroidissement d’atomes neutres
    summary: Refroidissement numérique d’un nuage d’atomes neutres par la méthode de refroidissement laser choisie ; chaque panneau montre les mêmes atomes simulés.
    items:
    - - Nuage 3D
      - Atomes sur des axes physiques à échelle égale (mm) ; les flèches rouge, verte et bleue sont x, y, z ; les cercles gris marquent les positions initiales, si affichées ; glisser ou molette pour tourner et zoomer.
    - - Projection 2D
      - Les mêmes atomes sur le plan choisi dans les réglages de vue.
    - - Température
      - 'Température des survivants d’après la variance centrée des vitesses : T totale (sombre), Tx (rouge), Ty (vert), Tz (bleu) ; la ligne dorée pointillée est l’échelle de la température Doppler.'
    - - Taille RMS
      - Taille quadratique moyenne du nuage σx, σy, σz (mm).
    - - Vitesse du centroïde
      - Vitesse moyenne du nuage selon x, y, z (m/s).
    - - Diagnostic de force
      - Force de pression de radiation le long de l’axe choisi en fonction de la position ou de la vitesse, autres coordonnées nulles (10⁻²¹ N).
    - - Espace des phases
      - Position en fonction de la vitesse selon l’axe choisi, valeurs du laboratoire (mm, m/s).
  paul-cooling-figures:
    title: Lire les graphiques de refroidissement laser du piège de Paul
    summary: Refroidissement numérique d’un nuage coulombien d’ions piégés ; chaque panneau montre les mêmes ions simulés.
    items:
    - - Projection 3D
      - Vue 3D rotative en µm ; les flèches rouge, verte et bleue sont x, y, z.
    - - x–y, z–x, y–z
      - Projections des mêmes ions sur les plans radial et axiaux.
    - - Température
      - 'Température moyenne, x, y et z (mK, logarithmique) d’après les variances centrées des vitesses ; la ligne pointillée est l’échelle Doppler ħΓ/(2k_B). Les courbes ne sont pas forcées de décroître : la libération d’énergie potentielle et la micro-oscillation peuvent chauffer.'
    - - Espace des phases
      - x − moyenne(x) en fonction de vₓ − moyenne(vₓ) (µm, m/s).
  rfq-design-inputs:
    title: Signification des entrées de conception
    summary: Ces champs fixent la géométrie des barreaux et l’excitation RF que l’affichage ci-dessous évalue. Les valeurs sont dans les unités des libellés (mm, V, MHz).
    items:
    - - Nombre de barres
      - Nombre de barreaux ronds N, pair, 4–24. Quatre barreaux forment un quadrupôle (filtre de masse, refroidisseur, groupeur). Plus de barreaux donnent un puits de pseudo-potentiel plus plat et pas de diagramme de stabilité de Mathieu.
    - - Règle du rayon des barreaux
      - 'Comment le rayon ρ est choisi. Optimal : la première harmonique de champ indésirable A₃ₙ s’annule. Courbure : ρ = r₀/(n−1), le barreau épouse au sommet la courbure de la ligne de champ idéale. Filtre de masse 1,128 : compromis usuel des filtres à quatre barreaux. Rapport / rayon propre : votre valeur (pas de rayon par défaut).'
    - - Rapport r/r₀, rayon
      - Rayon du barreau divisé par le rayon de champ r₀, et le même rayon en mm. Modifiables seulement avec les règles de rapport ou de rayon propres ; sinon calculés à partir de r₀.
    - - Tolérance du diamètre des barreaux
      - Tolérance d’usinage facultative du diamètre (mm). Elle ajoute seulement la variation ± correspondante de r/r₀ à l’affichage.
    - - Rayon évalué r/r₀
      - 'Distance à l’axe, en unités de r₀, où le champ RF, le pseudo-potentiel, η et l’harmonique indésirable sont évalués : 0,5 est à mi-chemin de la surface du barreau, 1 au bord de l’ouverture.'
    - - Cible de η
      - Limite de conception du paramètre d’adiabaticité η (0,3 usuel ; η = q pour quatre barreaux). L’affichage indique si η au rayon évalué est en dessous et donne la fréquence minimale et la tension RF maximale qui la respectent encore.
    - - Crêtes RF candidates
      - Tensions RF crête V en volts (un barreau par rapport à la masse), séparées par des virgules. Chacune est listée avec son η, son pseudo-potentiel et, pour quatre barreaux, sa classification de Mathieu.
  mathieu-inputs:
    title: Signification des entrées de l’explorateur
    summary: La carte montre où un mouvement borné existe dans le plan des paramètres sans dimension a (continu) et q (RF). Le point est le point de fonctionnement de l’ion saisi ci-dessous.
    items:
    - - Géométrie
      - 'RFQ linéaire : mouvement radial d’un quadrupôle à quatre barreaux, plan (a, q) et son image miroir (−a, −q). Piège de Paul 3D : coordonnées axiales d’un piège anneau et chapeaux.'
    - - Point choisi
      - 'À partir des tensions RFQ : a et q sont calculés d’après U, V, r₀, f et l’ion. a et q directs : saisissez vous-même les valeurs sans dimension.'
    - - Nombre de bandes
      - Combien de bandes de stabilité (n = 0, 1, … jusqu’à 6) sont colorées ; les bandes supérieures se trouvent à q plus grand.
    - - Limites de q et de a
      - Limites du tracé. Les boutons de zoom, la molette et le glissement les modifient.
    - - Masse ionique, nombre de charges z
      - Masse de l’ion en u et son nombre de charges z. « Renseigner la masse ionique » prend la masse dans le catalogue (AME2020 + NUBASE2020) pour l’espèce saisie ci-dessus.
    - - Tension continue U des tiges
      - 'Tension continue signée de la paire de tiges (V) : a = 8zeU/(m r₀² Ω²). U = 0 correspond au fonctionnement RF seul, a = 0.'
    - - Crête RF V des tiges
      - 'Tension RF de zéro à la crête d’une tige par rapport à la masse (les tiges voisines portent ±V) : q = 4zeV/(m r₀² Ω²). L’écart crête entre tiges voisines est 2V.'
    - - Rayon inscrit r₀
      - 'Rayon de champ : distance de l’axe à la surface du barreau.'
    - - Fréquence RF f
      - Fréquence d’excitation en MHz ; Ω = 2πf.
    - - Sections RFQ indépendantes
      - Refroidisseur, filtre de masse et groupeur peuvent avoir leurs propres U, V, r₀ et f ; leurs droites de fonctionnement a = (2U/V)·q et leurs points sont tracés sur la même carte.
  wb-species-input:
    title: Comment saisir une espèce
    summary: 'Chaque espèce est un ion : nucléide, état nucléaire et charge, ou une molécule. Le menu « État nucléaire » liste l’état fondamental et tous les isomères du nucléide saisi.'
    items:
    - - Nucléide
      - 'Nombre de masse et symbole : 133Xe (aussi Xe133, Xe-133). La masse de l’ion est la masse atomique AME2020 moins les masses des électrons.'
    - - Isomère
      - Choisissez-le dans « État nucléaire » ou saisissez 133mXe ou 133Xem (les deux désignent le premier isomère de 133Xe), 133Xe*, 133Xe[m], 133Xe[2] ; les numéros du type m2Xe et les lettres g m n p q r x i j fonctionnent aussi. Affiché 133Xem ; l’énergie d’excitation E* s’ajoute à la masse.
    - - Molécule
      - 'Isotopes à la suite : 16O133Cs, 1H16O133Cs ; 12C11 est onze atomes 12C. Forme à deux-points avec nombres explicites (nombre, élément, nombre de masse) : 1O16:1Cs133, 1H1:2O16:1Cs133 = H + 2 ¹⁶O + ¹³³Cs, et un isomère par constituant : 1H1:2O16:1mXe133 ou 1H1:2O16:1Xem133. La masse est la somme des masses atomiques (énergies de liaison moléculaires omises).'
    - - Charge
      - 'Champ Charge ou saisie : 133Cs+2, 133Cs2+. Par électrons : 133Cs-e retire un électron (affiché 133Cs+), 133Cs-2e deux (133Cs2+) ; en forme à deux-points 1O16:1Cs133:-e devient 1O16:1Cs133:+. Un ion négatif ajoute des électrons : 133Cs+e ou 133Cs- (affiché 133Cs-) ; un piège de Penning exige alors une tension de piégeage négative. Entier 1–100 ; une charge positive ne peut dépasser le nombre d’électrons.'
    - - Population
      - 'Population détectée : poids relatif de l’espèce dans l’échantillon ; peut aussi s’écrire 133Xe:30.'
    - - Masses
      - 'Masses atomiques de l’état fondamental AME2020 plus énergies d’excitation NUBASE2020 ; # marque une valeur extrapolée. Ouvrez « Masses et énergies AME2020 » sous une espèce pour voir tous les nombres tabulés.'
