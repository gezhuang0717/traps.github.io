  ? '① Mass m (u): type the ion mass (AME atomic mass minus q·mₑ). m = value × 1.66053906660×10⁻²⁷ kg. It sets the recoil velocity v_rec = ħk/m, the recoil temperature T_r, the trap frequencies ν_c = qB/2πm, ν_z ∝ √(qU₀/m d²), the Paul q = 2QV/(m r₀²Ω²) and the Coulomb accelerations.'
  : '① Masse m (u): die Ionenmasse eingeben (AME-Atommasse minus q·mₑ). m = Wert × 1,66053906660×10⁻²⁷ kg. Sie bestimmt die Rückstoßgeschwindigkeit v_rec = ħk/m, die Rückstoßtemperatur T_r, die Fallenfrequenzen ν_c = qB/2πm, ν_z ∝ √(qU₀/m d²), das Paul-q = 2QV/(m r₀²Ω²) und die Coulomb-Beschleunigungen.'
  '② Charge q (e): Q = q·e enters every trap frequency, the Mathieu parameters and the ion–ion force Q²/4πε₀r².': '② Ladung q (e): Q = q·e geht in jede Fallenfrequenz, die Mathieu-Parameter und die Ion-Ion-Kraft Q²/4πε₀r² ein.'
  ? '③ Wavelength λ (nm, vacuum): k = 2π/λ, photon momentum ħk; the Doppler shift k·v builds the cooling force F(v) = ħk[R(δ−kv) − R(δ+kv)]; saturation intensity I_sat = πhcΓ/3λ³.'
  : '③ Wellenlänge λ (nm, Vakuum): k = 2π/λ, Photonenimpuls ħk; die Doppler-Verschiebung k·v bildet die Kühlkraft F(v) = ħk[R(δ−kv) − R(δ+kv)]; Sättigungsintensität I_sat = πhcΓ/3λ³.'
  ? '④ Linewidth Γ/2π (MHz): Γ = 2π × value × 10⁶ s⁻¹. Scattering rate R = (Γ/2)s/(1 + s + (2Δ/Γ)²); detunings are in units of Γ (δ/Γ); Doppler limit T_D = ħΓ/2k_B; capture velocity ≈ Γ/2k.'
  : '④ Linienbreite Γ/2π (MHz): Γ = 2π × Wert × 10⁶ s⁻¹. Streurate R = (Γ/2)s/(1 + s + (2Δ/Γ)²); Verstimmungen in Einheiten von Γ (δ/Γ); Doppler-Grenze T_D = ħΓ/2k_B; Einfanggeschwindigkeit ≈ Γ/2k.'
  ? '⑤ Calculation chain: input → SI (m, Q, k, Γ) → every time step, for each ion: local s and Δ = δ − k·v → Poisson photon numbers → recoil ħk plus random emission kicks → new velocity → temperature statistics. The line below shows what your numbers give directly; check that they are sensible (T_D should be µK–mK).'
  : '⑤ Rechenkette: Eingabe → SI (m, Q, k, Γ) → in jedem Zeitschritt für jedes Ion: lokales s und Δ = δ − k·v → Poisson-Photonenzahlen → Rückstoß ħk plus zufällige Emissionsstöße → neue Geschwindigkeit → Temperaturstatistik. Die Zeile darunter zeigt, was Ihre Zahlen unmittelbar ergeben; prüfen, ob sie plausibel sind (T_D sollte im Bereich µK–mK liegen).'
  ? '⑥ Caveat: two-level model (no hyperfine structure, dark states or repumpers); if T_r ≳ T_D (narrow line) the semiclassical result is not reliable.'
  : '⑥ Einschränkung: Zwei-Niveau-Modell (keine Hyperfeinstruktur, Dunkelzustände oder Rückpumper); bei T_r ≳ T_D (schmale Linie) ist das semiklassische Ergebnis nicht zuverlässig.'
