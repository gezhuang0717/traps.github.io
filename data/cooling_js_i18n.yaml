  : '④ Luonnonleveys Γ/2π (MHz): Γ = 2π × arvo × 10⁶ s⁻¹. Sirontanopeus R = (Γ/2)s/(1 + s + (2Δ/Γ)²); virityserot ilmoitetaan Γ:n yksiköissä (δ/Γ); Doppler-raja T_D = ħΓ/2k_B; vangitsemisnopeus ≈ Γ/2k.'
  ? '⑤ Calculation chain: input → SI (m, Q, k, Γ) → every time step, for each ion: local s and Δ = δ − k·v → Poisson photon numbers → recoil ħk plus random emission kicks → new velocity → temperature statistics. The line below shows what your numbers give directly; check that they are sensible (T_D should be µK–mK).'
  : '⑤ Laskentaketju: syöte → SI (m, Q, k, Γ) → jokaisella aika-askeleella jokaiselle ionille paikallinen s ja Δ = δ − k·v → Poisson-fotonimäärät → rekyyli ħk sekä satunnaiset emissiopotkut → uusi nopeus → lämpötilatilastot. Alla oleva rivi näyttää, mitä lukusi antavat suoraan; tarkista, että ne ovat järkeviä (T_D:n tulisi olla µK–mK).'
