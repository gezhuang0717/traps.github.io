  ? '③ Wavelength λ (nm, vacuum): k = 2π/λ, photon momentum ħk; the Doppler shift k·v builds the cooling force F(v) = ħk[R(δ−kv) − R(δ+kv)]; saturation intensity I_sat = πhcΓ/3λ³.'
  : '③ Aallonpituus λ (nm, tyhjiö): k = 2π/λ, fotonin liikemäärä ħk; Doppler-siirtymä k·v muodostaa jäähdytysvoiman F(v) = ħk[R(δ−kv) − R(δ+kv)]; saturaatiointensiteetti I_sat = πhcΓ/3λ³.'
