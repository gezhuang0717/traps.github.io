  tof_intro: "Vertaa yksittäisiä resonansseja seosnäytteeseen. Yhden lajin sovite voi antaa tarkalta näyttävän keskipisteen, joka poikkeaa kohdeionin resonanssista."
  penning_intro: "Muuta ionia, magneettikenttää tai vangitsemista. Ylä-, sivu- ja 3D-näkymät käyttävät samoja ideaaliloukun taajuuksia ja fysikaalisia koordinaatteja."
