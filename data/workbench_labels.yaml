  zoom_in: "放大"
  zoom_out: "缩小"
  reset_view: "重置视图"
  view_hint: "拖动平移，Ctrl/⌘ + 滚轮或按钮缩放，双击重置。保存的图片即当前视图；悬停在点上可看到数值。"
  ground_tag: "基态"
  isomer_tag: "同核异能态"
  molecule_tag: "分子"
  pairs_all: "显示所有两两组合（否则只显示相邻峰）"
  pairs_note: "相邻 = 按飞行时间排序的下一个。"
  save_figure: "保存图片"
  species_total: "种类"
  time_us: "t (µs)"
  explain_fig: "在保存的图片下方写出符号说明"
  many: "十种氙同位素（十个种类）"
