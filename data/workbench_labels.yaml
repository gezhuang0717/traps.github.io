  phase_floor: 角度系统误差下限（mrad）
  phase_count: 每种离子的计数
  voltage: 四极势 U₀（V）
  geometry: 特征长度 d（mm）
  cyclotron_radius: 回旋半径（mm）
  magnetron_radius: 磁控半径（mm）
  axial: 轴向振幅（mm）
  duration: 轨迹时长（µs）
  playback: 播放速度
  pause: 暂停 / 继续
  reset: 重置
  step: 单步
  penning_note: 理想势 Φ = U₀(2z² − x² − y²)/(4d²)。频率使用物理单位；播放速度仅改变采样轨迹的显示速度。其他脉冲和冷却示意不是装置性能预测。
  clear_fit: 清除拟合
  power_plot: 分辨本领随圈数变化
  power_required: 所需质荷比分辨本领
  counts_bin: 每分箱计数
  mean_tof: 平均飞行时间（µs）
  event_tof: 事件飞行时间（µs）
  probability_density: 概率密度（µs⁻¹）
  residual_tof: 飞行时间残差（µs）
  observations: 合成观测
  seed_hint: 种子固定随机序列以便复现。20261007 是可修改的初始值，不是物理参数，也不表示今天的日期。
  legend_position: "图例"
  legend_bottom: "在图下方"
  legend_inside: "在图内"
