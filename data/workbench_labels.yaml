fr:
  mr_title: 'MR-TOF : séparer espèces et isomères'
  mr_intro: Choisissez jusqu’à trois espèces. Comparez leurs pics au spectre combiné et examinez l’effet du nombre
    de tours.
  tof_title: 'TOF-ICR : résonances superposées et biais d’ajustement'
  tof_intro: Comparez les résonances individuelles au mélange. L’ajustement d’une seule espèce peut sembler précis
    tout en étant décalé de la cible.
  penning_title: 'Piège de Penning : champs, fréquences et mouvement'
  penning_intro: Modifiez l’ion, le champ ou le confinement. Les vues de dessus, de côté et 3D partagent les fréquences
    et coordonnées physiques du piège idéal.
