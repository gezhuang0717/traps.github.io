en:
  mr_title: 'MR-TOF: separate species and isomers'
  mr_intro: "Choose up to ten ion species; ground states and isomers are listed separately in every legend and saved figure. Compare individual peaks with their combined spectrum, then see how separation changes with lap count."
  tof_title: 'TOF-ICR: overlapping resonances and fit bias'
  tof_intro: Compare individual resonances with a mixed sample. A single-species fit
    can give a precise-looking centre that differs from the target ion’s resonance.
  penning_title: 'Penning trap: fields, frequencies and motion'
  penning_intro: Change the ion, magnetic field or confinement. The top, side and
    3D views use the same ideal-trap frequencies and physical coordinates.
  loading: Loading evaluated nuclear data…
  species: Ion species
  state: Nuclear state
  charge: Charge
  population: Detected population
  number: Number of species
  preset: Example
  ground: Ground state
  advanced: Advanced parameters and assumptions
  parameters: Parameters
  spectrum: Individual peaks and combined spectrum
  laps_plot: Separation and width versus laps
  resonance: Individual responses and mixture
  residuals: Single-species fit residuals
  distribution: Event distributions at the selected frequency
  summary: Interpretation
  individual: Individual components
  combined: Combined sample
  generate: Generate synthetic measurements
  fit: Fit as one species
  target: Target for fit bias
  save: Export inputs and results
  png: Save plot PNG
  csv: Save plot CSV
  seed: Random seed
  counts: Total detected ions
  histogram: Show synthetic histogram
  laps: Mirror laps
  width: Initial bunch FWHM (ns)
  broadening: Broadening per lap (ps)
  reference_time: Flight time at 100 u, q = 1, 1 keV (µs)
  lap_time: Lap time at 100 u, q = 1, 1 keV (µs)
  delay: Fixed electronic delay (µs)
  calibration: Reference-ion mass calibration
  reference_ion: Reference ion
  reference_tof: Reference TOF (µs)
  observed_tof: Observed TOF (µs)
  time_sigma: Observed-time uncertainty (ns)
  reference_sigma: Reference-time uncertainty (ns)
  delay_sigma: Delay uncertainty (ns)
  calibrate: Calculate calibrated mass
  energy: "Kinetic energy per charge E/q (keV)"
  energy_hint: "Range 0.1–100 keV, default 1 keV. The two times below are those for 1 keV; flight times scale as 1/√(E/q): 100 keV is 10 times faster, 0.1 keV is 3.16 times slower. Ions with the same E/q keep their time ratios."
  bin: "Histogram bin width"
  bin_auto: "automatic (90 bins)"
  bin_custom: "custom (set below)"
  bin_custom_value: "Custom bin width (ns)"
  bin_too_small: "This bin width needs more than 4000 bins; choose a larger width or fewer laps."
  cal_t0: "Time offset t₀ (µs)"
  cal_formula: "One reference ion and the time offset t₀ (the electronic delay between the start signal and the flight) fix the scale: m/q = (m/q)ref · ((t − t₀)/(tref − t₀))². The kinetic energy cancels when both ions have the same E/q."
  cal_fill: "Fill from the simulated spectrum"
  cal_filled: "Filled with the simulated times of the reference ion and of species 1 at the current laps, energy and delay; “Calculate” should return the mass of species 1."
  magnetic: Magnetic field B (T)
  excitation: Excitation time (ms)
  scheme: Excitation sequence
  rect: Continuous rectangular pulse
  ramsey: 'Ramsey: 10% pulse / 80% wait / 10% pulse'
  points: Scan frequency points
  ions_point: Ions per frequency point
  scan_span: Scan half-span about target (Hz; 0 = automatic)
  detuning: Distribution frequency offset from target (Hz)
  mass_note: 'Masses: AME2020 ground state + NUBASE2020 excitation energy. # marks
    extrapolated properties. Unknown uncertainty is not zero; unavailable covariance
    uses an explicit diagonal approximation. Ionization and molecular binding energies
    are omitted.'
  mr_note: 'Flight time scales exactly as √(mion/q); fixed electronic delay is added
    afterwards. Width is phenomenological: FWHM² = initial width² + (laps × broadening)².
    Populations are detected fractions; displayed survival does not simulate decay
    products.'
  tof_note: 'Teaching response: t(F) = t_offset + t_scale / √(1 + κF). F is the dimensionless
    mode-conversion fraction, 0–1. Defaults: t_offset = 62 µs, t_scale = 193 µs, κ
    = 1.876; 8% unconverted background, event widths σ = 7 and 9 µs. Mixture means
    are population-weighted; displayed component event densities include population
    weights. Noise is illustrative. Local Δχ² = 1 fit intervals exclude mixture bias.'
  separated: Separated neighbours
  overlapping: Overlapping isobars
  unequal: Unequal populations
  three: Three species
  isomers: Ground state and isomer
  molecular: Atomic and molecular ions
  unknown: unknown
  survival: Survival over flight time
  phase_radius: Detector spot radius (mm)
  phase_width: Cartesian event σ (mm)
  phase_floor: Angular systematic floor (mrad)
  phase_count: Counts per species
  voltage: Quadrupole U₀ (V)
  geometry: Characteristic length d (mm)
  cyclotron_radius: Cyclotron radius (mm)
  magnetron_radius: Magnetron radius (mm)
  axial: Axial amplitude (mm)
  duration: Trajectory duration (µs)
  playback: Playback speed
  pause: Pause / resume
  reset: Reset
  step: Step
  penning_note: Ideal potential Φ = U₀(2z² − x² − y²)/(4d²). Frequencies are physical;
    playback only changes how quickly the sampled trajectory is revealed. Pulse/cooling
    illustrations elsewhere are not instrument predictions.
  clear_fit: Clear fit
  power_plot: Resolving power versus laps
  power_required: Required m/q resolution
  counts_bin: Counts per bin
  mean_tof: Mean TOF (µs)
  event_tof: Event TOF (µs)
  probability_density: Probability density (µs⁻¹)
  residual_tof: TOF residual (µs)
  observations: Synthetic observations
  seed_hint: The seed fixes the random sequence for reproducibility. 20261007 is an
    editable starting value, not a physical parameter or today’s date.
  legend_position: "Legend"
  legend_bottom: "below the plot"
  legend_inside: "inside the plot"
  legend_off: "hidden"
  zoom_in: "Zoom in"
  zoom_out: "Zoom out"
  reset_view: "Reset view"
  view_hint: "Drag to pan, Ctrl/⌘ + wheel or the buttons to zoom, double-click to reset. Saved figures show the current view; hover a point for its values."
  ground_tag: "ground state"
  isomer_tag: "isomer"
  molecule_tag: "molecule"
  pairs_all: "Show every pair (otherwise only neighbouring peaks)"
  pairs_note: "Neighbouring = next in flight-time order."
  save_figure: "Save figure"
  species_total: "Species"
  time_us: "t (µs)"
  explain_fig: "Print the explanation of the symbols below saved figures"
  many: "Ten xenon isotopes (ten species)"
  hist_series: "Synthetic histogram"
  ame_species_card: "AME2020 masses and energies of this species"
  ame_loading: "Loading AME2020 …"
  ame_unavailable: "The AME2020 table could not be loaded."
  ame_missing_nuclide: "not in AME2020"
  ame_excitation: "Excitation energy E* (NUBASE2020) / keV"
  ame_ground_note: "AME2020 tabulates ground states. For an isomer the excitation energy E* from NUBASE2020 is added to the ground-state mass; the ion mass subtracts the electron masses."
  ame_constituent: "Constituent"
  ame_quantity: "Quantity"

zh:
  mr_title: MR-TOF：离子种类与同核异能态分离
  mr_intro: "最多选择十种离子；基态与同核异能态在每张图的图例和保存的图片中分别列出。比较各自的峰与叠加谱，并观察分离随圈数的变化。"
  tof_title: TOF-ICR：重叠共振与拟合偏差
  tof_intro: 比较单独共振与混合样品。单组分拟合可能给出看似精确、却偏离目标离子共振的位置。
  penning_title: 彭宁阱：场、频率与运动
  penning_intro: 改变离子、磁场或囚禁条件。俯视、侧视和三维视图共享理想阱频率与物理坐标。
  loading: 正在加载评估核数据…
  species: 离子种类
  state: 核态
  charge: 电荷态
  population: 探测到的占比
  number: 离子种类数
  preset: 示例
  ground: 基态
  advanced: 高级参数与假设
  parameters: 参数
  spectrum: 各组分峰与叠加谱
  laps_plot: 分离与峰宽随圈数的变化
  resonance: 各组分响应与混合响应
  residuals: 单组分拟合残差
  distribution: 所选频率处的事件分布
  summary: 结果解释
  individual: 各组分
  combined: 混合样品
  generate: 生成模拟测量
  fit: 按单组分拟合
  target: 拟合偏差的目标离子
  save: 导出输入与结果
  png: 保存图片 PNG
  csv: 保存绘图数据 CSV
  seed: 随机种子
  counts: 探测到的总离子数
  histogram: 显示模拟直方图
  laps: 镜间往返圈数
  width: 初始离子束 FWHM（ns）
  broadening: 每圈展宽（ps）
  reference_time: 100 u、q = 1、1 keV 的飞行时间（µs）
  lap_time: 100 u、q = 1、1 keV 的单圈时间（µs）
  delay: 固定电子学延迟（µs）
  calibration: 参考离子质量标定
  reference_ion: 参考离子
  reference_tof: 参考飞行时间（µs）
  observed_tof: 观测飞行时间（µs）
  time_sigma: 观测时间不确定度（ns）
  reference_sigma: 参考时间不确定度（ns）
  delay_sigma: 延迟不确定度（ns）
  calibrate: 计算标定质量
  energy: "每电荷动能 E/q（keV）"
  energy_hint: "范围 0.1–100 keV，默认 1 keV。下面两个时间对应 1 keV；飞行时间按 1/√(E/q) 缩放：100 keV 快 10 倍，0.1 keV 慢 3.16 倍。E/q 相同的离子保持时间比不变。"
  bin: "直方图的分格宽度"
  bin_auto: "自动（90 格）"
  bin_custom: "自定义（见下）"
  bin_custom_value: "自定义分格宽度（ns）"
  bin_too_small: "该分格宽度需要超过 4000 格；请选择更大的宽度或减少圈数。"
  cal_t0: "时间零点偏移 t₀（µs）"
  cal_formula: "一个参考离子和时间零点偏移 t₀（起始信号与飞行之间的电子学延迟）即可确定标度：m/q = (m/q)ref · ((t − t₀)/(tref − t₀))²。两个离子的 E/q 相同时动能抵消。"
  cal_fill: "用模拟谱的数值填入"
  cal_filled: "已填入参考离子与种类 1 在当前圈数、能量和延迟下的模拟时间；点击“计算”应得到种类 1 的质量。"
  magnetic: 磁场 B（T）
  excitation: 激发时间（ms）
  scheme: 激发序列
  rect: 连续矩形脉冲
  ramsey: Ramsey：10% 脉冲 / 80% 等待 / 10% 脉冲
  points: 扫描频率点数
  ions_point: 每个频率点的离子数
  scan_span: 目标频率附近扫描半宽（Hz；0 为自动）
  detuning: 事件分布频率相对目标的偏移（Hz）
  mass_note: 质量：AME2020 基态 + NUBASE2020 激发能。# 标记外推量。未知不确定度不等于零；关联未知时明确采用对角近似。忽略电离能及分子结合能。
  mr_note: 飞行时间严格按 √(mion/q) 缩放，随后加上固定电子学延迟。峰宽采用唯象模型：FWHM² = 初始峰宽² +（圈数 × 每圈展宽）²。占比是探测到的比例；存活率提示不模拟衰变产物。
  tof_note: 教学响应：t(F) = t_offset + t_scale / √(1 + κF)。F 为无量纲模式转换比例，范围 0–1。默认值：t_offset
    = 62 µs，t_scale = 193 µs，κ = 1.876；未转换背景占 8%，事件宽度 σ 为 7 和 9 µs。混合平均飞行时间按布居加权，所示组分事件密度也包含布居权重。噪声仅为示意；局部
    Δχ² = 1 拟合区间不包含混合偏差。
