en:
  mr_title: 'MR-TOF: separate species and isomers'
  mr_intro: Choose up to three ion species. Compare individual peaks with their combined
    spectrum, then see how separation changes with lap count.
  tof_title: 'TOF-ICR: overlapping resonances and fit bias'
  tof_intro: Compare individual resonances with a mixed sample. A single-species fit
    can give a precise-looking centre that differs from the target ion’s resonance.
  penning_title: 'Penning trap: fields, frequencies and motion'
  penning_intro: Change the ion, magnetic field or confinement. The top, side and
    3D views use the same ideal-trap frequencies and physical coordinates.
