  cl_help: "Pois: yksi jatkuva väriasteikko. Päällä: asteikon alue (käsin asetettu alue tai valitsemasi datan minimi–maksimi) jaetaan valittuun määrään luokkia. Jokainen luokka saa yhden värin ja näkyy selitteessä piirrettyjen nuklidien lukumäärän kanssa. Napsauta selitteen riviä näyttääksesi vain sen luokan (napsauta uudelleen tai paina 'näytä kaikki' palauttaaksesi). Yhtä leveät jakaa alueen yhtä suuriin askeliin. Yhtä monta sijoittaa suunnilleen yhtä monta nuklidia kuhunkin luokkaan, mikä auttaa vinoilla suureilla. 'Omat rajat' käyttää kirjoittamiasi luokkarajoja näytetyssä yksikössä (logaritmisilla suureilla kirjoita todellinen arvo, esim. 100 tarkoittaa 100 keV). Etumerkilliset suureet jaetaan symmetrisesti nollan ympäri, jolloin yksi luokka sisältää nollan. Luokat muuttavat vain värien piirtotapaa, mitään arvoa ei muuteta. Pikanäppäin: C."
