  cl_help_t: "How the classes work"
  cl_help: "Off: one continuous colour bar. On: the range of the bar (the manual range, or the data minimum–maximum when you chose it) is cut into the chosen number of classes. Every class gets one colour and is listed in the legend with the number of plotted nuclides. Click a legend entry to show only that class (click again, or press 'show all', to reset). Equal width cuts the range into equal steps. Equal count puts about the same number of nuclides in every class, which helps for skewed quantities. 'My own edges' uses the class limits you type, in the unit shown (for logarithmic quantities type the real value, e.g. 100 for 100 keV). Quantities with a sign are cut symmetrically around zero so that one class contains 0. The classes change only how colours are drawn; no value is altered. Hotkey: C."
