  cl_help: "Désactivé : une échelle de couleurs continue. Activé : la plage de l’échelle (plage manuelle, ou minimum–maximum des données si vous l’avez choisi) est découpée en le nombre de classes choisi. Chaque classe reçoit une couleur et figure dans la légende avec le nombre de nucléides tracés. Cliquez sur une entrée de la légende pour n’afficher que cette classe (recliquez ou « tout afficher » pour revenir). Largeur égale découpe la plage en pas égaux ; effectif égal met à peu près autant de nucléides dans chaque classe, utile pour les grandeurs asymétriques. « Mes propres bornes » utilise les limites saisies dans l’unité affichée (pour les grandeurs logarithmiques, saisissez la vraie valeur, p. ex. 100 pour 100 keV). Les grandeurs signées sont découpées symétriquement autour de zéro, de sorte qu’une classe contienne 0. Les classes ne changent que la couleur, aucune valeur n’est modifiée. Raccourci : C."
