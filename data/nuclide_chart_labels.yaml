  ed_intro: "Jede AME-Ausgabe erschien zusammen mit einer NUBASE-Tabelle desselben Jahres. Grundzustandsmassen werden aus der AME-Tabelle gezählt: gemessene gegenüber extrapolierten Werten (mit # markiert). Isomere sind die in der zugehörigen NUBASE-Tabelle dokumentierten isomeren Zustände (m, n; Zustandsindex 1 und 2). Die auf der Karte gerade verglichene Ausgabe ist hervorgehoben."
