  st_min: "minimum"
  st_max: "maximum"
  st_median: "median"
  st_none: "No nuclide has a value for this quantity under the current filter."
  st_clipped: "{k} lie outside the colour range and take the end colours"
  st_hl: "Half-lives known for {n} nuclides"
  st_hl_stable: "stable"
  ed_title: "How many nuclei does each AME edition contain? Measured, estimated, isomers documented"
  ed_intro: "Each AME edition was published together with a NUBASE table of the same year. Ground-state masses are counted from the AME table: measured values versus extrapolated ones (marked #). Isomers are the isomeric states (m, n; state index 1 and 2) documented in the matching NUBASE table. The edition currently compared on the chart is highlighted."
  ed_col_ed: "AME edition"
  ed_col_nub: "NUBASE table"
  ed_col_n: "Nuclides"
  ed_col_meas: "Measured"
  ed_col_est: "Estimated (#)"
  ed_col_iso: "Isomers documented"
  ed_col_wiso: "Nuclides with isomers"
  ed_col_oth: "Other excited states"
  ed_note: "NUBASE can list a few more ground states than the AME table of the same year (for example 3379 versus 3353 in 2012) because it also contains nuclides whose mass comes from decay data, and four NUBASE1997 ground states have no mass at all. Other excited states are levels, resonances and extra isomers (p, q, r, x); isobaric analogue states are not counted. All numbers are computed from the original tables, whose links are in the data panel."
  ed_loading: "Loading edition data…"
  ed_opt_title: "{ed}: {n} nuclides ({m} measured, {e} estimated); {i} isomers in {nub}"
  ed_hint_head: "AME2020 − {ed}: {n} nuclides are present in both editions."
  ed_hint_new: "{n} nuclides are new in AME2020 (absent from {ed})."
  ed_hint_drop: "{n} nuclides of {ed} are not in AME2020."
  ed_hint_stat: "{a} extrapolated values became measured, {b} measured values became extrapolated."
  ed_hint_spread: "Median |Δ| = {med} keV, mean Δ = {mean} keV; largest |Δ| = {max} keV for {id}."
  ed_hint_sigma: "{n} nuclides differ by more than 3σ (σ = combined uncertainty)."
