  deflist:
    - "S<sub>n</sub> = ME(Z,N−1) + ME(n) − ME(Z,N); S<sub>2n</sub>, S<sub>p</sub>, S<sub>2p</sub> vastaavasti. Tihkumisraja (drip line) on kohta, jossa separaatioenergia muuttuu negatiiviseksi: sen ylitse ydin on sitoutumaton n / 2n / p / 2p -emission suhteen. AME2020:n kanssa viiva piirretään vain siellä, missä sitoutumaton ydin tunnetaan; mallin kanssa se on mallin viimeinen sitoutunut ydin."
    - "δ<sub>2n</sub> = S<sub>2n</sub>(N) − S<sub>2n</sub>(N+2): huiput kuoren sulkeutumisissa (maagisissa luvuissa)."
    - "Δ<sub>n</sub><sup>(3)</sup> = (−1)<sup>N</sup>/2 · [ME(N+1) − 2ME(N) + ME(N−1)]: pariton–parillinen massojen porrastus, parinmuodostusaukon mitta (Δ<sub>p</sub><sup>(3)</sup> Z:n suhteen)."
    - "δV<sub>pn</sub> (parillinen–parillinen) = ¼ [B(Z,N) − B(Z,N−2) − B(Z−2,N) + B(Z−2,N−2)], pariton A:n ja pariton–pariton -muodot Cakirlin &amp; Castenin mukaan, PRL 94, 092501 (2005): viimeisten protonien ja viimeisten neutronien keskimääräinen vuorovaikutus; suuri lähellä N = Z."
    - "Wigner-indikaattori W = δV<sub>pn</sub>(N) − ½ [δV<sub>pn</sub>(N+2) + δV<sub>pn</sub>(N−2)] (kuten Mulberry-koodissa): N = Z -ytimien lisäsidos (Wigner-energia) näkyy huippuna kohdassa N = Z."
    - "Epävarmuudet lasketaan neliöllisesti yhteen AME2020:n massaepävarmuuksista (korrelaatiot laiminlyödään); # merkitsee arvoja, jotka käyttävät ekstrapoloituja massoja. Teoreettisilla massoilla ei ole epävarmuutta."
    - "Mallit: FRDM (1995) — Möller, Nix, Myers, Swiatecki, ADNDT 59, 185 (1995); HFB-17 — Goriely, Chamel, Pearson, PRL 102, 152503 (2009); HFB-D1M — Goriely, Hilaire, Girod, Péru, PRL 102, 242501 (2009). Taulukot TALYS 1.95:n mukana jaettuina. r-prosessin polku: digitoitu lähteestä ApJ 815, 82 (2015); rp-prosessin polku likimääräinen."
