  ed_intro: "Each AME edition was published together with a NUBASE table of the same year. Ground-state masses are counted from the AME table: measured values versus extrapolated ones (marked #). Isomers are the isomeric states (m, n; state index 1 and 2) documented in the matching NUBASE table. The edition currently compared on the chart is highlighted."
