  p_pub_hint: "Uusi massa muuttaa oman pisteensä ja ne arvot, jotka sitä tarvitsevat (esimerkiksi S_n pisteissä A ja A+1). ”Jokainen sarja erikseen” vetää viivan vain saman sarjan pisteiden kautta, joten yksi tai kaksi uutta arvoa näkyy irrallisina merkkeinä. ”Uusilla tiedoilla korjattu AME2020” piirtää yhden yhtenäisen käyrän koko ketjun läpi kaikki muuttuneet arvot korvattuina, värillisenä harmaan AME2020-viivan päällä (useammalla syöttöjoukolla kukin värittää vain omat muuttuneet janansa); ”vain muuttuneet janat” värittää vain muuttuneeseen arvoon liittyvät janat. ”Merkkien siirto” siirtää uudet, Uusi + AME2020 ja omat pisteet sivuun annetun N-määrän, jotta samanarvoiset merkit eivät peitä toisiaan (viivat pysyvät todellisessa N:ssä). ”AME2020 harmaana” piirtää vertailun harmaana, jotta uudet tiedot erottuvat. Esiasetus ”julkaisutyyli” asettaa kaiken yhdellä kertaa (korjattu käyrä, siirto 0,12, harmaa AME2020, virhepalkit, ei punaista rengasta); ”oletus” palauttaa aiemman ulkoasun. Ero AME2020:een näkyy residuaalikuvassa."
