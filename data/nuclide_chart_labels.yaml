  p_pub_hint: "Une nouvelle masse modifie son propre point et les valeurs qui en ont besoin (par exemple S_n en A et A+1). « Chaque série séparément » ne relie que les points d’une même série ; une ou deux nouvelles valeurs apparaissent donc comme des marqueurs isolés. « AME2020 révisé par les nouvelles données » trace une courbe continue sur toute la chaîne où chaque valeur modifiée est remplacée, en couleur au-dessus d’une ligne AME2020 grise (avec plusieurs jeux d’entrées, chacun ne colore que ses propres segments modifiés) ; « seulement les segments modifiés » ne colore que les segments touchant une valeur modifiée. Le « décalage des marqueurs » déplace latéralement les points Nouveau, Nouveau + AME2020 et personnels de ce nombre de N, afin que des marqueurs de même valeur ne se cachent pas (les lignes restent au vrai N). « AME2020 en gris » dessine la référence en gris pour que les nouvelles données ressortent. Le préréglage « publication » règle tout ensemble (courbe révisée, décalage 0,12, AME2020 gris, barres d’erreur, pas de cercle rouge) ; « par défaut » rétablit l’aspect précédent. La différence avec AME2020 est dans le panneau des résidus."
