  defs: "导出量的定义"
  deflist:
    - "S<sub>n</sub> = ME(Z,N−1) + ME(n) − ME(Z,N)；S<sub>2n</sub>、S<sub>p</sub>、S<sub>2p</sub> 类似。滴线是分离能变为负值的位置：越过滴线，原子核对 n / 2n / p / 2p 发射不束缚。使用 AME2020 时，只在已知存在不束缚核的地方画线；使用模型时为模型中最后一个束缚核。"
    - "δ<sub>2n</sub> = S<sub>2n</sub>(N) − S<sub>2n</sub>(N+2)：在壳层闭合（幻数）处出现峰值。"
    - "Δ<sub>n</sub><sup>(3)</sup> = (−1)<sup>N</sup>/2 · [ME(N+1) − 2ME(N) + ME(N−1)]：奇偶质量差，衡量对能隙（质子为 Δ<sub>p</sub><sup>(3)</sup>）。"
    - "δV<sub>pn</sub>（偶偶核）= ¼ [B(Z,N) − B(Z,N−2) − B(Z−2,N) + B(Z−2,N−2)]，奇 A 与奇奇核采用 Cakirli & Casten, PRL 94, 092501 (2005) 的形式：最后几个质子与中子之间的平均相互作用，在 N = Z 附近很大。"
    - "Wigner 指标 W = δV<sub>pn</sub>(N) − ½ [δV<sub>pn</sub>(N+2) + δV<sub>pn</sub>(N−2)]（与 Mulberry 代码相同）：N = Z 核的额外结合（Wigner 能）表现为 N = Z 处的峰。"
    - "不确定度由 AME2020 质量误差按平方和合成（忽略相关性）；# 表示用到了外推质量。理论质量没有误差。"
    - "模型：FRDM (1995) — Möller, Nix, Myers, Swiatecki, ADNDT 59, 185 (1995)；HFB-17 — Goriely, Chamel, Pearson, PRL 102, 152503 (2009)；HFB-D1M — Goriely, Hilaire, Girod, Péru, PRL 102, 242501 (2009)。表格取自 TALYS 1.95。r 过程路径数字化自 ApJ 815, 82 (2015)；rp 过程路径为近似。"
