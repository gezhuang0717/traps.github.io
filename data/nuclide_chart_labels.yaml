  mine_global_assignment: "These assignments apply to every row. Unit, quantity, label and reference columns in a raw table are not applied automatically; use these controls and select σ explicitly. Split mixed-quantity or mixed-unit tables before import."
  mine_conversion_preview: "Conversion preview before mass transfer:"
  mine_typed_help: "Assign the quantity and unit explicitly: 50,50,8 means Z = 50, N = 50, value = 8. For BE/A choose MeV/nucleon; for ME choose keV. No mass is inferred. Optional σ uses the same input unit; blank means unknown. Apply shows your points in the chain plot with matching reference/theory checkboxes."
