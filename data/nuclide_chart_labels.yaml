  mod_exp: "experiment"
  model_short: "model"
  ovl: "Lines"
  rpath: "r-process path"
  rppath: "rp-process path"
  modnote: "Theory masses (cells marked * exist only in the model). Drip lines require neighbouring values around zero. Missing β₂ stays unavailable. Source:"
  m_vpn: "δVpn (p–n interaction)"
  m_d3n: "Δₙ⁽³⁾ (neutron pairing gap)"
  m_beta2: "β₂ deformation (model)"
  m_dmod: "ME(AME) − ME(model)"
  wig: "Wigner indicator W"
  defs: "Definitions of the derived quantities"
  deflist:
    - "S<sub>n</sub> = ME(Z,N−1) + ME(n) − ME(Z,N); S<sub>2n</sub>, S<sub>p</sub>, S<sub>2p</sub> analogous. A drip line is where the separation energy becomes negative: beyond it the nucleus is unbound to n / 2n / p / 2p emission. With AME2020 a line is drawn only where an unbound nucleus is known; with a model it is the model's last bound nucleus."
    - "δ<sub>2n</sub> = S<sub>2n</sub>(N) − S<sub>2n</sub>(N+2): peaks at shell closures (magic numbers)."
    - "Δ<sub>n</sub><sup>(3)</sup> = (−1)<sup>N</sup>/2 · [ME(N+1) − 2ME(N) + ME(N−1)]: odd–even mass staggering, a measure of the pairing gap (Δ<sub>p</sub><sup>(3)</sup> in Z)."
    - "δV<sub>pn</sub> (even–even) = ¼ [B(Z,N) − B(Z,N−2) − B(Z−2,N) + B(Z−2,N−2)], with the odd-A and odd–odd forms of Cakirli &amp; Casten, PRL 94, 092501 (2005): average interaction of the last protons with the last neutrons; large near N = Z."
    - "Wigner indicator W = δV<sub>pn</sub>(N) − ½ [δV<sub>pn</sub>(N+2) + δV<sub>pn</sub>(N−2)] (as in the Mulberry code): the extra binding of N = Z nuclei (Wigner energy) shows up as a peak at N = Z."
    - "Uncertainties are added in quadrature from the AME2020 mass uncertainties (correlations neglected); # marks values that use extrapolated masses. Theory masses have no uncertainty."
    - "Models: FRDM (1995) — Möller, Nix, Myers, Swiatecki, ADNDT 59, 185 (1995); HFB-17 — Goriely, Chamel, Pearson, PRL 102, 152503 (2009); HFB-D1M — Goriely, Hilaire, Girod, Péru, PRL 102, 242501 (2009). Tables as distributed with TALYS 1.95. r-process path: digitised from ApJ 815, 82 (2015); rp-process path approximate."
  line_width: "Overlay line width"
  export_hint: "PNG and PDF use the current view and line settings. PDF contains a high-resolution image; CSV preserves numeric data."
