  pp_default: "Standard"
  p_pub_title: "Abbildung im Publikationsstil"
  p_pub_hint: "Eine neue Masse ändert den eigenen Punkt und die Werte, die sie brauchen (zum Beispiel S_n bei A und A+1). „Jede Serie einzeln“ zeichnet nur Linien durch Punkte derselben Serie, sodass ein oder zwei neue Werte als einzelne Marker erscheinen. „AME2020 mit den neuen Daten korrigiert“ zeichnet eine zusammenhängende Kurve durch die ganze Kette, in der jeder geänderte Wert ersetzt ist, farbig über einer grauen AME2020-Linie (bei mehreren Eingabesätzen färbt jeder nur seine geänderten Abschnitte); „nur die geänderten Abschnitte“ färbt nur die Abschnitte, die einen geänderten Wert berühren. „Markerversatz“ verschiebt die Punkte Neu, Neu + AME2020 und eigene Punkte seitlich um so viele N, dass Marker mit gleichem Wert einander nicht verdecken (Linien bleiben beim wahren N). „AME2020 in Grau“ zeichnet die Referenz grau, damit die neuen Daten hervortreten. Die Vorgabe „Publikation“ setzt alles zusammen (korrigierte Kurve, Versatz 0,12, graues AME2020, Fehlerbalken, kein roter Kreis); „Standard“ stellt das frühere Aussehen wieder her. Die Differenz zu AME2020 steht im Residuenbild."
