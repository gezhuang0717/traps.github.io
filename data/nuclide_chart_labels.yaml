  - δV<sub>pn</sub> pair-pair = ¼ [B(Z,N) − B(Z,N−2) − B(Z−2,N) + B(Z−2,N−2)]. Les autres parités suivent Cakirli
    et Casten, PRL 94, 092501 (2005). Cet indicateur estime une interaction moyenne, importante près de N = Z.
  - 'W = δV<sub>pn</sub>(N) − ½ [δV<sub>pn</sub>(N+2) + δV<sub>pn</sub>(N−2)] : indicateur local de Wigner selon
    le code Mulberry, susceptible de montrer un pic à N = Z.'
  - 'Les termes de masse communs s’annulent avant propagation ; les incertitudes restantes se combinent avec une
    approximation diagonale. # signale une contribution extrapolée. L’incertitude des modèles est inconnue.'
  - 'Modèles : FRDM (1995), Möller et al., ADNDT 59, 185 ; HFB-17, Goriely et al., PRL 102, 152503 (2009) ; HFB-D1M,
    Goriely et al., PRL 102, 242501 (2009). Tables distribuées avec TALYS 1.95. Trajet r numérisé depuis ApJ 815,
    82 (2015) ; trajet rp approximatif.'
