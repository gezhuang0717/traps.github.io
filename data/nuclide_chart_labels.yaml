  p_pub_title: "发表风格的图"
  p_pub_hint: "新增一个质量会改变它自己的点，以及需要它的数值（例如 A 与 A+1 的 S_n）。“每个系列分别连线”只在同一系列的点之间连线，所以一两个新值会成为孤立的标记。“用新数据修订后的 AME2020”画一条贯穿整条链的连续曲线，所有变化的值都被替换，彩色画在灰色的 AME2020 线之上（有多组输入时，每组只给自己变化的线段着色）；“只连有变化的线段”只给接触到变化值的线段着色。“标记偏移”把新值、新值 + AME2020 和自己的点向侧面移动相应的 N，使数值相同的标记不再互相遮挡（线仍在真实的 N 上）。“AME2020 用灰色”把参考值画成灰色，使新数据更突出。预设“发表风格”一次设置所有这些（修订曲线、偏移 0.12、灰色 AME2020、误差棒、无红圈）；“默认”恢复原来的样子。与 AME2020 的差值见残差图。"
