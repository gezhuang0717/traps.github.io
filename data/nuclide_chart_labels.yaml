  cl_help: "Aus: eine kontinuierliche Farbskala. An: Der Bereich der Skala (der manuelle Bereich oder das Datenminimum–maximum, wenn gewählt) wird in die gewählte Zahl von Klassen geteilt. Jede Klasse erhält eine Farbe und steht in der Legende mit der Zahl der gezeichneten Nuklide. Ein Klick auf einen Legendeneintrag zeigt nur diese Klasse (erneut klicken oder 'alle zeigen' setzt zurück). Gleich breit teilt den Bereich in gleiche Schritte. Gleich viele legt etwa gleich viele Nuklide in jede Klasse, was bei schiefen Größen hilft. 'Eigene Grenzen' nutzt die eingegebenen Klassengrenzen in der angezeigten Einheit (bei logarithmischen Größen den echten Wert eingeben, z. B. 100 für 100 keV). Größen mit Vorzeichen werden symmetrisch um null geteilt, sodass eine Klasse die 0 enthält. Die Klassen ändern nur die Farbdarstellung, kein Wert wird verändert. Tastenkürzel: C."
