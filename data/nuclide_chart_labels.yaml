  deflist:
    - "S<sub>n</sub> = ME(Z,N−1) + ME(n) − ME(Z,N); S<sub>2n</sub>, S<sub>p</sub>, S<sub>2p</sub> analog. Eine Drip-Line liegt dort, wo die Separationsenergie negativ wird: jenseits davon ist der Kern gegenüber n / 2n / p / 2p-Emission ungebunden. Mit AME2020 wird eine Linie nur dort gezeichnet, wo ein ungebundener Kern bekannt ist; mit einem Modell ist es der letzte gebundene Kern des Modells."
    - "δ<sub>2n</sub> = S<sub>2n</sub>(N) − S<sub>2n</sub>(N+2): Maxima bei Schalenabschlüssen (magische Zahlen)."
    - "Δ<sub>n</sub><sup>(3)</sup> = (−1)<sup>N</sup>/2 · [ME(N+1) − 2ME(N) + ME(N−1)]: gerade–ungerade Massenstaffelung, ein Maß für die Paarungslücke (Δ<sub>p</sub><sup>(3)</sup> in Z)."
    - "δV<sub>pn</sub> (gerade–gerade) = ¼ [B(Z,N) − B(Z,N−2) − B(Z−2,N) + B(Z−2,N−2)], mit den Formen für ungerades A und ungerade–ungerade nach Cakirli &amp; Casten, PRL 94, 092501 (2005): mittlere Wechselwirkung der letzten Protonen mit den letzten Neutronen; groß nahe N = Z."
    - "Wigner-Indikator W = δV<sub>pn</sub>(N) − ½ [δV<sub>pn</sub>(N+2) + δV<sub>pn</sub>(N−2)] (wie im Mulberry-Code): die zusätzliche Bindung von N = Z-Kernen (Wigner-Energie) zeigt sich als Maximum bei N = Z."
    - "Unsicherheiten werden quadratisch aus den AME2020-Massenunsicherheiten addiert (Korrelationen vernachlässigt); # kennzeichnet Werte, die extrapolierte Massen verwenden. Theoretische Massen haben keine Unsicherheit."
    - "Modelle: FRDM (1995) — Möller, Nix, Myers, Swiatecki, ADNDT 59, 185 (1995); HFB-17 — Goriely, Chamel, Pearson, PRL 102, 152503 (2009); HFB-D1M — Goriely, Hilaire, Girod, Péru, PRL 102, 242501 (2009). Tabellen wie mit TALYS 1.95 verteilt. r-Prozess-Pfad: digitalisiert nach ApJ 815, 82 (2015); rp-Prozess-Pfad näherungsweise."
