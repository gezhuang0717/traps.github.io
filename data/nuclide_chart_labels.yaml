  p_preset: "figure preset"
  pp_publication: "publication"
  pp_default: "default"
  p_pub_title: "publication-style figure"
  p_pub_hint: "A new mass changes its own point and the values that need it (S_n of A and of A+1, for example). “Each series separately” draws a line only through points of the same series, so one or two new values appear as isolated markers. “AME2020 revised by the new data” draws one connected curve through the whole chain with every changed value replaced, in colour over a grey AME2020 line (with several input sets each set colours only its own changed segments); “only the segments that changed” colours just the segments that touch a changed value. “Marker offset” moves the New, New + AME2020 and own points sideways by that many N so that markers with the same value do not hide each other (lines stay at the true N). “AME2020 in grey” draws the reference in grey so that the new data stand out. The preset “publication” sets all of this together (revised curve, offset 0.12, grey AME2020, error bars, no red circle); “default” restores the previous look. The difference to AME2020 is in the residual panel."
