  mine_help: "Each row needs two of Z, N, A (or an element symbol such as 48Ca, or a symbol with A or N) and at least one numeric column. A header with names like Z, N, A, element is recommended; without a header the first two columns are Z and N. The chosen value column is drawn as colour and is also available as a chain-plot quantity."
  mine_file: "File"
  mine_column: "Value column"
  mine_apply: "Draw on the chart"
