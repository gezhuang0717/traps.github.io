  invalid: 'Calibration not used: check the calibrant values'
  using: Calibrated from
  hint: 'JYFLTRAP is a double Penning trap. PyMassScanner keeps one calibration per trap: a reference ion with its measured νc and the trap''s ν−. Every other ion or state is scaled by the frequency-ratio law νc(ion) = νc(ref)·(m_ref/m_ion)·(q_ion/q_ref) with AME2020/NUBASE2020 masses (isomers include Ex). ν− stays at the trap''s value (PyMassScanner) or is scaled as an ideal quadrupole; ν+ = νc − ν−, νz = √(νc² − ν+² − ν−²). Trap 1 gives the cleaning frequency, trap 2 the TOF-ICR/PI-ICR frequencies, periods and keV per Hz. Times of flight RFQ→T1 and T1→T2 scale as √(m/q) from their own calibrant. With the PyMassScanner defaults the site reproduces PyMassScanner''s own ³⁹K⁺ outputs to < 1 mHz.'
  trap1: Trap 1 — purification trap
  trap2: Trap 2 — precision trap
  trap1_note: 'Mass-selective buffer-gas cooling: νc of trap 1 sets the conversion (cleaning) scan.'
  trap2_note: 'TOF-ICR and PI-ICR: νc, ν+ = νc − ν−, νz and the motion periods come from trap 2.'
