    des Paars bestimmt die Referenzfrequenzen. Die Überlagerung erhöht die gewünschte Zeit bis zur
    nächsten Lösung mit ganzzahligem νc t + (δ₊ − δ₋)/360°. Der Standardzeitgeber rundet wie PyMassScanner
    auf 4 ns; der verbleibende Phasenrest wird angezeigt. Ideale Zeitgebung liefert genaue Überlagerung.
    Diagramme, Umläufe, Unsicherheiten, Vergleiche und Exporte verwenden die tatsächliche Zeit. Der
    gemeinsame Ursprung dreht alle Flecken bei unveränderten relativen Abständen.
