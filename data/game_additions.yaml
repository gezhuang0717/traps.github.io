    δm/(mIon + δm), δφ = 360° δνc t. Negative Werte bedeuten im Gegenuhrzeigersinn einen Rückstand
    gegenüber der Referenz. Das Ergebnis hängt vom ersten Ion und der aktuellen Akkumulationszeit
    ab. Dies ist eine angenommene Erhöhung, keine gemessene Isomerenergie.'
  reference_label: Referenz
  unwrapped_angle: Vorzeichenbehafteter, ungekürzter Winkel
  wrapped_angle: Restwinkel in [−180°,180°)
  pi_h: 'Vom gemeinsamen Ursprung gilt νc = (φ + 2πn)/(2πt), mit φ in Radiant und n vollständigen
    Umläufen. Die Simulation kennt n; Experimente bestimmen n getrennt. Bei gleicher Ladung ergibt
    zusätzliche Ruheenergie E: |Δνc|/νc = E/(mIon c² + E). Für kleine Winkel gilt σφ ≈ σx,y/r; r
    ist einstellbar, anfangs 10,00 mm. R = 2πνc t/(2,355 σφ) ist ein FWHM-Auflösungsrichtwert, keine
    Massenunsicherheit. Längere Zeiten können die umlaufenden Flecken erneut überlagern.'
  pi_fh: 'Ideale Bewegungen: schnelle radiale Bewegung ν₊, langsame Magnetronbewegung ν₋, axiale
    Schwingung νz. Hier Φ = U₀(z² − r²/2)/(2d²), νc = qB/(2πmIon), νz = √(qU₀/(mIon d²))/(2π), ν±
    = [νc ± √(νc² − 2νz²)]/2. Einschluss erfordert νc² > 2νz². Ideale Identitäten: ν₊ + ν₋ = νc,
    ν₊² + ν₋² + νz² = νc². Erste Ordnung: ν₋ ≈ U₀/(4πBd²).'
  custom_field: Eigenes B (T)
