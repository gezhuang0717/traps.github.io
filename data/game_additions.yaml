  pi_fh: 理想的な運動は速い半径方向運動 ν₊、遅いマグネトロン運動 ν₋、軸方向振動 νz です。Φ = U₀(z² − r²/2)/(2d²)、νc = qB/(2πmイオン)、νz
    = √(qU₀/(mイオンd²))/(2π)、ν± = [νc ± √(νc² − 2νz²)]/2。閉じ込めには νc² > 2νz² が必要。理想的な関係は ν₊ + ν₋ = νc、ν₊²
    + ν₋² + νz² = νc²。一階近似は ν₋ ≈ U₀/(4πBd²)。
  custom_field: B の指定値（T）
  zero_field: このモデルではゼロ磁場でサイクロトロン閉じ込めはできません。B をゼロより大きくしてください。
