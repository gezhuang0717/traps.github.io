  custom_sigma: 任意の目標（σ）
  sigma_help: σ は個々のイベントの角度分布の標準偏差です。2.355σ は一つのガウスピークの半値全幅（FWHM）の近似で、信頼水準や二つの重心の合成不確かさではありません。プリセットと入力値は同じ最短時間探索と比較線の目標を設定します。
  minus_offset: ν₋ 位相オフセット（°）
  plus_offset: ν₊ 位相オフセット（°）
  overlap_reference: 基準イオンのスポットを重ねる
