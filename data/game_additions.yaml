en:
  centre_sigma: "Centre spot width σx,y (mm)"
  floor_help: "A shared angular offset per species/dataset; 1 mrad = 0.0573°. It does not decrease when more events are counted."
  counts_help: "Assumed events used for each centroid estimate: statistical angular σ scales as 1/√N. This does not set the number of simulated hits per shot."
  seed_help: "Reproducible random detector hits. Use the same seed and settings, then New/Clear, to repeat a simulated sample. It is not a physical parameter."
  practice_help: "This limits only the dice/random isomer picker to half-lives of at least 50 ms. Manual search and ion entry stay available."
  spots_help: "Outer-spot σ controls event blur and phase resolution. Centre-spot σ controls only the central detector cloud; increasing it does not broaden the orbiting species."
  search: Search
  other_states: Other levels / IAS / unresolved classification
  detector_practice: Detector and practice
  detector_radius: Spot-to-centre radius (mm)
  angular_floor: Angular systematic floor (mrad)
  centroid_counts: Counts per centroid
  seed_label: Random seed
  practice_filter: 'Random practice only: T½ ≥ 50 ms'
  compare_title: Accumulation-time comparison
  compare_times: Compare selected times
  wrapped_sep: Minimum wrapped pair separation versus accumulation time
  compare_note: Known simulation frequencies determine the full turn count. Additional times reveal
    phase wrapping; this view does not determine an unknown experimental turn count.
  inputs_results: Inputs and results
  rfq_convention: V is the zero-to-peak RF voltage; U is the DC voltage. This collisionless transverse
    model illustrates finite-time transmission. Axial transport, buffer gas, space charge and fringe
    fields are omitted.
  mathieu: Mathieu equation
  small_angle: Small-angle approximation
  large_angle: 'Large angular width: the small-angle resolution estimate is outside its domain'
  event_width: Event σφ
  centroid_width: Centroid σφ
  turns: Turns
  relative_phase: Δφ relative to species 1
  event_limit: 3 event σφ
  missing_isomer: No matching calculable isomer
  invalid_state: Select valid ion states; unavailable states cannot fall back to the ground state.
  invalid_physical: Invalid physical input
  unconfined: Unconfined ideal-trap parameters
  zero_radius: Phase resolution is undefined at zero detector radius
  positive_population: Use a positive population
  invalid_time: Invalid comparison time
  separation_target: Separation target
  separation_note: σ means one event’s angular standard deviation. The search checks every ion pair
    on a 0.01 ms grid up to 5000 ms, including phase wrapping; it is not a fitted confidence level.
  separation_none: No accumulation time meets this target within 5000 ms.
  phase_origin: Magnetron phase origin (°)
  custom_angle: Custom angle
  centre_lines: Connect centre to spots
  phase_note: Counterclockwise angles. The common origin rotates all spots without changing relative
    separations. The detector drawing radius is 21.00 mm; it expands to 32.00 mm when the spot radius
    exceeds 20.00 mm. This drawing does not model detector acceptance losses.
  total_turns: Total νc turns
  complete_turns: Complete νc turns
  delta_turns: Δ turns from first species
  residual_phase: Residual Δφ from first species (°)
  t180: First 180° separation time (ms)
  t180_target: Compare with first species
  apply180: Apply 180° time
  turn_note: The first species is the reference. Total turns = νc t; Δ turns = (νc − νc,ref)t. Residual
    angles are wrapped to [−180°, 180°). The first opposite-position time is 1/(2|Δνc|); equal frequencies
    never separate. This time is pair-specific, and applying it rounds to the 0.01 ms control grid.
    All turn counts here use known simulation frequencies.
  energy_hint_title: What angle corresponds to 1 keV?
  energy_hint_note: 'This is +1 keV of rest energy (mass), not kinetic energy: δm = 1 keV/c² = 0.00000107354410
    u. With the same charge and B, δνc = −νc δm/(mion + δm) and δφ = 360° δνc t. Negative means lagging
    the reference in this counterclockwise convention. The result depends on the first ion and the
    current accumulation time; it is a hypothetical increment, not a measured isomer energy.'
  reference_label: Reference
  unwrapped_angle: Signed, unwrapped angle
  wrapped_angle: Residual angle in [−180°, 180°)
  pi_h: 'Relative to the common origin, νc = (φ + 2πn)/(2πt), with phase φ in radians and complete
    turns n. The simulator knows n; experiments must determine it separately. For rest-energy increase
    E at fixed charge: |Δνc|/νc = E/(mion c² + E). At small angles σφ ≈ σx,y/r; r is editable, initially
    10.00 mm. R = 2πνc t/(2.355 σφ) is a FWHM resolution guide, not mass uncertainty. Longer times
    can make wrapped spots overlap again.'
  pi_fh: 'The ideal trap has fast radial motion ν₊, slow magnetron motion ν₋ and axial oscillation
    νz. Here Φ = U₀(z² − r²/2)/(2d²), νc = qB/(2πmion), νz = √(qU₀/(mion d²))/(2π), ν± = [νc ± √(νc²
    − 2νz²)]/2. Confinement requires νc² > 2νz². Ideal identities: ν₊ + ν₋ = νc and ν₊² + ν₋² + νz²
    = νc². First order: ν₋ ≈ U₀/(4πBd²).'
  custom_field: Custom B (T)
  zero_field: A zero magnetic field has no cyclotron confinement in this model. Choose B greater
    than zero.
  detector_size: Detector radius
  custom_sigma: Custom target (σ)
  sigma_help: σ is the angular standard deviation of individual events. 2.355σ approximates one Gaussian
    peak’s full width at half maximum (FWHM); it is not a confidence level or the combined uncertainty
    of two centroids. Presets and the custom box set the same target used by the shortest-time search
    and comparison line.
  minus_offset: ν₋ phase offset (°)
  plus_offset: ν₊ phase offset (°)
  overlap_reference: Overlap reference spots
  phase_clock: Timing clock
  ideal_clock: Ideal timing
  actual_tacc: Actual accumulation time
  ideal_tacc: Ideal accumulation time
  reference_mismatch: Reference phase mismatch
  requested_tacc: Requested accumulation time t_acc
  phase_timing_title: Reference phase and timing
  phase_timing_note: These are counterclockwise offsets of the projected detector patterns, in the
    magnetron-reference frame. The first entered ion, or the ground state in single-pair mode, sets
    the reference frequencies. With overlap enabled, the requested time advances to the next solution
    of νc t + (δ₊ − δ₋)/360° = integer. The default clock rounds this ideal time to 4 ns, following
    the PyMassScanner timing convention; the remaining mismatch is shown rather than hidden. Ideal
    timing gives exact overlap. Plots, turn counts, uncertainty, comparisons and exports use the
    actual time. The common origin rotates all spots without changing separations.
  phase_timing_source: PI-ICR phase and overlap method
zh:
  centre_sigma: "中心斑点宽度 σx,y（mm）"
