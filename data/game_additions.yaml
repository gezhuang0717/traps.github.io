  spots_help: "外侧斑点σ控制事件模糊及相位分辨；中心斑点σ只改变中心探测云，不展宽绕行物种。"
  search: 搜索
  other_states: 其他能级 / 同位旋模拟态 / 分类未定
  detector_practice: 探测器与练习
  detector_radius: 斑点到中心的半径（mm）
  angular_floor: 角度系统误差下限（mrad）
  centroid_counts: 每斑点计数
  seed_label: 随机种子
  practice_filter: 仅随机练习：T½ ≥ 50 ms
  compare_title: 累积时间比较
  compare_times: 比较所选时间
  wrapped_sep: 最小回绕相位差随累积时间变化
  compare_note: 仿真中的已知频率确定完整圈数。多时间视图展示相位回绕，不推断实验中的未知整圈数。
  inputs_results: 输入与结果
  rfq_convention: V 为零到峰值射频电压，U 为直流电压。此无碰撞横向模型仅示意有限时间透过率；不包含轴向输运、缓冲气体、空间电荷和边缘场。
  mathieu: 马修方程
  small_angle: 小角度近似
  large_angle: 角展宽过大：小角度分辨率估计超出适用范围
  event_width: 事件 σφ
  centroid_width: 质心 σφ
  turns: 整圈
  relative_phase: 相对第1种离子的 Δφ
  event_limit: 3倍事件 σφ
  missing_isomer: 无匹配的可计算同核异能态
  invalid_state: 请选择有效核态；不可用核态不能自动替换为基态。
  invalid_physical: 物理输入无效
  unconfined: 理想阱参数不能囚禁离子
  zero_radius: 探测器半径为零时相位分辨率未定义
  positive_population: 至少一种离子占比需大于零
  invalid_time: 比较时间无效
  separation_target: 目标分离度
  separation_note: σ 指单个探测事件的角度标准差。搜索在 0.01 ms 网格上检查所有离子对，最长 5000 ms，并考虑相位回绕；不是拟合置信水平。
  separation_none: 5000 ms 内没有满足目标的累积时间。
  phase_origin: 磁控管相位原点（°）
  custom_angle: 自定义角度
  centre_lines: 连接中心与斑点
  phase_note: 角度按逆时针计。共同原点旋转所有斑点，不改变相对分离。探测器绘图半径为 21.00 mm；斑点半径超过 20.00 mm 时，自动扩大到 32.00 mm。本图未模拟探测器接收损失。
  total_turns: νc 总圈数
  complete_turns: νc 完整圈数
  delta_turns: 相对第一种离子的圈数差
  residual_phase: 相对第一种离子的残余 Δφ（°）
  t180: 首次相差 180° 的时间（ms）
  t180_target: 与第一种离子比较
  apply180: 应用 180° 时间
  turn_note: 第一种离子为参考。总圈数 = νc t；圈数差 = (νc − νc,参考)t。残余角度回绕到 [−180°,180°)。首次到达相反位置的时间为 1/(2|Δνc|)；频率相同则不会分离。这是指定离子对的时间，应用时按
    0.01 ms 控件网格取整。圈数使用仿真中的已知频率。
  energy_hint_title: 1 keV 对应多大角度？
  energy_hint_note: 这里是静止能量（质量）增加 1 keV，不是动能：δm = 1 keV/c² = 0.00000107354410 u。在相同电荷与 B 下，δνc =
    −νc δm/(m离子 + δm)，δφ = 360° δνc t。在逆时针角度约定下，负值表示落后于参考离子。结果依赖第一种离子与当前积累时间；这是假设的能量增量，不是某个同核异能态的测量值。
  reference_label: 参考离子
  unwrapped_angle: 未回绕的有符号角度
  wrapped_angle: '[−180°,180°) 内的残余角'
  pi_h: 相对共同角度原点，νc = (φ + 2πn)/(2πt)，φ 用弧度，n 为完整圈数。仿真已知 n，真实测量需另行确定。在相同电荷下，静止能量增加 E 时，|Δνc|/νc =
    E/(m离子c² + E)。小角度下 σφ ≈ σx,y/r；r 可调，初始为 10.00 mm。R = 2πνc t/(2.355 σφ) 表示半高全宽分辨本领，不等同于质量不确定度。积累时间更长时，回绕的斑点可能再次重叠。
  pi_fh: 理想阱包含快速径向运动 ν₊、慢速磁控运动 ν₋ 和轴向振荡 νz。这里 Φ = U₀(z² − r²/2)/(2d²)，νc = qB/(2πm离子)，νz = √(qU₀/(m离子d²))/(2π)，ν±
    = [νc ± √(νc² − 2νz²)]/2。稳定囚禁需要 νc² > 2νz²。理想关系：ν₊ + ν₋ = νc，ν₊² + ν₋² + νz² = νc²。一阶近似：ν₋ ≈
    U₀/(4πBd²)。
  custom_field: 自定义 B（T）
  zero_field: 此模型中零磁场无法提供回旋囚禁，请选择大于零的 B。
  detector_size: 探测器半径
  custom_sigma: 自定义目标（σ）
  sigma_help: σ 是单个事件角分布的标准差。2.355σ 近似一个高斯峰的半高全宽（FWHM），不是置信水平，也不是两个质心的合成不确定度。预设与自定义框控制相同目标，用于最短时间搜索及比较图的目标线。
  minus_offset: ν₋ 相位偏移（°）
  plus_offset: ν₊ 相位偏移（°）
  overlap_reference: 重合参考离子斑点
  phase_clock: 计时时钟
  ideal_clock: 理想计时
  actual_tacc: 实际累积时间
  ideal_tacc: 理想累积时间
  reference_mismatch: 参考相位残差
  requested_tacc: 请求的累积时间 t_acc
  phase_timing_title: 参考相位与计时
  phase_timing_note: 这些是磁控管参考坐标系中投影到探测器后的相位偏移，逆时针为正。输入的第一种离子，或单对模式的基态，决定参考频率。勾选重合后，请求时间向上调整到 νc t
    + (δ₊ − δ₋)/360° 为整数的下一个解。默认时钟按 PyMassScanner 的约定将理想时间舍入到 4 ns，并显示剩余残差。选择理想计时可精确重合。图、圈数、不确定度、时间比较和导出均使用实际时间。共同原点仍同时旋转所有斑点，不改变相对分离。
  phase_timing_source: PI-ICR 相位与斑点重合方法
