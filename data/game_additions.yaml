  detector_size: Detektorin säde
  custom_sigma: Oma tavoite (σ)
  sigma_help: σ on yksittäisten tapahtumien kulmajakauman keskihajonta. 2,355σ vastaa likimain yhden
    Gaussin huipun puoliarvoleveyttä (FWHM), ei luottamustasoa tai kahden keskipisteen yhteistä epävarmuutta.
    Esiasetus ja oma arvo ohjaavat samaa lyhimmän ajan hakua ja vertailuviivaa.
  minus_offset: ν₋-vaiheen siirto (°)
  plus_offset: ν₊-vaiheen siirto (°)
  overlap_reference: Aseta referenssitäplät päällekkäin
  phase_clock: Ajoituskello
  ideal_clock: Ideaalinen ajoitus
  actual_tacc: Todellinen kertymäaika
  ideal_tacc: Ideaalinen kertymäaika
  reference_mismatch: Referenssin vaihe-ero
  requested_tacc: Pyydetty kertymäaika t_acc
  phase_timing_title: Referenssin vaihe ja ajoitus
  phase_timing_note: Siirrot koskevat detektorille projisoituja kuvioita magnetronireferenssin koordinaatistossa;
    positiivinen kulma on vastapäivään. Ensimmäinen syötetty ioni tai parin perustila määrää referenssitaajuudet.
    Päällekkäisyys siirtää pyydetyn ajan seuraavaan ratkaisuun, jossa νc t + (δ₊ − δ₋)/360° on kokonaisluku.
    Oletuskello pyöristää ideaalisen ajan 4 ns:n välein PyMassScannerin tapaan; jäljelle jäävä vaihe-ero
    näytetään. Ideaalinen ajoitus tuottaa tarkan päällekkäisyyden. Kuviot, kierrokset, epävarmuudet,
    vertailut ja vienti käyttävät todellista aikaa. Yhteinen origo kiertää kaikkia täpliä muuttamatta
    suhteellisia eroja.
  phase_timing_source: PI-ICR:n vaihe- ja päällekkäisyysmenetelmä
