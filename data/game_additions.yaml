    √(νc² − 2νz²)]/2. Vakaus edellyttää νc² > 2νz². Ideaalisuhteet: ν₊ + ν₋ = νc ja ν₊² + ν₋² + νz²
    = νc². Ensimmäinen approksimaatio: ν₋ ≈ U₀/(4πBd²).'
  custom_field: Oma B (T)
  zero_field: Nollamagneettikenttä ei anna syklotronikonfinementtia tässä mallissa. Valitse B yli
