  phase_timing_title: 基準位相とタイミング
  phase_timing_note: 磁気回転基準の座標系で、検出器へ投影したパターンの位相をずらします。反時計回りが正です。入力した最初のイオン、または単一対の基底状態が基準周波数を決めます。重ね合わせを有効にすると、νc
    t + (δ₊ − δ₋)/360° が整数になる次の解へ指定時間を進めます。標準クロックは PyMassScanner と同様に理想時間を 4 ns 刻みに丸め、残る位相差を表示します。理想タイミングでは正確に重なります。図、周回数、不確かさ、時間比較、出力には実際の時間を使います。共通の原点はすべてのスポットを回転させ、相対的な間隔を保ちます。
  phase_timing_source: PI-ICR の位相と重ね合わせ法
