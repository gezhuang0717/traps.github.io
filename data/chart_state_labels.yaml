  state_pending: Ground + classification pending
  state_withdrawn: withdrawn assignment
  state_questioned: questioned assignment
  state_order_uncertain: ordering uncertain
  state_order_inverted: ordering differs from ENSDF
  state_model_note: 'Model masses apply only to ground states. Each # belongs to its adjacent value or uncertainty.'
  state_link: Link to this state
  state_count: catalogued isomer assignments
  state_kinds:
    ground: ground state
    isomer: isomer
    analogue: analogue state
    resonance: resonance
    unclassified: classification pending
  state_bases:
    source index 0: Source ground-state index 0
    source isomer label: Source isomer designation
    source IAS label: Source analogue-state designation
    NUBASE2020 section 2 higher-isomer assignment: Higher-isomer assignment, NUBASE2020 section 2
