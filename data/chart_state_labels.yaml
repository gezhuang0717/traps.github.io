  state_intro: 这里列出所选核素的不同核态，不是不同元素。先筛选下方列表，再点击核态按钮查看数据。
  state_search_hint: 在本核素内按完整核态标记（如 m）、激发能（keV）、自旋/宇称（如 10+）或类别名称搜索。留空时列出“核态类型”允许的全部核态。
  state_class_hint: 通常从“基态与同核异能态”开始；“所有核态”包括其他目录记录；“分类未定”显示基态及类别尚未确定的记录。修改筛选不会自动改变下方已选核态的详情。
  state_help_title: g、m、n 与核态类别是什么意思？
  state_definitions: g = 基态（最低能量态）。m、n 等保留来源的激发态标记，实际类别另行显示。同核异能态是亚稳的激发核态；同量异位类似态（IAS）对应邻近原子核中由同位旋关联的核态；共振态是非束缚态。分类未定表示现有字段不足以确认类别，不能只凭字母标记认定为异能态。
  state_values_hint: Eₓ = 相对基态的激发能（keV）；T½ = 半衰期；Jπ = 自旋与宇称（+/−）；ME = 质量过剩。# 表示外推值；? 或缺失的不确定度表示未知，不是零。来源及次序说明解释分类依据。
  state_matches: 共 {total} 个目录核态，其中 {n} 个符合筛选。点击按钮选择核态。
  state_empty: 没有符合筛选的核态。请清空搜索或选择“所有核态”。
  state_reset: 重置核态筛选
