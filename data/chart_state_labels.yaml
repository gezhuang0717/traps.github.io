    NUBASE2020 long-lived-state convention with record lifetime: 依据 NUBASE2020 长寿命核态约定及本条记录的寿命
    proton-resonance example in NUBASE2020 Table I explanation: NUBASE2020 表 I 说明中的质子共振例子
    excited state; classification not established by available fields: 激发态；现有字段不足以确定类别
