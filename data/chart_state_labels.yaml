    excited state; classification not established by available fields: Excited state; available fields do not establish
      its class
    'short-lived p/q/r record: lifetime alone does not establish level versus isomer': Short-lived p/q/r record;
      lifetime alone cannot distinguish a level from an isomer
  state_close: Close state details
  state_intro: These are nuclear states of the selected nuclide, not different elements. Filter the list below,
    then click a state button to display its data.
  state_search_hint: Search within this nuclide by exact state label (e.g. m), excitation energy (keV), spin/parity
    (e.g. 10+) or class name. Leave blank to list every state allowed by State class.
  state_class_hint: Ground + isomers is the usual starting list. All states includes other catalogue records. Pending
    shows ground + records whose class is not established. Changing a filter does not change the selected detail
    below.
  state_help_title: What are g, m, n and these state classes?
  state_definitions: g = ground state (lowest energy). m, n, … retain the source excited-state labels; the class
    is shown separately. An isomer is a metastable excited nuclear state. An analogue state (IAS) corresponds to
    an isospin-related state in a neighbouring nucleus. A resonance is an unbound state. Pending means the available
    fields do not establish its class; a label alone is not proof of an isomer.
  state_values_hint: 'Eₓ = energy above the ground state in keV; T½ = half-life; Jπ = spin and parity (+/−); ME
    = mass excess. # flags an extrapolated value. ? or missing uncertainty means unknown, not zero. Source and ordering
    notes explain how the assignment was classified.'
  state_matches: '{n} of {total} catalogue states match. Click a button to select one.'
  state_empty: No states match these filters. Clear the search or choose All states.
  state_reset: Reset state filters
