{{- $lang := substr site.Language.Lang 0 2 -}}
{{- $titles := dict "en" "Nuclei & light: data laboratory" "zh" "原子核与光：数据实验室" "fi" "Ytimet ja valo: datalaboratorio" "de" "Kerne und Licht: Datenlabor" "ja" "原子核と光：データ実験室" -}}
<link rel="stylesheet" href="{{ "css/spectroscopy.css" | relURL }}">
<section class="zg-spectroscopy" id="research-spectroscopy" data-spectroscopy data-lang="{{ $lang }}"
  data-values="{{ hugo.Data.spectroscopy | jsonify }}" data-cooling="{{ hugo.Data.laser_cooling.species | jsonify }}">
  <header><p class="sp-eyebrow">CLS · IAEA · NNDC · NIST</p><h2>{{ index $titles $lang | default $titles.en }}</h2></header>
  <div data-sp-app></div>
  <noscript><p>Enable JavaScript to explore the local source snapshots and calculators. / 请启用 JavaScript 以使用数据与计算器。</p></noscript>
</section>
<script defer src="{{ "js/zg-export.js" | relURL }}"></script>
<script defer src="{{ "js/spectroscopy-core.js" | relURL }}"></script>
<script defer src="{{ "js/spectroscopy.js" | relURL }}"></script>
