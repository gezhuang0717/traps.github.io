{{- $k := cond (hasPrefix site.Language.Lang "zh") "zh" site.Language.Lang -}}

<noscript><p><a href="{{ "data/daily.json" | relURL }}">Download Daily entries (JSON)</a></p></noscript>
<script defer src="{{ "js/daily.js" | relURL }}?v={{ readFile "static/js/daily.js" | sha256 }}"></script>
