{{ $zh := hasPrefix site.Language.Lang "zh" }}
<fieldset class="g-playback" data-playback-controls>
<legend>{{ partial "zg/ct.html" "c006" }}</legend>
<div class="g-opts-row">
<label>{{ partial "zg/ct.html" "c007" }} <input type="range" name="playbackSlider" min="0.05" max="10" step="0.05" value="1" aria-label="{{ partial "zg/ct.html" "c008" }}"></label>
<label>{{ partial "zg/ct.html" "c009" }} <input type="number" name="playbackSpeed" min="0.05" max="10" step="0.05" value="1" data-full-precision> ×</label>
<button type="button" class="zg-btn zg-btn-ghost" data-playback-rate="0.1">0.1×</button><button type="button" class="zg-btn zg-btn-ghost" data-playback-rate="1">1×</button><button type="button" class="zg-btn zg-btn-ghost" data-playback-rate="5">5×</button>
<button type="button" class="zg-btn zg-btn-ghost" data-playback-step>{{ partial "zg/ct.html" "c010" }}</button>
{{ if eq . "analytic" }}<label>{{ partial "zg/ct.html" "c011" }} <input name="stepUs" data-step-increment="0.001" type="number" min="0.001" max="100000" step="any" value="1"></label>{{ end }}
<label>{{ partial "zg/ct.html" "c012" }} <select name="videoFps"><option value="10">10 fps</option><option value="20" selected>20 fps</option><option value="30">30 fps</option><option value="60">60 fps</option></select></label>
</div>
<p class="zg-muted" data-playback-readout aria-live="off"></p>
<details><summary>{{ partial "zg/ct.html" "c013" }}</summary><p>{{ partial "zg/ct.html" "c014" }}</p></details>
</fieldset>
