name: Fast scientific data and UI regression checks
on:
  pull_request:
  push:
    branches: [main]
    paths:
      - 'static/js/nuclide-*'
      - 'static/js/rfq-*'
      - 'static/js/physics.js'
      - 'static/data/ame2026*'
      - 'static/data/nubase2026*'
      - 'static/data/nuclear-states2026*'
      - 'data/nuclide_chart_labels.yaml'
      - 'data/mathieu_labels.json'
      - 'tests/**'
      - 'tools/import_ame2026.py'
      - '.github/workflows/science-fast-tests.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: quick-science-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  scientific-tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Syntax, provenance and scientific mass tables
        run: |
          set -euo pipefail
          node --check static/js/nuclide-chart.js
          node --check static/js/rfq-mathieu.js
          node --check static/js/rfq-workbench.js
          python tools/import_ame2026.py --check
      - name: Node numerical/UI regressions, including manual colour mapping
        run: node --test tests/*.test.cjs
      - name: Python data, privacy, links and input regressions
        run: |
          python -m pip install -r requirements-dev.txt
          python -m pytest tests -q
          python tools/site.py check
