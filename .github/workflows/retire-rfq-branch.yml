name: Retire superseded RFQ branch (one-time)

on:
  push:
    branches:
      - test
    paths:
      - .github/workflows/retire-rfq-branch.yml

permissions:
  contents: write

jobs:
  retire:
    if: github.repository == 'gezhuang0717/traps.github.io'
    runs-on: ubuntu-latest
    steps:
      - name: Verify replacement PR is merged and delete only old branch
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          repo="gezhuang0717/traps.github.io"
          pr_json="$(curl -fsSL -H "Accept: application/vnd.github+json" -H "Authorization: Bearer $GH_TOKEN" "https://api.github.com/repos/$repo/pulls/2")"
          merged="$(printf '%s' "$pr_json" | python3 -c 'import json,sys; print(str(json.load(sys.stdin).get("merged",False)).lower())')"
          if [ "$merged" != "true" ]; then
            echo "Replacement PR #2 is not merged; refusing to remove old branch."
            exit 1
          fi
          url="https://api.github.com/repos/$repo/git/refs/heads/codex/rfq-workbench-sync-20261121"
          status="$(curl -sS -o /tmp/delete-response.txt -w '%{http_code}' \
            -X DELETE -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer $GH_TOKEN" "$url")"
          if [ "$status" = "204" ] || [ "$status" = "404" ]; then
            echo "Superseded RFQ branch absent (deleted or already absent); retained PR #2 and feature branch."
          else
            echo "Branch deletion failed with HTTP status $status"
            cat /tmp/delete-response.txt
            exit 1
          fi
