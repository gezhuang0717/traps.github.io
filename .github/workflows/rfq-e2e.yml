name: RFQ real-browser acceptance
on:
  push:
    branches: ['main', 'feature/rfq-integrated-science-20261122']
    paths:
      - 'static/js/rfq-*'
      - 'static/js/mathieu-core.js'
      - 'static/css/rfq-*'
      - 'static/data/rfq-examples/**'
      - 'layouts/_partials/zg/rfq-*'
      - 'data/rfq*'
      - 'data/mathieu_labels*'
      - 'tests/rfq_*'
      - '.github/workflows/rfq-e2e.yml'
  pull_request:
    paths:
      - 'static/js/rfq-*'
      - 'static/css/rfq-*'
      - 'static/data/rfq-examples/**'
      - 'layouts/_partials/zg/rfq-*'
      - 'static/js/mathieu-core.js'
      - 'data/rfq*'
      - 'data/mathieu_labels*'
      - 'tests/rfq_*'
      - '.github/workflows/rfq-e2e.yml'
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
permissions:
  contents: read
jobs:
  rfq-browser:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      RFQ_E2E_BASE: http://127.0.0.1:8765/
      RFQ_E2E_ARTIFACTS: rfq-browser-evidence
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements-dev.txt
      - name: Install pinned Hugo Extended
        run: |
          curl -fsSL -o "$RUNNER_TEMP/hugo.deb" "https://github.com/gohugoio/hugo/releases/download/v0.166.0/hugo_extended_0.166.0_linux-amd64.deb"
          sudo dpkg -i "$RUNNER_TEMP/hugo.deb"
      - name: Install headless browser and dependencies
        run: |
          python -m pip install playwright==1.58.0
          python -m playwright install --with-deps chromium
          sudo apt-get update -qq
          sudo apt-get install -y ffmpeg
      - name: Build website for local browser
        id: build
        run: |
          python tools/site.py config
          hugo --minify --configDir sites/congo --themesDir themes --destination "$RUNNER_TEMP/rfq-site" --baseURL http://127.0.0.1:8765/
          python -m http.server 8765 --bind 127.0.0.1 --directory "$RUNNER_TEMP/rfq-site" > "$RUNNER_TEMP/rfq-http.log" 2>&1 &
          echo $! > "$RUNNER_TEMP/rfq-http.pid"
          for i in $(seq 1 40); do curl -fsS http://127.0.0.1:8765/lab/ > /dev/null && break; sleep 1; done
      - name: Run real Chromium desktop/mobile acceptance
        run: python tests/rfq_browser_smoke.py
      - name: Verify readable RFQ plots and responsive controls
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: python tests/rfq_visual_acceptance.py
      - name: Verify resonance controls, physics and exports
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: python tests/rfq_resonance_acceptance.py
      - name: Verify motion, cooling, examples and decoded video exports
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: python tests/rfq_motion_scenes_acceptance.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: rfq-browser-evidence
          path: rfq-browser-evidence
          if-no-files-found: warn
