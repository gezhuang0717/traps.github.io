name: Validate and deploy website
on:
  push:
    branches: [main, test, 'codex/**']
  pull_request:
  schedule:
    # Daily feeds refresh at 00:01 and 08:01 Helsinki time. GitHub cron is UTC and best-effort
    # (runs can be late or dropped), so both UTC offsets (EEST +3 / EET +2) are listed and three
    # backup slots catch dropped runs. The "Decide" step below skips runs that are not needed.
    - cron: '1 21 * * *'
    - cron: '1 22 * * *'
    - cron: '1 5 * * *'
    - cron: '1 6 * * *'
    - cron: '41 1 * * *'
    - cron: '41 9 * * *'
    - cron: '41 15 * * *'
  workflow_dispatch:
    inputs:
      fetch:
        description: Refresh Daily feeds on main
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: website-${{ github.ref }}
  cancel-in-progress: false
env:
  HUGO_VERSION: 0.166.0
jobs:
  daily:
    # Runs on schedule, on manual request, and on every push to main (a push refreshes Daily only if it is older than 12 h)
    # Owner-approved Daily parity: root, IGISOL and traps each retain and refresh their own archive.
    if: (github.repository == format('{0}/{0}.github.io', github.repository_owner) || github.repository == 'gezhuang0717/igisol.github.io' || github.repository == 'gezhuang0717/traps.github.io') && github.ref == 'refs/heads/main' && (github.event_name == 'schedule' || github.event_name == 'push' || inputs.fetch)
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      commit: ${{ steps.commit.outputs.sha }}
      ran: ${{ steps.decide.outputs.run }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 50
      - id: decide
        name: Decide (Helsinki slot 00:xx / 08:xx, or last update older than 12 h)
        run: |
          H=$(TZ=Europe/Helsinki date +%H)
          LAST=$(git log -1 --format=%ct -- data/daily/feed-health.json || echo 0)
          AGE=$(( ($(date +%s) - ${LAST:-0}) / 3600 ))
          RUN=no
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then RUN=yes; fi
          if [ "${{ github.event_name }}" = "schedule" ]; then case "$H" in 00|01|08|09) RUN=yes ;; esac; fi
          if [ "$AGE" -ge 12 ]; then RUN=yes; fi
          echo "Helsinki hour $H, last Daily update ${AGE} h ago -> run=$RUN"
          echo "run=$RUN" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-python@v5
        if: steps.decide.outputs.run == 'yes'
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt
        if: steps.decide.outputs.run == 'yes'
      - name: Snapshot and dry run
        if: steps.decide.outputs.run == 'yes'
        run: |
          python tools/site.py snapshot --label scheduled-daily
          python tools/site.py fetch --dry-run
      - name: Canonical Daily writer
        if: steps.decide.outputs.run == 'yes'
        run: |
          python tools/site.py fetch
          python tools/site.py check
      - id: commit
        name: One logical Daily commit
        run: |
          git config user.name "Zhuang Ge"
          git config user.email gezhuang0717@users.noreply.github.com
          git add data/daily
          if ! git diff --cached --quiet; then
            git commit -m "Daily feeds $(TZ=Europe/Helsinki date '+%F %H:%M') Helsinki"
            git pull --rebase --autostash origin main
            git push origin HEAD:main
          fi
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
  validate:
    needs: daily
    if: always() && (github.event_name != 'schedule' || github.repository == format('{0}/{0}.github.io', github.repository_owner) || github.repository == 'gezhuang0717/igisol.github.io' || github.repository == 'gezhuang0717/traps.github.io') && (needs.daily.result == 'success' || needs.daily.result == 'skipped') && (needs.daily.outputs.ran != 'no' || github.event_name != 'schedule')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.daily.outputs.commit || github.sha }}
          submodules: recursive
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements-dev.txt
      - name: Install pinned Hugo Extended
        run: |
          curl -fsSL -o "$RUNNER_TEMP/hugo.deb" "https://github.com/gohugoio/hugo/releases/download/v${HUGO_VERSION}/hugo_extended_${HUGO_VERSION}_linux-amd64.deb"
          sudo dpkg -i "$RUNNER_TEMP/hugo.deb"
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: corepack enable
      - name: Audited original lockfile subgraph
        run: corepack pnpm --dir tools/react-toolchain install --frozen-lockfile
      - name: Resolve Pages base URL
        run: |
          owner=$(echo "$GITHUB_REPOSITORY_OWNER" | tr '[:upper:]' '[:lower:]'); repo="${GITHUB_REPOSITORY#*/}"
          base="https://${owner}.github.io/"; [ "$(echo "$repo" | tr '[:upper:]' '[:lower:]')" = "${owner}.github.io" ] || base="${base}${repo}/"
          echo "SITE_BASE_URL=$base" >> "$GITHUB_ENV"
          # Test/staging site: TEST SITE ribbon and noindex (Hugo reads HUGO_PARAMS_* as site params).
          if [ "$GITHUB_REPOSITORY" = "gezhuang0717/traps.github.io" ]; then
            echo "HUGO_PARAMS_TESTSITE=true" >> "$GITHUB_ENV"
            echo "HUGO_PARAMS_ROBOTS=noindex, nofollow" >> "$GITHUB_ENV"
          fi
      - name: Data and recovery tests
        run: |
          python tools/site.py check
          python -m pytest tests -q
          node --test tests/*.test.cjs
          python tools/site.py config
          python tools/site.py facilities-build
          python tools/site.py export-react
      - name: Publication gate (privacy, geo, links, inspect public/)
        run: python tools/publish.py check --base-url "$SITE_BASE_URL"
      - name: All themes and React
        run: |
          # Base URL follows the repository: user site (<owner>.github.io) or project site (<owner>.github.io/<repo>/)
          base="$SITE_BASE_URL"
          echo "Base URL: $base"
          for theme in congo blowfish papermod; do
            hugo --minify --configDir "sites/$theme" --themesDir themes --destination "builds/$theme" --baseURL "$base"
          done
          python tools/build_react.py --node "$(command -v node)" --toolchain tools/react-toolchain --output builds/react
          theme=$(python -c "import yaml;print(yaml.safe_load(open('site.yaml'))['live_theme'])")
          rm -rf public && mv "builds/$theme" public
          cp -R builds/react public/react
      - name: Final internal HTML, CSS and image links
        run: python tools/publish.py links --base-url "$SITE_BASE_URL"
      - uses: actions/upload-artifact@v4
        with:
          name: validated-website
          path: public
  deploy:
    needs: validate
    # Publish the user site, the owner-selected IGISOL project or the test/staging site; other copies
    # and the `test` branch only validate.
    if: always() && (github.repository == format('{0}/{0}.github.io', github.repository_owner) || github.repository == 'gezhuang0717/igisol.github.io' || github.repository == 'gezhuang0717/traps.github.io') && github.ref == 'refs/heads/main' && needs.validate.result == 'success' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: validated-website
          path: public
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: public
      - id: deployment
        uses: actions/deploy-pages@v4
